<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" width="760" height="472" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <title>Integration architecture: the API Hub sits between TPPs and each LFI, with the Trust Framework issuing certificates to both</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3D4451"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="472" rx="16" fill="#FFFFFF"/>

  <text x="24" y="28" font-size="15" font-weight="600" fill="#2E3440">The API Hub sits between TPPs and each LFI</text>
  <text x="24" y="48" font-size="11.5" fill="#5B6270">Shaded boxes are built by the LFI; the rest is provided by the API Hub</text>

  <!-- Trust Framework -->
  <rect x="248" y="68" width="240" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="368" y="92" text-anchor="middle" font-weight="600" fill="#2E3440">Trust Framework</text>
  <text x="368" y="110" text-anchor="middle" font-size="11.5" fill="#5B6270">Certificates, roles, licenses</text>

  <!-- TPP -->
  <rect x="24" y="200" width="152" height="72" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="36" y="224" font-weight="600" fill="#2E3440">TPP apps</text>
  <text x="36" y="242" font-size="11.5" fill="#5B6270">Licensed by QCB</text>
  <text x="36" y="258" font-size="11.5" fill="#5B6270">Call the API Hub</text>

  <!-- API Hub -->
  <rect x="216" y="160" width="304" height="248" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="232" y="184" font-weight="600" fill="#2E3440">API Hub (one tenant per LFI)</text>
  <rect x="232" y="200" width="272" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="244" y="224" font-weight="600" fill="#2E3440">Resource Server</text>
  <text x="244" y="242" font-size="11.5" fill="#5B6270">Standard v1 APIs for TPPs</text>
  <rect x="232" y="268" width="272" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="244" y="292" font-weight="600" fill="#2E3440">Authorization Server</text>
  <text x="244" y="310" font-size="11.5" fill="#5B6270">FAPI; issues access tokens</text>
  <rect x="232" y="336" width="272" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="244" y="360" font-weight="600" fill="#2E3440">Consent Manager</text>
  <text x="244" y="378" font-size="11.5" fill="#5B6270">Stores and manages consents</text>

  <!-- LFI -->
  <rect x="560" y="160" width="176" height="248" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="576" y="184" font-weight="600" fill="#2E3440">LFI</text>
  <rect x="576" y="200" width="144" height="72" rx="8" fill="#1E0B5C" fill-opacity="0.12" stroke="#1E0B5C" stroke-width="2"/>
  <text x="588" y="224" font-weight="600" fill="#2E3440">Ozone Connect</text>
  <text x="588" y="242" font-size="11.5" fill="#2E3440">Maps core banking</text>
  <text x="588" y="258" font-size="11.5" fill="#2E3440">to Standard v1</text>
  <rect x="576" y="296" width="144" height="88" rx="8" fill="#1E0B5C" fill-opacity="0.12" stroke="#1E0B5C" stroke-width="2"/>
  <text x="588" y="320" font-weight="600" fill="#2E3440">LFI apps</text>
  <text x="588" y="338" font-size="11.5" fill="#2E3440">SCA and consent</text>
  <text x="588" y="354" font-size="11.5" fill="#2E3440">screens; consent</text>
  <text x="588" y="370" font-size="11.5" fill="#2E3440">dashboard</text>

  <!-- Connectors -->
  <g fill="none" stroke="#3D4451" stroke-width="1.25">
    <path d="M176 228H232" marker-end="url(#arrow)"/>
    <path d="M504 228H576" marker-end="url(#arrow)"/>
    <path d="M576 310H504" marker-end="url(#arrow)"/>
    <path d="M576 364H504" marker-end="url(#arrow)"/>
    <path d="M368 124V160" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M248 96H100V200" marker-end="url(#arrow)"/>
    <path d="M488 96H648V160" marker-end="url(#arrow)"/>
    <path d="M100 272V432H648V384" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  </g>

  <!-- Connector labels -->
  <g font-size="11.5" fill="#5B6270">
    <text x="204" y="220" text-anchor="middle">API</text>
    <text x="540" y="220" text-anchor="middle">mTLS</text>
    <text x="540" y="302" text-anchor="middle">mTLS</text>
    <text x="540" y="356" text-anchor="middle">mTLS</text>
    <text x="376" y="148">validates certificates and roles</text>
    <text x="108" y="88">certificates</text>
    <text x="656" y="88">certificates</text>
    <text x="376" y="452" text-anchor="middle">User redirected to the LFI to authorize the consent</text>
  </g>
</svg>
