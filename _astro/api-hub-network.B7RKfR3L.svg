<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <title>API Hub network: the API Hub sits between TPPs and the LFI, and every LFI link uses mTLS</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3D4451"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="480" rx="16" fill="#FFFFFF"/>

  <text x="24" y="28" font-size="15" font-weight="600" fill="#2E3440">The API Hub sits between TPPs and the LFI, and every LFI link uses mTLS</text>

  <!-- TPP -->
  <rect x="24" y="44" width="688" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="368" y="68" text-anchor="middle" font-weight="600" fill="#2E3440">TPP</text>
  <text x="368" y="84" text-anchor="middle" font-size="11.5" fill="#5B6270">application calling the API Hub</text>

  <!-- API Hub -->
  <rect x="8" y="132" width="720" height="180" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="372" y="154" font-weight="600" fill="#2E3440">API Hub, hosted by Ozone in Qatar</text>

  <rect x="24" y="168" width="160" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="104" y="192" text-anchor="middle" font-weight="600" fill="#2E3440">auth1</text>
  <text x="104" y="208" text-anchor="middle" font-size="11.5" fill="#5B6270">OIDC discovery</text>

  <rect x="200" y="168" width="160" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="280" y="192" text-anchor="middle" font-weight="600" fill="#2E3440">as1</text>
  <text x="280" y="208" text-anchor="middle" font-size="11.5" fill="#5B6270">Authorization Server</text>

  <!-- Shaded: the one central service; everything else runs in the LFI's tenant -->
  <rect x="376" y="168" width="160" height="56" rx="8" fill="#1E0B5C" fill-opacity="0.12" stroke="#1E0B5C" stroke-width="2"/>
  <text x="456" y="192" text-anchor="middle" font-weight="600" fill="#2E3440">Ozone Trust Framework</text>
  <text x="456" y="208" text-anchor="middle" font-size="11.5" fill="#2E3440">central: certificates, roles</text>

  <rect x="552" y="168" width="160" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="632" y="192" text-anchor="middle" font-weight="600" fill="#2E3440">rs1</text>
  <text x="632" y="208" text-anchor="middle" font-size="11.5" fill="#5B6270">Resource Server</text>

  <rect x="24" y="240" width="160" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="104" y="264" text-anchor="middle" font-weight="600" fill="#2E3440">hh</text>
  <text x="104" y="280" text-anchor="middle" font-size="11.5" fill="#5B6270">Authorization API</text>

  <rect x="200" y="240" width="160" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="280" y="264" text-anchor="middle" font-weight="600" fill="#2E3440">cm</text>
  <text x="280" y="280" text-anchor="middle" font-size="11.5" fill="#5B6270">Consent Management API</text>

  <rect x="376" y="240" width="160" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="456" y="264" text-anchor="middle" font-weight="600" fill="#2E3440">admin</text>
  <text x="456" y="280" text-anchor="middle" font-size="11.5" fill="#5B6270">Admin Portal</text>

  <!-- LFI -->
  <rect x="8" y="352" width="720" height="104" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="24" y="374" font-weight="600" fill="#2E3440">LFI</text>

  <rect x="24" y="384" width="336" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="192" y="408" text-anchor="middle" font-weight="600" fill="#2E3440">auth-redirect</text>
  <text x="192" y="424" text-anchor="middle" font-size="11.5" fill="#5B6270">consent journey in web or mobile app</text>

  <rect x="376" y="384" width="160" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="456" y="408" text-anchor="middle" font-weight="600" fill="#2E3440">LFI staff</text>
  <text x="456" y="424" text-anchor="middle" font-size="11.5" fill="#5B6270">Admin Portal users</text>

  <rect x="552" y="384" width="160" height="56" rx="8" fill="none" stroke="#3D4451" stroke-width="1.25"/>
  <text x="632" y="408" text-anchor="middle" font-weight="600" fill="#2E3440">ozoneconnect</text>
  <text x="632" y="424" text-anchor="middle" font-size="11.5" fill="#5B6270">Ozone Connect server</text>

  <!-- Connectors: each arrow starts at the side making the call -->
  <g fill="none" stroke="#3D4451" stroke-width="1.25">
    <path d="M104 100V168" marker-end="url(#arrow)"/>
    <path d="M280 100V168" marker-end="url(#arrow)"/>
    <path d="M632 100V168" marker-end="url(#arrow)"/>
    <path d="M104 384V296" marker-end="url(#arrow)"/>
    <path d="M280 384V296" marker-end="url(#arrow)"/>
    <path d="M456 384V296" marker-end="url(#arrow)"/>
    <path d="M632 224V384" marker-end="url(#arrow)"/>
  </g>

  <text x="296" y="122" font-size="11.5" fill="#5B6270">security profile [TBC – QCB]</text>
  <text x="112" y="338" font-size="11.5" fill="#5B6270">mTLS</text>
  <text x="288" y="338" font-size="11.5" fill="#5B6270">mTLS</text>
  <text x="464" y="338" font-size="11.5" fill="#5B6270">TLS, user sign-in</text>
  <text x="640" y="338" font-size="11.5" fill="#5B6270">mTLS</text>
</svg>
