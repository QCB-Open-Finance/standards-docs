openapi: 3.1.0
info:
  title: Ozone Connect - Health Check APIs
  x-sf-docs-util-menu-item-name: Health Check Operations API
  contact:
    name: Ozone Financial Technology Limited
  description: >
    This document provides an API description in [OpenAPI](https://spec.openapis.org/oas/v3.1.0.html) for Health Check
    APIs for Ozone Connect, which provides the capability to check that an LFIs Ozone Connect interface is access for
    **testing and deployment purposes**.

    Please note that this API is **not** used as a live health check mechanism in production. These APIs should
    therefore be implemented by LFIs for testing and deployment purposes only.

    ## Versioning

    The `version` property implements the following pattern
    `{standards-major}.{standards-minor}.{ozone-connect-version}`, where:

    * `standards-major` is the major version of the latest QCB standard that the API description implements.

    * `standards-minor` is the minor version of the latest QCB standard that the API description implements.

    * `ozone-connect-version` is the version of the Ozone Connect API description.

    So, for example, `v1.0.0` indicates the first version of the Ozone Connect API description that implements the QCB
    standard version 1.0.

    ## Changelog

    The following sections describe high-level changes to this API description.

    ### v1.0.0

    * Added initial version of API description
  version: v1.0.0
servers:
  - url: https://{hostName}
    description: The address of your Ozone Connect API
    variables:
      hostName:
        description: The hostname at which your Ozone Connect API is provided
        default: example.com
tags:
  - name: health-check
    description: APIs that should be implemented by Financial Institutions to expose health check operations
security:
  - OzoneConnectMutualTls: []
paths:
  /hello:
    get:
      operationId: hello
      security: []
      summary: check connectivity without a mutual tls check
      tags:
        - health-check
      description: >
        Check connectivity without a mutual tls CheckDetails.

        This health check is used to check that the end-to-end network connectivity is working as expected. This is a
        simple health check that does not require mutual TLS.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck200Response'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /hello-mtls:
    get:
      operationId: helloMtls
      summary: check connectivity including mtls
      tags:
        - health-check
      description: >
        Check connectivity including mutual TLS CheckDetails.

        This health check is used to check that the end-to-end network connectivity is working as expected including
        mutual tls.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck200Response'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
  /echo-cert:
    get:
      operationId: echoCert
      tags:
        - health-check
      summary: Provides information about the client cert that the server received
      description: >
        This health check endpoint assists in debugging mutual tls client issues.

        The health check returns information about the client certificate and the issuer of the client certificate that
        the server received.

        Where mtls cannot be established, the server will return a 401 response.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckCertResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'
components:
  securitySchemes:
    OzoneConnectMutualTls:
      description: >-
        Communications between the API Hub and the LFI Ozone Connect implementation are secured using mutual TLS (mTLS),
        where the Client authenticates by presenting an X.509 certificate during the TLS handshake.
      type: mutualTLS
  responses:
    UnauthorizedResponse:
      description: Unauthorized response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthCheck4xxResponse'
    DefaultErrorResponse:
      description: Default error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthCheck4xxResponse'
  schemas:
    HealthCheck200Response:
      type: object
      description: Successful response on a health check
      properties:
        connectionEstablished:
          $ref: '#/components/schemas/ConnectionEstablished'
        mtlsStatus:
          description: Describes the status of the mTLS connection
          type: string
          enum:
            - established
            - not-established
            - not-checked
        hostName:
          $ref: '#/components/schemas/HostName'
      required:
        - connectionEstablished
        - mtlsStatus
        - hostName
    HealthCheck4xxResponse:
      type: object
      description: Response when connection could not be established
      properties:
        errorMessage:
          description: A description of the error being experienced.
          type: string
      required:
        - errorMessage
    HealthCheckCertResponse:
      type: object
      properties:
        connectionEstablished:
          $ref: '#/components/schemas/ConnectionEstablished'
        mtlsStatus:
          type: string
          enum:
            - established
            - not-established
        hostName:
          $ref: '#/components/schemas/HostName'
        clientCertificate:
          description: Properties of the client certificate presented by the caller during the mTLS handshake.
          type: object
          properties:
            subject:
              description: >-
                The Distinguished Name of the client certificate's subject. For Open Finance QCB callers, the OU
                contains the caller's organisation ID from the Trust Framework directory.
              type: string
              example: C=UK, O=OZONE FINANCIAL TECHNOLOGY LIMITED, OU=233bcd1d-4216-4b3c-a362-9e4a9282bba7
            issuer:
              description: The Distinguished Name of the issuing Certificate Authority.
              type: string
              example: >-
                C=QA, O=Open Finance QCB, OU=Open Finance QCB Sandbox Trust Framework, CN=Open Finance QCB Sandbox
                Issuing CA - G1
          required:
            - subject
            - issuer
      required:
        - connectionEstablished
        - mtlsStatus
        - hostName
        - clientCertificate
    HostName:
      description: >-
        The hostname to which the connection was attempted. Should match the hostname of the server on which the health
        check implementation is running.
      type: string
      example: auth.open-finance-apihub.qa
    ConnectionEstablished:
      description: Indicator of whether a connection was established
      type: boolean
