            Omitted where the Consent has not been revoked.
        OpenFinanceBilling:
          $ref: '#/components/schemas/Billing.CustomerType1Properties'
        Charges:
          type: array
          items:
            $ref: '#/components/schemas/Charges.Charge1Properties'
          minItems: 1
          description: |-
            Charges applied to a given payment initiation instruction, as stated by the LFI.

            Omitted if no charges apply to the payment.
        ExchangeRate:
          $ref: '#/components/schemas/CurrencyExchange.ConsentCurrencyExchangeRateInformation1Properties'
        PaymentConsumption:
          $ref: '#/components/schemas/PaymentInitiation.PaymentConsumption1Properties'
        Meta:
          allOf:
            - $ref: '#/components/schemas/Consent.ConsentMeta1Properties'
          description: >-
            Metadata recorded against the Consent by the LFI, which currently carries multi-authorization progress.


            Response-only: it reports state established after Consent Authorization, so it is **not** submitted in the
            Pushed Authorization Request.


            Omitted where the LFI does not require multiple authorizers for the Consent.
      description: Properties of the consent agreed by the User with the TPP for a Variable On-Demand Schedule of payments.
      additionalProperties: false
    PaymentInitiation.ReadVariablePeriodicScheduleAuthorizationDetails1Properties:
      type: object
      required:
        - type
        - consent
      properties:
        type:
          type: string
          enum:
            - urn:openfinanceqatar:payment-initiation:variable-periodic-schedule:v1.0
          description: >-
            The Rich Authorization Request type, as defined by [RFC
            9396](https://datatracker.ietf.org/doc/html/rfc9396#section-2-2.2).
        consent:
          $ref: '#/components/schemas/PaymentInitiation.ReadVariablePeriodicScheduleConsent1Properties'
        Webhook:
          type: object
          properties:
            Url:
              type: string
              pattern: https:\/\/.+
              description: |-
                The TPP Webhook URL being registered with the LFI.

                The URL **MUST** use HTTPS.
            IsActive:
              type: boolean
              description: >-
                The TPP specifying whether the API Hub should emit Events, where `isActive` is `true` (Events are sent)
                or `false` (Events are not sent).
          required:
            - Url
            - IsActive
          description: Properties of the TPP Webhook and the state of the subscription.
          additionalProperties: false
      description: Properties of a Consent object for a Variable Periodic Schedule of payments initiated by a TPP
      additionalProperties: false
    PaymentInitiation.ReadVariablePeriodicScheduleConsent1Properties:
      type: object
      required:
        - ControlParameters
        - ConsentId
        - IsSingleAuthorization
        - ExpirationDateTime
        - DebtorReference
        - PaymentPurposeCode
        - CreationDateTime
        - Status
        - StatusUpdateDateTime
        - PaymentConsumption
      properties:
        ControlParameters:
          type: object
          properties:
            PeriodType:
              $ref: '#/components/schemas/PaymentInitiation.PeriodType1Codes'
            PeriodStartDate:
              $ref: '#/components/schemas/PaymentInitiation.PeriodStartDate1Type'
            MaximumIndividualAmount:
              allOf:
                - $ref: '#/components/schemas/PaymentInitiation.MaximumIndividualAmount1Properties'
              description: This is the Maximum amount a variable payment can take per period.
          required:
            - PeriodType
            - PeriodStartDate
            - MaximumIndividualAmount
          description: >-
            Payment Controls that apply to all payment instructions in a given period under this payment  


            The payments for this consent must be executed only on the PeriodStartDate, and dates recurring based on the
            PeriodType.
          additionalProperties: false
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        BaseConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        IsSingleAuthorization:
          type: boolean
          description: >-
            TPP is request authorization by a single User, with no multi-authorization requirement.


            Used to indicate the requirement time-bound authorization of the payment, in order to release goods or
            services in a timely fashion.


            Can be ignored by LFIs where the access control model for the account requires multiple authorizations of
            the 


            Set to `false` where immediate authorization is not required.
        AuthorizationExpirationDateTime:
          type: string
          format: date-time
          x-ozone-discovery-requires-analysis: >-
            Check on existing usage as this may not make sense, and should be set by default after the Consent is
            created.
        ExpirationDateTime:
          $ref: '#/components/schemas/Consent.ConsentExpirationDateTime1Type'
        Permissions:
          type: array
          items:
            $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationAccountInformationPermission1Codes'
          minItems: 2
          uniqueItems: true
          description: >-
            Specifies the permitted Bank Data Sharing permissions, which is the data clusters being consented by the
            User, and requested for authorization with the LFI. 


            Allows TPPs to check the User balance at the payment account.


            TPPs **MUST** select `ReadAccountsBasic` and `ReadBalances` to implement a balance check before making
            payment.
        CurrencyRequest:
          $ref: '#/components/schemas/CurrencyExchange.RequestedCurrencyExchange1Properties'
        DebtorReference:
          $ref: '#/components/schemas/PaymentInitiation.DebtorReference1Type'
        CreditorReference:
          $ref: '#/components/schemas/PaymentInitiation.CreditorReference1Type'
        PaymentPurposeCode:
          allOf:
            - $ref: '#/components/schemas/PaymentPurposeCode1Type'
          x-ozone-discovery-requires-analysis: What are the applicable payment purpose codes under QCB payment schemes.
        CreationDateTime:
          $ref: '#/components/schemas/Consent.ConsentCreationDateTime1Type'
        Status:
          $ref: '#/components/schemas/Consent.ConsentStatus1Codes'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/Consent.ConsentStatusUpdateDateTime1Type'
        RevokedBy:
          allOf:
            - $ref: '#/components/schemas/Consent.ConsentRevokedBy1Codes'
          description: |-
            Indicates who the Consent was revoked by.

            Omitted where the Consent has not been revoked.
        OpenFinanceBilling:
          $ref: '#/components/schemas/Billing.CustomerType1Properties'
        Charges:
          type: array
          items:
            $ref: '#/components/schemas/Charges.Charge1Properties'
          minItems: 1
          description: |-
            Charges applied to a given payment initiation instruction, as stated by the LFI.

            Omitted if no charges apply to the payment.
        ExchangeRate:
          $ref: '#/components/schemas/CurrencyExchange.ConsentCurrencyExchangeRateInformation1Properties'
        PaymentConsumption:
          $ref: '#/components/schemas/PaymentInitiation.PaymentConsumption1Properties'
        Meta:
          allOf:
            - $ref: '#/components/schemas/Consent.ConsentMeta1Properties'
          description: >-
            Metadata recorded against the Consent by the LFI, which currently carries multi-authorization progress.


            Response-only: it reports state established after Consent Authorization, so it is **not** submitted in the
            Pushed Authorization Request.


            Omitted where the LFI does not require multiple authorizers for the Consent.
      description: Properties of the consent agreed by the User with the TPP for a Variable Periodic Schedule of payments.
      additionalProperties: false
    PaymentInitiation.RecipientType1Codes:
      type: string
      enum:
        - Individual
        - Corporate
      description: Indicates whether the recipient of the delivery is an individual or a corporate entity.
    PaymentInitiation.ReorderItemsIndicator1Codes:
      type: string
      enum:
        - FirstTimeOrder
        - Reorder
      description: Indicates whether the transaction is a first-time order or a reorder of items.
    PaymentInitiation.Risk1Properties:
      type: object
      properties:
        DebtorIndicators:
          $ref: '#/components/schemas/PaymentInitiation.DebtorIndicators1Properties'
        DestinationDeliveryAddress:
          type: object
          properties:
            RecipientType:
              $ref: '#/components/schemas/PaymentInitiation.RecipientType1Codes'
            RecipientName:
              type: object
              properties:
                en:
                  type: string
                  minLength: 1
                  maxLength: 70
                  description: Name provided in English language.
                ar:
                  type: string
                  minLength: 1
                  maxLength: 70
                  description: Name provided in Arabic
              additionalProperties: false
            NationalAddress:
              type: array
              items:
                $ref: '#/components/schemas/Address.QatarAddress1Properties'
              minItems: 1
              description: One-or-more addresses the goods or services are to be delivered to.
          description: Destination Delivery Address
          additionalProperties: false
        TransactionIndicators:
          $ref: '#/components/schemas/PaymentInitiation.TransactionIndicators1Properties'
        CreditorIndicators:
          $ref: '#/components/schemas/PaymentInitiation.CreditorIndicators1Properties'
      description: >-
        Risk information is sent by the TPP to the LFI and is used to specify additional details for payment risk and
        fraud scoring.
      additionalProperties: false
    PaymentInitiation.SingleInstantPayment1Properties:
      type: object
      required:
        - Type
        - Amount
      properties:
        Type:
          type: string
          enum:
            - SingleInstantPayment
          description: The Payment Type.
        Amount:
          type: object
          required:
            - Amount
            - Currency
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: An Amount qualified by an active Currency, using amount and currency as prescribed by ISO 4217.
          additionalProperties: false
      description: >-
        A single immediate payment consent that **MUST** be used for a single payment, which will be initiated
        immediately after User authorization at the LFI.
      additionalProperties: false
    PaymentInitiation.SinglePaymentConsentSchedule1Properties:
      type: object
      required:
        - SinglePayment
      properties:
        SinglePayment:
          $ref: '#/components/schemas/PaymentInitiation.SingleInstantPayment1Properties'
      description: A Consent Schedule for a Single Payment, initiated immediately after the User authorizes the Consent at the LFI.
      additionalProperties: false
    PaymentInitiation.SubChannelType1Codes:
      type: string
      enum:
        - WebBrowser
        - MobileApp
        - SmartTV
        - WearableDevice
        - POSTerminal
        - ATM
        - KioskTerminal
        - Other
      description: More specific classification of the transaction channel.
    PaymentInitiation.SuspiciousActivity1Codes:
      type: string
      enum:
        - NoSuspiciousActivity
        - SuspiciousActivityDetected
      description: Indicates whether suspicious activity has been detected on the account.
    PaymentInitiation.TradingName1Properties:
      type: object
      properties:
        en:
          type: string
          minLength: 1
          maxLength: 70
          description: English language value of the trading name.
        ar:
          type: string
          minLength: 1
          maxLength: 70
          description: Arabic language value of the trading name.
      description: |-
        The trading name (if applicable) for the Creditor, as defined by local organization registration requirements.

        Omitted if not account name and trading name match.
      additionalProperties: false
    PaymentInitiation.TransactionIndicators1Properties:
      type: object
      properties:
        IsCustomerPresent:
          type: boolean
          description: This field differentiates between automatic and manual payment initiation.
        IsContractPresent:
          type: boolean
          description: Indicates if the Creditor has a contractual relationship with the TPP.
        Channel:
          $ref: '#/components/schemas/PaymentInitiation.Channel1Codes'
        ChannelType:
          $ref: '#/components/schemas/PaymentInitiation.ChannelType1Codes'
        SubChannelType:
          $ref: '#/components/schemas/PaymentInitiation.SubChannelType1Codes'
        PaymentProcess:
          type: object
          properties:
            TotalDuration:
              type: integer
              minimum: 0
            CurrentSessionAttempts:
              type: integer
              minimum: 1
            CurrentSessionFailedAttempts:
              type: integer
              minimum: 0
            Last24HourAttempts:
              type: integer
              minimum: 0
            Last24HourFailedAttempts:
              type: integer
              minimum: 0
          description: Metrics related to the payment process duration and attempts
          additionalProperties: false
        MerchantRisk:
          type: object
          properties:
            DeliveryTimeframe:
              $ref: '#/components/schemas/PaymentInitiation.DeliveryTimeframe1Codes'
            ReorderItemsIndicator:
              $ref: '#/components/schemas/PaymentInitiation.ReorderItemsIndicator1Codes'
            PreOrderPurchaseIndicator:
              $ref: '#/components/schemas/PaymentInitiation.PreOrderPurchaseIndicator1Codes'
            IsGiftCardPurchase:
              type: boolean
            IsDeliveryAddressMatchesBilling:
              type: boolean
            AddressMatchLevel:
              $ref: '#/components/schemas/PaymentInitiation.AddressMatchLevel1Codes'
          description: Risk indicator details provided by the merchant
          additionalProperties: false
        SupplementaryData:
          type: object
          description: Additional information that cannot be captured in the structured fields and/or any other specific block
          additionalProperties: false
      description: Transaction Indicators
      additionalProperties: false
    PaymentInitiation.VariableOnDemand1Properties:
      type: object
      required:
        - Type
        - PeriodType
        - PeriodStartDate
        - Controls
      properties:
        Type:
          type: string
          enum:
            - VariableOnDemand
          description: The Periodic Schedule Type.
        PeriodType:
          $ref: '#/components/schemas/PaymentInitiation.PeriodType1Codes'
        PeriodStartDate:
          $ref: '#/components/schemas/PaymentInitiation.PeriodStartDate1Type'
        Controls:
          type: object
          properties:
            MaximumIndividualAmount:
              $ref: '#/components/schemas/PaymentInitiation.MaximumIndividualAmount1Properties'
            MaximumCumulativeValueOfPaymentsPerPeriod:
              $ref: '#/components/schemas/PaymentInitiation.PeriodTypeMaximumCumulativeValueOfPayments1Properties'
            MaximumCumulativeNumberOfPaymentsPerPeriod:
              type: integer
          minProperties: 1
          description: Controls that apply to the payment schedule.
          additionalProperties: false
      description: >-
        Payment Controls that apply to all payment instructions in a given period under this payment consent.


        The payments for this consent may be executed on any date, as long as they are within the Controls for a
        PeriodType.
      additionalProperties: false
    PaymentPurposeCode1Type:
      type: string
      minLength: 1
      maxLength: 4
      description: >-
        A category code that relates to the type of services or goods that corresponds to the underlying purpose of the
        payment. 


        The code must conform to the published code list provided by QCB.
      x-ozone-discovery-requires-analysis: Source mandated payment purpose code list from QCB.
    PushedAuthorizationRequestAuthorizationDetailTypesV1_0:
      type: object
      oneOf:
        - $ref: '#/components/schemas/AccountInformation.CreateAccountInformationAuthorizationDetails1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.CreatePaymentInitiationAuthorizationDetails1Properties'
      discriminator:
        propertyName: type
        mapping:
          urn:openfinanceqatar:bank-data-sharing:account-information:v1.0: '#/components/schemas/AccountInformation.CreateAccountInformationAuthorizationDetails1Properties'
          urn:openfinanceqatar:bank-service-initiation:payment-initiation:v1.0: '#/components/schemas/PaymentInitiation.CreatePaymentInitiationAuthorizationDetails1Properties'
    PushedAuthorizationRequestBody1Properties:
      type: object
      required:
        - client_assertion_type
        - client_assertion
        - request
      properties:
        client_assertion_type:
          type: string
          enum:
            - urn%3Aietf%3Aparams%3Aoauth%3Aclient-assertion-type%3Ajwt-bearer
          description: >-
            Client Assertion Type indicating JWT Authentication, as described by [RFC
            7523](https://datatracker.ietf.org/doc/html/rfc7523#section-2.2).


            The value `urn:ietf:params:oauth:client-assertion-type:jwt-bearer` is prescribed, and is implemented with
            URL encoding.
        client_assertion:
          type: string
          pattern: ^[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+$
          description: >-
            Client Assertion value, which **must** be a single JWT.


            Implemented using the `private_key_jwt` method, as defined by [OpenID
            Connect](https://openid.net/specs/openid-connect-core-1_0.html#ClientAuthentication).
        request:
          oneOf:
            - $ref: '#/components/schemas/AuthorizationRequest1Properties'
            - $ref: '#/components/schemas/PushedAuthorizationRequestJws1Type'
      additionalProperties: false
    PushedAuthorizationRequestJws1Type:
      type: string
      minLength: 1
      maxLength: 32768
      description: The Authorization Request object as a JWS, defined as a string.
    PushedAuthorizationResponse1Properties:
      type: object
      required:
        - request_uri
        - expires_in
      properties:
        request_uri:
          allOf:
            - $ref: '#/components/schemas/FAPI.RequestUri1Type'
          description: The URI corresponding to the Authorization Request posted as a PAR.
        expires_in:
          type: integer
          description: A JSON number that represents the lifetime of the request URI in seconds as a positive integer.
      additionalProperties: false
    RefreshTokenGrantTokenRequest1Properties:
      type: object
      required:
        - client_id
        - client_assertion_type
        - client_assertion
        - grant_type
        - refresh_token
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 1024
          description: The OAuth 2.0 Client ID of the Client, as set in the Trust Framework.
        client_assertion_type:
          type: string
          enum:
            - urn%3Aietf%3Aparams%3Aoauth%3Aclient-assertion-type%3Ajwt-bearer
          description: >-
            Client Assertion Type indicating JWT Authentication, as described by [RFC
            7523](https://datatracker.ietf.org/doc/html/rfc7523#section-2.2).


            The value `urn:ietf:params:oauth:client-assertion-type:jwt-bearer` is prescribed, and is implemented with
            URL encoding.
        client_assertion:
          type: string
          pattern: ^[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+$
          description: >-
            Client Assertion value, which **must** be a single JWT.


            Implemented using the `private_key_jwt` method, as defined by [OpenID
            Connect](https://openid.net/specs/openid-connect-core-1_0.html#ClientAuthentication).
        grant_type:
          type: string
          enum:
            - refresh_token
          description: The grant type, which must be set to `refresh_token`.
        refresh_token:
          type: string
          minLength: 1
          maxLength: 2048
          description: |-
            [OAuth 2.0 Refresh Token](https://datatracker.ietf.org/doc/html/rfc6749#section-1.5).

            Omitted from responses where not supported by a given consent type.
        scope:
          type: string
          minLength: 1
          maxLength: 1024
          description: Access Token scope. Omitted if not required.
      additionalProperties: false
    TokenResponse1Types:
      oneOf:
        - $ref: '#/components/schemas/AuthorizationCodeGrantTokenAuthorizationDetailsResponse1Properties'
        - $ref: '#/components/schemas/ClientCredentialsGrantTokenResponse1Properties'
      description: |-
        Token response properties, which vary by the grant type of the request.

        Rich Authorization Request (RAR) objects are returned for grants associated with a Consent agreed by a User.
    Values.ActiveOrHistoricAmount1Type:
      type: string
      pattern: ^\d{1,13}$|^\d{1,13}\.\d{1,5}$
      description: >-
        A number of monetary units specified in an active currency where the unit of currency is explicit and compliant
        with ISO 4217.
      example: '100.00'
    Values.ActiveOrHistoricCurrencyCode1Type:
      type: string
      pattern: ^[A-Z]{3,3}$
      description: |-
        A 3 character alphabetic code allocated to a currency under an international currency identification scheme.

        Values **MUST** be in accordance with ISO 4217 'Codes for the representation of currencies and funds'.
    Values.Latitude1Type:
      type: string
      minLength: 1
      maxLength: 20
      description: Latitude value.
    Values.Longitude1Type:
      type: string
      minLength: 1
      maxLength: 20
      description: Longitude value.
servers:
  - url: /open-finance/auth/v1.0
