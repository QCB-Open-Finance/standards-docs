openapi: 3.0.0
info:
  title: 'QCB Open Finance: Authorization Endpoints API'
  description: >-
    # QCB Open Finance Authorization Endpoints


    This API description provides the API descriptions for two OAuth 2.0 operations included in the FAPI 2.0 Security
    Profile:


    * [Pushed Authorization Requests](https://datatracker.ietf.org/doc/html/rfc9126), which implement [Rich
    Authorization Requests (RAR)](https://datatracker.ietf.org/doc/html/rfc9396) (RAR) payloads to provide Consent for a
    given use case.


    * Token operations that provide details of the RAR associated with a given Access Token request.


    Please note that the Authorization Request described by the Pushed Authorization Request is a JWT-Secured
    Authorization Request, as described by [RFC 9101](https://datatracker.ietf.org/doc/html/rfc9101).


    The API description describes the `request` property that implements this as a **plain JSON object, which only
    describes the payload of a signed JSON Web Token (JWS)**.


    The `request` object **MUST** be transmitted as a JWS, where the JWS is the value of the `request` parameter, which
    is encoded and submitted using the `application/x-www-form-urlencoded` content type.


    Users of this API description must ensure they implement the Authorization Request as a JWS, encoding the payload as
    described by [RFC 7515](https://datatracker.ietf.org/doc/html/rfc7515) and reflecting the requirements of the API
    Security Profile for the QCB open finance standards.
  version: v1.0-draft1
  x-sf-docs-util-menu-item-name: Authorization Endpoints
  x-sf-typescript-util-family: Qcb
  x-sf-typescript-util-api-type: standards
  x-sf-typescript-util-class-prefix: QcbAuthEdpt
tags:
  - name: Pushed Authorization Requests
    description: Operations to support Pushed Authorization Requests (PAR)
  - name: Token Operations
    description: Operations for creating OAuth 2.0 Access Tokens
paths:
  /par:
    post:
      operationId: CreatePushedAuthorizationRequestV1_0
      summary: Pushed Authorization Request endpoint
      description: >-
        Submit a Rich Authorization Request (RAR) to the Pushed Authorization Request (PAR) Endpoint, as defined in [RFC
        9126](https://datatracker.ietf.org/doc/html/rfc9126).


        The `application/json` Content Type is included in the Request Body for tooling compatibility, but requests
        **MUST** be sent using the Content Type `application/x-www-form-urlencoded`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushedAuthorizationResponse1Properties'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth.OAuthBadRequestErrorResponse1Properties'
        '405':
          description: Method Not Allowed
        '413':
          description: Content Too Large
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              required: true
              description: Number in seconds to wait
              schema:
                type: integer
                format: int64
      tags:
        - Pushed Authorization Requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushedAuthorizationRequestBody1Properties'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PushedAuthorizationRequestBody1Properties'
  /token:
    post:
      operationId: CreateAccessTokenRequestV1_0
      summary: Obtain an Access Token
      description: >-
        Request an Access Token based on a given grant type, indicated by `grant_type` and request payload properties.


        Response provides information on the original Rich Authorization Request (RAR) as described in [RFC
        9396](https://datatracker.ietf.org/doc/html/rfc9396).


        The `application/json` Content Type is included in the Request Body for tooling compatibility, but requests
        **MUST** be sent using the Content Type `application/x-www-form-urlencoded`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse1Types'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth.OAuthBadRequestErrorResponse1Properties'
      tags:
        - Token Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/AuthorizationCodeGrantTokenRequest1Properties'
                - $ref: '#/components/schemas/RefreshTokenGrantTokenRequest1Properties'
                - $ref: '#/components/schemas/ClientCredentialsGrantTokenRequest1Properties'
          application/x-www-form-urlencoded:
            schema:
              anyOf:
                - $ref: '#/components/schemas/AuthorizationCodeGrantTokenRequest1Properties'
                - $ref: '#/components/schemas/RefreshTokenGrantTokenRequest1Properties'
                - $ref: '#/components/schemas/ClientCredentialsGrantTokenRequest1Properties'
components:
  schemas:
    AccountInformation.AccountSubType1Codes:
      type: string
      enum:
        - Current
        - Savings
        - CreditCard
        - Mortgage
        - Finance
      description: |-
        Specifies the sub type of account (product family group).

        Supported values: CurrentAccount, Savings, CreditCard, Mortgage, Finance.
    AccountInformation.AccountType1Codes:
      type: string
      enum:
        - Retail
        - SME
        - Corporate
      description: Specifies the type of account (Retail, SME or Corporate).
    AccountInformation.ConsentPermission1Codes:
      type: string
      enum:
        - ReadAccountsBasic
        - ReadAccountsDetail
        - ReadBalances
        - ReadTransactionsBasic
        - ReadTransactionsDetail
      description: The permission codes available to the TPP for Bank Data Sharing and agreed with the User.
      x-ozone-discovery-requires-analysis: Verify that the list of permissions is correct for QCB.
    AccountInformation.CreateAccountInformationAuthorizationDetails1Properties:
      type: object
      required:
        - type
        - consent
      properties:
        type:
          type: string
          enum:
            - urn:openfinanceqatar:bank-data-sharing:account-information:v1.0
          description: >-
            The Rich Authorization Request type, as defined by [RFC
            9396](https://datatracker.ietf.org/doc/html/rfc9396#section-2-2.2).
        consent:
          $ref: '#/components/schemas/AccountInformation.CreateAccountInformationConsent1Properties'
        subscription:
          allOf:
            - $ref: '#/components/schemas/Events.Subscription1Properties'
          description: Subscription to Event Notifications, to be sent to the TPP Webhook registered at the API Hub.
      description: Properties for creating a Consent object for sharing account information with a TPP.
      additionalProperties: false
      title: Account Information Consent
    AccountInformation.CreateAccountInformationConsent1Properties:
      type: object
      required:
        - ConsentId
        - Permissions
        - ExpirationDateTime
        - OpenFinanceBilling
      properties:
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        BaseConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        Permissions:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.ConsentPermission1Codes'
          minItems: 1
        ExpirationDateTime:
          $ref: '#/components/schemas/Consent.ConsentExpirationDateTime1Type'
        FromDate:
          $ref: '#/components/schemas/AccountInformation.FromDate1Type'
        ToDate:
          $ref: '#/components/schemas/AccountInformation.ToDate1Type'
        AccountType:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.AccountType1Codes'
          minItems: 1
        AccountSubType:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.AccountSubType1Codes'
          minItems: 1
        OnBehalfOf:
          $ref: '#/components/schemas/Consent.TppActingOnBehalfOf1Types'
        OpenFinanceBilling:
          $ref: '#/components/schemas/AccountInformation.TppBillingInformation1Properties'
      additionalProperties: false
    AccountInformation.FromDate1Type:
      type: string
      format: date
      description: >-
        Specified start date for the transaction or statement query period.


        If this is not populated, the start date will be open ended, and data will be returned from the earliest
        available transaction or statement.


        All dates in the JSON payloads are represented in RFC 3339 date format.  For example: 2025-01-01
    AccountInformation.ReadAccountInformationAuthorizationDetails1Properties:
      type: object
      required:
        - type
        - consent
      properties:
        type:
          type: string
          enum:
            - urn:openfinanceqatar:bank-data-sharing:account-information:v1.0
          description: >-
            The Rich Authorization Request type, as defined by [RFC
            9396](https://datatracker.ietf.org/doc/html/rfc9396#section-2-2.2).
        consent:
          $ref: '#/components/schemas/AccountInformation.ReadConsent1Properties'
        subscription:
          allOf:
            - $ref: '#/components/schemas/Events.Subscription1Properties'
          description: >-
            Subscription to Event Notifications, to be sent to the TPP Webhook registered at the API Hub.


            Omitted where the TPP does not implement Event Notifications of Webhooks, and will use polling to retrieve
            updates to the status of a given Consent.
      description: Properties of a Consent object created to share Account Information with a TPP.
      additionalProperties: false
    AccountInformation.ReadConsent1Properties:
      type: object
      required:
        - ConsentId
        - Permissions
        - ExpirationDateTime
        - CreationDateTime
        - Status
        - StatusUpdateDateTime
        - OpenFinanceBilling
      properties:
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        BaseConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        Permissions:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.ConsentPermission1Codes'
          minItems: 1
        ExpirationDateTime:
          $ref: '#/components/schemas/Consent.ConsentExpirationDateTime1Type'
        FromDate:
          $ref: '#/components/schemas/AccountInformation.FromDate1Type'
        ToDate:
          $ref: '#/components/schemas/AccountInformation.ToDate1Type'
        AccountType:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.AccountType1Codes'
          minItems: 1
        AccountSubType:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.AccountSubType1Codes'
          minItems: 1
        OnBehalfOf:
          $ref: '#/components/schemas/Consent.TppActingOnBehalfOf1Types'
        CreationDateTime:
          $ref: '#/components/schemas/Consent.ConsentCreationDateTime1Type'
        Status:
          $ref: '#/components/schemas/Consent.ConsentStatus1Codes'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/Consent.ConsentStatusUpdateDateTime1Type'
        RevokedBy:
          allOf:
            - $ref: '#/components/schemas/Consent.ConsentRevokedBy1Codes'
          description: |-
            Indicates who the Consent was revoked by.

            Omitted where the Consent has not been revoked.
        OpenFinanceBilling:
          type: object
          properties:
            IsLargeCorporate:
              type: boolean
              description: Account holder is classified as a large corporate customer by the LFI.
            UserType:
              $ref: '#/components/schemas/Billing.TppBillingUserTypes1Codes'
            Purpose:
              type: string
              enum:
                - AccountAggregation
                - RiskAssessment
                - TaxFiling
                - Onboarding
                - Verification
                - QuoteComparison
                - BudgetingAnalysis
                - FinancialAdvice
                - AuditReconciliation
              description: Purpose of data sharing request, based on supported use cases.
              x-ozone-discovery-requires-analysis: Verify that the use cases listed are appropriate for QCB.
          required:
            - UserType
            - Purpose
          description: >-
            Consolidated billing information properties added by the TPP and LFI.


            `isLargeCorporate` is optional as the value is updated out-of-band, and may be updated after the completion
            of Consent Authorization.
          additionalProperties: false
      additionalProperties: false
    AccountInformation.ToDate1Type:
      type: string
      format: date
      description: >-
        Specified end date for the transaction or statement query period.


        If this is not populated, the end date will be open ended, and data will be returned to the latest available
        transaction or the last statement generated.


        All dates in the JSON payloads are represented in RFC 3339 date format.  For example: 2025-12-31    
    AccountInformation.TppBillingInformation1Properties:
      type: object
      required:
        - UserType
        - Purpose
      properties:
        UserType:
          $ref: '#/components/schemas/Billing.TppBillingUserTypes1Codes'
        Purpose:
          type: string
          enum:
            - AccountAggregation
            - RiskAssessment
            - TaxFiling
            - Onboarding
            - Verification
            - QuoteComparison
            - BudgetingAnalysis
            - FinancialAdvice
            - AuditReconciliation
          description: Purpose of data sharing request, based on supported use cases.
          x-ozone-discovery-requires-analysis: Verify that the use cases listed are appropriate for QCB.
      description: Billing information specified during Consent Setup or following authorization.
      additionalProperties: false
    Address.Address1Types:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Address.QatarAddress1Properties'
        - $ref: '#/components/schemas/Address.InternationalQualifiedAddress1Properties'
        - $ref: '#/components/schemas/Address.InternationalUnqualifiedAddress1Properties'
      discriminator:
        propertyName: AddressFormatType
        mapping:
          Qatar: '#/components/schemas/Address.QatarAddress1Properties'
          InternationalQualifiedAddress: '#/components/schemas/Address.InternationalQualifiedAddress1Properties'
          InternationalUnqualifiedAddress: '#/components/schemas/Address.InternationalUnqualifiedAddress1Properties'
      description: >-
        An address related to a given person or organization, based on ISO 20022.


        Qatar address structures are mapped as follows:


        * Zone: `CountrySubDivision`.


        * Street: `StreetName`.


        * Building Number: `BuildingNumber`.


        Other properties are retained in this object to support non-Qatar addresses.


        Implementers can choose, where appropriate, to provide `AddressLine` and `Country` where disambiguation of
        address properties is impossible.
    Address.AddressLine1Type:
      type: string
      minLength: 1
      maxLength: 70
      description: A freeform address entry that is not specified using specific address properties.
    Address.AddressType1Codes:
      type: string
      enum:
        - Billing
        - Business
        - Correspondence
        - DeliveryTo
        - MailTo
        - POBox
        - Postal
        - Permanent
        - Residential
        - Statement
        - Other
      description: Qualifies the type of address.
    Address.InternationalQualifiedAddress1Properties:
      type: object
      required:
        - AddressFormatType
        - AddressType
        - BuildingNumber
        - StreetName
        - CountrySubDivision
        - Country
      properties:
        AddressFormatType:
          type: string
          enum:
            - InternationalQualifiedAddress
          description: Address format, defaults to `InternationalQualifiedAddress`
        AddressType:
          $ref: '#/components/schemas/Address.AddressType1Codes'
        BuildingNumber:
          type: string
          minLength: 1
          maxLength: 16
          description: Identifies the position of a given building on a street.
        BuildingName:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of the house or building.
        Floor:
          type: string
          minLength: 1
          maxLength: 70
          description: Floor or storey within a building.
        StreetName:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of a street or thoroughfare.
        DistrictName:
          type: string
          minLength: 1
          maxLength: 140
          description: Identifies a subdivision within a country sub-division.
        PostBox:
          type: string
          minLength: 1
          maxLength: 16
          description: Numbered box ina post office assigned to a given Party where post is kept until collected.
        PostCode:
          type: string
          minLength: 1
          maxLength: 16
          description: Identifier that qualifies a postal address to assist with the sorting and delivery of mail.
        TownName:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of a built-up area.
        CountrySubDivision:
          type: string
          minLength: 1
          maxLength: 35
          description: Country sub-division based on standards for stated country.
        Country:
          type: string
          pattern: ^[A-Z]{2}$
          description: Country code that conforms to ISO 3166-1 alpha-2 values.
      description: International address in the qualified address format, implemented using separate address properties.
      additionalProperties: false
    Address.InternationalUnqualifiedAddress1Properties:
      type: object
      required:
        - AddressFormatType
        - AddressType
        - Country
      properties:
        AddressFormatType:
          type: string
          enum:
            - InternationalUnqualifiedAddress
          description: Address format, defaults to `InternationalUnqualifiedAddress`
        AddressType:
          $ref: '#/components/schemas/Address.AddressType1Codes'
        AddressLine:
          type: array
          items:
            $ref: '#/components/schemas/Address.AddressLine1Type'
          minItems: 1
          maxItems: 7
          description: One-or-more address lines provided using freeform text.
        Country:
          type: string
          pattern: ^[A-Z]{2}$
          description: Country code that conforms to ISO 3166-1 alpha-2 values.
      description: International address in the unqualified address format, implemented using `AddressLine` and `Country`.
      additionalProperties: false
    Address.QatarAddress1Properties:
      type: object
      required:
        - AddressFormatType
        - AddressType
        - BuildingNumber
        - StreetName
        - CountrySubDivision
        - Country
      properties:
        AddressFormatType:
          type: string
          enum:
            - Qatar
          description: Address format, defaults to `Qatar`
        AddressType:
          $ref: '#/components/schemas/Address.AddressType1Codes'
        BuildingNumber:
          type: string
          minLength: 1
          maxLength: 16
          description: Identifies the position of a given building on a street.
        StreetName:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of a street or thoroughfare.
        CountrySubDivision:
          type: string
          pattern: ^Zone [0-9]{1,2}$
          description: Country sub-division, provided as as a Zone for Qatar addresses.
        Country:
          type: string
          pattern: ^[A-Z]{2}$
          description: Country code that conforms to ISO 3166-1 alpha-2 values.
      description: Address in the Qatar address format.
      x-ozone-discovery-requires-analysis: Confirm that address format introduced for Qatar is appropriate for all use cases.
      additionalProperties: false
    AuthorizationCodeGrantTokenAuthorizationDetailsResponse1Properties:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - authorization_details
      properties:
        access_token:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            [OAuth 2.0 Access Token](https://datatracker.ietf.org/doc/html/rfc6749#section-1.4) issued through
            Authorization Code grant.
        token_type:
          type: string
          enum:
            - Bearer
          description: Access Token type.
        expires_in:
          type: integer
          description: Validity period of Access Token in seconds.
        scope:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            [Access Token Scope](https://datatracker.ietf.org/doc/html/rfc6749#section-3.3) as sent in Authorization
            Request and granted by the End User.
        state:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            OAuth 2.0 `state` value, provided as a means to support integrity checking by the Client under FAPI 2.0.
            Omitted from Refresh Token Grant.
        refresh_token:
          type: string
          minLength: 1
          maxLength: 2048
          description: |-
            [OAuth 2.0 Refresh Token](https://datatracker.ietf.org/doc/html/rfc6749#section-1.5).

            Omitted from responses where not supported by a given consent type.
        id_token:
          type: string
          minLength: 1
          maxLength: 16384
          description: OpenID Connect ID Token, returned where applicable to requested scope and supported flows.
        authorization_details:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationCodeGrantTokenRequestAuthorizationDetailTypesV1_0'
          minItems: 1
          description: Authorization details are sent in the Pushed Authorization Request
      additionalProperties: false
    AuthorizationCodeGrantTokenRequest1Properties:
      type: object
      required:
        - client_id
        - client_assertion_type
        - client_assertion
        - code_verifier
        - grant_type
        - code
        - redirect_uri
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 1024
          description: The OAuth 2.0 Client ID of the Client, as set in the Trust Framework.
        client_assertion_type:
          type: string
          enum:
            - urn%3Aietf%3Aparams%3Aoauth%3Aclient-assertion-type%3Ajwt-bearer
          description: >-
            Client Assertion Type indicating JWT Authentication, as described by [RFC
            7523](https://datatracker.ietf.org/doc/html/rfc7523#section-2.2).


            The value `urn:ietf:params:oauth:client-assertion-type:jwt-bearer` is prescribed, and is implemented with
            URL encoding.
        client_assertion:
          type: string
          pattern: ^[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+$
          description: >-
            Client Assertion value, which **must** be a single JWT.


            Implemented using the `private_key_jwt` method, as defined by [OpenID
            Connect](https://openid.net/specs/openid-connect-core-1_0.html#ClientAuthentication).
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          description: >-
            Code verifier value, created for Proof of Key Code Exchange correlating with value sent with Authorization
            Request.
        grant_type:
          $ref: '#/components/schemas/OAuth.AuthorizationCodeGrantType1Codes'
        code:
          type: string
          minLength: 1
          maxLength: 2048
          description: The authorization code received by the TPP from the Authorization Server.
        redirect_uri:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
          description: |-
            The OAuth 2.0 redirect URI of the Client, as set in the Trust Framework.

            The value of this property **MUST** match a redirect URI value registered at the Trust Framework.
        scope:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            [Access Token Scope](https://datatracker.ietf.org/doc/html/rfc6749#section-3.3) as sent in Authorization
            Request and granted by the End User.
      additionalProperties: false
    AuthorizationCodeGrantTokenRequestAuthorizationDetailTypesV1_0:
      type: object
      oneOf:
        - $ref: '#/components/schemas/AccountInformation.ReadAccountInformationAuthorizationDetails1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.ReadFixedDefinedScheduleAuthorizationDetails1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.ReadFixedOnDemandAuthorizationDetails1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.ReadFixedPeriodicScheduleAuthorizationDetails1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.ReadOpenPaymentsAuthorizationDetails1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.ReadSingleFutureDatedPaymentAuthorizationDetails1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.ReadSingleInstantPaymentAuthorizationDetails1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.ReadVariableDefinedScheduleAuthorizationDetails1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.ReadVariableOnDemandAuthorizationDetails1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.ReadVariablePeriodicScheduleAuthorizationDetails1Properties'
      discriminator:
        propertyName: type
        mapping:
          urn:openfinanceqatar:bank-data-sharing:account-information:v1.0: '#/components/schemas/AccountInformation.ReadAccountInformationAuthorizationDetails1Properties'
          urn:openfinanceqatar:payment-initiation:fixed-defined-schedule:v1.0: '#/components/schemas/PaymentInitiation.ReadFixedDefinedScheduleAuthorizationDetails1Properties'
          urn:openfinanceqatar:payment-initiation:fixed-on-demand:v1.0: '#/components/schemas/PaymentInitiation.ReadFixedOnDemandAuthorizationDetails1Properties'
          urn:openfinanceqatar:payment-initiation:fixed-periodic-schedule:v1.0: '#/components/schemas/PaymentInitiation.ReadFixedPeriodicScheduleAuthorizationDetails1Properties'
          urn:openfinanceqatar:payment-initiation:open-payments:v1.0: '#/components/schemas/PaymentInitiation.ReadOpenPaymentsAuthorizationDetails1Properties'
          urn:openfinanceqatar:payment-initiation:single-future-dated-payment:v1.0: '#/components/schemas/PaymentInitiation.ReadSingleFutureDatedPaymentAuthorizationDetails1Properties'
          urn:openfinanceqatar:payment-initiation:single-instant-payment:v1.0: '#/components/schemas/PaymentInitiation.ReadSingleInstantPaymentAuthorizationDetails1Properties'
          urn:openfinanceqatar:payment-initiation:variable-defined-schedule:v1.0: '#/components/schemas/PaymentInitiation.ReadVariableDefinedScheduleAuthorizationDetails1Properties'
          urn:openfinanceqatar:payment-initiation:variable-on-demand:v1.0: '#/components/schemas/PaymentInitiation.ReadVariableOnDemandAuthorizationDetails1Properties'
          urn:openfinanceqatar:payment-initiation:variable-periodic-schedule:v1.0: '#/components/schemas/PaymentInitiation.ReadVariablePeriodicScheduleAuthorizationDetails1Properties'
    AuthorizationRequest1Properties:
      type: object
      required:
        - authorization_details
        - iss
        - exp
        - nbf
        - client_id
        - response_type
        - redirect_uri
        - scope
        - code_challenge
        - code_challenge_method
      properties:
        authorization_details:
          type: array
          items:
            $ref: '#/components/schemas/PushedAuthorizationRequestAuthorizationDetailTypesV1_0'
          minItems: 1
          maxItems: 1
        iss:
          type: string
          minLength: 1
          maxLength: 2048
          description: The Issuer claim for the JWT, as described in [RFC 7519](https://tools.ietf.org/html/rfc7519#section-4.1.1)
        aud:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            The Audience claim for the JWT, as described in [RFC
            7519](https://tools.ietf.org/html/rfc7519#section-4.1.3)


            This value is constrained to a single `string` value, as prescribed by [FAPI 2.0 Security
            Profile](https://openid.net/specs/fapi-2_0-security-profile-ID2.html#section-5.3.2.1-2.5.1).
        exp:
          type: integer
          format: unixtime
          description: >-
            The Expiration Time claim for the JWT, as described in [RFC
            7519](https://tools.ietf.org/html/rfc7519#section-4.1.4)
        nbf:
          type: integer
          format: unixtime
          description: >-
            The Not Before claim for the JWT, as described in [RFC
            7519](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5) and expanded in the FAPI 2.0 Security Profile.
        client_id:
          type: string
          minLength: 1
          maxLength: 1024
          description: The OAuth 2.0 Client ID of the Client, as set in the Trust Framework.
        response_type:
          $ref: '#/components/schemas/OAuth.ResponseCode1Codes'
        redirect_uri:
          type: string
          minLength: 1
          maxLength: 2048
          format: uri
          description: |-
            The OAuth 2.0 redirect URI of the Client, as set in the Trust Framework.

            The value of this property **MUST** match a redirect URI value registered at the Trust Framework.
        scope:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            The OAuth 2.0 scope requested by the Client. 


            This value **MUST** match one-or-more scope values provided in the API descriptions for the Open Finance
            Standards.
        state:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            The OAuth 2.0 state value requested by the Client, as described in [RFC
            6749](https://tools.ietf.org/html/rfc6749#section-4.1.1).
        nonce:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            Nonce value as described in [OpenID Connect Core](https://openid.net/specs/openid-connect-core-1_0.html) and
            expanded in the FAPI 2.0 Security Profile.
        max_age:
          type: integer
          description: >-
            Maximum Authentication Age as described in [OpenID Connect
            Core](https://openid.net/specs/openid-connect-core-1_0.html).
        login_hint:
          oneOf:
            - $ref: '#/components/schemas/FAPI.LoginHintJwe1Type'
            - $ref: '#/components/schemas/FAPI.LoginHintJwePayload1Properties'
          description: >-
            Optional parameter used to send the User's national identifier as an encrypted JSON Web Token (JWE).


            This mechanism allows LFIs to correlate the User identity, and therefore the features of their account,
            before the User is redirected to the LFI's authentication page.


            The value **MUST** be a JWE, encrypted with the target LFI's public key, whose payload is a JSON object
            created from the `LoginHintJwePayload1Properties` Schema Object and signed with the TPP signing key to
            create a JSON Web Signature.


            As prescribed by OpenID Connect Core, `login_hint` is used for discovery. It **MUST NOT** be used to bypass
            authentication of the User, and a request **MUST NOT** be rejected because `login_hint` is not provided.


            The property is represented in both encoded and decoded form using a `oneOf`, so implementers can readily
            understand both the structure and the serialized form. Only the encoded form is sent on the wire.
        code_challenge:
          type: string
          minLength: 43
          maxLength: 128
          description: >-
            Code challenge as described in [RFC 7636](https://www.rfc-editor.org/rfc/rfc7636.html#section-4.3).


            Implements the Proof Key for Code Exchange (PKCE) extension to OAuth 2.0. PKCE is mandated by the FAPI 2.0
            Security Profile.
        code_challenge_method:
          allOf:
            - $ref: '#/components/schemas/PKCE.CodeChallengeMethod1Codes'
          description: |-
            Code challenge method as described in [RFC 7636](https://www.rfc-editor.org/rfc/rfc7636.html#section-4.3).

            Implements the Proof Key for Code Exchange (PKCE) extension to OAuth 2.0. 

            PKCE is mandated by the FAPI 2.0 Security Profile, which prescribes the use of the `S256` method.
      description: >-
        Authorization Request for a given Rich Authorization Request (RAR) objects that encodes the Consent agreed
        between the TPP and the User.


        Only a single RAR may be submitted at this version of the open finance standards.      


        The Schema Object defines the required JSON Web Token (JWT) payload. This **does not** represent a correctly
        serialized JWT, but provides a Schema Object that correctly defines the supported RARs.
      additionalProperties: false
    Billing.CustomerType1Properties:
      type: object
      required:
        - IsLargeCorporate
      properties:
        IsLargeCorporate:
          type: boolean
          description: Account holder is classified as a large corporate customer by the LFI.
      description: Billing parameters specified by the LFI.
      x-ozone-discovery-requires-analysis: Confirm the billing parameters for Qatar and what a large corporate is classified as.
      additionalProperties: false
    Billing.TppBillingUserTypes1Codes:
      type: string
      enum:
        - Retail
        - SME
        - Corporate
      description: >-
        Defines the entity type the TPP is acting on behalf of, as an indicator for the pricing tier of the service
        being provided.
      x-ozone-discovery-requires-analysis: Confirm that the billing user types are correct for Qatar.
    Charges.Charge1Properties:
      type: object
      required:
        - ChargeBearer
        - Type
        - Amount
      properties:
        ChargeBearer:
          $ref: '#/components/schemas/Charges.ChargeBearerType1Codes'
        Type:
          $ref: '#/components/schemas/Charges.PaymentChargeType1Codes'
        Amount:
          type: object
          required:
            - Amount
            - Currency
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: An Amount qualified by an active Currency, using amount and currency as prescribed by ISO 4217.
          additionalProperties: false
      description: Charges related to a given payment or transaction.
      additionalProperties: false
    Charges.ChargeBearerType1Codes:
      type: string
      enum:
        - BorneByCreditor
        - BorneByDebtor
        - Shared
      description: Bearer of the charges associated with a given payment or transaction.
    Charges.PaymentChargeType1Codes:
      type: string
      enum:
        - VAT
        - Fees
      description: Charge type codes, indicating what the charge relates to.
    ClientCredentialsGrantTokenRequest1Properties:
      type: object
      required:
        - client_id
        - client_assertion_type
        - client_assertion
        - grant_type
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 1024
          description: The OAuth 2.0 Client ID of the Client, as set in the Trust Framework.
        client_assertion_type:
          type: string
          enum:
            - urn%3Aietf%3Aparams%3Aoauth%3Aclient-assertion-type%3Ajwt-bearer
          description: >-
            Client Assertion Type indicating JWT Authentication, as described by [RFC
            7523](https://datatracker.ietf.org/doc/html/rfc7523#section-2.2).


            The value `urn:ietf:params:oauth:client-assertion-type:jwt-bearer` is prescribed, and is implemented with
            URL encoding.
        client_assertion:
          type: string
          pattern: ^[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+$
          description: >-
            Client Assertion value, which **must** be a single JWT.


            Implemented using the `private_key_jwt` method, as defined by [OpenID
            Connect](https://openid.net/specs/openid-connect-core-1_0.html#ClientAuthentication).
        grant_type:
          type: string
          enum:
            - client_credentials
          description: The grant type, which must be set to `client_credentials`.
        scope:
          type: string
          minLength: 1
          maxLength: 1024
          description: Access Token scope. Omitted if not required.
      additionalProperties: false
    ClientCredentialsGrantTokenResponse1Properties:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          minLength: 1
          maxLength: 2048
          description: >-
            [OAuth 2.0 Access Token](https://datatracker.ietf.org/doc/html/rfc6749#section-1.4) issued through Client
            Credentials grant.
        token_type:
          type: string
          enum:
            - Bearer
          description: Access Token type.
        expires_in:
          type: integer
          description: Validity period of Access Token in seconds.
        scope:
          type: string
          minLength: 1
          maxLength: 1024
          description: Access Token scope. Omitted if not required.
      description: >-
        Token response for the Client Credentials grant.


        No Rich Authorization Request (RAR) objects are returned, as the grant is not associated with a Consent agreed
        by a User.
      additionalProperties: false
    Consent.ConsentCreationDateTime1Type:
      type: string
      pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
      format: date-time
      description: >-
        Consent creation date and time, as recorded by Consent Manager.


        Date and time is represented in RFC 3339 date-time format, qualified as Arabia Standard Time, with seconds being
        the maximum supported precision.
    Consent.ConsentExpirationDateTime1Type:
      type: string
      pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
      format: date-time
      description: >-
        Date and time at which the consent will expire, as agreed at Consent Setup between the User and the TPP.


        Date and time is represented in RFC 3339 date-time format, qualified as Arabia Standard Time, with seconds being
        the maximum supported precision.
    Consent.ConsentId1Type:
      type: string
      minLength: 1
      maxLength: 128
      format: uuid
      description: >-
        Unique identification assigned by the TPP to identify the Consent.
          
        Indicates either a unique Consent or is used to identify a series of Consents linked by the TPP to indicate
        continuity of service across two-or-more Consent durations.


        Where used to indicate a series of Consents the value is described as the "Base Consent ID" (`baseConsentId`).
    Consent.ConsentMeta1Properties:
      type: object
      properties:
        MultipleAuthorizers:
          allOf:
            - $ref: '#/components/schemas/Consent.MultiAuthorization1Properties'
          description: Information on multi-authorization
      description: Metadata associated with a Consent Resource.
      additionalProperties: false
    Consent.ConsentRevokedBy1Codes:
      type: string
      enum:
        - LFI
        - TPP
        - LFI.InitiatedByUser
        - TPP.InitiatedByUser
      description: |-
        Indicates who the Consent was revoked by.

        | Identifier            | Description                              |
        |-----------------------|------------------------------------------|
        | `LFI`                 | Revoked by LFI without User interaction. |
        | `TPP`                 | Revoked by TPP without User interaction. |
        | `LFI.InitiatedByUser` | Initiated by the User at the LFI.        |
        | `TPP.InitiatedByUser` | Initiated by the User the TPP.           |
    Consent.ConsentStatus1Codes:
      type: string
      enum:
        - AwaitingAuthorization
        - Authorized
        - Rejected
        - Revoked
        - Expired
        - Consumed
        - Suspended
      description: |-
        Specifies the status of a Consent as recorded at Consent Manager.
         
        | Consent Status           | State Type | Description                                                       |
        |--------------------------|------------|-------------------------------------------------------------------|
        | `AwaitingAuthorization`  | Pending    | The Consent is awaiting authorization by the User.                |
        | `Authorized`             | In Use     | The Consent has been successfully authorized.                     |
        | `Rejected`               | Terminal   | The unauthorized Consent has been rejected at the LFI.            |
        | `Revoked`                | Terminal   | The Consent has been revoked at the TPP or LFI.                   |
        | `Expired`                | Terminal   | The Consent has expired.                                          |
        | `Consumed`               | Terminal   | The consented action(s) have been completed successfully.         |
        | `Suspended`              | In Use     | The Consent has been suspended.                                   |
    Consent.ConsentStatusUpdateDateTime1Type:
      type: string
      pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
      format: date-time
      description: >-
        Consent status update data and time, as recorded by Consent Manager.


        Date and time is represented in RFC 3339 date-time format, qualified as Arabia Standard Time, with seconds being
        the maximum supported precision.
    Consent.IdentifiedTppActingOnBehalfOf1Properties:
      type: object
      required:
        - LegalName
        - IdentifierType
        - Identifier
      properties:
        TradingName:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            Trading Name of the organization, as understood by the User agreeing the Consent. Omitted where the Trading
            Name and Legal Name are the same.
        LegalName:
          type: string
          minLength: 1
          maxLength: 50
          description: Legal Name, as registered with the local agency who licenses or regulates the activity of the organization.
        IdentifierType:
          type: string
          enum:
            - CommercialRegistrationCertificate
            - Other
          description: >-
            Qualifier for the organization identifier. Permissible values:


            * CommercialRegistrationCertificate: Issued by Ministry of Commerce and Industry, with the value being the
            Certificate number.


            * Other: Alternative identifier, as allowed under open finance regulations.
        Identifier:
          type: string
          minLength: 1
          maxLength: 50
          description: Value of the identifier, qualified by `IdentifierType`.
      description: >-
        Provides details of the organization a TPP is acting on behalf of in providing open finance services, identified
        by name and by a qualified identifier.


        `IdentifierType` and `Identifier` are paired: an identifier is always accompanied by the scheme that qualifies
        it.
      additionalProperties: false
    Consent.MultiAuthorization1Properties:
      type: object
      required:
        - TotalRequired
        - Authorizations
      properties:
        TotalRequired:
          type: integer
          description: The total number of Authorizers required to process the request, as provided by the LFI.
        Authorizations:
          type: array
          items:
            type: object
            properties:
              AuthorizerId:
                type: string
                minLength: 1
                maxLength: 128
                description: Authorizer identifier, as assigned by the LFI.
              AuthorizerType:
                type: string
                minLength: 1
                maxLength: 50
                description: The Type of Authorizer. For example, Financial, Management, etc.
              AuthorizationDate:
                type: string
                pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
                format: date-time
                description: The date and time when the Authorization occurred.
              AuthorizationStatus:
                type: string
                enum:
                  - Pending
                  - Approved
                  - Rejected
                description: Status that reflects the authorizers decision in granted Consent.
            required:
              - AuthorizerId
              - AuthorizationDate
              - AuthorizationStatus
            additionalProperties: false
          minItems: 1
      description: Metadata that describes the multi-authorization characteristics of the Consent, as prescribed by the LFI.
      additionalProperties: false
    Consent.TppActingOnBehalfOf1Types:
      oneOf:
        - $ref: '#/components/schemas/Consent.IdentifiedTppActingOnBehalfOf1Properties'
        - $ref: '#/components/schemas/Consent.UnidentifiedTppActingOnBehalfOf1Properties'
      description: >-
        Provides details of the organization a TPP is acting on behalf of in providing open finance services.


        Used in Consent to provide information on organizations that are not licensed directly to provide open finance
        services.


        Omitted where the TPP is not representing another organization in providing open finance services and agreeing
        Consent with the User.
      x-ozone-discovery-requires-analysis: Confirm that the on-behalf of approach is correct for Qatar and whether this or Sponsored TPP is correct.
    Consent.UnidentifiedTppActingOnBehalfOf1Properties:
      type: object
      required:
        - LegalName
      properties:
        TradingName:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            Trading Name of the organization, as understood by the User agreeing the Consent. Omitted where the Trading
            Name and Legal Name are the same.
        LegalName:
          type: string
          minLength: 1
          maxLength: 50
          description: Legal Name, as registered with the local agency who licenses or regulates the activity of the organization.
      description: >-
        Provides details of the organization a TPP is acting on behalf of in providing open finance services, identified
        by name only.


        Used where no qualified identifier is held for the organization.
      additionalProperties: false
    CurrencyExchange.ConsentCurrencyExchangeRateInformation1Properties:
      type: object
      required:
        - UnitCurrency
        - RateType
      properties:
        UnitCurrency:
          type: string
          pattern: ^[A-Z]{3,3}$
          description: >-
            Currency in which the rate of exchange is expressed in a currency exchange. Often referred to as the "sell"
            side in a currency conversion.


            In the example 1GBP = xxxCUR, the unit currency is GBP.
        RateType:
          $ref: '#/components/schemas/CurrencyExchange.RateType1Codes'
        ContractIdentification:
          $ref: '#/components/schemas/CurrencyExchange.ContractIdentification1Type'
        ExchangeRate:
          type: number
          description: |-
            The factor used for conversion of an amount from one currency to another.

            Reflects the price at which one currency was bought with another currency.
        ExpirationDateTime:
          type: string
          format: date-time
          description: |-
            Specified date and time the exchange rate agreement will expire.

            All dates in the JSON payloads are represented in ISO 8601 date-time format.

            All date-time fields in responses must include the timezone, for example: 2023-04-05T10:43:07+00:00
      description: |-
        Details of the currency exchange recorded against a Consent.

        `ExchangeRate` is optional, as the rate may not have been established at the point the Consent is
        read — unlike a payment, which reports the rate that was applied.
      additionalProperties: false
    CurrencyExchange.ContractIdentification1Type:
      type: string
      minLength: 1
      maxLength: 256
      description: >-
        Unique and unambiguous reference to the foreign exchange contract agreed between the initiating party/Creditor
        and the Debtor Agent.
    CurrencyExchange.CurrencyExchangeRateInformation1Properties:
      type: object
      required:
        - UnitCurrency
        - RateType
      properties:
        UnitCurrency:
          type: string
          pattern: ^[A-Z]{3,3}$
          description: >-
            Currency in which the rate of exchange is expressed in a currency exchange. Often referred to as the "sell"
            side in a currency conversion.


            In the example 1GBP = xxxCUR, the unit currency is GBP.
        RateType:
          $ref: '#/components/schemas/CurrencyExchange.RateType1Codes'
        ContractIdentification:
          $ref: '#/components/schemas/CurrencyExchange.ContractIdentification1Type'
        ExchangeRate:
          type: number
          description: |-
            The factor used for conversion of an amount from one currency to another.

            Reflects the price at which one currency was bought with another currency.
      description: |-
        Provides details on the currency exchange rate and contract requested for a payment.

        `ExchangeRate` is omitted where the rate is not known at the point the request is made, and is
        resolved by the LFI.
      additionalProperties: false
    CurrencyExchange.InstructionPriority1Codes:
      type: string
      enum:
        - Normal
        - Urgent
      description: >-
        Indicator of the urgency or order of importance that the instructing party would like the instructed party to
        apply to the processing of the instruction.


        Payment Initiation Request may not require this code where it is not supported or the payment can proceed
        without specific prioritization.
    CurrencyExchange.RateType1Codes:
      type: string
      enum:
        - Actual
        - Agreed
        - Indicative
      description: Specifies the type used to complete the currency exchange.
    CurrencyExchange.RequestedCurrencyExchange1Properties:
      type: object
      required:
        - ExtendedPurpose
        - CurrencyOfTransfer
      properties:
        InstructionPriority:
          $ref: '#/components/schemas/CurrencyExchange.InstructionPriority1Codes'
        ExtendedPurpose:
          type: string
          minLength: 1
          maxLength: 140
          description: Specifies the purpose of an international payment, using freeform text.
          x-ozone-discovery-requires-analysis: Does QCB mandate extended purpose codes for international payments.
        ChargeBearer:
          $ref: '#/components/schemas/Charges.ChargeBearerType1Codes'
        CurrencyOfTransfer:
          type: string
          pattern: ^[A-Z]{3,3}$
          description: >-
            Specifies the currency of the to be transferred amount, which is different from the currency of the Debtor
            Account.


            Often referred to as the "buy" side in a currency conversion.
        DestinationCountryCode:
          type: string
          pattern: '[A-Z]{2,2}'
          description: >-
            Country in which Credit Account is domiciled. Code to identify a country, a dependency, or another area of
            particular geopolitical interest, on the basis of country names obtained from the United Nations (ISO 3166,
            Alpha-2 code).


            Provides visibility to the LFI of the destination country for payment routing and risk screening purposes.
        ExchangeRateInformation:
          allOf:
            - $ref: '#/components/schemas/CurrencyExchange.CurrencyExchangeRateInformation1Properties'
          description: >-
            Details of the request currency exchange.


            Omitted where the TPP has no visibility of available rates at Consent Setup, with resolution of the
            requested currency exchange details happening at the LFI.
      description: >-
        The details of the non-local currency or currency exchange request that has been agreed between the User and the
        TPP.


        The requested Charge Bearer and Exchange Rate Information included in this object may be superseded by updated
        information supplied by the LFI, which will be recorded on the Consent record at Consent Manager.
      additionalProperties: false
    Events.Subscription1Properties:
      type: object
      required:
        - Webhook
      properties:
        Webhook:
          type: object
          properties:
            Url:
              type: string
              pattern: https:\/\/.+
              description: |-
                The TPP Webhook URL being registered with the LFI.

                The URL **MUST** use HTTPS.
            IsActive:
              type: boolean
              description: >-
                The TPP specifying whether the API Hub should emit Events, where `isActive` is `true` (Events are sent)
                or `false` (Events are not sent).
          required:
            - Url
            - IsActive
          description: Properties of the TPP Webhook and the state of the subscription.
          additionalProperties: false
      description: >-
        Properties of the a Event Notification Subscription created by the TPP for a given Consent.


        Additional guidance on supported Events is provided separately in the Developer Portal, and in the Webhook
        Template API description.
      additionalProperties: false
    FAPI.LoginHintJwe1Type:
      type: string
      minLength: 1
      maxLength: 131072
      description: >-
        The `login_hint` value as a JSON Web Encryption (JWE) object.


        The value is a Compact Serialization of a JWE, encrypted with the target LFI's public key, whose decrypted
        payload **MUST** be parsed using the `LoginHintJwePayload1Properties` Schema Object.
    FAPI.LoginHintJwePayload1Properties:
      type: object
      required:
        - SchemeName
        - Identification
      properties:
        SchemeName:
          allOf:
            - $ref: '#/components/schemas/Identity.NationalIdentifier1Codes'
          description: The scheme name that specifies the identification type value.
        Identification:
          type: string
          minLength: 1
          maxLength: 12
          description: Identification value, qualified by `SchemeName`.
      description: Provides the structure of the payload for the JWE used in the `login_hint` parameter.
      additionalProperties: false
    FAPI.RequestUri1Type:
      type: string
      minLength: 1
      maxLength: 512
    Identity.BusinessIdentity1Properties:
      type: object
      required:
        - SchemeName
        - Identification
      properties:
        SchemeName:
          type: string
          enum:
            - CommercialRegistrationNumber
          description: |-
            The scheme name that specifies the identification type value.

            `CommercialRegistrationNumber` is the only supported value for businesses.
        Identification:
          type: string
          minLength: 1
          maxLength: 12
          description: Identification value, qualified by `schemeName`
        ExpiryDate:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]
          format: date
          description: |-
            Date on which the identification expires.

            Omitted if not held.
        Name:
          type: object
          properties:
            en:
              type: string
              minLength: 1
              maxLength: 70
              description: Name provided in English language.
            ar:
              type: string
              minLength: 1
              maxLength: 70
              description: Name provided in Arabic
          description: Name of the organization. Omitted if not held.
          additionalProperties: false
      additionalProperties: false
    Identity.Identity1Properties:
      type: object
      required:
        - SchemeName
        - Identification
      properties:
        SchemeName:
          $ref: '#/components/schemas/Identity.NationalIdentifier1Codes'
        Identification:
          type: string
          minLength: 1
          maxLength: 12
          description: Identification value, qualified by `schemeName`
        Name:
          type: object
          properties:
            en:
              type: string
              minLength: 1
              maxLength: 70
              description: Name provided in English language.
            ar:
              type: string
              minLength: 1
              maxLength: 70
              description: Name provided in Arabic
          description: Name of the person or organization. Omitted if not held.
          additionalProperties: false
      additionalProperties: false
    Identity.NationalIdentifier1Codes:
      type: string
      enum:
        - QID
        - CommercialRegistrationNumber
      description: |-
        Identifier type, based on following values:

        * QID: A Qatar ID, issued to individuals.

        * CommercialRegistrationNumber: Commercial Registration Certificate, issued to organizations.
      x-ozone-discovery-requires-analysis: Verify that these schemes are the only required, or others need to be brought into scope.
    OAuth.AuthorizationCodeGrantType1Codes:
      type: string
      enum:
        - authorization_code
      description: The grant type, which must be set to `authorization_code`.
    OAuth.ErrorDescription1Type:
      type: string
      minLength: 1
      maxLength: 512
      description: Description of the error providing additional information
    OAuth.ErrorUri1Type:
      type: string
      format: uri
      minLength: 1
      maxLength: 2048
      description: A URI identifying a human-readable web page with information about the error
    OAuth.OAuthBadRequestErrorResponse1Properties:
      type: object
