                  All dates in the JSON payloads are represented in ISO 8601 date format, for example is: 2023-04-05
              Amount:
                type: object
                required:
                  - Amount
                  - Currency
                properties:
                  Amount:
                    $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
                  Currency:
                    $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
                description: An Amount qualified by an active Currency, using amount and currency as prescribed by ISO 4217.
                additionalProperties: false
            required:
              - PaymentExecutionDate
              - Amount
            additionalProperties: false
          minItems: 1
          maxItems: 53
          description: |-
            Payment Schedule denoting a list of pre-defined future dated payments all with fixed amounts and dates.

            Up to 53 payments are supported in a given schedule.
