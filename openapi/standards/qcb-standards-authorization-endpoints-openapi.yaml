        - $ref: '#/components/schemas/OAuth.OAuthErrorResponse1Properties'
      description: Bad Request
    OAuth.OAuthError1Codes:
      type: string
      enum:
        - invalid_request
        - invalid_client
        - invalid_grant
        - unauthorized_client
        - unsupported_grant_type
        - invalid_scope
      description: Status code corresponding to error condition to be returned to the client
    OAuth.OAuthErrorResponse1Properties:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/OAuth.OAuthError1Codes'
        error_description:
          $ref: '#/components/schemas/OAuth.ErrorDescription1Type'
        error_uri:
          $ref: '#/components/schemas/OAuth.ErrorUri1Type'
      description: Error returned from endpoints compliant with security profile
      additionalProperties: false
    OAuth.ResponseCode1Codes:
      type: string
      enum:
        - code
