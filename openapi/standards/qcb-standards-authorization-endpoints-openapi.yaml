        ExchangeRate:
          $ref: '#/components/schemas/CurrencyExchange.ConsentCurrencyExchangeRateInformation1Properties'
        PaymentConsumption:
          $ref: '#/components/schemas/PaymentInitiation.PaymentConsumption1Properties'
        Meta:
