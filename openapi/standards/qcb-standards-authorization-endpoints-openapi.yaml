            Omitted where the Consent has not been revoked.
        OpenFinanceBilling:
          $ref: '#/components/schemas/Billing.CustomerType1Properties'
        Charges:
          type: array
          items:
            $ref: '#/components/schemas/Charges.Charge1Properties'
          minItems: 1
          description: |-
            Charges applied to a given payment initiation instruction, as stated by the LFI.

