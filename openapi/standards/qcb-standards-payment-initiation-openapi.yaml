    get:
      operationId: QueryPaymentInitiationRequest_read
      summary: Query for a Payment using the Idempotency Key
      description: >-
        Query for a Payment Initiation Request using the `x-idempotency-key` header field value.


        If an idempotency key is matched the Links object will be returned with the Self value populated. This will
        provide a pointer to the correct resource.


        Provided to allow TPPs to obtain the response to a Payment Initiation Request operation where they did not
        receive a response due to a transient failure.


        Examples of such transient failures include are network issues or a client timeout where no response is
        returned.
      parameters:
        - $ref: '#/components/parameters/Headers.Authorization'
        - $ref: '#/components/parameters/Headers.x-fapi-auth-date'
        - $ref: '#/components/parameters/Headers.x-fapi-customer-ip-address'
