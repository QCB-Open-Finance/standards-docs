    Headers.IdempotencyKey1Type:
      type: string
      minLength: 1
      maxLength: 40
      description: >-
        Ensures the LFI processes the resource successfully only once per `x-idempotency-key` value.


        The TPP must not change the request body while using the same x-idempotency-key. Any changes to the request body
        will not result any action on the end resource.


        The API Hub will treat a request as idempotent if it had received the first request with the same
        x-idempotency-key from the same TPP in the preceding 24 hours.
