              description: Date and time as set on the device.
            ConnectionType:
              $ref: '#/components/schemas/PaymentInitiation.ConnectionType1Codes'
            ScreenInformation:
              type: object
              properties:
                PixelDensity:
                  type: integer
                  format: int64
                Orientation:
                  $ref: '#/components/schemas/PaymentInitiation.Orientation1Codes'
              description: Device screen information
              additionalProperties: false
            BatteryStatus:
              type: object
              properties:
                Level:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 100
                IsCharging:
                  type: boolean
              description: Device battery information.
              additionalProperties: false
            TouchSupport:
              type: object
              properties:
                Supported:
                  type: boolean
                MaxTouchPoints:
                  type: integer
                  minimum: 0
              description: Device touch support information.
              additionalProperties: false
            MotionSensors:
              type: object
              properties:
                Status:
                  $ref: '#/components/schemas/PaymentInitiation.MotionSensorStatus1Codes'
                Accelerometer:
                  type: boolean
                Gyroscope:
                  type: boolean
              description: Device motion sensor information.
              additionalProperties: false
            DeviceEnvironmentContext:
              type: array
              items:
                $ref: '#/components/schemas/PaymentInitiation.DeviceEnvironmentContext1Codes'
              minItems: 1
              description: Device environment context information.
          description: Detailed device information
          additionalProperties: false
        BiometricCapabilities:
          type: object
          properties:
            SupportsBiometric:
              type: boolean
            BiometricTypes:
              type: array
              items:
                $ref: '#/components/schemas/PaymentInitiation.BiometricType1Codes'
          description: Device biometric capabilities
          additionalProperties: false
        AppInformation:
          type: object
          properties:
            AppVersion:
              type: string
              minLength: 1
              maxLength: 50
              description: TPP app version number or label.
            PackageName:
              type: string
              minLength: 1
              maxLength: 256
              description: TPP app package name.
            BuildNumber:
              type: string
              minLength: 1
              maxLength: 50
              description: TPP app build number.
          minProperties: 1
          description: Mobile application specific information
          additionalProperties: false
        BrowserInformation:
          type: object
          properties:
            UserAgent:
              type: string
              minLength: 1
              maxLength: 1024
              description: User agent information.
            IsCookiesEnabled:
              type: boolean
              description: Whether cookies are enabled indicator.
            AvailableFonts:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 140
                description: Font family name.
              minItems: 1
            Plugins:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 140
                description: Plug-in name.
              minItems: 1
            PixelRatio:
              type: integer
              format: int64
              description: Browser pixel ratio.
          minProperties: 1
          description: Browser-specific information
          additionalProperties: false
        UserBehavior:
          type: object
          properties:
            ScrollBehavior:
              type: object
              properties:
                Direction:
                  $ref: '#/components/schemas/PaymentInitiation.Direction1Codes'
                Speed:
                  type: integer
                  format: int64
                Frequency:
                  type: integer
                  format: int64
              additionalProperties: false
          description: User behavior indicators
          additionalProperties: false
        AccountRiskIndicators:
          type: object
          properties:
            UserOnboardingDateTime:
              type: string
              format: date-time
              description: Date and time at which the User was onboarded with the TPP.
            LastAccountChangeDate:
              type: string
              format: date
              description: Date at which the User last changed their account settings at the TPP.
            LastPasswordChangeDate:
              type: string
              format: date
              description: Date at which the User last changed their password at the TPP.
            SuspiciousActivity:
              $ref: '#/components/schemas/PaymentInitiation.SuspiciousActivity1Codes'
            TransactionHistory:
              type: object
              properties:
                LastDay:
                  type: integer
                  minimum: 0
                LastYear:
                  type: integer
                  minimum: 0
              description: Summary of User transaction history at the TPP.
              additionalProperties: false
          description: Risk indicators related to the account
          additionalProperties: false
        SupplementaryData:
          type: object
          description: >-
            Additional information that cannot be captured in the structured fields and/or any other specific block.
            This may include information that is not available in the structured fields, such as a user's behavioural
            data like their typing speed and typing patterns.
          additionalProperties: false
      description: Indicators associated with the User (Debtor) that agreed the Consent with the TPP.
      additionalProperties: false
    PaymentInitiation.DebtorReference1Type:
      type: string
      minLength: 1
      maxLength: 35
      pattern: ^[A-Za-z0-9 \/?:().,'+-]+$
      description: >-
        Debtor Reference that provides information to the User on the source of the payment.


        If included in the Consent displayed during Consent Authorization and recorded with payment on the account
        ledger of transactions by the LFI.


        If included in the Payment Initiation operation included in the request payload or returned by the financial
        institution for information for the User.
    PaymentInitiation.DeliveryTimeframe1Codes:
      type: string
      enum:
        - ElectronicDelivery
        - SameDayShipping
        - OvernightShipping
        - MoreThan1DayShipping
      description: The delivery timeframe for the merchandise as provided by the merchant.
    PaymentInitiation.DeviceBindingId1Type:
      type: string
      minLength: 1
      maxLength: 8192
      description: Device binding identifier that binds a device to the session established by the TPP with the User.
    PaymentInitiation.DeviceEnvironmentContext1Codes:
      type: string
      enum:
        - VPNDetected
        - EmulatorDetected
      description: Contextual indicators detected in the environment of the User's device.
    PaymentInitiation.DeviceId1Type:
      type: string
      minLength: 1
      maxLength: 255
      description: Device identifier (primary or alternative) as elicited by the TPP from the appropriate device interface.
    PaymentInitiation.DeviceLanguage1Type:
      type: string
      minLength: 1
      maxLength: 35
      description: Device language setting.
    PaymentInitiation.DeviceOperatingSystem1Type:
      type: string
      minLength: 1
      maxLength: 70
      description: Device operating system as elicited by the TPP from the appropriate device interface.
    PaymentInitiation.DeviceOperatingSystemVersion1Type:
      type: string
      minLength: 1
      maxLength: 70
      description: Device operating system version as elicited by the TPP from the appropriate device interface.
    PaymentInitiation.DeviceType1Codes:
      type: string
      enum:
        - Mobile
        - Desktop
        - Tablet
        - Wearable
        - Other
      description: The type of device used by the User to access their account with the TPP.
    PaymentInitiation.Direction1Codes:
      type: string
      enum:
        - Up
        - Down
        - Both
      description: The direction of the User's scroll behaviour.
    PaymentInitiation.DomesticCreditor1Properties:
      type: object
      required:
        - CreditorAccount
      properties:
        CreditorAgent:
          $ref: '#/components/schemas/PaymentInitiation.CreditorAgent1Properties'
        Creditor:
          $ref: '#/components/schemas/PaymentInitiation.Creditor1Properties'
        CreditorAccount:
          $ref: '#/components/schemas/PaymentInitiation.DomesticCreditorAccount1Properties'
      description: Identification elements for a Creditor for a domestic payment instruction.
      additionalProperties: false
    PaymentInitiation.DomesticCreditorAccount1Properties:
      type: object
      required:
        - SchemeName
        - Identification
        - Name
      properties:
        Type:
          $ref: '#/components/schemas/PaymentInitiation.CreditorAccountType1Codes'
        SchemeName:
          type: string
          enum:
            - IBAN
          description: Domestic payment scheme, restricted to `IBAN`.
        Identification:
          $ref: '#/components/schemas/PaymentInitiation.QcbIban1Type'
        Name:
          $ref: '#/components/schemas/PaymentInitiation.AccountName1Properties'
        TradingName:
          $ref: '#/components/schemas/PaymentInitiation.TradingName1Properties'
      description: Unambiguous identification of the account of the Creditor to which a payment will be made.
      additionalProperties: false
    PaymentInitiation.DomesticPaymentInitiationPersonalIdentifiableInformation1Properties:
      type: object
      required:
        - Initiation
        - Risk
      properties:
        Initiation:
          $ref: '#/components/schemas/PaymentInitiation.DomesticCreditor1Properties'
        Risk:
          $ref: '#/components/schemas/PaymentInitiation.Risk1Properties'
      description: >-
        Domestic Payment Personal Identifiable Information (PII) Schema Object.


        This Schema Object is provided for guidance only, and **must be implemented as a JWE when a Payment Initiation
        Request is sent**.
      additionalProperties: false
    PaymentInitiation.InherenceFactorType1Codes:
      type: string
      enum:
        - Biometric
        - Fingerprint
        - FaceRecognition
        - IrisSca
        - VoiceRecognition
        - FIDOBiometric
        - DeviceBiometrics
        - Other
    PaymentInitiation.InternationalCreditor1Properties:
      type: object
      required:
        - CreditorAgent
        - Creditor
        - CreditorAccount
      properties:
        CreditorAgent:
          $ref: '#/components/schemas/PaymentInitiation.CreditorAgent1Properties'
        Creditor:
          $ref: '#/components/schemas/PaymentInitiation.Creditor1Properties'
        CreditorAccount:
          $ref: '#/components/schemas/PaymentInitiation.InternationalCreditorAccount1Properties'
      description: >-
        Identification elements for a Creditor for an international payment instruction.


        Creditor Agent and Creditor are mandatory in order to correct route a payment to the target, non-Qatar financial
        institution.
      additionalProperties: false
    PaymentInitiation.InternationalCreditorAccount1Properties:
      type: object
      required:
        - SchemeName
        - Identification
        - Name
      properties:
        Type:
          $ref: '#/components/schemas/PaymentInitiation.CreditorAccountType1Codes'
        SchemeName:
          type: string
          enum:
            - IBAN
            - Other
          description: >-
            The name of the scheme that qualifies the `identification` value for the Creditor Account.


            The following values are supported:


            * `IBAN`: An IBAN provided according to the regulations enacted in the destination jurisdiction.


            * `Other`: An alternative identifier, as prescribed by the destination jurisdiction for account
            identification.
        Identification:
          type: string
          minLength: 1
          maxLength: 34
          description: Identification of the account as defined by the destination FI and understood by the Debtor.
        Name:
          $ref: '#/components/schemas/PaymentInitiation.AccountName1Properties'
        TradingName:
          $ref: '#/components/schemas/PaymentInitiation.TradingName1Properties'
      description: Unambiguous identification of the account of the creditor to which a credit entry will be posted.
      additionalProperties: false
    PaymentInitiation.InternationalPaymentInitiationPersonalIdentifiableInformation1Properties:
      type: object
      required:
        - Initiation
        - Risk
      properties:
        Initiation:
          $ref: '#/components/schemas/PaymentInitiation.InternationalCreditor1Properties'
        Risk:
          $ref: '#/components/schemas/PaymentInitiation.Risk1Properties'
      description: >-
        International Payment Personal Identifiable Information (PII) Schema Object.


        This Schema Object is provided for guidance only, and **must be implemented as a JWE when a Payment Initiation
        Request is sent**.
      additionalProperties: false
    PaymentInitiation.KnowledgeFactorType1Codes:
      type: string
      enum:
        - PIN
        - Password
        - SecurityQuestion
        - SMSOTP
        - EmailOTP
        - OTPPush
        - Other
    PaymentInitiation.LongLivedPaymentConsent1Properties:
      type: object
      required:
        - PeriodicSchedule
      properties:
        MaximumCumulativeValueOfPayments:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.PeriodTypeMaximumCumulativeValueOfPayments1Properties'
          description: >-
            The maximum cumulative value of all successful payment rails executions under the Consent.


            Each successful payment rails execution amount (related to the Consent) is added to the total cumulative
            value of the Consent, which cannot exceed the maximum value agreed with the User at the point of consent.
        MaximumCumulativeNumberOfPayments:
          type: integer
          description: >-
            The maximum cumulative number of all successful payment rails executions under the Consent.


            Each successful payment rails execution (related to the Consent) is added to the total cumulative number of
            payments for the Consent, which cannot exceed the maximum value agreed with the User at the point of
            consent.
        PeriodicSchedule:
          $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationPeriodicSchedule1Types'
      description: A Consent definition for defining Multi Payments.
      additionalProperties: false
    PaymentInitiation.MaximumIndividualAmount1Properties:
      type: object
      required:
        - Amount
        - Currency
      properties:
        Amount:
          $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
        Currency:
          $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
      description: This is the Maximum amount a variable payment can take per period.
      additionalProperties: false
    PaymentInitiation.MotionSensorStatus1Codes:
      type: string
      enum:
        - InMotion
        - Stationary
      description: Indicates whether the User's device is in motion or stationary.
    PaymentInitiation.MultiPaymentConsentSchedule1Properties:
      type: object
      required:
        - MultiPayment
      properties:
        MultiPayment:
          $ref: '#/components/schemas/PaymentInitiation.LongLivedPaymentConsent1Properties'
      description: A Consent Schedule for a Multi-Payment, initiated under a payment schedule agreed between the User and the TPP.
      additionalProperties: false
    PaymentInitiation.Orientation1Codes:
      type: string
      enum:
        - Portrait
        - Landscape
      description: The screen orientation of the User's device.
    PaymentInitiation.OtherFiIdentification1Type:
      type: string
      minLength: 1
      maxLength: 35
      description: Alternative FI identification, where BICFI is not supplied or supported.
    PaymentInitiation.PaymentConsumption1Properties:
      type: object
      required:
        - CumulativeNumberOfPayments
        - CumulativeValueOfPayments
      properties:
        CumulativeNumberOfPayments:
          type: integer
          description: |-
            The cumulative number of payment instructions initiated under the consent schedule.

            Excludes instructions in a Rejected state.
        CumulativeValueOfPayments:
          type: object
          required:
            - Amount
            - Currency
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: >-
            The cumulative value of payment instructions initiated under the consent schedule, excluding instructions in
            a Rejected state.


            A number of monetary units specified in an active currency where the unit of currency is explicit and
            compliant with ISO 4217.
          additionalProperties: false
        CumulativeNumberOfPaymentsInCurrentPeriod:
          type: integer
          description: |-
            The cumulative number of payment instructions in the current period initiated under the consent schedule.

            Excludes instructions in a Rejected state.
        CumulativeValueOfPaymentsInCurrentPeriod:
          type: object
          required:
            - Amount
            - Currency
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: >-
            The cumulative value of payment instructions in the current period initiated under the consent schedule.


            Excludes instructions in a Rejected state.


            A number of monetary units specified in an active currency where the unit of currency is explicit and
            compliant with ISO 4217.
          additionalProperties: false
      additionalProperties: false
    PaymentInitiation.PaymentId1Type:
      type: string
      minLength: 1
      maxLength: 40
      description: Unique identifier for a given Payment Initiation Request.
    PaymentInitiation.PaymentInitiationAccountInformationPermission1Codes:
      type: string
      enum:
        - ReadAccountsBasic
        - ReadAccountsDetail
        - ReadBalances
        - ReadRefundAccount
    PaymentInitiation.PaymentInitiationConsentSchedule1Types:
      oneOf:
        - $ref: '#/components/schemas/PaymentInitiation.SinglePaymentConsentSchedule1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.MultiPaymentConsentSchedule1Properties'
      description: |-
        The Consent Schedule agreed between the User and the TPP.

        Exactly one payment type **MUST** be provided.
    PaymentInitiation.PaymentInitiationControlParameters1Properties:
      type: object
      required:
        - ConsentSchedule
      properties:
        ConsentSchedule:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationConsentSchedule1Types'
          description: |-
            The various payment types that can be initiated. Exactly one payment type **MUST** be provided:

            * A Single Payment, initiated immediately after the User authorizes the Consent at the LFI.

            * A Multi-Payment, initiated under a payment schedule agreed between the User and the TPP.
      description: Control Parameters set the overall rules for the Payment Schedule.
      additionalProperties: false
    PaymentInitiation.PaymentInitiationPeriodicSchedule1Types:
      type: object
      oneOf:
        - $ref: '#/components/schemas/PaymentInitiation.VariableOnDemand1Properties'
      discriminator:
        propertyName: Type
        mapping:
          VariableOnDemand: '#/components/schemas/PaymentInitiation.VariableOnDemand1Properties'
      description: The definition for a payment schedule, discriminated by the `Type` property.
    PaymentInitiation.PaymentInitiationRequest1Properties:
      type: object
      required:
        - ConsentId
        - Instruction
        - PersonalIdentifiableInformation
        - PaymentPurposeCode
        - CreditorReference
        - OpenFinanceBilling
      properties:
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        Instruction:
          type: object
          properties:
            Amount:
              type: object
              required:
                - Amount
                - Currency
              properties:
                Amount:
                  $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
                Currency:
                  $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
              description: The payment initiation currency and amount.
              additionalProperties: false
          required:
            - Amount
          description: |-
            The currency and amount instructed by the TPP based on the payment authorized by the User. 

            Used to instruct the movement of funds from the Debtor to the Creditor.
          additionalProperties: false
        PersonalIdentifiableInformation:
          oneOf:
            - $ref: >-
                #/components/schemas/PaymentInitiation.DomesticPaymentInitiationPersonalIdentifiableInformation1Properties
            - $ref: >-
                #/components/schemas/PaymentInitiation.InternationalPaymentInitiationPersonalIdentifiableInformation1Properties
            - type: string
              minLength: 1
              maxLength: 131072
          description: >-
            Personal Identifiable Information for the Payment Request.


            This information **MUST** be sent as a JWE when submitting the Request.


            The Schema Objects are provided for guidance only, to ensure the JSON Web Token (JWT) payload is created
            correctly.
        PaymentPurposeCode:
          $ref: '#/components/schemas/PaymentPurposeCode1Type'
        DebtorReference:
          $ref: '#/components/schemas/PaymentInitiation.DebtorReference1Type'
        CreditorReference:
          $ref: '#/components/schemas/PaymentInitiation.CreditorReference1Type'
        OpenFinanceBilling:
          $ref: '#/components/schemas/Billing.TppBillingPaymentType1Properties'
        CurrencyRequest:
          allOf:
            - $ref: '#/components/schemas/CurrencyExchange.RequestedCurrencyExchange1Properties'
          description: Currency exchange requested for an International Payment. Omitted for a Domestic Payment.
      description: |-
        Payment Initiation Request for a Domestic or International Payment.

        A single request object is used for both payment types, as in the UAE standard. The payment type is
        evident from the Personal Identifiable Information supplied, and `CurrencyRequest` is provided only
        for an International Payment.
      additionalProperties: false
    PaymentInitiation.PaymentInitiationResponse1Properties:
      type: object
      required:
        - PaymentId
        - ConsentId
        - Instruction
        - PaymentPurposeCode
        - OpenFinanceBilling
        - CreationDateTime
        - Status
        - StatusUpdateDateTime
      properties:
        PaymentId:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.PaymentId1Type'
          description: Unique identifier assigned by the LFI to identify the Payment Initiation Request resource.
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        Instruction:
          type: object
          properties:
            Amount:
              type: object
              required:
                - Amount
                - Currency
              properties:
                Amount:
                  $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
                Currency:
                  $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
              description: The payment initiation currency and amount.
              additionalProperties: false
          required:
            - Amount
          description: |-
            The currency and amount instructed by the TPP based on the payment authorized by the User. 

            Used to instruct the movement of funds from the Debtor to the Creditor.
          additionalProperties: false
        PaymentPurposeCode:
          $ref: '#/components/schemas/PaymentPurposeCode1Type'
        DebtorReference:
          $ref: '#/components/schemas/PaymentInitiation.DebtorReference1Type'
        OpenFinanceBilling:
          $ref: '#/components/schemas/Billing.TppBillingPaymentType1Properties'
        CreationDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: >-
            Date and time at which the resource was created, formatted as defined by ISO 8601/RFC 3339
            [`date-time`](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6).
        Status:
          $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationStatus1Codes'
        StatusUpdateDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: >-
            Date and time at which the payment status was updated, formatted as defined by ISO 8601/RFC 3339
            [`date-time`](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6).
        PaymentTransactionId:
          $ref: '#/components/schemas/PaymentInitiation.PaymentTransactionId1Type'
        Charges:
          type: array
          items:
            $ref: '#/components/schemas/Charges.Charge1Properties'
          minItems: 1
          description: Charges incurred in transacting the payment.
        RejectReasonCode:
          type: array
          items:
            $ref: '#/components/schemas/PaymentInitiation.RejectReasonCode1Properties'
          minItems: 1
          description: Reject reason code(s) provided by payment system serving the Payment Initiation Request.
        CurrencyRequest:
          allOf:
            - $ref: '#/components/schemas/CurrencyExchange.RequestedCurrencyExchange1Properties'
          description: Currency exchange requested for an International Payment. Omitted for a Domestic Payment.
        ExchangeRate:
          allOf:
            - $ref: '#/components/schemas/CurrencyExchange.FinalizedCurrencyExchangeRateInformation1Properties'
          description: >-
            Finalized currency exchange for an International Payment. Omitted for a Domestic Payment, or where the rate
            is not yet available.
      description: Payment Initiation Request for an International Payment.
      x-ozone-discovery-requires-analysis: >-
        Solicit feedback on whether to introduce properties to explicitly target a given payment rail, as per UK and
        Berlin Group.
      additionalProperties: false
    PaymentInitiation.PaymentInitiationStatus1Codes:
      type: string
      enum:
        - Pending
        - AcceptedSettlementCompleted
        - AcceptedCreditSettlementCompleted
        - AcceptedWithoutPosting
        - Rejected
      description: >
        Describes the status of the Payment Initiation Request.


        | Code |
        Description                                                                                                                                                                    
        |

        | --------------------------------- |
        --------------------------------------------------------------------------------------------------------------------------------------------------
        |

        | Pending                           | Payment initiation or individual transaction included in the payment
        initiation is pending.<br>Further checks and status update will be performed. |

        | Rejected                          | The payment initiation has been
        rejected.                                                                                                         
        |

        | AcceptedSettlementCompleted       | Settlement of the Debtor account has been
        completed.                                                                                               |

        | AcceptedCreditSettlementCompleted | When the Creditor account has been credited with the funds of the payment
        initiated via the TPP.                                                   |

        | AcceptedWithoutPosting            | When the Recipient Bank has accepted the payment but has not applied the
        credit to the Creditor account yet.                                       |
    PaymentInitiation.PaymentTransactionId1Type:
      type: string
      minLength: 1
      maxLength: 140
      description: >-
        An identifier for a given Payment Initiation Request generated by the Debtor financial institution or payment
        system acting on their behalf to identify the transaction.


        An example of this value is the `EndToEndIdentification` value, which is commonly implemented in ISO 20022-based
        payment systems.


        This value is optional as it may not be available when the Payment Initiation Request resource is initially
        created, due to the asynchronous nature of payment systems.
    PaymentInitiation.PeriodStartDate1Type:
      type: string
      format: date
      description: Specifies the start date of when a payment schedule begins.
    PaymentInitiation.PeriodType1Codes:
      type: string
      enum:
        - Day
        - Week
        - Month
        - Year
      description: >-
        |Period Type|Description|

        |-----------|-----------|

        |Day|A continuous period of time, consisting of 24 consecutive hours, starting from midnight (00:00:00) and
        finishing at 23:59:59 of the same day. |

        |Week|A continuous period of time, consisting of seven consecutive days, starting from midnight (00:00:00) and
        finishing at 23:59:59 of the 7th day. |

        |Month|A continuous period of time starting from midnight (00:00:00) of the first day of a month and finishing
        at 23:59:59 of the last day of that month.|

        |Year|A continuous period of time, consisting of 12 months.|
    PaymentInitiation.PeriodTypeMaximumCumulativeValueOfPayments1Properties:
      type: object
      required:
        - Amount
        - Currency
      properties:
        Amount:
          $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
        Currency:
          $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
      description: The maximum cumulative payment value of all payment initiations per Period Type.
      additionalProperties: false
    PaymentInitiation.PossessionFactorType1Codes:
      type: string
      enum:
        - FIDO2SecurityKey
        - Passkey
        - OTPDevice
        - OTPApp
        - SMSOTP
        - EmailOTP
        - PushNotification
        - WebauthnToken
        - SecureEnclaveKey
        - HardwareOTPKey
        - TrustedDevice
        - Other
      description: Possession factor used by the User when authenticated at the TPP.
    PaymentInitiation.PreOrderPurchaseIndicator1Codes:
      type: string
      enum:
        - MerchandiseAvailable
        - FutureAvailability
      description: Indicates whether the merchandise is currently available or is a pre-order for future availability.
    PaymentInitiation.QcbIban1Type:
      type: string
      pattern: ^QA[0-9]{2}[A-Z]{4}[0-9]{21}$
      description: >-
        A domestic IBAN, as [defined](https://www.qcb.gov.qa/Documents/BankInstructions/EN/13-193.pdf) by Qatar Central
        Bank.
    PaymentInitiation.ReadDebtorAccount1Properties:
