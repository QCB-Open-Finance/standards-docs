openapi: 3.0.0
info:
  title: 'QCB Open Finance: Account Information API'
  description: |-
    # QCB Open Finance: Account Information

    This API description provides the API operations for Account Information, exposed by the API Hub.
  version: v1.0-draft1
  x-sf-docs-util-menu-item-name: Account Information
  x-sf-typescript-util-family: Qcb
  x-sf-typescript-util-api-type: standards
  x-sf-typescript-util-class-prefix: QcbAcctInfo
  x-sf-permission-codes-required: true
tags:
  - name: Account Access Consents
    description: Account Access Consent Operations
  - name: Accounts
    description: Accounts Operations
  - name: Balances
    description: Balances Operations
  - name: Transactions
    description: Transactions Operations
paths:
  /account-access-consents:
    get:
      operationId: ReadAccountAccessConsentsByBaseConsentId_read
      summary: Read all Account Access Consents by Base Consent ID
      description: Read all Account Access Consents that match a given Base Consent ID.
      parameters:
        - $ref: '#/components/parameters/Headers.Authorization'
        - $ref: '#/components/parameters/Headers.x-fapi-auth-date'
        - $ref: '#/components/parameters/Headers.x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/Headers.x-fapi-interaction-id'
        - $ref: '#/components/parameters/Headers.x-customer-user-agent'
        - $ref: '#/components/parameters/Consent.BaseConsentIdQueryParameter1Properties'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/FapiInteractionId'
          content:
            application/jwt:
              schema:
                $ref: '#/components/schemas/ReadAccountAccessBaseConsents1Response'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      tags:
        - Account Access Consents
      security:
        - UserOAuth2Security1Properties:
            - openid
            - accounts
  /account-access-consents/{ConsentId}:
    get:
      operationId: ReadAccountAccessConsent_read
      summary: Read a Account Access Initiation Consent
      description: Read the properties of a Account Access Consent.
      parameters:
        - $ref: '#/components/parameters/Headers.Authorization'
        - $ref: '#/components/parameters/Headers.x-fapi-auth-date'
        - $ref: '#/components/parameters/Headers.x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/Headers.x-fapi-interaction-id'
        - $ref: '#/components/parameters/Headers.x-customer-user-agent'
        - $ref: '#/components/parameters/Consent.ConsentIdPathParameter1Properties'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/FapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInformation.ReadAccountInformationConsent1Response'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      tags:
        - Account Access Consents
      security:
        - UserOAuth2Security1Properties:
            - openid
            - accounts
    patch:
      operationId: UpdateAccountInformationConsentStatus_update
      summary: Update the status of a Account Information Consent
      description: |-
        Update the status of a Account Information Consent to `Revoked`.

        TPPs can only revoked a given Consent. No other statuses can be applied by TPPs.
      parameters:
        - $ref: '#/components/parameters/Headers.Authorization'
        - $ref: '#/components/parameters/Headers.x-fapi-auth-date'
        - $ref: '#/components/parameters/Headers.x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/Headers.x-fapi-interaction-id'
        - $ref: '#/components/parameters/Headers.x-customer-user-agent'
        - $ref: '#/components/parameters/Consent.ConsentIdPathParameter1Properties'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
          headers:
            x-fapi-interaction-id:
              required: false
              description: An RFC4122 UID used as a correlation ID.
              schema:
                type: string
                minLength: 1
                maxLength: 256
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '415':
          $ref: '#/components/responses/415Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      tags:
        - Account Access Consents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountInformationConsent1Request'
      security:
        - UserOAuth2Security1Properties:
            - openid
            - accounts
  /accounts:
    get:
      operationId: ReadAccountsOperationV1_0
      summary: Read Accounts
      description: >-
        Read the accounts granted to a TPP, based on a given Consent and account selection by the User.


        The `ReadAccountsBasic` or `ReadAccountsDetail` permission and `accounts` OAuth scope are required to access
        this resource.


        TPPs **MUST** access this resource after consent authorization to retrieve all `AccountId` values to which they
        have been granted access.


        TPPs can choose to subsequently address a single account to retrieve any details that _may_ updated through the
        `get /accounts/{AccountId}` operation, such as account status.
      parameters:
        - $ref: '#/components/parameters/Headers.Authorization'
        - $ref: '#/components/parameters/Headers.x-customer-user-agent'
        - $ref: '#/components/parameters/Headers.x-fapi-auth-date'
        - $ref: '#/components/parameters/Headers.x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/Headers.x-fapi-interaction-id'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/FapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAccountsResponse1Properties'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      tags:
        - Accounts
      security:
        - UserOAuth2Security1Properties:
            - openid
            - accounts
      x-sf-permission-codes:
        - ReadAccounts
        - ReadAccountsBasic
        - ReadAccountsDetail
  /accounts/{AccountId}:
    get:
      operationId: ReadAccountOperationV1_0
      summary: Read Account
      description: |-
        Read an account granted to a TPP, based on a given Consent and account selection by the User.

        The `ReadAccounts` Permission and `accounts` OAuth scope are required to access this resource.

        TPPs **must** invoke the `get /accounts` operation to retrieve the available `AccountId` values.
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParameter'
        - $ref: '#/components/parameters/Headers.Authorization'
        - $ref: '#/components/parameters/Headers.x-customer-user-agent'
        - $ref: '#/components/parameters/Headers.x-fapi-auth-date'
        - $ref: '#/components/parameters/Headers.x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/Headers.x-fapi-interaction-id'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/FapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAccountResponse1Properties'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      tags:
        - Accounts
      security:
        - UserOAuth2Security1Properties:
            - openid
            - accounts
      x-sf-permission-codes:
        - ReadAccounts
        - ReadAccountsBasic
        - ReadAccountsDetail
  /accounts/{AccountId}/balances:
    get:
      operationId: ReadAccountBalancesOperationV1_0
      summary: Read Account Balances
      description: >-
        Read the balances for a given account, based on the `AccountId`.


        The `ReadAccounts` and `ReadBalances` permissions and `accounts` OAuth scope are required to access this
        resource.


        TPPs **MUST** invoke the `get /accounts` operation to retrieve the available `AccountId` values before accessing
        this resource.
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParameter'
        - $ref: '#/components/parameters/Headers.Authorization'
        - $ref: '#/components/parameters/Headers.x-customer-user-agent'
        - $ref: '#/components/parameters/Headers.x-fapi-auth-date'
        - $ref: '#/components/parameters/Headers.x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/Headers.x-fapi-interaction-id'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/FapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAccountBalancesResponse1Properties'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      tags:
        - Balances
      security:
        - UserOAuth2Security1Properties:
            - openid
            - accounts
      x-sf-permission-codes:
        - ReadAccounts
        - ReadBalances
  /accounts/{AccountId}/transactions:
    get:
      operationId: ReadAccountTransactionsOperationV1_0
      summary: Read Account Transactions
      description: >-
        Read the transactions for a given account, based on the `AccountId`.


        The `ReadAccounts` and `ReadTransactions` permissions and `accounts` OAuth scope are required to access this
        resource.


        TPPs **MUST** invoke the `get /accounts` operation to retrieve the available `AccountId` values before accessing
        this resource.
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParameter'
        - $ref: '#/components/parameters/TransactionBookingDateTimeQueryParameters.fromBookingDateTime'
        - $ref: '#/components/parameters/TransactionBookingDateTimeQueryParameters.toBookingDateTime'
        - $ref: '#/components/parameters/Headers.Authorization'
        - $ref: '#/components/parameters/Headers.x-customer-user-agent'
        - $ref: '#/components/parameters/Headers.x-fapi-auth-date'
        - $ref: '#/components/parameters/Headers.x-fapi-customer-ip-address'
        - $ref: '#/components/parameters/Headers.x-fapi-interaction-id'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/FapiInteractionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAccountTransactionsResponse1Properties'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      tags:
        - Transactions
      security:
        - UserOAuth2Security1Properties:
            - openid
            - accounts
      x-sf-permission-codes:
        - ReadAccounts
        - ReadTransactions
components:
  parameters:
    AccountIdPathParameter:
      name: AccountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AccountInformation.AccountId1Type'
    Consent.BaseConsentIdQueryParameter1Properties:
      name: baseConsentId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Consent.ConsentId1Type'
      explode: false
    Consent.ConsentIdPathParameter1Properties:
      name: ConsentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Consent.ConsentId1Type'
    Headers.Authorization:
      name: authorization
      in: header
      required: true
      description: An Access Token as per https://tools.ietf.org/html/rfc6750
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    Headers.x-customer-user-agent:
      name: x-customer-user-agent
      in: header
      required: false
      description: Indicates the user-agent that the User is using.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    Headers.x-fapi-auth-date:
      name: x-fapi-auth-date
      in: header
      required: false
      description: |-
        The time when the User last logged in with the TPP.

        All dates in the HTTP headers are represented as RFC 7231 Full Dates. 

        An example is as follows: Sun, 10 Sep 2017 19:43:31 UTC.
      schema:
        type: string
        pattern: >-
          ^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), \d{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) \d{4}
          \d{2}:\d{2}:\d{2} UTC$
    Headers.x-fapi-customer-ip-address:
      name: x-fapi-customer-ip-address
      in: header
      required: false
      description: The User's IP address if the User is currently logged in with the TPP.
      schema:
        type: string
        minLength: 1
        maxLength: 50
    Headers.x-fapi-interaction-id:
      name: x-fapi-interaction-id
      in: header
      required: false
      description: An RFC4122 UID used as a correlation ID.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    TransactionBookingDateTimeQueryParameters.fromBookingDateTime:
      name: fromBookingDateTime
      in: query
      required: false
      description: >-
        Filters transactions to those booked to the account on or after the given date and time.


        Omitted to apply no lower bound, in which case the LFI returns transactions from the earliest date available for
        the account.
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
        format: date-time
      explode: false
    TransactionBookingDateTimeQueryParameters.toBookingDateTime:
      name: toBookingDateTime
      in: query
      required: false
      description: >-
        Filters transactions to those booked to the account on or before the given date and time.


        Omitted to apply no upper bound, in which case the LFI returns transactions up to the latest date available for
        the account.
      schema:
        type: string
        pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
        format: date-time
      explode: false
  schemas:
    AccountInformation.Account1Properties:
      type: object
      required:
        - AccountId
        - Status
      properties:
        AccountId:
          $ref: '#/components/schemas/AccountInformation.AccountId1Type'
        Status:
          type: string
          enum:
            - Active
            - Inactive
            - Dormant
            - Unclaimed
            - Deceased
            - Suspended
            - Closed
          description: Specifies the status of account resource.
          x-ozone-discovery-requires-analysis: Verify the correct list of account status codes for QCB.
        StatusUpdateDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: 'Date and time at which the account resource status was updated. '
      description: >-
        Properties of a given Account, as indicated by the `AccountId` value, that are provided by the `ReadAccounts`
        permissions.


        Where a TPP holds **_only_** `ReadAccounts` the properties describe will be provided to access other operations.


        For example, a TPP may only require balance information and not need all the properties of the account. The TPP
        will therefore only require minimal properties to do this.
      x-sf-permission-codes:
        - ReadAccounts
      additionalProperties: false
    AccountInformation.Account1Types:
      oneOf:
        - $ref: '#/components/schemas/AccountInformation.AccountBasicWithoutIdentifier1Properties'
        - $ref: '#/components/schemas/AccountInformation.AccountDetailWithoutIdentifier1Properties'
      description: >-
        Properties of a given Account, when accessed using the `get /accounts/{AccountId}` operation, where the
        `AccountId` is provided by the containing object.
    AccountInformation.AccountBasic1Properties:
      type: object
      required:
        - AccountId
        - Status
        - AccountHolderName
        - Currency
        - AccountType
        - AccountSubType
        - IsShariaCompliant
      properties:
        AccountId:
          $ref: '#/components/schemas/AccountInformation.AccountId1Type'
        Status:
          type: string
          enum:
            - Active
            - Inactive
            - Dormant
            - Unclaimed
            - Deceased
            - Suspended
            - Closed
          description: Specifies the status of account resource.
          x-ozone-discovery-requires-analysis: Verify the correct list of account status codes for QCB.
        StatusUpdateDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: 'Date and time at which the account resource status was updated. '
        AccountHolderName:
          $ref: '#/components/schemas/AccountInformation.AccountHolderName1Type'
        Nickname:
          type: string
          minLength: 1
          maxLength: 70
          description: >-
            The nickname of the account, assigned by the User to provide an additional and easier means of
            identification of the account at the LFI.
        Currency:
          $ref: '#/components/schemas/AccountInformation.AccountCurrency1Type'
        AccountType:
          $ref: '#/components/schemas/AccountInformation.AccountType1Codes'
        AccountSubType:
          $ref: '#/components/schemas/AccountInformation.AccountSubType1Codes'
        Description:
          type: string
          minLength: 1
          maxLength: 35
          description: Specifies the description of the account sub-type.
        OpeningDate:
          $ref: '#/components/schemas/AccountInformation.OpeningDate1Type'
        MaturityDate:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: |-
            The date on which the savings mature and the balance can be withdrawn by the User without penalty.

            Omitted for accounts that do not incorporate a maturation feature.
        IsShariaCompliant:
          type: boolean
          description: A flag to indicate if the account is provided through a product that is Sharia compliant.
      description: >-
        Properties of a given Account, as indicated by the `AccountId` value, that are provided by the
        `ReadAccountsBasic` permissions.
      x-sf-permission-codes:
        - ReadAccountsBasic
      additionalProperties: false
    AccountInformation.AccountBasicWithoutIdentifier1Properties:
      type: object
      required:
        - Status
        - AccountHolderName
        - Currency
        - AccountType
        - AccountSubType
        - IsShariaCompliant
      properties:
        Status:
          type: string
          enum:
            - Active
            - Inactive
            - Dormant
            - Unclaimed
            - Deceased
            - Suspended
            - Closed
          description: Specifies the status of account resource.
          x-ozone-discovery-requires-analysis: Verify the correct list of account status codes for QCB.
        StatusUpdateDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: 'Date and time at which the account resource status was updated. '
        AccountHolderName:
          $ref: '#/components/schemas/AccountInformation.AccountHolderName1Type'
        Nickname:
          type: string
          minLength: 1
          maxLength: 70
          description: >-
            The nickname of the account, assigned by the User to provide an additional and easier means of
            identification of the account at the LFI.
        Currency:
          $ref: '#/components/schemas/AccountInformation.AccountCurrency1Type'
        AccountType:
          $ref: '#/components/schemas/AccountInformation.AccountType1Codes'
        AccountSubType:
          $ref: '#/components/schemas/AccountInformation.AccountSubType1Codes'
        Description:
          type: string
          minLength: 1
          maxLength: 35
          description: Specifies the description of the account sub-type.
        OpeningDate:
          $ref: '#/components/schemas/AccountInformation.OpeningDate1Type'
        MaturityDate:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: |-
            The date on which the savings mature and the balance can be withdrawn by the User without penalty.

            Omitted for accounts that do not incorporate a maturation feature.
        IsShariaCompliant:
          type: boolean
          description: A flag to indicate if the account is provided through a product that is Sharia compliant.
      description: >-
        Properties provided by the `ReadAccountsBasic` permissions, excluding `AccountId`, which is provided by the
        containing object.
      x-sf-permission-codes:
        - ReadAccountsBasic
      additionalProperties: false
    AccountInformation.AccountCurrency1Type:
      type: string
      pattern: ^[A-Z]{3,3}$
      description: The currency of the account.
    AccountInformation.AccountDetail1Properties:
      type: object
      required:
        - AccountId
        - Status
        - AccountHolderName
        - Currency
        - AccountType
        - AccountSubType
        - IsShariaCompliant
        - AccountIdentifiers
        - Servicer
      properties:
        AccountId:
          $ref: '#/components/schemas/AccountInformation.AccountId1Type'
        Status:
          type: string
          enum:
            - Active
            - Inactive
            - Dormant
            - Unclaimed
            - Deceased
            - Suspended
            - Closed
          description: Specifies the status of account resource.
          x-ozone-discovery-requires-analysis: Verify the correct list of account status codes for QCB.
        StatusUpdateDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: 'Date and time at which the account resource status was updated. '
        AccountHolderName:
          $ref: '#/components/schemas/AccountInformation.AccountHolderName1Type'
        Nickname:
          type: string
          minLength: 1
          maxLength: 70
          description: >-
            The nickname of the account, assigned by the User to provide an additional and easier means of
            identification of the account at the LFI.
        Currency:
          $ref: '#/components/schemas/AccountInformation.AccountCurrency1Type'
        AccountType:
          $ref: '#/components/schemas/AccountInformation.AccountType1Codes'
        AccountSubType:
          $ref: '#/components/schemas/AccountInformation.AccountSubType1Codes'
        Description:
          type: string
          minLength: 1
          maxLength: 35
          description: Specifies the description of the account sub-type.
        OpeningDate:
          $ref: '#/components/schemas/AccountInformation.OpeningDate1Type'
        MaturityDate:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: |-
            The date on which the savings mature and the balance can be withdrawn by the User without penalty.

            Omitted for accounts that do not incorporate a maturation feature.
        IsShariaCompliant:
          type: boolean
          description: A flag to indicate if the account is provided through a product that is Sharia compliant.
        AccountIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.CashAccount1Properties'
          description: Identifiers for the account.
        Servicer:
          allOf:
            - $ref: '#/components/schemas/AccountInformation.Servicer1Properties'
          description: Identifier for the financial institution that manages the account on behalf of the User.
      description: >-
        Properties of a given Account, as indicated by the `AccountId` value, that are provided by the
        `ReadAccountsDetail` permissions.
      x-sf-permission-codes:
        - ReadAccountsDetail
      additionalProperties: false
    AccountInformation.AccountDetailWithoutIdentifier1Properties:
      type: object
      required:
        - Status
        - AccountHolderName
        - Currency
        - AccountType
        - AccountSubType
        - IsShariaCompliant
        - AccountIdentifiers
        - Servicer
      properties:
        Status:
          type: string
          enum:
            - Active
            - Inactive
            - Dormant
            - Unclaimed
            - Deceased
            - Suspended
            - Closed
          description: Specifies the status of account resource.
          x-ozone-discovery-requires-analysis: Verify the correct list of account status codes for QCB.
        StatusUpdateDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: 'Date and time at which the account resource status was updated. '
        AccountHolderName:
          $ref: '#/components/schemas/AccountInformation.AccountHolderName1Type'
        Nickname:
          type: string
          minLength: 1
          maxLength: 70
          description: >-
            The nickname of the account, assigned by the User to provide an additional and easier means of
            identification of the account at the LFI.
        Currency:
          $ref: '#/components/schemas/AccountInformation.AccountCurrency1Type'
        AccountType:
          $ref: '#/components/schemas/AccountInformation.AccountType1Codes'
        AccountSubType:
          $ref: '#/components/schemas/AccountInformation.AccountSubType1Codes'
        Description:
          type: string
          minLength: 1
          maxLength: 35
          description: Specifies the description of the account sub-type.
        OpeningDate:
          $ref: '#/components/schemas/AccountInformation.OpeningDate1Type'
        MaturityDate:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: |-
            The date on which the savings mature and the balance can be withdrawn by the User without penalty.

            Omitted for accounts that do not incorporate a maturation feature.
        IsShariaCompliant:
          type: boolean
          description: A flag to indicate if the account is provided through a product that is Sharia compliant.
        AccountIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.CashAccount1Properties'
          description: Identifiers for the account.
        Servicer:
          allOf:
            - $ref: '#/components/schemas/AccountInformation.Servicer1Properties'
          description: Identifier for the financial institution that manages the account on behalf of the User.
      description: >-
        Properties provided by the `ReadAccountsDetail` permissions, excluding `AccountId`, which is provided by the
        containing object.
      x-sf-permission-codes:
        - ReadAccountsDetail
      additionalProperties: false
    AccountInformation.AccountHolderName1Type:
      type: string
      minLength: 1
      maxLength: 70
      description: |-
        The Account Holder Name is the name or names of the Account owner(s) represented at the account level:

        * Where the property is included in an Account resource, this is the holder of the account.

        * Where the property is related to a beneficiary or payment to a beneficiary, this is the name of the Creditor.
    AccountInformation.AccountId1Type:
      type: string
      minLength: 1
      maxLength: 256
      description: >-
        A unique and immutable identifier used to identify resource, with no meaning to the Account Owner.


        LFIs **MUST NOT** implement this value using data that is secret or confidential, due the risk of exposure via
        the URL when transmitted over distributed systems.
    AccountInformation.AccountSchemeIdentification1Codes:
      type: string
      enum:
        - IBAN
        - AccountNumber
        - MaskedPAN
        - MobileNumber
        - UtilityName
        - EWallet
      description: Name of the identification scheme for the account. Encoded with allowable values published in an external list.
    AccountInformation.AccountSubType1Codes:
      type: string
      enum:
        - Current
        - Savings
        - CreditCard
        - Mortgage
        - Finance
      description: |-
        Specifies the sub type of account (product family group).

        Supported values: CurrentAccount, Savings, CreditCard, Mortgage, Finance.
    AccountInformation.AccountType1Codes:
      type: string
      enum:
        - Retail
        - SME
        - Corporate
      description: Specifies the type of account (Retail, SME or Corporate).
    AccountInformation.Accounts1Types:
      oneOf:
        - $ref: '#/components/schemas/AccountInformation.Account1Properties'
        - $ref: '#/components/schemas/AccountInformation.AccountBasic1Properties'
        - $ref: '#/components/schemas/AccountInformation.AccountDetail1Properties'
      description: >-
        Properties of a given Account, as indicated by the `AccountId` value, when accessed using the `get /accounts`
        operation.
    AccountInformation.AmountWithCategorization1Properties:
      type: object
      required:
        - BalanceCategory
        - Amount
      properties:
        BalanceCategory:
          $ref: '#/components/schemas/AccountInformation.BalanceCategory1Codes'
        BalanceDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: |-
            Description of the categorized amount.

            Allows the specific Sharia compliant charges, payments and rewards that affect the balance to be identified.
        Amount:
          type: object
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          required:
            - Amount
            - Currency
          description: The value of the categorized amount.
          additionalProperties: false
      description: |-
        An amount qualified by the balance category it belongs to, which identifies a part of a balance or
        of a transaction and its value.
      additionalProperties: false
    AccountInformation.Balance1Properties:
      type: object
      required:
        - CreditDebitIndicator
        - Type
        - DateTime
        - Amount
      properties:
        CreditDebitIndicator:
          $ref: '#/components/schemas/AccountInformation.CreditDebit1Codes'
        Type:
          $ref: '#/components/schemas/AccountInformation.BalanceType1Codes'
        DateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: Indicates the date (and time) that the account balance was checked.
        Amount:
          type: object
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          required:
            - Amount
            - Currency
          description: Amount of money of the cash balance.
          additionalProperties: false
        CreditLine:
          type: array
          items:
            type: object
            properties:
              Included:
                type: boolean
                description: Indicated whether the credit line is included in the balance.
              Type:
                type: string
                enum:
                  - Available
                  - Credit
                  - Emergency
                  - Pre-Agreed
                  - Temporary
                description: The credit line type, based on an allowed values.
              Amount:
                type: object
                properties:
                  Amount:
                    $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
                  Currency:
                    $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
                required:
                  - Amount
                  - Currency
                description: The credit line amount.
                additionalProperties: false
            required:
              - Included
              - Type
              - Amount
            additionalProperties: false
          description: |-
            The credit lines available on the account.

            Omitted when no credit line is offered.
        Components:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.AmountWithCategorization1Properties'
          minItems: 1
          description: >-
            A breakdown of the balance into the categorized components that make it up.


            Allows the parts of a balance to be identified separately, including the Sharia compliant charges, payments
            and rewards that affect it.


            Omitted where the LFI does not categorize the balance.
      description: Balance of a given Account, as indicated by `AccountId`
      additionalProperties: false
    AccountInformation.BalanceCategory1Codes:
      type: string
      enum:
        - Principal
        - Interest
        - FeesAndCharges
        - PastDue
        - Profit
        - Rental
      description: |-
        The category of a component of a balance, which allows a balance to be broken down into the
        parts that make it up.

        | Code             | Description                                                                |
        | ---------------- | -------------------------------------------------------------------------- |
        | `Principal`      | The principal amount outstanding.                                          |
        | `Interest`       | Interest applied to the balance.                                           |
        | `FeesAndCharges` | Fees and charges applied to the balance.                                   |
        | `PastDue`        | The amount that is past its due date.                                      |
        | `Profit`         | Profit applied to the balance, for Sharia compliant products.              |
        | `Rental`         | Rental applied to the balance, for Sharia compliant products.              |
    AccountInformation.BalanceType1Codes:
      type: string
      enum:
        - ClosingAvailable
        - ClosingBooked
        - ClosingCleared
        - Expected
        - ForwardAvailable
        - InterimAvailable
        - InterimBooked
        - InterimCleared
        - OpeningAvailable
        - OpeningBooked
        - OpeningCleared
      description: >-
        The balance type based on the following ISO 20022 code set:


        | Code               |
        Description                                                                                                                         
        |

        | ------------------ |
        ------------------------------------------------------------------------------------------------------------------------------------
        |

        | `ClosingAvailable` | End of day balance specifying the amount available to withdraw or
        use.                                                               |

        | `ClosingBooked`    | End of day balance including value of payments for cheques or payments which have not
        been cleared yet.                              |

        | `ClosingCleared`   | End of day balance including value of payments for cheques or payments which have been
        cleared.                                      |

        | `Expected`         | Intra day balance including value of payments for cheques or payments which have been
        cleared.                                       |

        | `ForwardAvailable` | Intra-day balance specifying the amount available to withdraw or use considering forward
        dated payments or other intra-day payments. |

        | `InterimAvailable` | Intra-day balance specifying the amount available to withdraw or use (most probably
        real-time).                                      |

        | `InterimBooked`    | Intra-day balance including value of payments for cheques or payments which have not been
        cleared yet.                               |

        | `InterimCleared`   | Intra-day balance including value of payments for cheques or payments which have been
        cleared (probably real-time).                  |

        | `OpeningAvailable` | Start of day balance specifying the amount available to withdraw or
        use.                                                             |

        | `OpeningBooked`    | Start of day balance including value of payments for cheques or payments which have not
        been cleared yet.                            |

        | `OpeningCleared`   | Start of day balance including value of payments for cheques or payments which have been
        cleared.                                    |
    AccountInformation.CashAccount1Properties:
      type: object
      required:
        - SchemeName
        - Identification
      properties:
        SchemeName:
          $ref: '#/components/schemas/AccountInformation.AccountSchemeIdentification1Codes'
        Identification:
          $ref: '#/components/schemas/PaymentInitiation.OtherAccountIdentification1Type'
        Name:
          allOf:
            - $ref: '#/components/schemas/AccountInformation.AccountHolderName1Type'
          description: >-
            The account name is the name or names of the account owner(s) represented at the account level, as displayed
            by the LFI's online channels.


            This is **not** the product name or the nickname of the account.
      description: |-
        Provides the details to identify the account, qualified by the property name.

        `Name` is omitted where not held.
      additionalProperties: false
    AccountInformation.ConsentPermission1Codes:
      type: string
      enum:
        - ReadAccountsBasic
        - ReadAccountsDetail
        - ReadBalances
        - ReadTransactionsBasic
        - ReadTransactionsDetail
      description: The permission codes available to the TPP for Bank Data Sharing and agreed with the User.
      x-ozone-discovery-requires-analysis: Verify that the list of permissions is correct for QCB.
    AccountInformation.CreditDebit1Codes:
      type: string
      enum:
        - Credit
        - Debit
      description: |-
        Indicates whether the balance of the account is a credit or a debit balance. 

        Encoded with allowable values: 'Credit', 'Debit' 

        A zero balance is considered to be a credit balance.
    AccountInformation.CurrencyExchange1Properties:
      type: object
      required:
        - SourceCurrency
        - TargetCurrency
        - UnitCurrency
        - ExchangeRate
        - InstructedAmount
      properties:
        SourceCurrency:
          allOf:
            - $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: Currency from which the `InstructedAmount` was converted.
        TargetCurrency:
          allOf:
            - $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: Currency to which the `InstructedAmount` was converted.
        UnitCurrency:
          type: string
          pattern: ^[A-Z]{3,3}$
          description: >-
            Currency in which the rate of exchange is expressed in a currency exchange. Often referred to as the "sell"
            side in a currency conversion.


            In the example 1GBP = xxxCUR, the unit currency is GBP.
        ExchangeRate:
          type: number
          description: >-
            The factor used for conversion of an amount from one currency to another.


            Reflects the price at which one currency was bought with another currency, expressed as the ratio between
            `UnitCurrency` and the quoted currency.
        ContractIdentification:
          $ref: '#/components/schemas/CurrencyExchange.ContractIdentification1Type'
        QuotationDate:
          type: string
          format: date-time
          description: |-
            Date and time at which an exchange rate is quoted.

            Omitted if not recorded.
        InstructedAmount:
          type: object
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          required:
            - Amount
            - Currency
          description: >-
            Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the
            currency as ordered by the initiating party.
          additionalProperties: false
      description: Provides details of the currency exchanged performed for the transaction, where applicable.
      additionalProperties: false
    AccountInformation.FromDate1Type:
      type: string
      format: date
      description: >-
        Specified start date for the transaction or statement query period.


        If this is not populated, the start date will be open ended, and data will be returned from the earliest
        available transaction or statement.


        All dates in the JSON payloads are represented in RFC 3339 date format.  For example: 2025-01-01
    AccountInformation.LocalTimeZone1Type:
      type: string
      pattern: ^UTC[+-]([01]\d|2[0-4])(:?[0-5]\d)?$
      description: The UTC offset of the local date and time of where the transaction occurred, for example `UTC+03:00`.
    AccountInformation.OpeningDate1Type:
      type: string
      pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
      format: date-time
      description: Date on which the account and its related basic services by LFI started to be operational for the User
    AccountInformation.ReadAccountInformationConsent1Response:
      type: object
      required:
        - Data
        - Links
      properties:
        Data:
          $ref: '#/components/schemas/AccountInformation.ReadConsent1Properties'
        Links:
          $ref: '#/components/schemas/JsonApi.LinksResource1Properties'
        Meta:
          $ref: '#/components/schemas/JsonApi.MetaResource1Properties'
        Subscription:
          $ref: '#/components/schemas/Events.Subscription1Properties'
      additionalProperties: false
    AccountInformation.ReadConsent1Properties:
      type: object
      required:
        - ConsentId
        - Permissions
        - ExpirationDateTime
        - CreationDateTime
        - Status
        - StatusUpdateDateTime
        - OpenFinanceBilling
      properties:
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        BaseConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        Permissions:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.ConsentPermission1Codes'
          minItems: 1
        ExpirationDateTime:
          $ref: '#/components/schemas/Consent.ConsentExpirationDateTime1Type'
        FromDate:
          $ref: '#/components/schemas/AccountInformation.FromDate1Type'
        ToDate:
          $ref: '#/components/schemas/AccountInformation.ToDate1Type'
        AccountType:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.AccountType1Codes'
          minItems: 1
        AccountSubType:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.AccountSubType1Codes'
          minItems: 1
        OnBehalfOf:
          $ref: '#/components/schemas/Consent.TppActingOnBehalfOf1Types'
        CreationDateTime:
          $ref: '#/components/schemas/Consent.ConsentCreationDateTime1Type'
        Status:
          $ref: '#/components/schemas/Consent.ConsentStatus1Codes'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/Consent.ConsentStatusUpdateDateTime1Type'
        RevokedBy:
          allOf:
            - $ref: '#/components/schemas/Consent.ConsentRevokedBy1Codes'
          description: |-
            Indicates who the Consent was revoked by.

            Omitted where the Consent has not been revoked.
        OpenFinanceBilling:
          type: object
          properties:
            IsLargeCorporate:
              type: boolean
              description: Account holder is classified as a large corporate customer by the LFI.
            UserType:
              $ref: '#/components/schemas/Billing.TppBillingUserTypes1Codes'
            Purpose:
              type: string
              enum:
                - AccountAggregation
                - RiskAssessment
                - TaxFiling
                - Onboarding
                - Verification
                - QuoteComparison
                - BudgetingAnalysis
                - FinancialAdvice
                - AuditReconciliation
              description: Purpose of data sharing request, based on supported use cases.
              x-ozone-discovery-requires-analysis: Verify that the use cases listed are appropriate for QCB.
          required:
            - UserType
            - Purpose
          description: >-
            Consolidated billing information properties added by the TPP and LFI.


            `isLargeCorporate` is optional as the value is updated out-of-band, and may be updated after the completion
            of Consent Authorization.
          additionalProperties: false
      additionalProperties: false
    AccountInformation.Servicer1Properties:
      type: object
      required:
        - SchemeName
        - Identification
      properties:
        SchemeName:
          type: string
          enum:
            - BICFI
            - Other
          description: |-
            The name of the scheme that qualifies the `identification` value for the Agent.

            The following values are supported:

            * `BICFI`: A Business Identification Code, as defined under ISO9362.

            * `Other`: An alternative identifier, as prescribed under local market regulations.
        Identification:
          anyOf:
            - $ref: '#/components/schemas/PaymentInitiation.BicFi1Type'
            - $ref: '#/components/schemas/PaymentInitiation.OtherFiIdentification1Type'
          description: Identification for the financial institution who is the Agent, qualified by `SchemeName`.
      description: >-
        Party that manages the account on behalf of the account owner.


        Manages the registration and booking of entries on the account, calculates balances on the account, and provides
        information about the account.
      additionalProperties: false
    AccountInformation.SubTransactionType1Codes:
      type: string
      enum:
        - Purchase
        - Reversal
        - Refund
        - Withdrawal
        - WithdrawalReversal
        - Deposit
        - DepositReversal
        - MoneyTransfer
        - Repayments
        - Interest
        - Fee
        - Charges
        - Profit
        - Disbursement
        - Adjustment
        - Tax
        - Rewards
        - NotApplicable
        - LeaseRepayment
      description: Sub-type for transaction activity.
    AccountInformation.ToDate1Type:
      type: string
      format: date
      description: >-
        Specified end date for the transaction or statement query period.


        If this is not populated, the end date will be open ended, and data will be returned to the latest available
        transaction or the last statement generated.


        All dates in the JSON payloads are represented in RFC 3339 date format.  For example: 2025-12-31    
    AccountInformation.Transaction1Properties:
      type: object
      required:
        - TransactionId
        - TransactionDateTime
        - TransactionType
        - SubTransactionType
        - CreditDebitIndicator
        - Status
        - BookingDateTime
        - Amount
      properties:
        TransactionId:
          $ref: '#/components/schemas/AccountInformation.TransactionId'
        TransactionDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: Date and time of the transaction
        LocalTimeZone:
          $ref: '#/components/schemas/AccountInformation.LocalTimeZone1Type'
        StatementReference:
          type: string
          minLength: 1
          maxLength: 35
          description: Unique reference for the statement that includes the transaction. Omitted if not included in a statement.
        TransactionReference:
          type: string
          minLength: 1
          maxLength: 210
          description: Unique reference for the transaction.
        TransactionType:
          $ref: '#/components/schemas/AccountInformation.TransactionType1Codes'
        SubTransactionType:
          $ref: '#/components/schemas/AccountInformation.SubTransactionType1Codes'
        Flags:
          type: array
          items:
            type: string
            enum:
              - Cashback
              - Payroll
              - DirectDebit
              - StandingOrder
              - Finance
              - Dividend
              - OpenFinance
          description: The transaction type as flagged by the LFI.
        CreditDebitIndicator:
          type: string
          enum:
            - Credit
            - Debit
          description: Indicates whether the transaction is a credit or a debit entry.
        Status:
          type: string
          enum:
            - Booked
            - Pending
            - Rejected
          description: Status of a transaction entry on the books of the account servicer.
        TransactionMutability:
          type: string
          enum:
            - Mutable
            - Immutable
          description: Specifies the Mutability of the Transaction record.
        BookingDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: >-
            Date and time when a transaction entry is posted to an account on the account servicer's books.


            Booking date is the expected booking date, unless the status is `Booked`, in which case it is the actual
            booking date.
        ValueDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: >-
            Date and time at which assets become available to the account owner in case of a credit entry, or cease to
            be available to the account owner in case of a debit transaction entry.


            If transaction entry status is pending and value date is present, then the value date refers to an
            expected/requested value date.
        TransactionInformation:
          type: string
          minLength: 1
          maxLength: 500
          description: Further details of the transaction. This is the transaction narrative, which is unstructured text.
        Amount:
          type: object
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          required:
            - Amount
            - Currency
          description: The transaction amount.
          additionalProperties: false
        ChargeAmount:
          type: object
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
            ChargeIncluded:
              type: boolean
              description: If `chargeIncluded` is `true` then the value in the Amount has the ChargeAmount deducted from it.
          required:
            - Amount
            - Currency
            - ChargeIncluded
          description: Transaction charges to be paid by the charge bearer.
          additionalProperties: false
        ChargeAmountVat:
          type: object
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          required:
            - Amount
            - Currency
          description: The VAT associated with the ChargeAmount.
          additionalProperties: false
        CurrencyExchange:
          $ref: '#/components/schemas/AccountInformation.CurrencyExchange1Properties'
        BankTransactionCode:
          type: object
          properties:
            Domain:
              type: string
              minLength: 4
              maxLength: 4
              description: Specifies the Domain
            DomainCode:
              type: string
              minLength: 4
              maxLength: 4
              description: Specifies the Domain Code.
            Family:
              type: string
              minLength: 4
              maxLength: 4
              description: Specifies the Family
            FamilyCode:
              type: string
              minLength: 4
              maxLength: 4
              description: Specifies the Family Code
            SubFamily:
              type: string
              minLength: 4
              maxLength: 4
              description: Specifies the Sub-Family
            SubFamilyCode:
              type: string
              minLength: 4
              maxLength: 4
              description: Specifies the Sub-family Code
          minProperties: 1
          description: >2-
             
            BankTransactionCode is mandatory (with code specifying the Domain, Family and SubFamily as per External
            Codes ISO20022) when the ProprietaryBankTransactionCode is absent.
             
            Specifies the domain, the family and the sub-family of the bank transaction code, in a structured and
            hierarchical format.
             
            If a specific family or sub-family code cannot be provided, the generic family code defined for the domain
            or the generic sub-family code defined for the family should be provided.
             
            The allowed code list is provided
            [here](https://www.iso20022.org/sites/default/files/2022-05/BTC_Codification_31May2022.xls).
          additionalProperties: false
        ProprietaryBankTransactionCode:
          type: object
          properties:
            Code:
              type: string
              minLength: 1
              maxLength: 35
              description: Proprietary bank transaction code to identify the underlying transaction.
            Issuer:
              type: string
              minLength: 1
              maxLength: 35
              description: Identification of the issuer of the proprietary bank transaction code.
          required:
            - Code
          description: >-
            ProprietaryBankTransactionCode is mandatory when the BankTransactionCode (with code specifying the Domain,
            Family and SubFamily as per External Codes ISO20022) is absent.
          additionalProperties: false
        Balance:
          type: object
          properties:
            CreditDebitIndicator:
              $ref: '#/components/schemas/AccountInformation.CreditDebit1Codes'
            Type:
              $ref: '#/components/schemas/AccountInformation.BalanceType1Codes'
            Amount:
              type: object
              properties:
                Amount:
                  $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
                Currency:
                  $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
              required:
                - Amount
                - Currency
              description: Amount of money of the cash balance after a transaction entry is applied to the account..
              additionalProperties: false
          required:
            - CreditDebitIndicator
            - Type
            - Amount
          description: >-
            Set of elements used to define the balance as a numerical representation of the net increases and decreases
            in an account after a transaction entry is applied to the account.
          additionalProperties: false
        MerchantDetails:
          type: object
          properties:
            MerchantId:
              type: string
              minLength: 1
              maxLength: 35
              description: Merchant identifier, based on market or ecosystem scheme.
            MerchantName:
              type: string
              minLength: 1
              maxLength: 350
              description: Name by which the merchant is known.
            MerchantCategoryCode:
              type: string
              minLength: 3
              maxLength: 4
              description: >-
                Category code values are used to enable the classification of merchants into specific categories based
                on the type of business, trade or services supplied.


                Category code values conform to ISO 18245, related to the type of services or goods the merchant
                provides for the transaction."
          minProperties: 1
          description: >-
            Details of the Merchant involved in the transaction.


            Merchant Details are specified only for those merchant categories that are generally expected to originate
            retail financial transactions


            Omitted if not held.
          additionalProperties: false
        Allocations:
          allOf:
            - $ref: '#/components/schemas/AccountInformation.AmountWithCategorization1Properties'
          description: >-
            The categorized amount the transaction is allocated to.


            Allows the part of the balance the transaction applies to be identified, including the Sharia compliant
            charges, payments and rewards that affect it.


            Omitted where the LFI does not categorize the transaction.
        CreditorAgent:
          type: object
          required:
            - SchemeName
            - Identification
          properties:
            SchemeName:
              type: string
              enum:
                - BICFI
                - Other
              description: |-
                The name of the scheme that qualifies the `identification` value for the Agent.

                The following values are supported:

                * `BICFI`: A Business Identification Code, as defined under ISO9362.

                * `Other`: An alternative identifier, as prescribed under local market regulations.
            Identification:
              anyOf:
                - $ref: '#/components/schemas/PaymentInitiation.BicFi1Type'
                - $ref: '#/components/schemas/PaymentInitiation.OtherFiIdentification1Type'
              description: Identification for the financial institution who is the Agent, qualified by `SchemeName`.
            Name:
              type: string
              minLength: 1
              maxLength: 140
              description: Name of the branch or financial institution that identifies the Agent.
            PostalAddress:
              $ref: '#/components/schemas/Address.Address1Types'
          description: A bank or financial institution that manages the account on behalf of the payment beneficiary.
          additionalProperties: false
        CreditorAccount:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.CashAccount1Properties'
          minItems: 1
          description: >-
            Creditor account details, provided where the transaction is a Debit transaction.


            Omitted where the details cannot be populated for a Debit transaction. For example, cash withdrawals have no
            creditor account or agent; cheques and direct debits may not carry the information during clearing, and for
            some agency banks may never be reconciled; and for card payments the merchant information is provided
            instead.
        DebtorAgent:
          type: object
          required:
            - SchemeName
            - Identification
          properties:
            SchemeName:
              type: string
              enum:
                - BICFI
                - Other
              description: |-
                The name of the scheme that qualifies the `identification` value for the Agent.

                The following values are supported:

                * `BICFI`: A Business Identification Code, as defined under ISO9362.

                * `Other`: An alternative identifier, as prescribed under local market regulations.
            Identification:
              anyOf:
                - $ref: '#/components/schemas/PaymentInitiation.BicFi1Type'
                - $ref: '#/components/schemas/PaymentInitiation.OtherFiIdentification1Type'
              description: Identification for the financial institution who is the Agent, qualified by `SchemeName`.
            Name:
              type: string
              minLength: 1
              maxLength: 140
              description: Name of the branch or financial institution that identifies the Agent.
            PostalAddress:
              $ref: '#/components/schemas/Address.Address1Types'
          description: A bank or financial institution that manages the account on behalf of the payment beneficiary.
          additionalProperties: false
        DebtorAccount:
          $ref: '#/components/schemas/AccountInformation.CashAccount1Properties'
        CardInstrument:
          type: object
          properties:
            CardSchemeName:
              type: string
              enum:
                - AmericanExpress
                - Diners
                - Discover
                - GCC
                - MasterCard
                - UPI
                - VISA
              description: Name of the card scheme.
            InstrumentType:
              type: string
              enum:
                - ApplePay
                - Contactless
                - MagStripe
                - Chip
                - Other
              description: The card instrument type.
            IsPrimaryInstrument:
              type: boolean
              description: >-
                Flag to indicate whether the transaction was made using the payment card belonging to the main account
                holder(s), as opposed to a card issued to a family member or other person who is not the main account
                holder(s) but needs to make payments against the account.


                Set to `true` where the card belongs to the main account holder(s).


                Omitted if not tracked.
            Name:
              type: string
              minLength: 1
              maxLength: 70
              description: Name of the cardholder using the card instrument.
            Identification:
              type: string
              minLength: 1
              maxLength: 19
              description: |-
                Identification assigned by an institution to identify the card instrument used in the transaction. 

                This identification is known by the account owner, and MUST be masked.
          required:
            - CardSchemeName
            - InstrumentType
          description: Set of elements to describe the card instrument used in the transaction.
          additionalProperties: false
        GeoLocation:
          type: object
          properties:
            Latitude:
              $ref: '#/components/schemas/Values.Latitude1Type'
            Longitude:
              $ref: '#/components/schemas/Values.Longitude1Type'
          required:
            - Latitude
            - Longitude
          description: Estimated latitude and longitude coordinates, in degrees.
          additionalProperties: false
        PaymentPurposeCode:
          type: string
          pattern: ^[A-Z]{4}$
          description: >-
            Purpose code that relates to the type of services or goods that corresponds to the underlying purpose of the
            payment.


            Omitted if not recorded.
        SupplementaryData:
          $ref: '#/components/schemas/Values.SupplementaryData1Properties'
      description: >-
        Provides details of a specific transaction recorded against the Account, where the account is identified by
        `AccountId`.
      additionalProperties: false
    AccountInformation.TransactionId:
      type: string
      minLength: 1
      maxLength: 256
      description: >-
        A unique and immutable identifier used to identify resource, with no meaning to the Account Owner.


        LFIs **MUST NOT** implement this value using data that is secret or confidential, due the risk of exposure via
        the URL when transmitted over distributed systems.
    AccountInformation.TransactionType1Codes:
      type: string
      enum:
        - POS
        - ECommerce
        - ATM
        - BillPayments
        - LocalBankTransfer
        - SameBankTransfer
        - InternationalTransfer
        - Teller
        - Cheque
        - Other
      description: The type of transaction.
    AccountInformation.TransactionsMeta1Properties:
      type: object
      required:
        - TotalPages
      properties:
        TotalPages:
          $ref: '#/components/schemas/JsonApi.TotalPages1Type'
        FirstAvailableDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: The date and time of the earliest transaction available for the account.
        LastAvailableDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: The date and time of the latest transaction available for the account.
      description: |-
        Metadata for the transactions collection.

        Reports the period of transaction history available for the account, so a TPP can tell whether an
        empty result means no transactions occurred or that the query fell outside the available range.
      additionalProperties: false
    AccountInformation.UpdateAccountInformationStatus1Properties:
      type: object
      required:
        - Status
      properties:
        Status:
          type: string
          enum:
            - Revoked
          description: Consent updated to `Revoked` status by User at TPP or unilaterally by TPP.
        RevokedBy:
          anyOf:
            - type: string
              enum:
                - TPP
            - type: string
              enum:
                - TPP.InitiatedByUser
          description: "Indicates whether the revocation was initiated by User or unilaterally by TPP.\n\n\n| Identifier          | Description                             |\n| ------------------- | --------------------------------------- |\n| TPP                 | Revoked by TPP without User initiation. |\n| TPP.InitiatedByUser |\tInitiated by User via the TPP.          |\n"
      additionalProperties: false
    Address.Address1Types:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Address.QatarAddress1Properties'
        - $ref: '#/components/schemas/Address.InternationalQualifiedAddress1Properties'
        - $ref: '#/components/schemas/Address.InternationalUnqualifiedAddress1Properties'
      discriminator:
        propertyName: AddressFormatType
        mapping:
          Qatar: '#/components/schemas/Address.QatarAddress1Properties'
          InternationalQualifiedAddress: '#/components/schemas/Address.InternationalQualifiedAddress1Properties'
          InternationalUnqualifiedAddress: '#/components/schemas/Address.InternationalUnqualifiedAddress1Properties'
      description: >-
        An address related to a given person or organization, based on ISO 20022.


        Qatar address structures are mapped as follows:


        * Zone: `CountrySubDivision`.


        * Street: `StreetName`.


        * Building Number: `BuildingNumber`.


        Other properties are retained in this object to support non-Qatar addresses.


        Implementers can choose, where appropriate, to provide `AddressLine` and `Country` where disambiguation of
        address properties is impossible.
    Address.AddressLine1Type:
      type: string
      minLength: 1
      maxLength: 70
      description: A freeform address entry that is not specified using specific address properties.
    Address.AddressType1Codes:
      type: string
      enum:
        - Billing
        - Business
        - Correspondence
        - DeliveryTo
        - MailTo
        - POBox
        - Postal
        - Permanent
        - Residential
        - Statement
        - Other
      description: Qualifies the type of address.
    Address.InternationalQualifiedAddress1Properties:
      type: object
      required:
        - AddressFormatType
        - AddressType
        - BuildingNumber
        - StreetName
        - CountrySubDivision
        - Country
      properties:
        AddressFormatType:
          type: string
          enum:
            - InternationalQualifiedAddress
          description: Address format, defaults to `InternationalQualifiedAddress`
        AddressType:
          $ref: '#/components/schemas/Address.AddressType1Codes'
        BuildingNumber:
          type: string
          minLength: 1
          maxLength: 16
          description: Identifies the position of a given building on a street.
        BuildingName:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of the house or building.
        Floor:
          type: string
          minLength: 1
          maxLength: 70
          description: Floor or storey within a building.
        StreetName:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of a street or thoroughfare.
        DistrictName:
          type: string
          minLength: 1
          maxLength: 140
          description: Identifies a subdivision within a country sub-division.
        PostBox:
          type: string
          minLength: 1
          maxLength: 16
          description: Numbered box ina post office assigned to a given Party where post is kept until collected.
        PostCode:
          type: string
          minLength: 1
          maxLength: 16
          description: Identifier that qualifies a postal address to assist with the sorting and delivery of mail.
        TownName:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of a built-up area.
        CountrySubDivision:
          type: string
          minLength: 1
          maxLength: 35
          description: Country sub-division based on standards for stated country.
        Country:
          type: string
          pattern: ^[A-Z]{2}$
          description: Country code that conforms to ISO 3166-1 alpha-2 values.
      description: International address in the qualified address format, implemented using separate address properties.
      additionalProperties: false
    Address.InternationalUnqualifiedAddress1Properties:
      type: object
      required:
        - AddressFormatType
        - AddressType
        - Country
      properties:
        AddressFormatType:
          type: string
          enum:
            - InternationalUnqualifiedAddress
          description: Address format, defaults to `InternationalUnqualifiedAddress`
        AddressType:
          $ref: '#/components/schemas/Address.AddressType1Codes'
        AddressLine:
          type: array
          items:
            $ref: '#/components/schemas/Address.AddressLine1Type'
          minItems: 1
          maxItems: 7
          description: One-or-more address lines provided using freeform text.
        Country:
          type: string
          pattern: ^[A-Z]{2}$
          description: Country code that conforms to ISO 3166-1 alpha-2 values.
      description: International address in the unqualified address format, implemented using `AddressLine` and `Country`.
      additionalProperties: false
    Address.QatarAddress1Properties:
      type: object
      required:
        - AddressFormatType
        - AddressType
        - BuildingNumber
        - StreetName
        - CountrySubDivision
        - Country
      properties:
        AddressFormatType:
          type: string
          enum:
            - Qatar
          description: Address format, defaults to `Qatar`
        AddressType:
          $ref: '#/components/schemas/Address.AddressType1Codes'
        BuildingNumber:
          type: string
          minLength: 1
          maxLength: 16
          description: Identifies the position of a given building on a street.
        StreetName:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of a street or thoroughfare.
        CountrySubDivision:
          type: string
          pattern: ^Zone [0-9]{1,2}$
          description: Country sub-division, provided as as a Zone for Qatar addresses.
        Country:
          type: string
          pattern: ^[A-Z]{2}$
          description: Country code that conforms to ISO 3166-1 alpha-2 values.
      description: Address in the Qatar address format.
      x-ozone-discovery-requires-analysis: Confirm that address format introduced for Qatar is appropriate for all use cases.
      additionalProperties: false
    Billing.TppBillingUserTypes1Codes:
      type: string
      enum:
        - Retail
        - SME
        - Corporate
      description: >-
        Defines the entity type the TPP is acting on behalf of, as an indicator for the pricing tier of the service
        being provided.
      x-ozone-discovery-requires-analysis: Confirm that the billing user types are correct for Qatar.
    Consent.ConsentCreationDateTime1Type:
      type: string
      pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
      format: date-time
      description: >-
        Consent creation date and time, as recorded by Consent Manager.


        Date and time is represented in RFC 3339 date-time format, qualified as Arabia Standard Time, with seconds being
        the maximum supported precision.
    Consent.ConsentExpirationDateTime1Type:
      type: string
      pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
      format: date-time
      description: >-
        Date and time at which the consent will expire, as agreed at Consent Setup between the User and the TPP.


        Date and time is represented in RFC 3339 date-time format, qualified as Arabia Standard Time, with seconds being
        the maximum supported precision.
    Consent.ConsentId1Type:
      type: string
      minLength: 1
      maxLength: 128
      format: uuid
      description: >-
        Unique identification assigned by the TPP to identify the Consent.
          
        Indicates either a unique Consent or is used to identify a series of Consents linked by the TPP to indicate
        continuity of service across two-or-more Consent durations.


        Where used to indicate a series of Consents the value is described as the "Base Consent ID" (`baseConsentId`).
    Consent.ConsentRevokedBy1Codes:
      type: string
      enum:
        - LFI
        - TPP
        - LFI.InitiatedByUser
        - TPP.InitiatedByUser
      description: |-
        Indicates who the Consent was revoked by.

        | Identifier            | Description                              |
        |-----------------------|------------------------------------------|
        | `LFI`                 | Revoked by LFI without User interaction. |
        | `TPP`                 | Revoked by TPP without User interaction. |
        | `LFI.InitiatedByUser` | Initiated by the User at the LFI.        |
        | `TPP.InitiatedByUser` | Initiated by the User the TPP.           |
    Consent.ConsentStatus1Codes:
      type: string
      enum:
        - AwaitingAuthorization
        - Authorized
        - Rejected
        - Revoked
        - Expired
        - Consumed
        - Suspended
      description: |-
        Specifies the status of a Consent as recorded at Consent Manager.
         
        | Consent Status           | State Type | Description                                                       |
        |--------------------------|------------|-------------------------------------------------------------------|
        | `AwaitingAuthorization`  | Pending    | The Consent is awaiting authorization by the User.                |
        | `Authorized`             | In Use     | The Consent has been successfully authorized.                     |
        | `Rejected`               | Terminal   | The unauthorized Consent has been rejected at the LFI.            |
        | `Revoked`                | Terminal   | The Consent has been revoked at the TPP or LFI.                   |
        | `Expired`                | Terminal   | The Consent has expired.                                          |
        | `Consumed`               | Terminal   | The consented action(s) have been completed successfully.         |
        | `Suspended`              | In Use     | The Consent has been suspended.                                   |
    Consent.ConsentStatusUpdateDateTime1Type:
      type: string
      pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
      format: date-time
      description: >-
        Consent status update data and time, as recorded by Consent Manager.


        Date and time is represented in RFC 3339 date-time format, qualified as Arabia Standard Time, with seconds being
        the maximum supported precision.
    Consent.IdentifiedTppActingOnBehalfOf1Properties:
      type: object
      required:
        - LegalName
        - IdentifierType
        - Identifier
      properties:
        TradingName:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            Trading Name of the organization, as understood by the User agreeing the Consent. Omitted where the Trading
            Name and Legal Name are the same.
        LegalName:
          type: string
          minLength: 1
          maxLength: 50
          description: Legal Name, as registered with the local agency who licenses or regulates the activity of the organization.
        IdentifierType:
          type: string
          enum:
            - CommercialRegistrationCertificate
            - Other
          description: >-
            Qualifier for the organization identifier. Permissible values:


            * CommercialRegistrationCertificate: Issued by Ministry of Commerce and Industry, with the value being the
            Certificate number.


            * Other: Alternative identifier, as allowed under open finance regulations.
        Identifier:
          type: string
          minLength: 1
          maxLength: 50
          description: Value of the identifier, qualified by `IdentifierType`.
      description: >-
        Provides details of the organization a TPP is acting on behalf of in providing open finance services, identified
        by name and by a qualified identifier.


        `IdentifierType` and `Identifier` are paired: an identifier is always accompanied by the scheme that qualifies
        it.
      additionalProperties: false
    Consent.TppActingOnBehalfOf1Types:
      oneOf:
        - $ref: '#/components/schemas/Consent.IdentifiedTppActingOnBehalfOf1Properties'
        - $ref: '#/components/schemas/Consent.UnidentifiedTppActingOnBehalfOf1Properties'
      description: >-
        Provides details of the organization a TPP is acting on behalf of in providing open finance services.


        Used in Consent to provide information on organizations that are not licensed directly to provide open finance
        services.


        Omitted where the TPP is not representing another organization in providing open finance services and agreeing
        Consent with the User.
      x-ozone-discovery-requires-analysis: Confirm that the on-behalf of approach is correct for Qatar and whether this or Sponsored TPP is correct.
    Consent.UnidentifiedTppActingOnBehalfOf1Properties:
      type: object
      required:
        - LegalName
      properties:
        TradingName:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            Trading Name of the organization, as understood by the User agreeing the Consent. Omitted where the Trading
            Name and Legal Name are the same.
        LegalName:
          type: string
          minLength: 1
          maxLength: 50
          description: Legal Name, as registered with the local agency who licenses or regulates the activity of the organization.
      description: >-
        Provides details of the organization a TPP is acting on behalf of in providing open finance services, identified
        by name only.


        Used where no qualified identifier is held for the organization.
      additionalProperties: false
    CurrencyExchange.ContractIdentification1Type:
      type: string
      minLength: 1
      maxLength: 256
      description: >-
        Unique and unambiguous reference to the foreign exchange contract agreed between the initiating party/Creditor
        and the Debtor Agent.
    Errors.CustomErrorCode1Type:
      type: string
      pattern: ^[A-Za-z]+\.[A-Za-z0-9]+$
      description: A custom error code implemented by the LFI that is not included in the list of prescribed API Hub error codes.
    Errors.Error4001Codes:
      type: string
      enum:
        - Consent.Invalid
        - Consent.BusinessRuleViolation
        - Consent.FailsControlParameters
        - Consent.InvalidUserIdentifier
        - JWS.InvalidSignature
        - JWS.Malformed
        - JWS.InvalidClaim
        - JWS.InvalidHeader
        - JWS.InvalidPayload
        - JWE.DecryptionError
        - JWE.InvalidHeader
        - GenericRecoverableError
        - GenericError
        - Event.UnexpectedEvent
        - Body.InvalidFormat
        - Resource.InvalidFormat
      description: Prescribed error codes for 400 errors.
    Errors.Error4001Types:
      anyOf:
        - $ref: '#/components/schemas/Errors.Error4001Codes'
        - $ref: '#/components/schemas/Errors.CustomErrorCode1Type'
    Errors.Error400ResponseBody1Properties:
      type: object
      required:
        - Errors
      properties:
        Errors:
          type: array
          items:
            type: object
            properties:
              Code:
                $ref: '#/components/schemas/Errors.Error4001Types'
              Message:
                type: string
                minLength: 1
                maxLength: 500
                description: >-
                  A description of the error that occurred. e.g., 'A mandatory field isn't supplied' or
                  'RequestedExecutionDateTime must be in future'

                  UAEOF doesn't standardise this field
              Path:
                type: string
                minLength: 1
                maxLength: 500
                description: >-
                  Recommended but optional reference to the JSON Path of the field with error, e.g.,
                  $.Data.Initiation.InstructedAmount.Currency
              Url:
                type: string
                minLength: 1
                maxLength: 1024
                description: URL to help remediate the problem, or provide more information, or to API Reference, or help etc
            required:
              - Code
              - Message
            additionalProperties: false
          minItems: 1
          description: List of one-or-more errors.
      description: An array of detail error codes, and messages, and URLs to documentation to help remediation.
      additionalProperties: false
    Errors.Error400ResponseBodySigned1Properties:
      type: object
      required:
        - iss
        - exp
        - nbf
        - message
      properties:
        iss:
          type: string
          minLength: 1
          maxLength: 2048
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1)'
        exp:
          type: integer
          format: unixtime
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.4)'
        nbf:
          type: integer
          format: unixtime
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.5)'
        aud:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 2048
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.3)'
        iat:
          type: integer
          format: unixtime
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.6)'
        message:
          $ref: '#/components/schemas/Errors.Error400ResponseBody1Properties'
      additionalProperties: false
    Errors.Error4031Codes:
      type: string
      enum:
        - AccessToken.InvalidScope
        - Consent.TransientAccountAccessFailure
        - Consent.AccountTemporarilyBlocked
        - Consent.PermanentAccountAccessFailure
        - GenericRecoverableError
        - GenericError
      description: Prescribed error codes for 403 errors.
    Errors.Error4031Types:
      anyOf:
        - $ref: '#/components/schemas/Errors.Error4031Codes'
        - $ref: '#/components/schemas/Errors.CustomErrorCode1Type'
    Errors.Error403ResponseBody1Properties:
      type: object
      required:
        - Errors
      properties:
        Errors:
          type: array
          items:
            type: object
            properties:
              Code:
                $ref: '#/components/schemas/Errors.Error4031Types'
              Message:
                type: string
                minLength: 1
