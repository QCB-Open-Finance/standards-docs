    PaymentInitiation.CreditorReference1Type:
      type: string
      minLength: 1
      maxLength: 35
      pattern: ^[A-Za-z0-9 \/?:().,'+-]+$
      description: >-
        Creditor Reference that provides information to the Creditor on the source of the payment.


        If included in the Consent displayed during Consent Authorization and recorded with payment on the Creditor
        account ledger of transactions by the LFI, where supported by the LFI.


        If included in the Payment Initiation operation included in the request payload.


        If included in Account Information, provides a record of the Creditor Reference recorded with the transaction.
    PaymentInitiation.DebtorReference1Type:
      type: string
      minLength: 1
      maxLength: 35
      pattern: ^[A-Za-z0-9 \/?:().,'+-]+$
      description: >-
        Debtor Reference that provides information to the User on the source of the payment.


        If included in the Consent displayed during Consent Authorization and recorded with payment on the account
        ledger of transactions by the LFI.


        If included in the Payment Initiation operation included in the request payload or returned by the financial
        institution for information for the User.
    PaymentInitiation.LongLivedPaymentConsent1Properties:
      type: object
      required:
        - PeriodicSchedule
      properties:
        MaximumCumulativeValueOfPayments:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.PeriodTypeMaximumCumulativeValueOfPayments1Properties'
          description: >-
            The maximum cumulative value of all successful payment rails executions under the Consent.


            Each successful payment rails execution amount (related to the Consent) is added to the total cumulative
            value of the Consent, which cannot exceed the maximum value agreed with the User at the point of consent.
        MaximumCumulativeNumberOfPayments:
          type: integer
          description: >-
            The maximum cumulative number of all successful payment rails executions under the Consent.


            Each successful payment rails execution (related to the Consent) is added to the total cumulative number of
            payments for the Consent, which cannot exceed the maximum value agreed with the User at the point of
            consent.
        PeriodicSchedule:
          $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationPeriodicSchedule1Types'
      description: A Consent definition for defining Multi Payments.
      additionalProperties: false
    PaymentInitiation.MaximumIndividualAmount1Properties:
      type: object
      required:
        - Amount
        - Currency
      properties:
        Amount:
          $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
        Currency:
          $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
      description: This is the Maximum amount a variable payment can take per period.
      additionalProperties: false
    PaymentInitiation.MultiPaymentConsentSchedule1Properties:
      type: object
      required:
        - MultiPayment
      properties:
        MultiPayment:
          $ref: '#/components/schemas/PaymentInitiation.LongLivedPaymentConsent1Properties'
      description: A Consent Schedule for a Multi-Payment, initiated under a payment schedule agreed between the User and the TPP.
      additionalProperties: false
    PaymentInitiation.PaymentConsumption1Properties:
      type: object
      required:
        - CumulativeNumberOfPayments
        - CumulativeValueOfPayments
      properties:
        CumulativeNumberOfPayments:
          type: integer
          description: |-
            The cumulative number of payment instructions initiated under the consent schedule.

            Excludes instructions in a Rejected state.
        CumulativeValueOfPayments:
          type: object
          required:
            - Amount
            - Currency
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: >-
            The cumulative value of payment instructions initiated under the consent schedule, excluding instructions in
            a Rejected state.


            A number of monetary units specified in an active currency where the unit of currency is explicit and
            compliant with ISO 4217.
          additionalProperties: false
        CumulativeNumberOfPaymentsInCurrentPeriod:
          type: integer
          description: |-
            The cumulative number of payment instructions in the current period initiated under the consent schedule.

            Excludes instructions in a Rejected state.
        CumulativeValueOfPaymentsInCurrentPeriod:
          type: object
          required:
            - Amount
            - Currency
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: >-
            The cumulative value of payment instructions in the current period initiated under the consent schedule.


            Excludes instructions in a Rejected state.


            A number of monetary units specified in an active currency where the unit of currency is explicit and
            compliant with ISO 4217.
          additionalProperties: false
      additionalProperties: false
    PaymentInitiation.PaymentId1Type:
      type: string
      minLength: 1
      maxLength: 40
      description: Unique identifier for a given Payment Initiation Request.
    PaymentInitiation.PaymentInitiationAccountInformationPermission1Codes:
      type: string
      enum:
        - ReadAccountsBasic
        - ReadAccountsDetail
        - ReadBalances
        - ReadRefundAccount
    PaymentInitiation.PaymentInitiationConsentSchedule1Types:
      oneOf:
        - $ref: '#/components/schemas/PaymentInitiation.SinglePaymentConsentSchedule1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.MultiPaymentConsentSchedule1Properties'
      description: |-
        The Consent Schedule agreed between the User and the TPP.

        Exactly one payment type **MUST** be provided.
    PaymentInitiation.PaymentInitiationControlParameters1Properties:
      type: object
      required:
        - ConsentSchedule
      properties:
        ConsentSchedule:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationConsentSchedule1Types'
          description: |-
            The various payment types that can be initiated. Exactly one payment type **MUST** be provided:

            * A Single Payment, initiated immediately after the User authorizes the Consent at the LFI.

            * A Multi-Payment, initiated under a payment schedule agreed between the User and the TPP.
      description: Control Parameters set the overall rules for the Payment Schedule.
      additionalProperties: false
    PaymentInitiation.PaymentInitiationPeriodicSchedule1Types:
      type: object
      oneOf:
        - $ref: '#/components/schemas/PaymentInitiation.VariableOnDemand1Properties'
      discriminator:
        propertyName: Type
        mapping:
          VariableOnDemand: '#/components/schemas/PaymentInitiation.VariableOnDemand1Properties'
      description: The definition for a payment schedule, discriminated by the `Type` property.
    PaymentInitiation.PaymentInitiationResponse1Properties:
      type: object
      required:
        - PaymentId
        - ConsentId
        - Instruction
        - PaymentPurposeCode
        - CreationDateTime
        - Status
        - StatusUpdateDateTime
      properties:
        PaymentId:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.PaymentId1Type'
          description: Unique identifier assigned by the LFI to identify the Payment Initiation Request resource.
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        Instruction:
          type: object
          properties:
            Amount:
              type: object
              required:
                - Amount
                - Currency
              properties:
                Amount:
                  $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
                Currency:
                  $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
              description: The payment initiation currency and amount.
              additionalProperties: false
          required:
            - Amount
          description: |-
            The currency and amount instructed by the TPP based on the payment authorized by the User. 

            Used to instruct the movement of funds from the Debtor to the Creditor.
          additionalProperties: false
        PaymentPurposeCode:
          $ref: '#/components/schemas/PaymentPurposeCode1Type'
        DebtorReference:
          $ref: '#/components/schemas/PaymentInitiation.DebtorReference1Type'
        CreationDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: >-
            Date and time at which the resource was created, formatted as defined by ISO 8601/RFC 3339
            [`date-time`](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6).
        Status:
          $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationStatus1Codes'
        StatusUpdateDateTime:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: >-
            Date and time at which the payment status was updated, formatted as defined by ISO 8601/RFC 3339
            [`date-time`](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6).
        PaymentTransactionId:
          $ref: '#/components/schemas/PaymentInitiation.PaymentTransactionId1Type'
        Charges:
          type: array
          items:
            $ref: '#/components/schemas/Charges.Charge1Properties'
          minItems: 1
          description: Charges incurred in transacting the payment.
        RejectReasonCode:
          type: array
          items:
            $ref: '#/components/schemas/PaymentInitiation.RejectReasonCode1Properties'
          minItems: 1
          description: Reject reason code(s) provided by payment system serving the Payment Initiation Request.
        CurrencyRequest:
          allOf:
            - $ref: '#/components/schemas/CurrencyExchange.RequestedCurrencyExchange1Properties'
          description: >-
            Currency exchange requested for a domestic, non-Riyal payment. Omitted where no currency exchange is
            required.
        ExchangeRate:
          allOf:
            - $ref: '#/components/schemas/CurrencyExchange.FinalizedCurrencyExchangeRateInformation1Properties'
          description: >-
            Finalized currency exchange for a domestic, non-Riyal payment. Omitted where no currency exchange is
            required, or where the rate is not yet available.
      description: |-
        Payment Initiation Response for a Domestic Payment.

        `CurrencyRequest` and `ExchangeRate` are provided only for a domestic, non-Riyal payment, and
        finalized exchange rate information is omitted where the rate is not available when the resource
        is created.
      additionalProperties: false
    PaymentInitiation.PaymentInitiationStatus1Codes:
      type: string
      enum:
        - Pending
        - AcceptedSettlementCompleted
        - AcceptedCreditSettlementCompleted
        - AcceptedWithoutPosting
        - Rejected
      description: >
        Describes the status of the Payment Initiation Request.


        | Code |
        Description                                                                                                                                                                    
        |

        | --------------------------------- |
        --------------------------------------------------------------------------------------------------------------------------------------------------
        |

        | Pending                           | Payment initiation or individual transaction included in the payment
        initiation is pending.<br>Further checks and status update will be performed. |

        | Rejected                          | The payment initiation has been
        rejected.                                                                                                         
        |

        | AcceptedSettlementCompleted       | Settlement of the Debtor account has been
        completed.                                                                                               |

        | AcceptedCreditSettlementCompleted | When the Creditor account has been credited with the funds of the payment
        initiated via the TPP.                                                   |

        | AcceptedWithoutPosting            | When the Recipient Bank has accepted the payment but has not applied the
        credit to the Creditor account yet.                                       |
    PaymentInitiation.PaymentTransactionId1Type:
      type: string
      minLength: 1
      maxLength: 140
      description: >-
        An identifier for a given Payment Initiation Request generated by the Debtor financial institution or payment
        system acting on their behalf to identify the transaction.


        An example of this value is the `EndToEndIdentification` value, which is commonly implemented in ISO 20022-based
        payment systems.


        This value is optional as it may not be available when the Payment Initiation Request resource is initially
        created, due to the asynchronous nature of payment systems.
    PaymentInitiation.PeriodStartDate1Type:
      type: string
      format: date
      description: Specifies the start date of when a payment schedule begins.
    PaymentInitiation.PeriodType1Codes:
      type: string
      enum:
        - Day
        - Week
        - Month
        - Year
      description: >-
        |Period Type|Description|

        |-----------|-----------|

        |Day|A continuous period of time, consisting of 24 consecutive hours, starting from midnight (00:00:00) and
        finishing at 23:59:59 of the same day. |

        |Week|A continuous period of time, consisting of seven consecutive days, starting from midnight (00:00:00) and
        finishing at 23:59:59 of the 7th day. |

        |Month|A continuous period of time starting from midnight (00:00:00) of the first day of a month and finishing
        at 23:59:59 of the last day of that month.|

        |Year|A continuous period of time, consisting of 12 months.|
    PaymentInitiation.PeriodTypeMaximumCumulativeValueOfPayments1Properties:
      type: object
      required:
        - Amount
        - Currency
      properties:
        Amount:
          $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
        Currency:
          $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
      description: The maximum cumulative payment value of all payment initiations per Period Type.
      additionalProperties: false
    PaymentInitiation.ReadPaymentInitiationConsent1Properties:
      type: object
      required:
        - ControlParameters
        - ConsentId
        - ExpirationDateTime
        - PaymentPurposeCode
        - CreationDateTime
        - Status
        - StatusUpdateDateTime
        - PaymentConsumption
      properties:
        ControlParameters:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationControlParameters1Properties'
          description: Control Parameters set the overall rules for the Payment Schedule.
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        BaseConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        IsSingleAuthorization:
          type: boolean
          description: >-
            TPP is request authorization by a single User, with no multi-authorization requirement.


            Used to indicate the requirement time-bound authorization of the payment, in order to release goods or
            services in a timely fashion.


            Can be ignored by LFIs where the access control model for the account requires multiple authorizations of
            the 


            Set to `false` where immediate authorization is not required.
        AuthorizationExpirationDateTime:
          type: string
          format: date-time
        ExpirationDateTime:
          $ref: '#/components/schemas/Consent.ConsentExpirationDateTime1Type'
        Permissions:
          type: array
          items:
            $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationAccountInformationPermission1Codes'
          minItems: 1
          uniqueItems: true
          description: >-
            Specifies the permitted Bank Data Sharing permissions, which is the data clusters being consented by the
            User, and requested for authorization with the LFI. 


            Allows TPPs to check the User balance at the payment account.


            TPPs **MUST** select `ReadAccountsBasic` and `ReadBalances` to implement a balance check before making
            payment.
        CurrencyRequest:
          $ref: '#/components/schemas/CurrencyExchange.RequestedCurrencyExchange1Properties'
        DebtorReference:
          $ref: '#/components/schemas/PaymentInitiation.DebtorReference1Type'
        CreditorReference:
          $ref: '#/components/schemas/PaymentInitiation.CreditorReference1Type'
        PaymentPurposeCode:
          $ref: '#/components/schemas/PaymentPurposeCode1Type'
        CreationDateTime:
          $ref: '#/components/schemas/Consent.ConsentCreationDateTime1Type'
        Status:
          $ref: '#/components/schemas/Consent.ConsentStatus1Codes'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/Consent.ConsentStatusUpdateDateTime1Type'
        RevokedBy:
          allOf:
            - $ref: '#/components/schemas/Consent.ConsentRevokedBy1Codes'
          description: |-
            Indicates who the Consent was revoked by.

            Omitted where the Consent has not been revoked.
        Charges:
          type: array
          items:
            $ref: '#/components/schemas/Charges.Charge1Properties'
          minItems: 1
          description: |-
            Charges applied to a given payment initiation instruction, as stated by the LFI.

            Omitted if no charges apply to the payment.
        ExchangeRate:
          $ref: '#/components/schemas/CurrencyExchange.ConsentCurrencyExchangeRateInformation1Properties'
        PaymentConsumption:
          $ref: '#/components/schemas/PaymentInitiation.PaymentConsumption1Properties'
      description: Properties of the Consent agreed by the User with the TPP for Payment Initiation.
      title: Payment Initiation Consent
      additionalProperties: false
    PaymentInitiation.RejectReasonCode1Properties:
      type: object
      required:
        - Code
        - Message
      properties:
        Code:
          $ref: '#/components/schemas/PaymentInitiation.RejectReasonCode1Type'
        Message:
          $ref: '#/components/schemas/PaymentInitiation.RejectReasonMessage1Type'
      additionalProperties: false
    PaymentInitiation.RejectReasonCode1Type:
      type: string
      minLength: 1
      maxLength: 35
      pattern: ^(FAWRAN|QATCH|.+)\.[A-Za-z0-9]+$
      description: >-
        A reject reason code describes why a given Payment Initiation Request has been rejected.


        The first part of the code qualifies the payment system processing the Request, and reflects either domestic
        payment

        schemes or other payment rails out of scope of Open Finance standards.


        The second part is a code prescribed by the payment system for the error condition.
    PaymentInitiation.RejectReasonMessage1Type:
      type: string
      minLength: 1
      maxLength: 500
      description: A message describing the reason why a given Payment Initiation Request was rejected.
    PaymentInitiation.SingleInstantPayment1Properties:
      type: object
      required:
        - Type
        - Amount
      properties:
        Type:
          type: string
          enum:
            - SingleInstantPayment
          description: The Payment Type.
        Amount:
          type: object
          required:
            - Amount
            - Currency
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: An Amount qualified by an active Currency, using amount and currency as prescribed by ISO 4217.
          additionalProperties: false
      description: >-
        A single immediate payment consent that **MUST** be used for a single payment, which will be initiated
        immediately after User authorization at the LFI.
      additionalProperties: false
    PaymentInitiation.SinglePaymentConsentSchedule1Properties:
      type: object
      required:
        - SinglePayment
      properties:
        SinglePayment:
          $ref: '#/components/schemas/PaymentInitiation.SingleInstantPayment1Properties'
      description: A Consent Schedule for a Single Payment, initiated immediately after the User authorizes the Consent at the LFI.
      additionalProperties: false
    PaymentInitiation.VariableOnDemand1Properties:
      type: object
      required:
        - Type
        - PeriodType
        - PeriodStartDate
        - Controls
      properties:
        Type:
          type: string
          enum:
            - VariableOnDemand
          description: The Periodic Schedule Type.
        PeriodType:
          $ref: '#/components/schemas/PaymentInitiation.PeriodType1Codes'
        PeriodStartDate:
          $ref: '#/components/schemas/PaymentInitiation.PeriodStartDate1Type'
        Controls:
          type: object
          properties:
            MaximumIndividualAmount:
              $ref: '#/components/schemas/PaymentInitiation.MaximumIndividualAmount1Properties'
            MaximumCumulativeValueOfPaymentsPerPeriod:
              $ref: '#/components/schemas/PaymentInitiation.PeriodTypeMaximumCumulativeValueOfPayments1Properties'
            MaximumCumulativeNumberOfPaymentsPerPeriod:
              type: integer
          minProperties: 1
          description: Controls that apply to the payment schedule.
          additionalProperties: false
      description: >-
        Payment Controls that apply to all payment instructions in a given period under this payment consent.


        The payments for this consent may be executed on any date, as long as they are within the Controls for a
        PeriodType.
      additionalProperties: false
    PaymentInitiationEvent1Properties:
      type: object
      required:
        - Meta
      properties:
        Data:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationResponse1Properties'
          description: >-
            Payment Initiation Event Data. This Data Object will contain the same API resource and Schema that has
            triggered the Event.


            If the value of `EventType` is `Resource.Deleted` this property will be omitted.
        Meta:
          type: object
          properties:
            EventDateTime:
              type: string
              pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
              format: date-time
              description: Date and time at which the Event was raised.
            EventResource:
              type: string
              minLength: 1
              maxLength: 500
              description: The API resource that triggered the Event, e.g. `/account-access-consents/{ConsentId}`.
            EventType:
              $ref: '#/components/schemas/Events.EventType1Codes'
            ConsentId:
              allOf:
                - $ref: '#/components/schemas/Consent.ConsentId1Type'
              description: Consent identifier related to the Event.
            PaymentId:
              allOf:
                - $ref: '#/components/schemas/PaymentInitiation.PaymentId1Type'
              description: Unique identifier assigned by the LFI to identify the Payment Initiation Request resource.
          required:
            - EventDateTime
            - EventResource
            - EventType
            - ConsentId
            - PaymentId
          description: Event Metadata.
          additionalProperties: false
      description: Event Notification raised when a Payment Initiation Request is created or updated.
      title: Payment Initiation Event
      additionalProperties: false
    PaymentPurposeCode1Type:
      type: string
      minLength: 1
      maxLength: 4
      description: >-
        A category code that relates to the type of services or goods that corresponds to the underlying purpose of the
        payment. 


        The code must conform to the published code list provided by QCB.
    Values.ActiveOrHistoricAmount1Type:
      type: string
      pattern: ^\d{1,13}$|^\d{1,13}\.\d{1,5}$
      description: >-
        A number of monetary units specified in an active currency where the unit of currency is explicit and compliant
        with ISO 4217.
      examples:
        - '100.00'
    Values.ActiveOrHistoricCurrencyCode1Type:
      type: string
      pattern: ^[A-Z]{3,3}$
      description: |-
        A 3 character alphabetic code allocated to a currency under an international currency identification scheme.

        Values **MUST** be in accordance with ISO 4217 'Codes for the representation of currencies and funds'.
    WebhookEvent1Types:
      oneOf:
        - $ref: '#/components/schemas/ConsentEvent1Properties'
        - $ref: '#/components/schemas/PaymentInitiationEvent1Properties'
      description: The Event Notification types sent by the API Hub.
servers:
  - url: /
