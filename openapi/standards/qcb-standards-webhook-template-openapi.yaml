openapi: 3.1.0
info:
  title: 'QCB Open Finance: Webhook Template API'
  description: >-
    # QCB Open Finance: Webhook Template


    This API description is provided **as a template** for guidance in implementing Webhooks at a TPP, to receive Event
    Notifications sent by the API Hub.
  version: v1.0-rc1
  x-sf-docs-util-menu-item-name: Webhook Template
tags:
  - name: Webhook Template
    description: Webhook Template Operations
paths:
  /:
    post:
      operationId: UnsignedEventNotificationPayload_SignedEventNotificationPayload
      parameters: []
      description: >-
        This endpoint provides a template for the implementation of Webhooks at a TPP.


        A 202 or 204 HTTP return code with an empty payload is expected in acknowledgement of receipt.


        TPPs should observe the standardized error payloads as defined by the Open Finance Framework and provided in
        this API description.
      summary: Event Notification Template
      responses:
        '202':
          description: Accepted
          headers:
            x-fapi-interaction-id:
              required: false
              description: An RFC4122 UID used as a correlation ID.
              schema:
                type: string
                minLength: 1
                maxLength: 256
        '204':
          description: No content
          headers:
            x-fapi-interaction-id:
              required: false
              description: An RFC4122 UID used as a correlation ID.
              schema:
                type: string
                minLength: 1
                maxLength: 256
        '400':
          description: Bad request
          headers:
            x-fapi-interaction-id:
              required: false
              description: An RFC4122 UID used as a correlation ID.
              schema:
                type: string
                minLength: 1
                maxLength: 256
          content:
            application/jwt:
              schema:
                $ref: '#/components/schemas/Errors.Error400ResponseBodySigned1Properties'
        '401':
          description: Unauthorized
          headers:
            x-fapi-interaction-id:
              required: false
              description: An RFC4122 UID used as a correlation ID.
              schema:
                type: string
                minLength: 1
                maxLength: 256
        '403':
          description: Forbidden
          headers:
            x-fapi-interaction-id:
              required: false
              description: An RFC4122 UID used as a correlation ID.
              schema:
                type: string
                minLength: 1
                maxLength: 256
          content:
            application/jwt:
              schema:
                $ref: '#/components/schemas/Errors.Error403ResponseBodySigned1Properties'
        '405':
          description: Method Not Allowed
          headers:
            x-fapi-interaction-id:
              required: false
              description: An RFC4122 UID used as a correlation ID.
              schema:
                type: string
                minLength: 1
                maxLength: 256
        '406':
          description: Not Acceptable
          headers:
            x-fapi-interaction-id:
              required: false
              description: An RFC4122 UID used as a correlation ID.
              schema:
                type: string
                minLength: 1
                maxLength: 256
        '415':
          description: Unsupported Media Type
          headers:
            x-fapi-interaction-id:
              required: false
              description: An RFC4122 UID used as a correlation ID.
              schema:
                type: string
                minLength: 1
                maxLength: 256
        '429':
          description: Too Many Requests
          headers:
            x-fapi-interaction-id:
              required: false
              description: An RFC4122 UID used as a correlation ID.
              schema:
                type: string
                minLength: 1
                maxLength: 256
            retry-after:
              required: true
              description: Number in seconds to wait
              schema:
                type: integer
                format: int64
        '500':
          description: Internal Server Error
          headers:
            x-fapi-interaction-id:
              required: false
              description: An RFC4122 UID used as a correlation ID.
              schema:
                type: string
                minLength: 1
                maxLength: 256
          content:
            application/jwt:
              schema:
                $ref: '#/components/schemas/Errors.Error500ResponseBodySigned1Properties'
      tags:
        - Webhook Template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventNotificationSigned1Request'
          application/jwt:
            schema:
              type: string
              minLength: 1
              maxLength: 131072
        description: >-
          Please note the `application/json` Content Type is provided for processing the Event Notification payload and
          does not accurately reflect the format of a serialized, signed, and encrypted JSON Web Token (JWT) that will
          be received at the registered Webhook. The event will be a string and be received with the Content Type value
          `application/jwt`.


          The Schema Object is provided for TPPs to understand the correct message payload definition that must be
          parsed from the signed and encrypted enclosed JWT received in the Event Notification.


          Please refer to the Open Finance Framework documentation for guidelines on decrypting and verifying JWTs
          received at Webhooks.
components:
  schemas:
    AccountInformation.AccountSubType1Codes:
      type: string
      enum:
        - CreditCard
        - CurrencyAccount
        - CurrentAccount
        - Loan
        - Mortgage
        - Savings
        - Wallet
      description: |-
        Specifies the sub type of account (product family group).

        Supported values: CreditCard, CurrencyAccount, CurrentAccount, Loan, Mortgage, Savings, Wallet.
    AccountInformation.AccountType1Codes:
      type: string
      enum:
        - Retail
        - SME
        - Corporate
      description: Specifies the type of account (Retail, SME or Corporate).
    AccountInformation.ConsentPermission1Codes:
      type: string
      enum:
        - ReadAccountsBasic
        - ReadAccountsDetail
        - ReadBalances
        - ReadTransactionsBasic
        - ReadTransactionsDetail
      description: The permission codes available to the TPP for Bank Data Sharing and agreed with the User.
    AccountInformation.FromDate1Type:
      type: string
      format: date
      description: >-
        Specified start date for the transaction or statement query period.


        If this is not populated, the start date will be open ended, and data will be returned from the earliest
        available transaction or statement.


        All dates in the JSON payloads are represented in RFC 3339 date format.  For example: 2025-01-01
    AccountInformation.ReadConsent1Properties:
      type: object
      required:
        - ConsentId
        - Permissions
        - ExpirationDateTime
        - CreationDateTime
        - Status
        - StatusUpdateDateTime
      properties:
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        BaseConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        Permissions:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.ConsentPermission1Codes'
          minItems: 1
        ExpirationDateTime:
          $ref: '#/components/schemas/Consent.ConsentExpirationDateTime1Type'
        FromDate:
          $ref: '#/components/schemas/AccountInformation.FromDate1Type'
        ToDate:
          $ref: '#/components/schemas/AccountInformation.ToDate1Type'
        AccountType:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.AccountType1Codes'
          minItems: 1
        AccountSubType:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.AccountSubType1Codes'
          minItems: 1
        OnBehalfOf:
          $ref: '#/components/schemas/Consent.TppActingOnBehalfOf1Types'
        CreationDateTime:
          $ref: '#/components/schemas/Consent.ConsentCreationDateTime1Type'
        Status:
          $ref: '#/components/schemas/Consent.ConsentStatus1Codes'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/Consent.ConsentStatusUpdateDateTime1Type'
        RevokedBy:
          allOf:
            - $ref: '#/components/schemas/Consent.ConsentRevokedBy1Codes'
          description: |-
            Indicates who the Consent was revoked by.

            Omitted where the Consent has not been revoked.
      title: Account Information Consent
      additionalProperties: false
    AccountInformation.ToDate1Type:
      type: string
      format: date
      description: >-
        Specified end date for the transaction or statement query period.


        If this is not populated, the end date will be open ended, and data will be returned to the latest available
        transaction or the last statement generated.


        All dates in the JSON payloads are represented in RFC 3339 date format.  For example: 2025-12-31    
    Charges.Charge1Properties:
      type: object
      required:
        - ChargeBearer
        - Type
        - Amount
      properties:
        ChargeBearer:
          $ref: '#/components/schemas/Charges.ChargeBearerType1Codes'
        Type:
          $ref: '#/components/schemas/Charges.PaymentChargeType1Codes'
        Amount:
          type: object
          required:
            - Amount
            - Currency
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: An Amount qualified by an active Currency, using amount and currency as prescribed by ISO 4217.
          additionalProperties: false
      description: Charges related to a given payment or transaction.
      additionalProperties: false
    Charges.ChargeBearerType1Codes:
      type: string
      enum:
        - BorneByCreditor
        - BorneByDebtor
        - Shared
      description: Bearer of the charges associated with a given payment or transaction.
    Charges.PaymentChargeType1Codes:
      type: string
      enum:
        - VAT
        - Fees
      description: Charge type codes, indicating what the charge relates to.
    Consent.ConsentCreationDateTime1Type:
      type: string
      pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
      format: date-time
      description: >-
        Consent creation date and time, as recorded by Consent Manager.


        Date and time is represented in RFC 3339 date-time format, qualified as Arabia Standard Time, with seconds being
        the maximum supported precision.
    Consent.ConsentExpirationDateTime1Type:
      type: string
      pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
      format: date-time
      description: >-
        Date and time at which the consent will expire, as agreed at Consent Setup between the User and the TPP.


        Date and time is represented in RFC 3339 date-time format, qualified as Arabia Standard Time, with seconds being
        the maximum supported precision.
    Consent.ConsentId1Type:
      type: string
      minLength: 1
      maxLength: 128
      format: uuid
      description: >-
        Unique identification assigned by the TPP to identify the Consent.
          
        Indicates either a unique Consent or is used to identify a series of Consents linked by the TPP to indicate
        continuity of service across two-or-more Consent durations.


        Where used to indicate a series of Consents the value is described as the "Base Consent ID" (`baseConsentId`).
    Consent.ConsentRevokedBy1Codes:
      type: string
      enum:
        - LFI
        - TPP
        - LFI.InitiatedByUser
        - TPP.InitiatedByUser
      description: |-
        Indicates who the Consent was revoked by.

        | Identifier            | Description                              |
        |-----------------------|------------------------------------------|
        | `LFI`                 | Revoked by LFI without User interaction. |
        | `TPP`                 | Revoked by TPP without User interaction. |
        | `LFI.InitiatedByUser` | Initiated by the User at the LFI.        |
        | `TPP.InitiatedByUser` | Initiated by the User the TPP.           |
    Consent.ConsentStatus1Codes:
      type: string
      enum:
        - AwaitingAuthorization
        - Authorized
        - Rejected
        - Revoked
        - Expired
        - Consumed
        - Suspended
      description: |-
        Specifies the status of a Consent as recorded at Consent Manager.
         
        | Consent Status           | State Type | Description                                                       |
        |--------------------------|------------|-------------------------------------------------------------------|
        | `AwaitingAuthorization`  | Pending    | The Consent is awaiting authorization by the User.                |
        | `Authorized`             | In Use     | The Consent has been successfully authorized.                     |
        | `Rejected`               | Terminal   | The unauthorized Consent has been rejected at the LFI.            |
        | `Revoked`                | Terminal   | The Consent has been revoked at the TPP or LFI.                   |
        | `Expired`                | Terminal   | The Consent has expired.                                          |
        | `Consumed`               | Terminal   | The consented action(s) have been completed successfully.         |
        | `Suspended`              | In Use     | The Consent has been suspended.                                   |
    Consent.ConsentStatusUpdateDateTime1Type:
      type: string
      pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
      format: date-time
      description: >-
        Consent status update data and time, as recorded by Consent Manager.


        Date and time is represented in RFC 3339 date-time format, qualified as Arabia Standard Time, with seconds being
        the maximum supported precision.
    Consent.IdentifiedTppActingOnBehalfOf1Properties:
      type: object
      required:
        - LegalName
        - IdentifierType
        - Identifier
      properties:
        TradingName:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            Trading Name of the organization, as understood by the User agreeing the Consent. Omitted where the Trading
            Name and Legal Name are the same.
        LegalName:
          type: string
          minLength: 1
          maxLength: 50
          description: Legal Name, as registered with the local agency who licenses or regulates the activity of the organization.
        IdentifierType:
          type: string
          enum:
            - CommercialRegistrationCertificate
            - Other
          description: >-
            Qualifier for the organization identifier. Permissible values:


            * CommercialRegistrationCertificate: Issued by Ministry of Commerce and Industry, with the value being the
            Certificate number.


            * Other: Alternative identifier, as allowed under open finance regulations.
        Identifier:
          type: string
          minLength: 1
          maxLength: 50
          description: Value of the identifier, qualified by `IdentifierType`.
      description: >-
        Provides details of the organization a TPP is acting on behalf of in providing open finance services, identified
        by name and by a qualified identifier.


        `IdentifierType` and `Identifier` are paired: an identifier is always accompanied by the scheme that qualifies
        it.
      additionalProperties: false
    Consent.TppActingOnBehalfOf1Types:
      oneOf:
        - $ref: '#/components/schemas/Consent.IdentifiedTppActingOnBehalfOf1Properties'
        - $ref: '#/components/schemas/Consent.UnidentifiedTppActingOnBehalfOf1Properties'
      description: >-
        Provides details of the organization a TPP is acting on behalf of in providing open finance services.


        Used in Consent to provide information on organizations that are not licensed directly to provide open finance
        services.


        Omitted where the TPP is not representing another organization in providing open finance services and agreeing
        Consent with the User.
    Consent.UnidentifiedTppActingOnBehalfOf1Properties:
      type: object
      required:
        - LegalName
      properties:
        TradingName:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            Trading Name of the organization, as understood by the User agreeing the Consent. Omitted where the Trading
            Name and Legal Name are the same.
        LegalName:
          type: string
          minLength: 1
          maxLength: 50
          description: Legal Name, as registered with the local agency who licenses or regulates the activity of the organization.
      description: >-
        Provides details of the organization a TPP is acting on behalf of in providing open finance services, identified
        by name only.


        Used where no qualified identifier is held for the organization.
      additionalProperties: false
    ConsentEvent1Properties:
      type: object
      required:
        - Meta
      properties:
        Data:
          allOf:
            - $ref: '#/components/schemas/ConsentEventData1Types'
          description: >-
            Consent Event Data. This Data Object will contain the same API resource and Schema that has triggered the
            Event.


            If the value of `EventType` is `Resource.Deleted` this property will be omitted.
        Meta:
          type: object
          properties:
            EventDateTime:
              type: string
              pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
              format: date-time
              description: Date and time at which the Event was raised.
            EventResource:
              type: string
              minLength: 1
              maxLength: 500
              description: The API resource that triggered the Event, e.g. `/account-access-consents/{ConsentId}`.
            EventType:
              $ref: '#/components/schemas/Events.EventType1Codes'
            ConsentId:
              allOf:
                - $ref: '#/components/schemas/Consent.ConsentId1Type'
              description: Consent identifier related to the Event.
          required:
            - EventDateTime
            - EventResource
            - EventType
            - ConsentId
          description: Event Metadata.
          additionalProperties: false
      description: Event Notification raised when a Consent is created, updated or deleted.
      title: Consent Event
      additionalProperties: false
    ConsentEventData1Types:
      oneOf:
        - $ref: '#/components/schemas/AccountInformation.ReadConsent1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.ReadPaymentInitiationConsent1Properties'
      description: >-
        The Consent that triggered the Event, as returned by the Consent operations of the Account Information and
        Payment Initiation APIs.
    CurrencyExchange.ConsentCurrencyExchangeRateInformation1Properties:
      type: object
      required:
        - UnitCurrency
        - RateType
      properties:
        UnitCurrency:
          type: string
          pattern: ^[A-Z]{3,3}$
          description: >-
            Currency in which the rate of exchange is expressed in a currency exchange. Often referred to as the "sell"
            side in a currency conversion.


            In the example 1GBP = xxxCUR, the unit currency is GBP.
        RateType:
          $ref: '#/components/schemas/CurrencyExchange.RateType1Codes'
        ContractIdentification:
          $ref: '#/components/schemas/CurrencyExchange.ContractIdentification1Type'
        ExchangeRate:
          type: number
          description: |-
            The factor used for conversion of an amount from one currency to another.

            Reflects the price at which one currency was bought with another currency.
        ExpirationDateTime:
          type: string
          format: date-time
          description: |-
            Specified date and time the exchange rate agreement will expire.

            All dates in the JSON payloads are represented in ISO 8601 date-time format.

            All date-time fields in responses must include the timezone, for example: 2023-04-05T10:43:07+00:00
      description: >-
        Details of the currency exchange recorded against a Consent.


        `ExchangeRate` is optional, as the rate may not have been established at the point the Consent is

        read — unlike a payment, which reports the rate that was applied.


        This object provides for domestic, non-Riyal transactions, where both accounts are held by LFIs in Qatar. This
        object **is not** intended to support international transactions.
      additionalProperties: false
    CurrencyExchange.ContractIdentification1Type:
      type: string
      minLength: 1
      maxLength: 256
      description: >-
        Unique and unambiguous reference to the foreign exchange contract agreed between the initiating party/Creditor
        and the Debtor Agent.
    CurrencyExchange.CurrencyExchangeRateInformation1Properties:
      type: object
      required:
        - UnitCurrency
        - RateType
      properties:
        UnitCurrency:
          type: string
          pattern: ^[A-Z]{3,3}$
          description: >-
            Currency in which the rate of exchange is expressed in a currency exchange. Often referred to as the "sell"
            side in a currency conversion.


            In the example 1GBP = xxxCUR, the unit currency is GBP.
        RateType:
          $ref: '#/components/schemas/CurrencyExchange.RateType1Codes'
        ContractIdentification:
          $ref: '#/components/schemas/CurrencyExchange.ContractIdentification1Type'
        ExchangeRate:
          type: number
          description: |-
            The factor used for conversion of an amount from one currency to another.

            Reflects the price at which one currency was bought with another currency.
      description: |-
        Provides details on the currency exchange rate and contract requested for a payment.

        `ExchangeRate` is omitted where the rate is not known at the point the request is made, and is
        resolved by the LFI.
      additionalProperties: false
    CurrencyExchange.FinalizedCurrencyExchangeRateInformation1Properties:
      type: object
      required:
        - UnitCurrency
        - RateType
        - ExchangeRate
      properties:
        UnitCurrency:
          type: string
          pattern: ^[A-Z]{3,3}$
          description: >-
            Currency in which the rate of exchange is expressed in a currency exchange. Often referred to as the "sell"
            side in a currency conversion.


            In the example 1GBP = xxxCUR, the unit currency is GBP.
        RateType:
          $ref: '#/components/schemas/CurrencyExchange.RateType1Codes'
        ContractIdentification:
          $ref: '#/components/schemas/CurrencyExchange.ContractIdentification1Type'
        ExchangeRate:
          type: number
          description: |-
            The factor used for conversion of an amount from one currency to another.

            Reflects the price at which one currency was bought with another currency. Mandatory, as the
            finalized information reports the rate that was applied.
        ExpirationDateTime:
          type: string
          format: date-time
          description: |-
            Specified date and time the exchange rate agreement will expire.

            All dates in the JSON payloads are represented in ISO 8601 date-time format.

            All date-time fields in responses must include the timezone, for example: 2023-04-05T10:43:07+00:00
      description: >-
        Further detailed information on the exchange rate that has been used in the payment transaction, as returned by
        the LFI.


        This object provides for domestic, non-Riyal transactions, where both accounts are held by LFIs in Qatar. This
        object **is not** intended to support international transactions.
      additionalProperties: false
    CurrencyExchange.InstructionPriority1Codes:
      type: string
      enum:
        - Normal
        - Urgent
      description: >-
        Indicator of the urgency or order of importance that the instructing party would like the instructed party to
        apply to the processing of the instruction.


        Payment Initiation Request may not require this code where it is not supported or the payment can proceed
        without specific prioritization.
    CurrencyExchange.RateType1Codes:
      type: string
      enum:
        - Actual
        - Agreed
        - Indicative
      description: Specifies the type used to complete the currency exchange.
    CurrencyExchange.RequestedCurrencyExchange1Properties:
      type: object
      required:
        - CurrencyOfTransfer
      properties:
        InstructionPriority:
          $ref: '#/components/schemas/CurrencyExchange.InstructionPriority1Codes'
        ExtendedPurpose:
          type: string
          minLength: 1
          maxLength: 140
          description: Specifies the purpose of an international payment, using freeform text.
        ChargeBearer:
          $ref: '#/components/schemas/Charges.ChargeBearerType1Codes'
        CurrencyOfTransfer:
          type: string
          pattern: ^[A-Z]{3,3}$
          description: >-
            Specifies the currency of the to be transferred amount, which is different from the currency of the Debtor
            Account.


            Often referred to as the "buy" side in a currency conversion.
        DestinationCountryCode:
          type: string
          pattern: '[A-Z]{2,2}'
          description: >-
            Country in which Credit Account is domiciled. Code to identify a country, a dependency, or another area of
            particular geopolitical interest, on the basis of country names obtained from the United Nations (ISO 3166,
            Alpha-2 code).


            Provides visibility to the LFI of the destination country for payment routing and risk screening purposes.
        ExchangeRateInformation:
          allOf:
            - $ref: '#/components/schemas/CurrencyExchange.CurrencyExchangeRateInformation1Properties'
          description: >-
            Details of the request currency exchange.


            Omitted where the TPP has no visibility of available rates at Consent Setup, with resolution of the
            requested currency exchange details happening at the LFI.
      description: >-
        The details of the non-local currency or currency exchange request that has been agreed between the User and the
        TPP.


        The requested Charge Bearer and Exchange Rate Information included in this object may be superseded by updated
        information supplied by the LFI, which will be recorded on the Consent record at Consent Manager.


        This object provides for domestic, non-Riyal transactions, where both accounts are held by LFIs in Qatar. This
        object **is not** intended to support international transactions.
      additionalProperties: false
    Errors.CustomErrorCode1Type:
      type: string
      pattern: ^[A-Za-z]+\.[A-Za-z0-9]+$
      description: A custom error code implemented by the LFI that is not included in the list of prescribed API Hub error codes.
    Errors.Error4001Codes:
      type: string
      enum:
        - Consent.Invalid
        - Consent.BusinessRuleViolation
        - Consent.FailsControlParameters
        - Consent.InvalidUserIdentifier
        - JWS.InvalidSignature
        - JWS.Malformed
        - JWS.InvalidClaim
        - JWS.InvalidHeader
        - JWS.InvalidPayload
        - JWE.DecryptionError
        - JWE.InvalidHeader
        - GenericRecoverableError
        - GenericError
        - Event.UnexpectedEvent
        - Body.InvalidFormat
        - Resource.InvalidFormat
      description: Prescribed error codes for 400 errors.
    Errors.Error4001Types:
      anyOf:
        - $ref: '#/components/schemas/Errors.Error4001Codes'
        - $ref: '#/components/schemas/Errors.CustomErrorCode1Type'
    Errors.Error400ResponseBody1Properties:
      type: object
      required:
        - Errors
      properties:
        Errors:
          type: array
          items:
            type: object
            properties:
              Code:
                $ref: '#/components/schemas/Errors.Error4001Types'
              Message:
                type: string
                minLength: 1
                maxLength: 500
                description: >-
                  A description of the error that occurred. e.g., 'A mandatory field isn't supplied' or
                  'RequestedExecutionDateTime must be in future'

                  UAEOF doesn't standardise this field
              Path:
                type: string
                minLength: 1
                maxLength: 500
                description: >-
                  Recommended but optional reference to the JSON Path of the field with error, e.g.,
                  $.Data.Initiation.InstructedAmount.Currency
              Url:
                type: string
                minLength: 1
                maxLength: 1024
                description: URL to help remediate the problem, or provide more information, or to API Reference, or help etc
            required:
              - Code
              - Message
            additionalProperties: false
          minItems: 1
          description: List of one-or-more errors.
      description: An array of detail error codes, and messages, and URLs to documentation to help remediation.
      additionalProperties: false
    Errors.Error400ResponseBodySigned1Properties:
      type: object
      required:
        - iss
        - exp
        - nbf
        - message
      properties:
        iss:
          type: string
          minLength: 1
          maxLength: 2048
          description: '[https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1](https://www.rfc-editor.org/rfc/rfc7519#section-4.1.1)'
        exp:
          type: integer
          format: unixtime
