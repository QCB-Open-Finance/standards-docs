          $ref: '#/components/schemas/UserRef'
          description: >-
            The user account that created the record. Present only where a person was at the other end of the request —
            that is, where `createdByChannel` is `ui`. Absent for `api`, which authenticates an organisation and no
            person, and absent for `system` and `dataload`, which have no caller at all. Its absence is information
            rather than a gap.
          examples:
            - id: e04a2b78-6c1d-4f93-a5e8-7b2f9d0c3a61
              fullName: Amara Okafor
        createdByChannel:
          $ref: '#/components/schemas/Channel'
          description: >-
            How the record was created. Read from the access token, never from the request body: `ui` where the token
            carries the `trust-framework-ui` scope, `api` otherwise. Send this field and it is ignored. `system` and
            `dataload` both cover records written with no caller — a time-based transition or a cascade for the first, a
            bulk import for the second — so both take their organisation from elsewhere, as the creating-organisation
            field beside this one describes, and neither ever carries a user.
          examples:
            - api
        createdAt:
          type: string
          format: date-time
          description: >-
            When the Trust Framework created this record. System-owned — set by the platform at write time and never
            supplied by a caller.
          examples:
            - '2026-03-14T09:12:44+00:00'
        lastUpdatedAt:
          type: string
          format: date-time
          description: >-
            When the Trust Framework last changed this record. System-owned — equal to `createdAt` until something
            changes it, and never supplied by a caller.
          examples:
            - '2026-08-02T16:41:07+00:00'
        lastUpdatedByOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organisation the last change is attributed to, by the same three routes as the creating organisation and
            told apart the same way by `lastUpdatedByChannel`. Equal to the creating organisation until something
            changes the record.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        lastUpdatedByUser:
          $ref: '#/components/schemas/UserRef'
          description: >-
            The user account that last changed the record. Present only where `lastUpdatedByChannel` is `ui`; absent for
            a machine caller, for a change the platform made itself, and for a bulk load.
          examples:
            - id: e04a2b78-6c1d-4f93-a5e8-7b2f9d0c3a61
              fullName: Amara Okafor
        lastUpdatedByChannel:
          $ref: '#/components/schemas/Channel'
          description: >-
            How the record was last changed. Read from the access token the same way as `createdByChannel` — `ui` where
            it carries `trust-framework-ui`, `api` otherwise — and never from the request body. `system` is the value
            for a time-based transition or a cascade, which is how an expiry is told apart from someone revoking by
            hand, and `dataload` for a change made by a bulk import rather than by a request.
          examples:
            - api
      required:
        - id
        - organization
        - user
        - profile
        - status
        - effectiveStatus
        - createdByOrganization
        - createdByChannel
        - createdAt
        - lastUpdatedAt
        - lastUpdatedByOrganization
        - lastUpdatedByChannel
      additionalProperties: false
    JwksOwnerPermissionWrite:
      title: JwksOwnerPermissionWrite
      description: >-
        A `JwksOwnerPermission` as a caller supplies it. Identical to `JwksOwnerPermission` except that references are
        bare identifiers: a caller sends the id it holds, not a label it does not own.
      type: object
      properties:
        ownerType:
          type: string
          enum:
            - Organization
            - SoftwareStatement
            - Resource
          description: The kind of holder this permission governs, from the same vocabulary as `Jwks.ownerType`.
          examples:
            - Resource
        permittedEcosystemRoles:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: >-
            An organization must hold at least one of these roles before a key store of this kind may be created.
            Checked against the organization in every case, including the two where the store hangs off something else:
            a software statement and a resource each belong to an organization, and it is that organization's
            entitlement that is being tested.
      required:
        - ownerType
        - permittedEcosystemRoles
      additionalProperties: false
    LegalIdentifierWrite:
      title: LegalIdentifierWrite
      description: >-
        A `LegalIdentifier` as a caller supplies it. Identical to `LegalIdentifier` except that references are bare
        identifiers: a caller sends the id it holds, not a label it does not own.
      type: object
      properties:
        legalIdentifier:
          type: string
          description: The identifier value as issued.
          examples:
            - GB-COH-09876543
        issuingOrganization:
          type: string
          format: uuid
          description: >-
            The organization that issued the identifier — a companies registry, a tax authority, a regulator. Every
            issuing body is itself a record in the Trust Framework, so this is a reference rather than a name in a
            string.
          examples:
            - 1a7d3e90-b2c4-4f16-8a55-9c0e2d4f6b81
        country:
          type: string
          description: ISO 3166-1 alpha-2 country of issue.
          pattern: ^[A-Z]{2}$
          examples:
            - GB
        type:
          type: string
          description: >-
            The kind of identifier this is. Must be one of the values `OrganizationConfig.legalIdentifierTypes` lists
            for an organization, or `PersonConfig.legalIdentifierTypes` for a person.
          examples:
            - CompanyNumber
      required:
        - legalIdentifier
        - issuingOrganization
        - country
        - type
      additionalProperties: false
    BrandRef:
      title: BrandRef
      description: A reference to a `Brand` — its identifier and enough to recognise it without a second call.
      type: object
      properties:
        id:
          type: string
          format: uuid
          examples:
            - 7d41e9b6-0c53-4a28-9e71-3f8b2a6c0d94
          description: The `Brand` this refers to. Follow it to read the whole record.
        brandName:
          type: string
          description: >-
            The brand as a consumer knows it, and what a selection screen shows. Unique among the active brands of one
            organization.
          examples:
            - Example Bank Everyday
      required:
        - id
        - brandName
      additionalProperties: false
    ConfigurationRef:
      title: ConfigurationRef
      description: A reference to a `Configuration` — its identifier and enough to recognise it without a second call.
      type: object
      properties:
        id:
          type: string
          format: uuid
          examples:
            - 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
          description: The `Configuration` this refers to. Follow it to read the whole record.
        version:
          type: string
          description: >-
            The version as the ecosystem names it: conventionally the year and month its rules take effect, with a
            revision suffix where one is needed.
          pattern: ^[0-9]{4}\.[0-9]{2}(\.[0-9]+)?$
          examples:
            - '2026.09'
      required:
        - id
        - version
      additionalProperties: false
    EcosystemRoleRef:
      title: EcosystemRoleRef
      description: A reference to an `EcosystemRole` — its identifier and enough to recognise it without a second call.
      type: object
      properties:
        id:
          type: string
          format: uuid
          examples:
            - 2f7b9c14-8a03-4e56-b7d1-4c9e0a2f6b85
          description: The `EcosystemRole` this refers to. Follow it to read the whole record.
        roleName:
          type: string
          description: >-
            The role as the ecosystem names it — a regulatory classification like `PISP` or `ASPSP`, or an
            access-control name like `Admin`.
          examples:
            - PISP
      required:
        - id
        - roleName
      additionalProperties: false
    EntitlementConfigRef:
      title: EntitlementConfigRef
      description: A reference to an `EntitlementConfig` — its identifier and enough to recognise it without a second call.
      type: object
      properties:
        id:
          type: string
          format: uuid
          examples:
            - d13f7a58-6b04-4c92-8e71-3a9c5f2e0b46
          description: The `EntitlementConfig` this refers to. Follow it to read the whole record.
        entitlementTypeName:
          type: string
          description: The type as the issuing regime names it.
          examples:
            - AIS
      required:
        - id
        - entitlementTypeName
      additionalProperties: false
    JwkRef:
      title: JwkRef
      description: A reference to a `Jwk` — its identifier and enough to recognise it without a second call.
      type: object
      properties:
        kid:
          type: string
          description: >-
            The RFC 7517 key identifier, and this record's own identifier. It appears in every JWS header the ecosystem
            exchanges.
          examples:
            - kid-as-transport-2026-01
      required:
        - kid
      additionalProperties: false
    JwksRef:
      title: JwksRef
      description: A reference to a `Jwks` — its identifier and enough to recognise it without a second call.
      type: object
      properties:
        id:
          type: string
          format: uuid
          examples:
            - 5f9c3a72-1e48-4b06-8d95-2c7e0b4a6f31
          description: The `Jwks` this refers to. Follow it to read the whole record.
        discoveryUri:
          type: string
          format: uri
          description: >-
            Where this key store is published for relying parties to fetch, as an RFC 7517 JWKS document. Set by
            `createJwks`; not accepted in any request body.
          examples:
            - https://directory.example.org/jwks/8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
      required:
        - id
        - discoveryUri
      additionalProperties: false
    OrganizationRef:
      title: OrganizationRef
      description: A reference to an `Organization` — its identifier and enough to recognise it without a second call.
      type: object
      properties:
        id:
          type: string
          format: uuid
          examples:
            - 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
          description: The `Organization` this refers to. Follow it to read the whole record.
        organizationName:
          type: string
          description: >-
            The organization's name, as it is known in this ecosystem and as it appears wherever another record refers
            to it. Unique across the Trust Framework.
          minLength: 2
          examples:
            - Example Bank plc
      required:
        - id
        - organizationName
      additionalProperties: false
    PersonRef:
      title: PersonRef
      description: A reference to a `Person` — its identifier and enough to recognise it without a second call.
      type: object
      properties:
        id:
          type: string
          format: uuid
          examples:
            - 5d9e7f31-2a4b-4c68-b0f7-8e1c6a3d9b52
          description: The `Person` this refers to. Follow it to read the whole record.
        displayName:
          type: string
          description: >-
            The person's name as one string, for showing them in a list. Derived from `name`, so it changes when the
            name does and is never set directly. Maintained by the platform; not accepted in any request body.
          examples:
            - Alex Whittaker
      required:
        - id
        - displayName
      additionalProperties: false
    ProfileRef:
      title: ProfileRef
      description: A reference to a `Profile` — its identifier and enough to recognise it without a second call.
      type: object
      properties:
        id:
          type: string
          format: uuid
          examples:
            - 6b91d4c0-3e57-42a8-9f16-8d0a2c7e5b39
          description: The `Profile` this refers to. Follow it to read the whole record.
        profileName:
          type: string
          description: >-
            The access level as the ecosystem names it — `EcosystemOperator`, `EcosystemParticipant`,
            `EcosystemAdministrator`.
          examples:
            - EcosystemParticipant
      required:
        - id
        - profileName
      additionalProperties: false
    ResourceRef:
      title: ResourceRef
      description: A reference to a `Resource` — its identifier and enough to recognise it without a second call.
      type: object
      properties:
        id:
          type: string
          format: uuid
          examples:
            - 3e7a1d86-5c04-4b93-8f26-1a9d0c5e7b34
          description: The `Resource` this refers to. Follow it to read the whole record.
        name:
          type: string
          description: The resource as the operator names it, shown wherever participants are listed.
          examples:
            - Example Bank Production AS
      required:
        - id
        - name
      additionalProperties: false
    ResourceCertificationConfigRef:
      title: ResourceCertificationConfigRef
      description: >-
        A reference to a `ResourceCertificationConfig` — its identifier and enough to recognise it without a second
        call.
      type: object
      properties:
        id:
          type: string
          format: uuid
          examples:
            - 2c8e5f41-7b30-4d96-a1e7-5f0b3c9d6a28
          description: The `ResourceCertificationConfig` this refers to. Follow it to read the whole record.
        certificationTypeName:
          type: string
          description: >-
            The standard as the certifying body names it. Copied onto every `ResourceCertification` recorded against
            this config, so a record says what it is without resolving back here.
          examples:
            - FAPI 2.0 Advanced
      required:
        - id
        - certificationTypeName
      additionalProperties: false
    SoftwareStatementRef:
      title: SoftwareStatementRef
      description: A reference to a `SoftwareStatement` — its identifier and enough to recognise it without a second call.
      type: object
      properties:
        id:
          type: string
          format: uuid
          examples:
            - 4a9d2f68-5c31-4e07-b8a2-1f6c0e3d9b54
          description: The `SoftwareStatement` this refers to. Follow it to read the whole record.
        name:
          type: string
          description: The application as its operator names it, shown to users at consent time.
          examples:
            - Example Budgeting App
      required:
        - id
        - name
      additionalProperties: false
    UserRef:
      title: UserRef
      description: A reference to a `User` — its identifier and enough to recognise it without a second call.
      type: object
      properties:
        id:
          type: string
          format: uuid
          examples:
            - e04a2b78-6c1d-4f93-a5e8-7b2f9d0c3a61
          description: The `User` this refers to. Follow it to read the whole record.
        fullName:
          type: string
          description: Display name for the account, shown wherever the account appears or is credited with a change.
          examples:
            - Amara Okafor
      required:
        - id
        - fullName
      additionalProperties: false
    AssignmentNew:
      title: AssignmentNew
      description: >-
        The fields a caller supplies when creating an `Assignment`.<br/><br/>The assignment of a person to an
        organization in one designation — an officer, an authorized representative, a technical contact — with the dates
        it runs between. A person holding two designations at one organization has two assignments.
      type: object
      properties:
        person:
          type: string
          format: uuid
          description: The person being assigned. Carried in the body rather than the path.
          examples:
            - 5d9e7f31-2a4b-4c68-b0f7-8e1c6a3d9b52
        designation:
          type: string
          description: >-
            What the person is assigned as — an officer, an authorized representative, a technical contact. One
            designation per assignment, and the value must be one `AssignmentConfig.designations` lists.
          examples:
            - Officer
        profile:
          type: string
          format: uuid
          description: >-
            The assignee's access level in the Trust Framework. It must resolve to a subset of the roles the assigning
            organization's own profile resolves to: a person cannot hold more Trust Framework power than the
            organization they act for.
          examples:
            - 6b91d4c0-3e57-42a8-9f16-8d0a2c7e5b39
      required:
        - person
        - designation
        - profile
      additionalProperties: false
    AssignmentPatch:
      title: AssignmentPatch
      description: >-
        The fields a caller may change on an `Assignment`.<br/><br/>The assignment of a person to an organization in one
        designation — an officer, an authorized representative, a technical contact — with the dates it runs between. A
        person holding two designations at one organization has two assignments.
      type: object
      properties:
        profile:
          type: string
          format: uuid
          description: >-
            The assignee's access level in the Trust Framework. It must resolve to a subset of the roles the assigning
            organization's own profile resolves to: a person cannot hold more Trust Framework power than the
            organization they act for.
          examples:
            - 6b91d4c0-3e57-42a8-9f16-8d0a2c7e5b39
      minProperties: 1
      additionalProperties: false
    AssignmentConfigNew:
      title: AssignmentConfigNew
      description: >-
        The fields a caller supplies when creating an `AssignmentConfig`.<br/><br/>The ecosystem's settings for
        assignments — what a person may be assigned as, and the reasons an assignment may end. One record per
        configuration version.
      type: object
      properties:
        configuration:
          type: string
          format: uuid
          description: >-
            The configuration version this record belongs to. Every configuration record in one version references it,
            and exactly one version is active at a time.
          examples:
            - 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
        designations:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            What a person may be assigned as — an officer, an authorized representative, a technical contact.
            `Assignment.designation` must be one of these.
          examples:
            - - Officer
              - AuthorizedRepresentative
              - TechnicalContact
              - MoneyLaunderingReportingOfficer
        deactivationReasons:
          type: array
          items:
            type: string
          minItems: 1
          description: The reasons an assignment may end. `Assignment.deactivationReason` must be one of these.
          examples:
            - - Resigned
              - Removed
              - TermExpired
              - OrganizationDeactivated
      required:
        - configuration
        - designations
        - deactivationReasons
      additionalProperties: false
    AuthorityNew:
      title: AuthorityNew
      description: >-
        The fields a caller supplies when creating an `Authority`.<br/><br/>The record that marks an organization as an
        accrediting authority — a body that may issue entitlements to participants. An organization either holds one of
        these or does not.
      type: object
      properties:
        jurisdictionScope:
          $ref: '#/components/schemas/JurisdictionScope'
          description: >-
            Whether this authority may accredit anywhere, or only within named jurisdictions. `Global` has no
            territorial limit; `Limited` confines it to the jurisdictions listed below. Every entitlement it issues is
            bounded by this.
          examples:
            - Limited
        jurisdictions:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            The jurisdictions this authority may accredit within. Required when `jurisdictionScope` is `Limited` and
            absent when it is `Global`. Each value must be one `JurisdictionConfig.jurisdictions` lists.
          examples:
            - - GB
              - IE
      required:
        - jurisdictionScope
      additionalProperties: false
    BrandNew:
      title: BrandNew
      description: >-
        The fields a caller supplies when creating a `Brand`.<br/><br/>A customer-facing identity an organization trades
        under — the name and logo a consumer recognizes and chooses between. One organization may operate several, and a
        brand is not a legal entity: it has no identifiers of its own and holds no entitlements.
      type: object
      properties:
        brandName:
          type: string
          description: >-
            The brand as a consumer knows it, and what a selection screen shows. Unique among the active brands of one
            organization.
          examples:
            - Example Bank Everyday
        logoUri:
          type: string
          format: uri
          description: >-
            Where the brand's logo is published, for a consumer-facing selection screen. Absent where the ecosystem does
            not collect one.
          examples:
            - https://assets.example-bank.co.uk/everyday/logo.svg
        websiteUri:
          type: string
          format: uri
          description: The brand's own public website, where it has one distinct from its operator's.
          examples:
            - https://everyday.example-bank.co.uk
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Ecosystem-specific attributes of the brand. What may appear here is fixed by
            `BrandConfig.supplementaryInformationSchema`.
      required:
        - brandName
      additionalProperties: false
    BrandConfigNew:
      title: BrandConfigNew
      description: >-
        The fields a caller supplies when creating a `BrandConfig`.<br/><br/>The ecosystem's settings for brands — what
        may be recorded on one, which kinds of record may be associated with a brand and how many each may name, and the
        reasons a brand may be withdrawn. One record per configuration version.
      type: object
      properties:
        configuration:
          type: string
          format: uuid
          description: >-
            The configuration version this record belongs to. Every configuration record in one version references it,
            and exactly one version is active at a time.
          examples:
            - 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
        brandAssociations:
          type: array
          items:
            $ref: '#/components/schemas/BrandAssociation'
          minItems: 1
          description: >-
            Which kinds of record may name a brand, and how many each may name. One entry per kind, and every kind the
            ecosystem recognizes must have one — saying a kind may not be associated is the cardinality `0..0`, not an
            omission.
        deactivationReasons:
          type: array
          items:
            type: string
          minItems: 1
          description: The reasons a brand may be withdrawn. `Brand.deactivationReason` must be one of these.
          examples:
            - - Rebranded
              - Discontinued
              - MergedIntoAnother
              - SoldToAnotherOrganisation
        supplementaryInformationSchema:
          type: object
          additionalProperties: true
          description: The JSON Schema that `Brand.supplementaryInformation` is validated against.
      required:
        - configuration
        - brandAssociations
        - deactivationReasons
      additionalProperties: false
    CaConfigurationNew:
      title: CaConfigurationNew
      description: >-
        The fields a caller supplies when creating a `CaConfiguration`.<br/><br/>The record that makes an organization a
        certificate authority in this ecosystem — what it may issue, under which chains, and whether it publishes
        revocation information. An organization either holds one of these or does not.
      type: object
      properties:
        name:
          type: string
          description: The CA as it identifies itself in the certificates it issues.
          examples:
            - Example Ecosystem CA
        permittedChains:
          type: array
          items:
            type: string
          minItems: 1
          description: Root and intermediate chains this CA is allowed to issue under, as the ecosystem approved them.
        ocspEnabled:
          type: boolean
          description: Whether this CA publishes OCSP responses for the certificates it issues.
          examples:
            - true
        crlEnabled:
          type: boolean
          description: Whether this CA publishes a certificate revocation list.
          examples:
            - true
        issuesTransport:
          type: boolean
          description: Whether this CA is permitted to issue transport (mTLS) certificates.
          examples:
            - true
        issuesSigning:
          type: boolean
          description: Whether this CA is permitted to issue signing (JWS) certificates.
          examples:
            - true
        issuesEncryption:
          type: boolean
          description: Whether this CA is permitted to issue encryption (JWE) certificates.
          examples:
            - false
        mandatoryTransportCerts:
          type: boolean
          description: >-
            Whether this certificate authority requires a transport certificate from every organization it serves. This
            is one issuer's terms for its own subscribers, not ecosystem-wide policy.
          examples:
            - true
      required:
        - name
        - permittedChains
        - ocspEnabled
        - crlEnabled
        - issuesTransport
        - issuesSigning
        - issuesEncryption
        - mandatoryTransportCerts
      additionalProperties: false
    CertificateNew:
      title: CertificateNew
      description: >-
        The fields a caller supplies when creating a `Certificate`.<br/><br/>An X.509 certificate the Trust Framework
        holds for an organization, bound to the key it attests to. The Trust Framework mirrors the certificate's own
        validity window and keeps its own state alongside it.
      type: object
      properties:
        kid:
          type: string
          description: The key this certificate attests to, by its RFC 7517 `kid`.
          examples:
            - kid-as-transport-2026-01
        keyStore:
          type: string
          format: uuid
          description: >-
            The key store this certificate's key is published into. Supplied on upload and not kept: a key store is not
            a property of a certificate.
          examples:
            - 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
        certificateType:
          type: string
          enum:
            - Transport
            - Signing
            - Encryption
          description: What the certificate is used for — mTLS, JWS or JWE.
          examples:
            - Transport
        x5c:
          type: array
          items:
            type: string
          description: The certificate chain embedded, base64-encoded. One of `x5c` or `x5u` is required.
        x5u:
          type: string
          format: uri
          description: URL the certificate chain resolves from. One of `x5c` or `x5u` is required.
          examples:
            - https://directory.example.org/chains/0A3F22B79104.pem
      required:
        - kid
        - keyStore
        - certificateType
        - x5c
      additionalProperties: false
    CertificatePatch:
      title: CertificatePatch
      description: >-
        The fields a caller may change on a `Certificate`.<br/><br/>An X.509 certificate the Trust Framework holds for
        an organization, bound to the key it attests to. The Trust Framework mirrors the certificate's own validity
        window and keeps its own state alongside it.
      type: object
      properties:
        x5u:
          type: string
          format: uri
          description: URL the certificate chain resolves from. One of `x5c` or `x5u` is required.
          examples:
            - https://directory.example.org/chains/0A3F22B79104.pem
      minProperties: 1
      additionalProperties: false
    ConfigurationNew:
      title: ConfigurationNew
      description: >-
        The fields a caller supplies when creating a `Configuration`.<br/><br/>One version of the ecosystem's
        configuration — the role catalogue, the recognized identifier types, the key policies and everything else an
        ecosystem sets for itself. Exactly one version is active at a time, and every configuration record names the
        version it belongs to.
      type: object
      properties:
        version:
          type: string
          description: >-
            The version as the ecosystem names it: conventionally the year and month its rules take effect, with a
            revision suffix where one is needed.
          pattern: ^[0-9]{4}\.[0-9]{2}(\.[0-9]+)?$
          examples:
            - '2026.09'
        description:
          type: string
          description: >-
            What this version changes and why, in the words of whoever built it. This is what a reviewer reads before
            the version is made active.
          minLength: 10
          examples:
            - Adds the Payments Initiation role set agreed at the September forum.
        clonedFrom:
          type: string
          format: uuid
          description: >-
            The version this one was created from. Supplying it on create copies every config record of that version
            into this one, so a new version starts as a complete, editable copy of the live rules rather than as an
            empty set somebody has to refill by hand. Absent only on the first version, which had nothing to clone.
          examples:
            - c2d61a84-7f39-4e50-b6a1-9e3c5d0f7b28
      required:
        - version
        - description
      additionalProperties: false
    ConfigurationPatch:
      title: ConfigurationPatch
      description: >-
        The fields a caller may change on a `Configuration`.<br/><br/>One version of the ecosystem's configuration — the
        role catalogue, the recognized identifier types, the key policies and everything else an ecosystem sets for
        itself. Exactly one version is active at a time, and every configuration record names the version it belongs to.
      type: object
      properties:
        description:
          type: string
          description: >-
            What this version changes and why, in the words of whoever built it. This is what a reviewer reads before
            the version is made active.
          minLength: 10
          examples:
            - Adds the Payments Initiation role set agreed at the September forum.
      minProperties: 1
      additionalProperties: false
    EcosystemRoleNew:
      title: EcosystemRoleNew
      description: >-
        The fields a caller supplies when creating an `EcosystemRole`.<br/><br/>A ecosystem classification an
        organization holds — AISP, PISP, ASPSP. Holding one is what lets an organization and its applications act in
        that capacity. Roles are conferred by entitlements, never assigned directly.
      type: object
      properties:
        roleName:
          type: string
          description: >-
            The role as the ecosystem names it — a regulatory classification like `PISP` or `ASPSP`, or an
            access-control name like `Admin`.
          examples:
            - PISP
        description:
          type: string
          description: What holding this role permits, in the ecosystem's own words.
          examples:
            - Payment Initiation Service Provider, as defined by the scheme rulebook.
        ecosystemScopes:
          type: array
          items:
            type: string
          description: >-
            The OAuth scopes an application activating this role may request **of other participants** — not of the
            Trust Framework. Plain strings, because the market standard owns this vocabulary and the Trust Framework
            only records it. Empty for a classification that confers no API surface of its own.
          examples:
            - - accounts
              - payments
        permittedAuthorizationDetailsTypes:
          type: array
          items:
            type: string
          description: >-
            The RFC 9396 `authorization_details` types an application activating this role may request. This is how FAPI
            2.0 expresses fine-grained consent, and it is the vocabulary a modern ecosystem actually constrains — scopes
            say which API, these say what within it.
          examples:
            - - payment_initiation
              - account_information
        permittedGrantTypes:
          type: array
          items:
            type: string
          description: The OAuth entitlement types an application activating this role may use when calling other participants.
          examples:
            - - authorization_code
              - client_credentials
      required:
        - roleName
      additionalProperties: false
    EntitlementNew:
      title: EntitlementNew
      description: >-
        The fields a caller supplies when creating an `Entitlement`.<br/><br/>A license, certification or authorization
        an organization holds, as granted by an accrediting authority. Holding one is what confers the ecosystem roles
        the organization may act under.
      type: object
      properties:
        entitlementConfig:
          type: string
          format: uuid
          description: The type this entitlement is an instance of, and whose issuer rules govern it.
          examples:
            - d13f7a58-6b04-4c92-8e71-3a9c5f2e0b46
        entitlementType:
          $ref: '#/components/schemas/EntitlementType'
          description: >-
            Which kind of entitlement this is — a license, a certification, an authorization, or a delegation of an
            authority's power to issue. Recorded on the entitlement itself, so it still says what it was if the
            entitlement type is changed later.
          examples:
            - License
        entitlementName:
          type: string
          description: The entitlement as named on the paperwork, which may differ from the type name.
          examples:
            - Data Provider License (Retail Banking)
        entitlementNumber:
          type: string
          description: >-
            The issuing regime's own reference for the entitlement. Supplied by the participant; the Trust Framework
            neither generates nor validates it.
          examples:
            - FCA-DP-2026-004417
        issuingAuthority:
          type: string
          format: uuid
          description: >-
            The authority that issued the entitlement. What the entitlement confers is fixed by the entitlement type it
            was issued against, not chosen at issuance.
          examples:
            - 6e1d8b45-3f92-4a07-bc58-9d0f2a6e4b13
        effectiveEcosystemRoles:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: >-
            The ecosystem roles this entitlement confers. Recorded on the entitlement itself, so it still says what it
            conferred after the entitlement type changes. An organization's roles are the union of these across its
            active entitlements — there is no separate assignment record.
        effectiveProfiles:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: >-
            The Trust Framework access levels this entitlement confers. A `TrustFrameworkClient` belonging to this
            organization may name any profile the union of its in-service entitlements confers, and none that none of
            them confers. Recorded on the entitlement itself, so it still says what it conferred after the entitlement
            type changes.
        jurisdictionScope:
          $ref: '#/components/schemas/JurisdictionScope'
          description: >-
            Whether this entitlement is good anywhere, or only within the jurisdictions listed below. It cannot reach
            further than the issuing authority's own remit: an authority limited to named jurisdictions cannot make a
            global entitlement.
          examples:
            - Limited
        jurisdictions:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            The jurisdictions this entitlement is good in. Required when `jurisdictionScope` is `Limited` and absent
            when it is `Global`, and every value must be one the issuing authority is itself permitted to accredit
            within. Recorded on the entitlement, so it still says where it reached after the authority's own remit
            changes.
          examples:
            - - GB
        issueDate:
          type: string
          format: date
          description: >-
            The date the issuing authority granted the entitlement, as stated on the paperwork. Supplied by the
            participant or the authority; not stamped by the Trust Framework.
          examples:
            - '2026-04-01'
        expiryDate:
          type: string
          format: date
          description: The date the entitlement lapses, as the issuing authority set it. Absent means it runs until it is revoked.
          examples:
            - '2029-03-31'
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Ecosystem-specific attributes of the entitlement, such as geographic scope or product limitations. What may
            appear here is fixed by `EntitlementConfig.supplementaryInformationSchema`.
      required:
        - entitlementConfig
        - entitlementType
        - entitlementName
        - issuingAuthority
        - effectiveEcosystemRoles
        - effectiveProfiles
        - jurisdictionScope
        - issueDate
      additionalProperties: false
    EntitlementPatch:
      title: EntitlementPatch
      description: >-
        The fields a caller may change on an `Entitlement`.<br/><br/>A license, certification or authorization an
        organization holds, as granted by an accrediting authority. Holding one is what confers the ecosystem roles the
        organization may act under.
      type: object
      properties:
        entitlementName:
          type: string
          description: The entitlement as named on the paperwork, which may differ from the type name.
          examples:
            - Data Provider License (Retail Banking)
        entitlementNumber:
          type: string
          description: >-
            The issuing regime's own reference for the entitlement. Supplied by the participant; the Trust Framework
            neither generates nor validates it.
          examples:
            - FCA-DP-2026-004417
        expiryDate:
          type: string
          format: date
          description: The date the entitlement lapses, as the issuing authority set it. Absent means it runs until it is revoked.
          examples:
            - '2029-03-31'
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Ecosystem-specific attributes of the entitlement, such as geographic scope or product limitations. What may
            appear here is fixed by `EntitlementConfig.supplementaryInformationSchema`.
      minProperties: 1
      additionalProperties: false
    EntitlementConfigNew:
      title: EntitlementConfigNew
      description: >-
        The fields a caller supplies when creating an `EntitlementConfig`.<br/><br/>One kind of entitlement the
        ecosystem recognizes — what it is called, which authority issues it, and which ecosystem roles it confers. Every
        entitlement is issued against one of these.
      type: object
      properties:
        configuration:
          type: string
          format: uuid
          description: >-
            The configuration version this record belongs to. Every configuration record in one version references it,
            and exactly one version is active at a time.
          examples:
            - 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
        entitlementTypeName:
          type: string
          description: The type as the issuing regime names it.
          examples:
            - AIS
        entitlementType:
          $ref: '#/components/schemas/EntitlementType'
          description: >-
            Which kind of grant this type produces. Copied onto every `Entitlement` issued against this config, so a
            grant says what it is without resolving back here.
          examples:
            - License
        delegatedTo:
          type: string
          format: uuid
          description: >-
            The ecosystem role a caller must hold to issue an entitlement of this type **on the authority's behalf**.
            Absent where only the authority itself may issue. The delegation is itself an entitlement, of
            `entitlementType` `Delegated`, conferring the role named here.
          examples:
            - 8d5f3a92-7c16-4e40-b283-1f9a6c0e5d78
        issuingAuthority:
          type: string
          format: uuid
          description: >-
            The authority on whose behalf entitlements of this type are issued. Copied onto every entitlement issued
            against this config.
          examples:
            - 6e1d8b45-3f92-4a07-bc58-9d0f2a6e4b13
        effectiveEcosystemRoles:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: >-
            The ecosystem roles an entitlement of this type confers. Not a default that issuance may override — it is
            what the grant gives, and it is copied onto every entitlement issued against this config.
        effectiveProfiles:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: >-
            The Trust Framework access levels an entitlement of this type confers on the organization holding it. A
            `TrustFrameworkClient` may name any of these and none that is not here, so this is what decides how much of
            the Trust Framework API a participant can reach by virtue of what it is licensed to do.
        supplementaryInformationSchema:
          type: object
          additionalProperties: true
          description: The JSON Schema that `Entitlement.supplementaryInformation` is validated against.
      required:
        - configuration
        - entitlementTypeName
        - entitlementType
        - issuingAuthority
        - effectiveEcosystemRoles
        - effectiveProfiles
      additionalProperties: false
    EntitlementConfigPatch:
      title: EntitlementConfigPatch
      description: >-
        The fields a caller may change on an `EntitlementConfig`.<br/><br/>One kind of entitlement the ecosystem
        recognizes — what it is called, which authority issues it, and which ecosystem roles it confers. Every
        entitlement is issued against one of these.<br/><br/>**`effectiveEcosystemRoles`, `effectiveProfiles` are lists
        and they are replaced in full.** Sending one of them sets the field to exactly the members in your request;
        members the record holds and your request omits are removed.
      type: object
      properties:
        entitlementTypeName:
          type: string
          description: The type as the issuing regime names it.
          examples:
            - AIS
        entitlementType:
          $ref: '#/components/schemas/EntitlementType'
          description: >-
            Which kind of grant this type produces. Copied onto every `Entitlement` issued against this config, so a
            grant says what it is without resolving back here.
          examples:
            - License
        delegatedTo:
          type: string
          format: uuid
          description: >-
            The ecosystem role a caller must hold to issue an entitlement of this type **on the authority's behalf**.
            Absent where only the authority itself may issue. The delegation is itself an entitlement, of
            `entitlementType` `Delegated`, conferring the role named here.
          examples:
            - 8d5f3a92-7c16-4e40-b283-1f9a6c0e5d78
        issuingAuthority:
          type: string
          format: uuid
          description: >-
            The authority on whose behalf entitlements of this type are issued. Copied onto every entitlement issued
            against this config.
          examples:
            - 6e1d8b45-3f92-4a07-bc58-9d0f2a6e4b13
        effectiveEcosystemRoles:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: >-
            The ecosystem roles an entitlement of this type confers. Not a default that issuance may override — it is
            what the grant gives, and it is copied onto every entitlement issued against this config.<br/><br/>This is a
            list, and sending it **replaces the whole list**. The members you send become the entire value of the field:
            anything the record holds and your request omits is removed, not kept. To add or remove one member, read the
            record, change the list you were given, and send all of it back.
        effectiveProfiles:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: >-
            The Trust Framework access levels an entitlement of this type confers on the organization holding it. A
            `TrustFrameworkClient` may name any of these and none that is not here, so this is what decides how much of
            the Trust Framework API a participant can reach by virtue of what it is licensed to do.<br/><br/>This is a
            list, and sending it **replaces the whole list**. The members you send become the entire value of the field:
            anything the record holds and your request omits is removed, not kept. To add or remove one member, read the
            record, change the list you were given, and send all of it back.
        supplementaryInformationSchema:
          type: object
          additionalProperties: true
          description: The JSON Schema that `Entitlement.supplementaryInformation` is validated against.
      minProperties: 1
      additionalProperties: false
    JurisdictionConfigNew:
      title: JurisdictionConfigNew
      description: >-
        The fields a caller supplies when creating a `JurisdictionConfig`.<br/><br/>The jurisdictions this ecosystem
        recognizes. Every territorial limit you can set — on an entitlement, a resource or a software statement — is
        chosen from this list. One record per configuration version.
      type: object
      properties:
        configuration:
          type: string
          format: uuid
          description: >-
            The configuration version this record belongs to. Every configuration record in one version references it,
            and exactly one version is active at a time.
          examples:
            - 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
        jurisdictions:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            The jurisdictions this ecosystem recognizes. `Authority.jurisdictions`, `Entitlement.jurisdictions` and
            `Resource.jurisdictions` must each draw their values from this list.
          examples:
            - - GB
              - IE
              - EU
      required:
        - configuration
        - jurisdictions
      additionalProperties: false
    JwkNew:
      title: JwkNew
      description: >-
        The fields a caller supplies when creating a `Jwk`.<br/><br/>One key inside a key store, identified by its RFC
        7517 `kid`. What the key may be used for, which algorithms it may declare and whether it must carry a
        certificate chain are all fixed by the ecosystem's policy for its key type.
      type: object
      properties:
        kid:
          type: string
          description: >-
            The RFC 7517 key identifier, and this record's own identifier. It appears in every JWS header the ecosystem
            exchanges.
          examples:
            - kid-as-transport-2026-01
        keyType:
          $ref: '#/components/schemas/JwkKeyType'
          description: >-
            What the key is used for in the ecosystem's protocols. Selects the `JwkKeyPolicy` that governs this key: a
            type with no policy on the active `JwksConfig` may not be created.
          examples:
            - Transport
        alg:
          type: string
          description: >-
            The RFC 7517 `alg` — the algorithm this key is used with, from the IANA JOSE registry. The permitted values
            are whichever `JwkKeyPolicy.permittedAlgs` lists for this key's type, so a signing key is held to a
            different list than an encryption or a transport key.
          examples:
            - PS256
        algorithmFamily:
          type: string
          enum:
            - RSA
            - EC
          description: >-
            The key's cryptographic family. Determined by `alg` — `PS256` is `RSA`, `ES256` is `EC` — and carried
            explicitly because it is what a relying party filters a published JWKS on.
          examples:
            - EC
        keyUse:
          type: string
          enum:
            - sig
            - enc
          description: The RFC 7517 `use` parameter as published in the JWKS.
          examples:
            - sig
        creationMethod:
          type: string
          enum:
            - CertificateUploaded
            - KeyUploaded
            - Generated
          description: >-
            How the key came to exist. The three routes differ in what the Trust Framework ever held:<br/>-
            `CertificateUploaded` — you supplied an X.509 certificate, and the public key, `alg` and `expiresAt` were
            read out of it.<br/>- `KeyUploaded` — you supplied a bare public key, with no chain. Permitted only where
            the matching `JwkKeyPolicy` has `x5cRequirement` and `x5uRequirement` both `Optional` or
            `Unsupported`.<br/>- `Generated` — you supplied nothing and the Trust Framework generated the pair. **The
            private key is returned in the response to that one call and never stored**, so it cannot be re-fetched; a
            participant that loses it creates a new key and revokes this one. Where the matching policy has
            `selfSignedPermitted`, generation may also mint a self-signed certificate into `x5c`.
          examples:
            - CertificateUploaded
        x5c:
          type: array
          items:
            type: string
          description: >-
            The X.509 certificate chain embedded in the key, base64-encoded per RFC 7517. Whether it is required,
            optional or rejected is fixed by `JwkKeyPolicy.x5cRequirement` for this key's type.
        x5u:
          type: string
          format: uri
          description: >-
            URL the X.509 chain for this key resolves from, where it is not embedded. Governed by `x5uRequirement` on
            the matching `JwkKeyPolicy`.<br/><br/>A participant may **upload** a chain rather than host one, in which
            case the Trust Framework publishes it and sets this field by expanding the `X5u` template on `JwksConfig`.
            Either way the field holds a resolvable URL; what differs is who serves it.
          examples:
            - https://directory.example.org/chains/kid-as-transport-2026-01.pem
        expiresAt:
          type: string
          format: date-time
          description: >-
            When the key ceases to be valid. Read from the certificate where there is one — the `notAfter` of the leaf
            in `x5c`, or of the chain `x5u` resolves to — and supplied by the participant where there is not. Expiry
            does not change `status`: an expired key is still `Active` and simply no longer valid.
          examples:
            - '2027-01-20T00:00:00+00:00'
      required:
        - kid
        - keyType
        - alg
        - algorithmFamily
        - keyUse
        - creationMethod
        - expiresAt
      additionalProperties: false
    JwksNew:
      title: JwksNew
      description: >-
        The fields a caller supplies when creating a `Jwks`.<br/><br/>A key store: the set of keys published for one
        holder, which may be an organization, a resource or a software statement. Relying parties fetch it from the
        discovery URL below.
      type: object
      properties:
        ownerType:
          type: string
          enum:
            - Organization
            - SoftwareStatement
            - Resource
          description: Which kind of holder owns this key store.
          examples:
            - Organization
        ownerId:
          type: string
          format: uuid
          description: The holder that owns this key store, in whichever collection `ownerType` names.
          examples:
            - 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
        brands:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: >-
            The brands this key store is presented under. Every brand named must be one the key store's owning
            organization operates, and must be `Active`. Whether this record may name no brand, exactly one, or several
            is fixed by the `BrandConfig.brandAssociations` entry for `Jwks` — `0..0` there means this field is absent.
      required:
        - ownerType
        - ownerId
      additionalProperties: false
    JwksPatch:
      title: JwksPatch
      description: >-
        The fields a caller may change on a `Jwks`.<br/><br/>A key store: the set of keys published for one holder,
        which may be an organization, a resource or a software statement. Relying parties fetch it from the discovery
        URL below.<br/><br/>**`brands` is a list and it is replaced in full.** Sending it sets the field to exactly the
        members in your request; members the record holds and your request omits are removed.
      type: object
      properties:
        brands:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: >-
            The brands this key store is presented under. Every brand named must be one the key store's owning
            organization operates, and must be `Active`. Whether this record may name no brand, exactly one, or several
            is fixed by the `BrandConfig.brandAssociations` entry for `Jwks` — `0..0` there means this field is
            absent.<br/><br/>This is a list, and sending it **replaces the whole list**. The members you send become the
            entire value of the field: anything the record holds and your request omits is removed, not kept. To add or
            remove one member, read the record, change the list you were given, and send all of it back.
      minProperties: 1
      additionalProperties: false
    JwksConfigNew:
      title: JwksConfigNew
      description: >-
        The fields a caller supplies when creating a `JwksConfig`.<br/><br/>The ecosystem's key policy — who may create
        a key store, where key material is published, and what is permitted for each kind of key. One record per
        configuration version.
      type: object
      properties:
        configuration:
          type: string
          format: uuid
          description: >-
            The configuration version this record belongs to. Every configuration record in one version references it,
            and exactly one version is active at a time.
          examples:
            - 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/JwksOwnerPermissionWrite'
          minItems: 1
          description: >-
            Which ecosystem roles may create a key store, per kind of holder. A holder kind absent from this collection
            may not have one created at all.
        urlTemplates:
          type: array
          items:
            $ref: '#/components/schemas/JwksUrlTemplate'
          minItems: 6
          description: >-
            Where the Trust Framework publishes key material, one row per kind of holder and purpose. Every kind of
            holder needs both a live JWKS URL and a revoked-keys URL, which is why there are at least six; `X5u` rows
            are additional, for holder kinds whose policy permits an uploaded chain.
        keyPolicies:
          type: array
          items:
            $ref: '#/components/schemas/JwkKeyPolicy'
          minItems: 1
          description: >-
            What the ecosystem permits, **per kind of key**. A key type is enabled by having a row here and forbidden by
            not having one. The answers genuinely differ per type: a transport key is an mTLS credential and nearly
            always needs a chain from a recognized CA, while a signing key may legitimately be a bare uploaded key.
        publishWhenNotInService:
          type: boolean
          description: >-
            Whether a key store stays published once it is no longer in service. `true` keeps the JWKS document
            reachable so a relying party can still verify signatures made while the organization was active; `false`
            withdraws the document entirely.
          examples:
            - true
      required:
        - configuration
        - permissions
        - urlTemplates
        - keyPolicies
        - publishWhenNotInService
      additionalProperties: false
    OrganizationNew:
      title: OrganizationNew
      description: >-
        The fields a caller supplies when creating an `Organization`.<br/><br/>A legal entity participating in the
        ecosystem — a bank, a third-party provider, a regulator, a certificate authority. Nearly every other record in
        the Trust Framework hangs off one.
      type: object
      properties:
        organizationName:
          type: string
          description: >-
            The organization's name, as it is known in this ecosystem and as it appears wherever another record refers
            to it. Unique across the Trust Framework.
          minLength: 2
          examples:
            - Example Bank plc
        legalIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/LegalIdentifierWrite'
          minItems: 1
          description: >-
            The organization's legal identifiers. More than one is normal — different jurisdictions, or a tax identifier
            alongside a company number.
        sponsoredBy:
          type: string
          format: uuid
          description: >-
            The organization that sponsored this one into the ecosystem. Never empty — the root organization names
            itself.
          examples:
            - 1a7d3e90-b2c4-4f16-8a55-9c0e2d4f6b81
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Ecosystem-specific attributes of the organization. What may appear here is fixed by
            `OrganizationConfig.supplementaryInformationSchema`. A name or logo the organization trades under is not
            held here: it is a `Brand`, at `/organizations/{orgId}/brands`.
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
          description: >-
            How to reach the organization. Treated as personal data, because it often names and reaches a person:
            withheld from the default representation and served only at the `contacts` sub-resource.
      required:
        - organizationName
        - legalIdentifiers
        - sponsoredBy
      additionalProperties: false
    OrganizationPatch:
      title: OrganizationPatch
      description: >-
        The fields a caller may change on an `Organization`.<br/><br/>A legal entity participating in the ecosystem — a
        bank, a third-party provider, a regulator, a certificate authority. Nearly every other record in the Trust
        Framework hangs off one.<br/><br/>**`legalIdentifiers` is a list and it is replaced in full.** Sending it sets
        the field to exactly the members in your request; members the record holds and your request omits are removed.
      type: object
      properties:
        organizationName:
          type: string
          description: >-
            The organization's name, as it is known in this ecosystem and as it appears wherever another record refers
            to it. Unique across the Trust Framework.
          minLength: 2
          examples:
            - Example Bank plc
        legalIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/LegalIdentifierWrite'
          minItems: 1
          description: >-
            The organization's legal identifiers. More than one is normal — different jurisdictions, or a tax identifier
            alongside a company number.<br/><br/>This is a list, and sending it **replaces the whole list**. The members
            you send become the entire value of the field: anything the record holds and your request omits is removed,
            not kept. To add or remove one member, read the record, change the list you were given, and send all of it
            back.
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Ecosystem-specific attributes of the organization. What may appear here is fixed by
            `OrganizationConfig.supplementaryInformationSchema`. A name or logo the organization trades under is not
            held here: it is a `Brand`, at `/organizations/{orgId}/brands`.
      minProperties: 1
      additionalProperties: false
    OrganizationConfigNew:
      title: OrganizationConfigNew
      description: >-
        The fields a caller supplies when creating an `OrganizationConfig`.<br/><br/>The ecosystem's settings for
        organizations — what may be recorded on one, which kinds of legal identifier are recognized, and the reasons
        participation may end. One record per configuration version, governing every organization.
      type: object
      properties:
        configuration:
          type: string
          format: uuid
          description: >-
            The configuration version this record belongs to. Every configuration record in one version references it,
            and exactly one version is active at a time.
          examples:
            - 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
        supplementaryInformationSchema:
          type: object
          additionalProperties: true
          description: The JSON Schema that `Organization.supplementaryInformation` is validated against.
        legalIdentifierTypes:
          type: array
          items:
            type: string
          minItems: 1
          description: The kinds of legal identifier an organization may register. `LegalIdentifier.type` must be one of these.
          examples:
            - - CompanyNumber
              - TaxIdentifier
              - LEI
        deactivationReasons:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            The reasons an organization may be recorded as inactive. `Organization.deactivationReason` must be one of
            these.
          examples:
            - - CeasedTrading
              - LicenseRevoked
              - MergedIntoAnother
              - VoluntaryWithdrawal
        contactConfig:
          $ref: '#/components/schemas/ContactConfig'
          description: What kinds of contact point an organization may record.
      required:
        - configuration
        - supplementaryInformationSchema
        - legalIdentifierTypes
        - deactivationReasons
        - contactConfig
      additionalProperties: false
    PersonNew:
      title: PersonNew
      description: >-
        The fields a caller supplies when creating a `Person`.<br/><br/>A natural person the Trust Framework holds a
        record of — an officer, an authorized representative, a technical contact. A person exists independently of any
        organization, and the same person can act for several.
      type: object
      properties:
        name:
          $ref: '#/components/schemas/PersonName'
          description: The person's name, structured rather than a single flat string.
        legalIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/LegalIdentifierWrite'
          description: >-
            The person's legal identifiers, where the ecosystem records any — a national identity number, a professional
            registration. Many ecosystems hold none for a natural person.
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Ecosystem-specific attributes of the person. What may appear here is fixed by
            `PersonConfig.supplementaryInformationSchema`.
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
          description: >-
            How to reach the person. Personal data: withheld from the default representation and served only at the
            `contacts` sub-resource.
      required:
        - name
      additionalProperties: false
    PersonPatch:
      title: PersonPatch
      description: >-
        The fields a caller may change on a `Person`.<br/><br/>A natural person the Trust Framework holds a record of —
        an officer, an authorized representative, a technical contact. A person exists independently of any
        organization, and the same person can act for several.<br/><br/>**`legalIdentifiers` is a list and it is
        replaced in full.** Sending it sets the field to exactly the members in your request; members the record holds
        and your request omits are removed.
      type: object
      properties:
        name:
          $ref: '#/components/schemas/PersonName'
          description: The person's name, structured rather than a single flat string.
        legalIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/LegalIdentifierWrite'
          description: >-
            The person's legal identifiers, where the ecosystem records any — a national identity number, a professional
            registration. Many ecosystems hold none for a natural person.<br/><br/>This is a list, and sending it
            **replaces the whole list**. The members you send become the entire value of the field: anything the record
            holds and your request omits is removed, not kept. To add or remove one member, read the record, change the
            list you were given, and send all of it back.
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Ecosystem-specific attributes of the person. What may appear here is fixed by
            `PersonConfig.supplementaryInformationSchema`.
      minProperties: 1
      additionalProperties: false
    PersonConfigNew:
      title: PersonConfigNew
      description: >-
        The fields a caller supplies when creating a `PersonConfig`.<br/><br/>The ecosystem's settings for persons —
        what may be recorded on one, which identifier types and forms of address are recognized, and the reasons
        participation may end. One record per configuration version.
      type: object
      properties:
        configuration:
          type: string
          format: uuid
          description: >-
            The configuration version this record belongs to. Every configuration record in one version references it,
            and exactly one version is active at a time.
          examples:
            - 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
        supplementaryInformationSchema:
          type: object
          additionalProperties: true
          description: The JSON Schema that `Person.supplementaryInformation` is validated against.
        legalIdentifierTypes:
          type: array
          items:
            type: string
          description: >-
            The kinds of legal identifier a person may register. Absent where the ecosystem records none for a natural
            person, which is common.
          examples:
            - - NationalInsuranceNumber
              - ProfessionalRegistration
        deactivationReasons:
          type: array
          items:
            type: string
          minItems: 1
          description: The reasons a person may be recorded as inactive. `Person.deactivationReason` must be one of these.
          examples:
            - - LeftOrganisation
              - Deceased
              - Disqualified
              - RequestedRemoval
        titles:
          type: array
          items:
            type: string
          description: >-
            The forms of address a person's name may carry. Absent where the ecosystem does not constrain it, in which
            case `PersonName.title` is free text.
          examples:
            - - Mr
              - Mrs
              - Ms
              - Miss
              - Mx
              - Dr
              - Prof
              - Rev
              - Sir
              - Dame
              - Lord
              - Lady
        contactConfig:
          $ref: '#/components/schemas/ContactConfig'
          description: What kinds of contact point a person may record.
      required:
        - configuration
        - supplementaryInformationSchema
        - deactivationReasons
        - contactConfig
      additionalProperties: false
    ProfileNew:
      title: ProfileNew
      description: >-
        The fields a caller supplies when creating a `Profile`.<br/><br/>A named access level in the Trust Framework —
        the set of Trust Framework scopes granted to an organization, or to one of its assignees. Exactly one profile
        applies at a time.
      type: object
      properties:
        configuration:
          type: string
          format: uuid
          description: >-
            The configuration version this record belongs to. Every configuration record in one version references it,
            and exactly one version is active at a time.
          examples:
            - 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
        profileName:
          type: string
          description: >-
            The access level as the ecosystem names it — `EcosystemOperator`, `EcosystemParticipant`,
            `EcosystemAdministrator`.
          examples:
            - EcosystemParticipant
        description:
          type: string
          description: Who this profile is for and what it is meant to permit, in the operator's own words.
          minLength: 10
          examples:
            - A participant that maintains its own entry and reads the public Trust Framework.
        trustFrameworkScopes:
          type: array
          items:
            $ref: '#/components/schemas/TrustFrameworkScope'
          minItems: 1
          description: >-
            The Trust Framework scopes this profile confers. These are the scopes the organization is registered with as
            an OIDC client.
      required:
