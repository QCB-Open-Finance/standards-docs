      operationId: listRelatedOrganizations
      summary: List RelatedOrganization records
      description: >-
        Read a page of `RelatedOrganization` records. Scoped to the `orgId` in the path. Pass `updatedSince` to receive
        only what has changed since an instant you name — poll with the time of your last read rather than re-reading
        the whole collection.


        **Rules**


        *Before it runs*

        - `{orgId}` MUST resolve to an `Organization` the caller has read access to. Read access means
        `view:organizations:all`, which reaches every `Organization`, or `view:organizations:own` where the
        `Organization` is the caller's own. The record **is** the principal — the organization identified by the access
        token. Otherwise `404`.

        - A caller holding only `view:related-organizations:own` sees only the records it has read access to by the test
        above. The others are left out of the list rather than refused, so a page may be shorter than its limit, and
        `meta` counts what the caller can see, not what exists.

        - The access token MUST carry `view:related-organizations:all` or `view:related-organizations:own`. Either
        admits the call. Which records it then reaches is the access rule below, not this one. Otherwise `403`.

        - Being related to an organization lets you see **the relationship**, and nothing more of the organization
        itself. You get its id and its name, because a reference carries those — and that is the whole of it. To read
        its records, its resources or its entitlements you need the same access you would need if you had never been
        related to it at all: `view:organizations:all`, or a role at that organization. A relationship is a statement
        about the two of you, not a grant.


        Every operation is also subject to the **common rules** — client certificate, access token, scope, caller
        status, schema validation, visibility. They are set out once under **Common rules** in this API's description,
        and are not repeated on each operation.
      tags:
        - parties
      security:
        - trustFrameworkOAuth:
            - view:related-organizations:own
        - trustFrameworkOAuth:
            - view:related-organizations:all
      responses:
        '200':
          $ref: '#/components/responses/RelatedOrganizationListResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: updatedSince
          in: query
          required: false
          description: >-
            Return only the records whose `lastUpdatedAt` is at or after this instant. Intended for keeping a local copy
            in step: poll with the time of your last successful read and you receive what has changed since, rather than
            the whole collection.
          schema:
            type: string
            format: date-time
