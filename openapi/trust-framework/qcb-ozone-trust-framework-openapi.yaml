  securitySchemes:
    trustFrameworkOAuth:
      type: oauth2
      description: >-
        The Trust Framework's own OIDC provider. Every operation here accepts both flows, so what differs is not which
        calls you can make but which records you can reach. An organisation authenticates with client credentials and
        holds the scopes of its `Profile`. A person authenticates through the authorization code flow and holds the
        union of the scopes of every role they have: hold two roles and you hold both, with nothing to choose between at
        sign-in. A scope you ask for and have not been granted is left out of the token rather than refused, so read the
        `scope` claim rather than assuming. On the authorization code flow the token identifies the person: `sub` is
        their user id, and `given_name` and `family_name` are their name as the register holds it. A service account
        carries no name claims.
      flows:
        clientCredentials:
          tokenUrl: https://directory.example.org/oauth2/token
          scopes:
            create:assignment-config: Create an `AssignmentConfig`.
            create:assignments:all: Create an `Assignment` for anyone, yours or not.
            create:assignments:own: Create an `Assignment` that is your own (own) — The assignment's `organization` is the principal.
            create:authority:all: Create an `Authority` for anyone, yours or not.
            create:authority:own: Create an `Authority` that is your own (own) — The authority's `organization` is the principal.
            create:brand-config: Create a `BrandConfig`.
            create:brands:all: Create a `Brand` for anyone, yours or not.
            create:brands:own: Create a `Brand` that is your own (own) — The brand's `organization` is the principal.
            create:ca-configuration:all: Create a `CaConfiguration` for anyone, yours or not.
            create:ca-configuration:own: >-
              Create a `CaConfiguration` that is your own (own) — The CA record's `certificateAuthority` is the
              principal.
            create:certificates:all: Create a `Certificate` for anyone, yours or not.
            create:certificates:own: >-
              Create a `Certificate` that is your own (own) — The certificate's `owner` is the principal — its subject,
              not its issuer.
            create:certifications:all: Create a `ResourceCertification` for anyone, yours or not.
            create:certifications:own: >-
              Create a `ResourceCertification` that is your own (own) — The certified resource is owned by the
              principal.
            create:configuration-activations: Create a `ConfigurationActivation`.
            create:configurations: Create a `Configuration`.
            create:entitlement-configs: Create an `EntitlementConfig`.
            create:entitlements:all: Create an `Entitlement` for anyone, yours or not.
            create:entitlements:own: >-
              Create an `Entitlement` that is your own (own) — The entitlement's `organization` is the principal. An
              issuer reads its own issuances through the Any-scoped act.
            create:jurisdiction-config: Create a `JurisdictionConfig`.
            create:jwks-config: Create a `JwksConfig`.
            create:jwks:all: Create a `Jwks` for anyone, yours or not.
            create:jwks:own: >-
              Create a `Jwks` that is your own (own) — The key store is owned by the principal, whichever kind of holder
              `ownerType` names.
            create:keys: Create a `Jwk`.
            create:organization-config: Create an `OrganizationConfig`.
            create:organizations:all: Create an `Organization` for anyone, yours or not.
            create:organizations:own: >-
              Create an `Organization` that is your own (own) — The record **is** the principal — the organization
              identified by the access token.
            create:person-config: Create a `PersonConfig`.
            create:persons:all: Create a `Person` for anyone, yours or not.
            create:profiles: Create a `Profile`.
            create:related-organization-config: Create a `RelatedOrganizationConfig`.
            create:related-organizations:all: Create a `RelatedOrganization` for anyone, yours or not.
            create:resource-certification-configs: Create a `ResourceCertificationConfig`.
            create:resource-configs: Create a `ResourceConfig`.
            create:resources:all: Create a `Resource` for anyone, yours or not.
            create:resources:own: Create a `Resource` that is your own (own) — The resource's `owner` is the principal.
            create:roles: Create an `EcosystemRole`.
            create:software-statement-config: Create a `SoftwareStatementConfig`.
            create:software-statements:all: Create a `SoftwareStatement` for anyone, yours or not.
            create:software-statements:own: Create a `SoftwareStatement` that is your own (own) — The application's `organization` is the principal.
            create:ssa:all: Create a `Ssa` for anyone, yours or not.
            create:ssa:own: Create a `Ssa` that is your own (own) — The assertion was issued from an application the principal owns.
            create:trust-framework-clients:all: Create a `TrustFrameworkClient` for anyone, yours or not.
            create:trust-framework-clients:own: Create a `TrustFrameworkClient` that is your own (own) — The client's `organization` is the principal.
            create:user-roles:all: Create a `UserRole` for anyone, yours or not.
            create:user-roles:own: Create a `UserRole` that is your own (own) — The assignment's `organization` is the principal.
            create:users:all: Create a `User` for anyone, yours or not.
            create:users:own: >-
              Create a `User` that is your own (own) — The account belongs to a person assigned to the principal, or is
              a service account of the principal.
            delete:assignment-config: Delete any `AssignmentConfig`.
            delete:assignments:all: Delete any `Assignment`.
            delete:authority:all: Delete any `Authority`.
            delete:brand-config: Delete any `BrandConfig`.
            delete:brands:all: Delete any `Brand`.
            delete:ca-configuration:all: Delete any `CaConfiguration`.
            delete:certificates:all: Delete any `Certificate`.
            delete:certifications:all: Delete any `ResourceCertification`.
            delete:configuration-activations: Delete any `ConfigurationActivation`.
            delete:configurations: Delete any `Configuration`.
            delete:entitlement-configs: Delete any `EntitlementConfig`.
            delete:entitlements:all: Delete any `Entitlement`.
            delete:jurisdiction-config: Delete any `JurisdictionConfig`.
            delete:jwks-config: Delete any `JwksConfig`.
            delete:jwks:all: Delete any `Jwks`.
            delete:keys: Delete any `Jwk`.
            delete:organization-config: Delete any `OrganizationConfig`.
            delete:organizations:all: Delete any `Organization`.
            delete:person-config: Delete any `PersonConfig`.
            delete:persons:all: Delete any `Person`.
            delete:profiles: Delete any `Profile`.
            delete:related-organization-config: Delete any `RelatedOrganizationConfig`.
            delete:related-organizations:all: Delete any `RelatedOrganization`.
            delete:resource-certification-configs: Delete any `ResourceCertificationConfig`.
            delete:resource-configs: Delete any `ResourceConfig`.
            delete:resources:all: Delete any `Resource`.
            delete:roles: Delete any `EcosystemRole`.
            delete:software-statement-config: Delete any `SoftwareStatementConfig`.
            delete:software-statements:all: Delete any `SoftwareStatement`.
            delete:ssa:all: Delete any `Ssa`.
            delete:trust-framework-clients:all: Delete any `TrustFrameworkClient`.
            delete:user-roles:all: Delete any `UserRole`.
            delete:users:all: Delete any `User`.
