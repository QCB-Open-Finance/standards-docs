        - parties
      requestBody:
        $ref: '#/components/requestBodies/RelatedOrganizationNewRequest'
      security:
        - trustFrameworkOAuth:
            - create:related-organizations:all
      responses:
        '201':
          $ref: '#/components/responses/RelatedOrganizationCreatedResponse'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
