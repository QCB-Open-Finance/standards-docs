    Jwk:
      title: Jwk
      description: >-
        One key inside a key store, identified by its RFC 7517 `kid`. What the key may be used for, which algorithms it
        may declare and whether it must carry a certificate chain are all fixed by the ecosystem's policy for its key
        type.
      type: object
      properties:
        kid:
          type: string
          description: >-
            The RFC 7517 key identifier, and this record's own identifier. It appears in every JWS header the ecosystem
            exchanges.
          examples:
            - kid-as-transport-2026-01
        keyStore:
          $ref: '#/components/schemas/JwksRef'
          description: >-
            The key store this key belongs to. Set from the path when the record is created, never sent in the body, and
            fixed for the life of the record.
          examples:
            - id: 5f9c3a72-1e48-4b06-8d95-2c7e0b4a6f31
              discoveryUri: https://directory.example.org/jwks/8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
        keyType:
          $ref: '#/components/schemas/JwkKeyType'
          description: >-
            What the key is used for in the ecosystem's protocols. Selects the `JwkKeyPolicy` that governs this key: a
            type with no policy on the active `JwksConfig` may not be created.
          examples:
            - Transport
        alg:
          type: string
          description: >-
            The RFC 7517 `alg` — the algorithm this key is used with, from the IANA JOSE registry. The permitted values
            are whichever `JwkKeyPolicy.permittedAlgs` lists for this key's type, so a signing key is held to a
            different list than an encryption or a transport key.
          examples:
            - PS256
        algorithmFamily:
          type: string
          enum:
            - RSA
            - EC
          description: >-
            The key's cryptographic family. Determined by `alg` — `PS256` is `RSA`, `ES256` is `EC` — and carried
            explicitly because it is what a relying party filters a published JWKS on.
          examples:
            - EC
        keyUse:
          type: string
          enum:
            - sig
            - enc
          description: The RFC 7517 `use` parameter as published in the JWKS.
          examples:
            - sig
        creationMethod:
          type: string
          enum:
            - CertificateUploaded
            - KeyUploaded
            - Generated
          description: >-
            How the key came to exist. The three routes differ in what the Trust Framework ever held:<br/>-
            `CertificateUploaded` — you supplied an X.509 certificate, and the public key, `alg` and `expiresAt` were
            read out of it.<br/>- `KeyUploaded` — you supplied a bare public key, with no chain. Permitted only where
            the matching `JwkKeyPolicy` has `x5cRequirement` and `x5uRequirement` both `Optional` or
            `Unsupported`.<br/>- `Generated` — you supplied nothing and the Trust Framework generated the pair. **The
            private key is returned in the response to that one call and never stored**, so it cannot be re-fetched; a
            participant that loses it creates a new key and revokes this one. Where the matching policy has
            `selfSignedPermitted`, generation may also mint a self-signed certificate into `x5c`.
          examples:
            - CertificateUploaded
        publicKey:
          $ref: '#/components/schemas/PublicKey'
          description: >-
            The public key itself, as RFC 7517 names it. Present whatever route the key arrived by, so a verifier never
            has to fetch and parse a chain to get it. Set by `createJwk`; not accepted in any request body.
        x5c:
          type: array
          items:
            type: string
          description: >-
            The X.509 certificate chain embedded in the key, base64-encoded per RFC 7517. Whether it is required,
            optional or rejected is fixed by `JwkKeyPolicy.x5cRequirement` for this key's type.
        x5u:
          type: string
          format: uri
          description: >-
            URL the X.509 chain for this key resolves from, where it is not embedded. Governed by `x5uRequirement` on
            the matching `JwkKeyPolicy`.<br/><br/>A participant may **upload** a chain rather than host one, in which
            case the Trust Framework publishes it and sets this field by expanding the `X5u` template on `JwksConfig`.
            Either way the field holds a resolvable URL; what differs is who serves it.
          examples:
            - https://directory.example.org/chains/kid-as-transport-2026-01.pem
        expiresAt:
          type: string
          format: date-time
          description: >-
            When the key ceases to be valid. Read from the certificate where there is one — the `notAfter` of the leaf
            in `x5c`, or of the chain `x5u` resolves to — and supplied by the participant where there is not. Expiry
            does not change `status`: an expired key is still `Active` and simply no longer valid.
          examples:
            - '2027-01-20T00:00:00+00:00'
        status:
          type: string
          enum:
            - Active
            - Revoked
          description: Whether a relying party may trust this key. `Active` may be trusted; `Revoked` may not, and is final.
          examples:
            - Active
        revokedAt:
          type: string
          format: date-time
          description: >-
            When the key was revoked. System-owned; absent while the key is `Active`. Kept because a signature made
            before this instant may still be validated afterwards — which is what the revoked-JWKS publishing templates
            exist to serve. Set by `revokeJwk`; not accepted in any request body.
          examples:
            - '2027-01-19T08:15:00+00:00'
        owner:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization that owns this `Jwk`, through its `keyStore`. Set by `createJwk`; not accepted in any
            request body.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        effectiveStatus:
          $ref: '#/components/schemas/EffectiveStatus'
          description: >-
            Whether this `Jwk` is actually in service. `status` is what an operator asked for; this is what the
            ecosystem gets, once the condition of the owning `Organization` and the `Jwks` holding it is taken into
            account. Maintained by the platform; not accepted in any request body.
          examples:
            - Active
        notInServiceReasons:
          type: array
          items:
            type: string
            enum:
              - KeyStoreNotInService
              - OrganizationDeactivated
          description: >-
            Why this `Jwk` is not in service, where the cause is the owning `Organization` and the `Jwks` holding it
            rather than this record's own `status`. Present, and non-empty, exactly while `effectiveStatus` is
            `NotInService`; absent while the record is in service. The two are one value in two shapes and never
            disagree, and an empty array is not a state either of them has. Maintained by the platform; not accepted in
            any request body.
        createdByOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organisation the record is attributed to. Always present, by one of three routes, which
            `createdByChannel` tells apart:<br/>- `api` or `ui` — resolved from the access token. Both the
            client-credentials and the authorization-code grant identify an organisation.<br/>- `system` — there was no
            caller, so it is inherited from the record whose change caused this one. A cascade is attributed to whoever
            set off the cascade.<br/>- `dataload` — the organisation operating this API, which ran the load.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        createdByUser:
          $ref: '#/components/schemas/UserRef'
          description: >-
            The user account that created the record. Present only where a person was at the other end of the request —
            that is, where `createdByChannel` is `ui`. Absent for `api`, which authenticates an organisation and no
            person, and absent for `system` and `dataload`, which have no caller at all. Its absence is information
            rather than a gap.
          examples:
            - id: e04a2b78-6c1d-4f93-a5e8-7b2f9d0c3a61
              fullName: Amara Okafor
        createdByChannel:
          $ref: '#/components/schemas/Channel'
          description: >-
            How the record was created. Read from the access token, never from the request body: `ui` where the token
            carries the `trust-framework-ui` scope, `api` otherwise. Send this field and it is ignored. `system` and
            `dataload` both cover records written with no caller — a time-based transition or a cascade for the first, a
            bulk import for the second — so both take their organisation from elsewhere, as the creating-organisation
            field beside this one describes, and neither ever carries a user.
          examples:
            - api
      required:
        - kid
        - keyStore
        - keyType
        - alg
        - algorithmFamily
        - keyUse
        - creationMethod
        - publicKey
        - expiresAt
        - status
        - owner
        - effectiveStatus
        - createdByOrganization
        - createdByChannel
      additionalProperties: false
    JwkKeyPolicy:
      title: JwkKeyPolicy
      description: >-
        What the ecosystem permits for one kind of key — which algorithms it may declare, whether it must carry a
        certificate chain, and whether self-signed material is accepted.
      type: object
      properties:
        keyType:
          $ref: '#/components/schemas/JwkKeyType'
          description: >-
            The kind of key this policy governs. Its presence is what enables the type — a key type with no policy may
            not be created at all.
          examples:
            - Transport
        permittedAlgs:
          type: array
          items:
            type: string
          minItems: 1
          description: The IANA JOSE `alg` values a key of this type may declare. `Jwk.alg` must be one of these.
          examples:
            - - PS256
              - ES256
        x5cRequirement:
          $ref: '#/components/schemas/KeyMaterialRequirement'
          description: Whether a key of this type must carry an embedded certificate chain, may carry one, or may not.
          examples:
            - Mandatory
        x5uRequirement:
          $ref: '#/components/schemas/KeyMaterialRequirement'
          description: >-
            Whether a key of this type must resolve its chain from a URL, may, or may not. Independent of
            `x5cRequirement`: an ecosystem may require a chain and accept it by either route, require specifically the
            embedded form, or accept a hosted chain only as a supplement.
          examples:
            - Optional
        selfSignedPermitted:
          type: boolean
          description: >-
            Whether a certificate the Trust Framework mints itself satisfies this policy. `false` means the chain must
            come from a certificate authority the ecosystem recognizes.
          examples:
            - false
      required:
        - keyType
        - permittedAlgs
        - x5cRequirement
        - x5uRequirement
        - selfSignedPermitted
      additionalProperties: false
    Jwks:
      title: Jwks
      description: >-
        A key store: the set of keys published for one holder, which may be an organization, a resource or a software
        statement. Relying parties fetch it from the discovery URL below.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key of the key store, independent of whichever holder owns it.
          examples:
            - 5f9c3a72-1e48-4b06-8d95-2c7e0b4a6f31
        ownerType:
          type: string
          enum:
            - Organization
            - SoftwareStatement
            - Resource
          description: Which kind of holder owns this key store.
          examples:
            - Organization
        ownerId:
          type: string
          format: uuid
          description: The holder that owns this key store, in whichever collection `ownerType` names.
          examples:
            - 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
        owner:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization this key store ultimately belongs to. Where `ownerType` is `Organization` it is the owner
            itself; otherwise it is the organization that operates the resource, or registered the application, that
            owns it. The Trust Framework works this out from the owner when the key store is created. Set by
            `createJwks`; not accepted in any request body.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        discoveryUri:
          type: string
          format: uri
          description: >-
            Where this key store is published for relying parties to fetch, as an RFC 7517 JWKS document. Set by
            `createJwks`; not accepted in any request body.
