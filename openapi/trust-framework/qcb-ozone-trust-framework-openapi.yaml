  /configurations/{configurationId}/action/activate:
    parameters:
      - name: configurationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identifier carried in the path.
    post:
      operationId: activateConfiguration
      summary: Activate the Configuration
      description: >-
        Moves `Configuration.status` from `Draft` or `Superseded` to `Active`. Also supersedes whichever version was
        Active, and writes a ConfigurationActivation.


        **Rules**


        *Before it runs*

        - `{configurationId}` MUST resolve to a `Configuration` the caller has read access to. Read access means
        `view:configurations`. Otherwise `404`.

        - No other `Configuration` may already be `Active` — this action makes this one `Active`, and only one may be.
        Otherwise `409`.

        - `status` MUST be `Draft` or `Superseded` — this action moves the `Configuration` to `Active`, and that
        transition is defined from `Draft` or `Superseded` and from nowhere else. Otherwise `409`.

        - The access token MUST carry `edit:configurations`. Otherwise `403`.

        - Activating a `Configuration` whose `BrandConfig` changes either bound for a kind MUST be refused while any
        record of that kind in a non-terminal state names a number of brands outside the new cardinality — too few where
        a lower bound is raised (`0..M` to `1..M`), too many where an upper bound is lowered (`0..M` to `0..1` or
        `0..0`). Otherwise `409`.

        - The target version MUST hold exactly one record of every ecosystem-wide config — `OrganizationConfig`,
        `PersonConfig`, `AssignmentConfig`, `JwksConfig`, `SoftwareStatementConfig`, `BrandConfig`,
        `JurisdictionConfig`, `RelatedOrganizationConfig` — and at least one `ResourceConfig`. Activating a version
        missing one leaves the Trust Framework unable to evaluate the operations that config governs. Otherwise `422`.

        - Every `JwksConfig.urlTemplates` row MUST be present — three owner kinds × `Jwks` and `RevokedJwks`. Otherwise
        `422`.

        - An `X5u` `urlTemplates` row MUST be present for every holder kind whose `keyPolicies` permit an uploaded
        chain. Without it the Trust Framework accepts a chain it has nowhere to publish, and `x5u` cannot be set — so
        the key is stored with a chain no relying party can reach. (when `422` · `CONFIGURATION_INCOMPLETE`)

        - A link type in use by any `Active` `RelatedOrganization` MUST NOT be removed from a configuration version that
        is subsequently activated, nor have its `symmetric` flag changed. Otherwise `409`.


        *What it does*

        - The previously active `Configuration` MUST transition to `Superseded` in the same transaction. Two active
        versions is the failure this entity exists to prevent.

        - A `ConfigurationActivation` MUST be written recording the version activated, the version superseded, and the
        instant. The **actor** is recorded by «Attributed» — `createdByOrganization`, `createdByUserId`,
        `createdByChannel` — and MUST NOT be duplicated in a field of its own.

        - Records already written MUST NOT be re-evaluated against the new version. Configuration governs the evaluation
        of a request, not the validity of history.


        Every operation is also subject to the **common rules** — client certificate, access token, scope, caller
        status, schema validation, visibility. They are set out once under **Common rules** in this API's description,
        and are not repeated on each operation.
      tags:
        - configuration-versions
      security:
        - trustFrameworkOAuth:
            - edit:configurations
      responses:
        '204':
          description: The `Configuration` moved to `Active`. No body — the mutation is the outcome.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
