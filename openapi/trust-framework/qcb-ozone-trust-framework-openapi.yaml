          $ref: '#/components/schemas/EffectiveStatus'
          description: >-
            Whether this `Resource` is actually in service. `status` is what an operator asked for; this is what the
            ecosystem gets, once the condition of the owning `Organization` is taken into account. Maintained by the
            platform; not accepted in any request body.
          examples:
