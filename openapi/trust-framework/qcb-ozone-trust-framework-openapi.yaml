    Configuration:
      title: Configuration
      description: >-
        One version of the ecosystem's configuration — the role catalogue, the recognized identifier types, the key
        policies and everything else an ecosystem sets for itself. Exactly one version is active at a time, and every
        configuration record names the version it belongs to.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key. Stable across activation and supersession.
          examples:
            - 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
        version:
          type: string
          description: >-
            The version as the ecosystem names it: conventionally the year and month its rules take effect, with a
            revision suffix where one is needed.
          pattern: ^[0-9]{4}\.[0-9]{2}(\.[0-9]+)?$
          examples:
            - '2026.09'
        description:
          type: string
          description: >-
            What this version changes and why, in the words of whoever built it. This is what a reviewer reads before
            the version is made active.
          minLength: 10
          examples:
            - Adds the Payments Initiation role set agreed at the September forum.
        clonedFrom:
          $ref: '#/components/schemas/ConfigurationRef'
          description: >-
            The version this one was created from. Supplying it on create copies every config record of that version
            into this one, so a new version starts as a complete, editable copy of the live rules rather than as an
            empty set somebody has to refill by hand. Absent only on the first version, which had nothing to clone.
          examples:
            - id: c2d61a84-7f39-4e50-b6a1-9e3c5d0f7b28
              version: '2026.09'
        status:
          type: string
          enum:
            - Draft
            - Active
            - Superseded
          description: >-
            Where this version stands. `Draft` while it is being built, `Active` while the ecosystem runs on it,
            `Superseded` once another version replaced it. A superseded version can be activated again, which is how a
            rollback is done.
          examples:
            - Active
        createdByOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organisation the record is attributed to. Always present, by one of three routes, which
            `createdByChannel` tells apart:<br/>- `api` or `ui` — resolved from the access token. Both the
            client-credentials and the authorization-code grant identify an organisation.<br/>- `system` — there was no
            caller, so it is inherited from the record whose change caused this one. A cascade is attributed to whoever
            set off the cascade.<br/>- `dataload` — the organisation operating this API, which ran the load.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        createdByUser:
          $ref: '#/components/schemas/UserRef'
          description: >-
            The user account that created the record. Present only where a person was at the other end of the request —
            that is, where `createdByChannel` is `ui`. Absent for `api`, which authenticates an organisation and no
            person, and absent for `system` and `dataload`, which have no caller at all. Its absence is information
            rather than a gap.
          examples:
            - id: e04a2b78-6c1d-4f93-a5e8-7b2f9d0c3a61
              fullName: Amara Okafor
        createdByChannel:
          $ref: '#/components/schemas/Channel'
          description: >-
            How the record was created. Read from the access token, never from the request body: `ui` where the token
            carries the `trust-framework-ui` scope, `api` otherwise. Send this field and it is ignored. `system` and
            `dataload` both cover records written with no caller — a time-based transition or a cascade for the first, a
            bulk import for the second — so both take their organisation from elsewhere, as the creating-organisation
            field beside this one describes, and neither ever carries a user.
          examples:
            - api
        createdAt:
          type: string
          format: date-time
          description: >-
            When the Trust Framework created this record. System-owned — set by the platform at write time and never
            supplied by a caller.
          examples:
            - '2026-03-14T09:12:44+00:00'
        lastUpdatedAt:
          type: string
          format: date-time
          description: >-
            When the Trust Framework last changed this record. System-owned — equal to `createdAt` until something
            changes it, and never supplied by a caller.
          examples:
            - '2026-08-02T16:41:07+00:00'
        lastUpdatedByOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organisation the last change is attributed to, by the same three routes as the creating organisation and
            told apart the same way by `lastUpdatedByChannel`. Equal to the creating organisation until something
            changes the record.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        lastUpdatedByUser:
          $ref: '#/components/schemas/UserRef'
          description: >-
            The user account that last changed the record. Present only where `lastUpdatedByChannel` is `ui`; absent for
            a machine caller, for a change the platform made itself, and for a bulk load.
          examples:
            - id: e04a2b78-6c1d-4f93-a5e8-7b2f9d0c3a61
              fullName: Amara Okafor
        lastUpdatedByChannel:
          $ref: '#/components/schemas/Channel'
          description: >-
            How the record was last changed. Read from the access token the same way as `createdByChannel` — `ui` where
            it carries `trust-framework-ui`, `api` otherwise — and never from the request body. `system` is the value
            for a time-based transition or a cascade, which is how an expiry is told apart from someone revoking by
            hand, and `dataload` for a change made by a bulk import rather than by a request.
          examples:
            - api
      required:
        - id
        - version
        - description
        - status
        - createdByOrganization
        - createdByChannel
        - createdAt
        - lastUpdatedAt
        - lastUpdatedByOrganization
        - lastUpdatedByChannel
