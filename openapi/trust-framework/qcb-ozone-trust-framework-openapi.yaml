    JwksOwnerPermission:
      title: JwksOwnerPermission
      description: Which ecosystem roles an organization must hold before a key store may be created for one kind of holder.
      type: object
      properties:
        ownerType:
          type: string
          enum:
            - Organization
            - SoftwareStatement
            - Resource
          description: The kind of holder this permission governs, from the same vocabulary as `Jwks.ownerType`.
          examples:
            - Resource
        permittedEcosystemRoles:
          type: array
          items:
            $ref: '#/components/schemas/EcosystemRoleRef'
          minItems: 1
          description: >-
            An organization must hold at least one of these roles before a key store of this kind may be created.
            Checked against the organization in every case, including the two where the store hangs off something else:
            a software statement and a resource each belong to an organization, and it is that organization's
            entitlement that is being tested.
      required:
        - ownerType
        - permittedEcosystemRoles
      additionalProperties: false
    JwksUrlTemplate:
      title: JwksUrlTemplate
      description: >-
        One publishing URL pattern: for one kind of key-store holder and one purpose, the address the Trust Framework
        expands and serves key material at.
      type: object
      properties:
        ownerType:
          type: string
          enum:
            - Organization
            - SoftwareStatement
            - Resource
          description: Which kind of key-store holder this pattern serves.
          examples:
            - Organization
        purpose:
          $ref: '#/components/schemas/JwksUrlPurpose'
          description: What is published at the expanded URL.
          examples:
            - Jwks
        template:
          type: string
          description: >-
            The RFC 6570 pattern the Trust Framework expands. Its variables are the identifiers of the holder
            `ownerType` names, and — for `X5u` — the `kid` of the individual key.
          examples:
            - https://directory.example.org/{orgId}/{softwareStatementId}/revoked-jwks.json
      required:
        - ownerType
        - purpose
        - template
      additionalProperties: false
    LegalIdentifier:
      title: LegalIdentifier
      description: >-
        One identifier issued to a party by a legal authority — a company number, a tax identifier, an LEI — with the
        country it was issued in and the body that issued it.
      type: object
      properties:
        legalIdentifier:
          type: string
          description: The identifier value as issued.
          examples:
            - GB-COH-09876543
        issuingOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization that issued the identifier — a companies registry, a tax authority, a regulator. Every
            issuing body is itself a record in the Trust Framework, so this is a reference rather than a name in a
            string.
          examples:
            - id: 1a7d3e90-b2c4-4f16-8a55-9c0e2d4f6b81
              organizationName: Example Bank plc
        country:
          type: string
          description: ISO 3166-1 alpha-2 country of issue.
          pattern: ^[A-Z]{2}$
          examples:
            - GB
        type:
          type: string
          description: >-
            The kind of identifier this is. Must be one of the values `OrganizationConfig.legalIdentifierTypes` lists
            for an organization, or `PersonConfig.legalIdentifierTypes` for a person.
          examples:
            - CompanyNumber
      required:
        - legalIdentifier
        - issuingOrganization
        - country
        - type
      additionalProperties: false
    Organization:
      title: Organization
      description: >-
        A legal entity participating in the ecosystem — a bank, a third-party provider, a regulator, a certificate
        authority. Nearly every other record in the Trust Framework hangs off one. `contacts` is not included here —
        read it at `/organizations/{orgId}/contacts`.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key, assigned by the Trust Framework when the organization is created.
          examples:
            - 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
        organizationName:
          type: string
          description: >-
            The organization's name, as it is known in this ecosystem and as it appears wherever another record refers
            to it. Unique across the Trust Framework.
          minLength: 2
          examples:
            - Example Bank plc
        legalIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/LegalIdentifier'
          minItems: 1
          description: >-
            The organization's legal identifiers. More than one is normal — different jurisdictions, or a tax identifier
            alongside a company number.
        sponsoredBy:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization that sponsored this one into the ecosystem. Never empty — the root organization names
            itself.
          examples:
            - id: 1a7d3e90-b2c4-4f16-8a55-9c0e2d4f6b81
              organizationName: Example Bank plc
        profile:
          $ref: '#/components/schemas/ProfileRef'
          description: >-
            The organization's access level in the Trust Framework. It resolves to the set of scopes the organization is
            registered with as an OIDC client, and there is at most one. It is not set when the organization is created:
            an operator assigns it, and until they do the organization holds no access level and its client confers no
            scopes. Set by `createOrganization`; not accepted in any request body.
