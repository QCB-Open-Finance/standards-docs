    post:
      operationId: createRelatedOrganization
      summary: Create a RelatedOrganization
      description: >-
        Create a `RelatedOrganization`. The created record is returned, and its address in the `Location` header.


        **Rules**


        *Before it runs*

        - `{orgId}` MUST resolve to an `Organization` the caller has read access to. Read access means
        `view:organizations:all`, which reaches every `Organization`, or `view:organizations:own` where the
        `Organization` is the caller's own. The record **is** the principal — the organization identified by the access
        token. Otherwise `404`.

        - `toOrganization` MUST resolve to an existing `Organization`. Otherwise `422`.

        - The owning `Organization`'s `effectiveStatus` MUST be `Active` — an `Organization` that is out of service
        cannot take new records, whatever its `status` says. Otherwise `409`.

        - No other `RelatedOrganization` may already hold the same (`fromOrganization`, `toOrganization`,
        `relationshipType`). Otherwise `409`.

        - The `supplementaryInformation` the `RelatedOrganization` will hold MUST validate against `the governing
        config`. That schema is the ecosystem's and may require members, so the check does not depend on the request
        carrying the field — omitting it fails wherever a member is required. Otherwise `422`.

        - The access token MUST carry `create:related-organizations:all`. There is no `:own` alternative on this
        operation. Creating a relationship means naming an organization you are not related to yet — that is what the
        call is for. Nothing in an `:own` scope lets you find or read that organization, so a caller holding only
        `create:related-organizations:own` could name one solely by quoting an id, which would make this operation a way
        of testing whether an id exists. Declaring a relationship is therefore an `:all` act. Changing or ending one you
        are already part of is not, and keeps its `:own` scope. Otherwise `403`.

        - `relationshipType` MUST name an entry in `RelatedOrganizationConfig.relationshipTypes` on the active
        `Configuration`. Otherwise `422`.

        - `fromOrganization` and `toOrganization` MUST NOT be the same organization. Otherwise `422`.

        - Where the named type's `symmetric` is `true`, no `Active` link of that type MUST exist in **either** direction
        between the pair. The uniqueness constraint sees an ordered pair and cannot detect the reverse. (when the type
        is symmetric) Otherwise `409`.

        - `effectiveToDate`, where supplied, MUST NOT precede `effectiveFromDate`. (when `effectiveToDate` supplied)
        Otherwise `422`.

        - Both `fromOrganization` and `toOrganization` MUST have `status` `Active`. Not merely *not `Draft`*: a
        `Suspended` organization has been stopped and a `Deactivated` one has left the ecosystem, and a relationship
        declared with either asserts something about a participant that is not participating. Otherwise `409`.


        *What it does*

        - The `RelatedOrganization` is created and returned, with the id the Trust Framework assigned it.

        - It starts in `Active`.


        Every operation is also subject to the **common rules** — client certificate, access token, scope, caller
        status, schema validation, visibility. They are set out once under **Common rules** in this API's description,
        and are not repeated on each operation.
