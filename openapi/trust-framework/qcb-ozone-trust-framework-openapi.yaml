    Brand:
      title: Brand
      description: >-
        A customer-facing identity an organization trades under — the name and logo a consumer recognizes and chooses
        between. One organization may operate several, and a brand is not a legal entity: it has no identifiers of its
        own and holds no entitlements.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key of the brand, stable across renaming and withdrawal.
          examples:
            - 7d41e9b6-0c53-4a28-9e71-3f8b2a6c0d94
        organization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization that operates this brand. Set from the path when the record is created, never sent in the
            body, and fixed for the life of the record.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        brandName:
          type: string
          description: >-
            The brand as a consumer knows it, and what a selection screen shows. Unique among the active brands of one
            organization.
          examples:
            - Example Bank Everyday
        logoUri:
          type: string
          format: uri
          description: >-
            Where the brand's logo is published, for a consumer-facing selection screen. Absent where the ecosystem does
            not collect one.
          examples:
            - https://assets.example-bank.co.uk/everyday/logo.svg
        websiteUri:
          type: string
          format: uri
          description: The brand's own public website, where it has one distinct from its operator's.
          examples:
            - https://everyday.example-bank.co.uk
        status:
          type: string
          enum:
            - Draft
            - Active
            - Suspended
            - Deactivated
          description: >-
            Whether the brand is in use. `Draft` is being set up and may not yet be associated with anything; `Active`
            is in use; `Suspended` has been taken out of use and can be brought back; `Deactivated` has been withdrawn
            for good.
          examples:
            - Active
        deactivationReason:
          type: string
          description: >-
            Why the brand was withdrawn for good. Required when `status` is `Deactivated` and absent otherwise, and must
            be one of the reasons `BrandConfig.deactivationReasons` lists. Supplied when calling `deactivateBrand`, and
            on no other request.
          examples:
            - Rebranded
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Ecosystem-specific attributes of the brand. What may appear here is fixed by
            `BrandConfig.supplementaryInformationSchema`.
        effectiveStatus:
          $ref: '#/components/schemas/EffectiveStatus'
          description: >-
            Whether this `Brand` is actually in service. `status` is what an operator asked for; this is what the
            ecosystem gets, once the condition of the owning `Organization` is taken into account. Maintained by the
            platform; not accepted in any request body.
          examples:
            - Active
        notInServiceReasons:
          type: array
          items:
            type: string
            enum:
              - OrganizationDeactivated
              - OrganizationSuspended
          description: >-
            Why this `Brand` is not in service, where the cause is the owning `Organization` rather than this record's
            own `status`. Present, and non-empty, exactly while `effectiveStatus` is `NotInService`; absent while the
            record is in service. The two are one value in two shapes and never disagree, and an empty array is not a
            state either of them has. Maintained by the platform; not accepted in any request body.
        createdByOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organisation the record is attributed to. Always present, by one of three routes, which
