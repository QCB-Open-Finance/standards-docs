    Certificate:
      title: Certificate
      description: >-
        An X.509 certificate the Trust Framework holds for an organization, bound to the key it attests to. The Trust
        Framework mirrors the certificate's own validity window and keeps its own state alongside it.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key held by the Trust Framework, distinct from the X.509 serial number.
          examples:
            - 7b3e9d51-6a04-4c28-91f7-4e8c2a5b0d69
        kid:
          $ref: '#/components/schemas/JwkRef'
          description: The key this certificate attests to, by its RFC 7517 `kid`.
          examples:
            - kid: kid-as-transport-2026-01
        owner:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization the certificate was issued to — its subject. Set from the path when the record is created,
            never sent in the body, and fixed for the life of the record.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        certificateAuthority:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization that issued the certificate, which must be a certificate authority in this ecosystem.
            Identified from the certificate itself — by matching its `issuer` to a trusted certificate authority — never
            supplied in the request. Set by `createCertificate`; not accepted in any request body.
          examples:
            - id: 1a7d3e90-b2c4-4f16-8a55-9c0e2d4f6b81
              organizationName: Example Bank plc
        certificateType:
          type: string
          enum:
            - Transport
            - Signing
            - Encryption
          description: What the certificate is used for — mTLS, JWS or JWE.
          examples:
            - Transport
        serialNumber:
          type: string
          description: >-
            The issuing CA's serial number for the certificate, as it appears in the X.509. Set by `createCertificate`;
            not accepted in any request body.
          examples:
            - 0A:3F:22:B7:91:04
        subject:
          type: string
          description: >-
            The X.509 subject distinguished name, mirrored from the certificate. Set by `createCertificate`; not
            accepted in any request body.
          examples:
            - CN=as.example-bank.co.uk,O=Example Bank,C=GB
        issuer:
          type: string
          description: >-
            The X.509 issuer distinguished name, mirrored from the certificate. Set by `createCertificate`; not accepted
            in any request body.
          examples:
            - CN=Example Ecosystem CA,O=Example Regulator,C=GB
        notBefore:
          type: string
          format: date-time
          description: >-
            The instant the certificate becomes valid. Mirrors the X.509 `notBefore` exactly — the Trust Framework
            neither sets nor adjusts it. Set by `createCertificate`; not accepted in any request body.
          examples:
            - '2026-01-20T00:00:00+00:00'
        notAfter:
          type: string
          format: date-time
          description: >-
            The instant the certificate ceases to be valid. Mirrors the X.509 `notAfter` exactly — the Trust Framework
            never shortens it. Set by `createCertificate`; not accepted in any request body.
          examples:
            - '2027-01-20T00:00:00+00:00'
        status:
          type: string
          enum:
            - Active
            - Revoked
            - Expired
          description: >-
            The certificate's state as the Trust Framework holds it, separately from the X.509 validity window. `Active`
            is usable; `Revoked` was withdrawn; `Expired` is past `notAfter`. The last two are final.
          examples:
            - Active
        x5c:
          type: array
          items:
            type: string
          description: The certificate chain embedded, base64-encoded. One of `x5c` or `x5u` is required.
        x5u:
          type: string
          format: uri
          description: URL the certificate chain resolves from. One of `x5c` or `x5u` is required.
          examples:
            - https://directory.example.org/chains/0A3F22B79104.pem
        effectiveStatus:
          $ref: '#/components/schemas/EffectiveStatus'
          description: >-
            Whether this `Certificate` is actually in service. `status` is what an operator asked for; this is what the
            ecosystem gets, once the condition of the owning `Organization` is taken into account. Maintained by the
            platform; not accepted in any request body.
          examples:
            - Active
        notInServiceReasons:
          type: array
          items:
            type: string
            enum:
              - OrganizationDeactivated
              - OrganizationSuspended
          description: >-
            Why this `Certificate` is not in service, where the cause is the owning `Organization` rather than this
            record's own `status`. Present, and non-empty, exactly while `effectiveStatus` is `NotInService`; absent
            while the record is in service. The two are one value in two shapes and never disagree, and an empty array
            is not a state either of them has. Maintained by the platform; not accepted in any request body.
