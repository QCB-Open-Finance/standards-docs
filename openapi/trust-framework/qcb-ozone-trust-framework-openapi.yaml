    JwksConfig:
      title: JwksConfig
      description: >-
        The ecosystem's key policy — who may create a key store, where key material is published, and what is permitted
        for each kind of key. One record per configuration version.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key. One record holds the whole ecosystem key policy.
          examples:
            - 2d8b6f14-3c50-4a97-be21-7f0a5c9d4e83
        configuration:
          $ref: '#/components/schemas/ConfigurationRef'
          description: >-
            The configuration version this record belongs to. Every configuration record in one version references it,
            and exactly one version is active at a time.
          examples:
            - id: 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
              version: '2026.09'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/JwksOwnerPermission'
          minItems: 1
          description: >-
            Which ecosystem roles may create a key store, per kind of holder. A holder kind absent from this collection
            may not have one created at all.
        urlTemplates:
          type: array
          items:
            $ref: '#/components/schemas/JwksUrlTemplate'
          minItems: 6
          description: >-
            Where the Trust Framework publishes key material, one row per kind of holder and purpose. Every kind of
            holder needs both a live JWKS URL and a revoked-keys URL, which is why there are at least six; `X5u` rows
            are additional, for holder kinds whose policy permits an uploaded chain.
        keyPolicies:
          type: array
          items:
            $ref: '#/components/schemas/JwkKeyPolicy'
          minItems: 1
          description: >-
            What the ecosystem permits, **per kind of key**. A key type is enabled by having a row here and forbidden by
            not having one. The answers genuinely differ per type: a transport key is an mTLS credential and nearly
            always needs a chain from a recognized CA, while a signing key may legitimately be a bare uploaded key.
        publishWhenNotInService:
          type: boolean
          description: >-
            Whether a key store stays published once it is no longer in service. `true` keeps the JWKS document
            reachable so a relying party can still verify signatures made while the organization was active; `false`
            withdraws the document entirely.
          examples:
            - true
        createdByOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organisation the record is attributed to. Always present, by one of three routes, which
            `createdByChannel` tells apart:<br/>- `api` or `ui` — resolved from the access token. Both the
            client-credentials and the authorization-code grant identify an organisation.<br/>- `system` — there was no
            caller, so it is inherited from the record whose change caused this one. A cascade is attributed to whoever
            set off the cascade.<br/>- `dataload` — the organisation operating this API, which ran the load.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
