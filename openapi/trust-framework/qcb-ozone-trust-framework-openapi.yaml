        - The access token MUST carry `create:certificates:all` or `create:certificates:own`. Either admits the call.
        Which records it then reaches is the access rule below, not this one. Otherwise `403`.

        - The `Certificate` the caller is creating MUST be its own. With `create:certificates:all` it may be created for
        anyone. With `create:certificates:own` it may be created only for the caller itself. The certificate's `owner`
        is the principal — its subject, not its issuer. Otherwise `403`.

        - `x5c[0]` MUST parse as an X.509 certificate. Otherwise `422`.

        - The chain MUST terminate at a certificate authority the ecosystem trusts, per the `CaConfiguration` records of
        the active `Configuration`. A chain that validates against nothing attests to nothing. Otherwise `422`.

