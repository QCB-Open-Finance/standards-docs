    ResourceCertification:
      title: ResourceCertification
      description: >-
        A compliance certification recorded against one resource — the standard it was certified against, the body that
        certified it, and the dates it runs between.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key of the certification record, distinct from the resource it certifies.
          examples:
            - 8c1f5b30-7a26-4d94-b6e0-2f8a4c1d9e57
        resource:
          $ref: '#/components/schemas/ResourceRef'
          description: >-
            The resource this certification is against. Set from the path when the record is created, never sent in the
            body, and fixed for the life of the record.
          examples:
            - id: 3e7a1d86-5c04-4b93-8f26-1a9d0c5e7b34
              name: Example Bank Production AS
        resourceCertificationConfig:
          $ref: '#/components/schemas/ResourceCertificationConfigRef'
          description: >-
            The kind of certification this is. The standard's name and the rules for recording it come from here, and
            the values copied onto this record at issuance do not change when it does.
          examples:
            - id: 2c8e5f41-7b30-4d96-a1e7-5f0b3c9d6a28
              certificationTypeName: FAPI 2.0 Advanced
        certificationTypeName:
          type: string
          description: The standard certified against, as the certifying body names it.
          examples:
            - FAPI 2.0 Advanced
        certifiedBy:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The body that performed the certification — the OpenID Foundation, a conformance laboratory. Not necessarily
            the organization that recorded it here, which is `createdByOrganization`, and the two differ whenever a
            certification awarded elsewhere is entered into the Trust Framework.
          examples:
            - id: 1a7d3e90-b2c4-4f16-8a55-9c0e2d4f6b81
              organizationName: Example Bank plc
        certificationUri:
          type: string
          format: uri
          description: >-
            Where the certification can be looked up at the certifying body — an entry in a public conformance register.
            Absent where the body publishes none. This is what makes a recorded certification checkable by a relying
            party rather than merely asserted.
          examples:
            - https://openid.net/certification/#FAPI2_OPs
        certificationReference:
          type: string
          description: >-
            The certifying body's own reference for this certification. Supplied by whoever records it; the Trust
            Framework neither generates nor validates it.
          examples:
            - OIDF-FAPI2-2026-0417
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Attributes specific to this kind of certification — profile, test suite version, deployment scope. What may
            appear here is fixed by `ResourceCertificationConfig.supplementaryInformationSchema`.
        issueDate:
          type: string
          format: date
          description: >-
            The date the certifying body granted the certification. Supplied at registration, not stamped by the Trust
            Framework.
          examples:
            - '2026-05-06'
        expiryDate:
          type: string
          format: date
          description: >-
            The date the certification lapses, as the certifying body set it. Absent means there is no fixed renewal
            cycle.
          examples:
            - '2027-05-05'
        status:
          type: string
          enum:
            - Valid
            - Expired
            - Revoked
          description: >-
            Whether the certification stands. `Valid` does; `Expired` is past its expiry date; `Revoked` was withdrawn.
            The last two are final.
          examples:
            - Valid
        owner:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization that owns this `ResourceCertification`, through its `resource`. Set by
            `createResourceCertification`; not accepted in any request body.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        effectiveStatus:
          $ref: '#/components/schemas/EffectiveStatus'
          description: >-
            Whether this `ResourceCertification` is actually in service. `status` is what an operator asked for; this is
            what the ecosystem gets, once the condition of the `Resource` certified is taken into account. Maintained by
            the platform; not accepted in any request body.
