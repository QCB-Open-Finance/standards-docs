    PublicKey:
      title: PublicKey
      description: >-
        The public key's own parameters, named as RFC 7517 names them. A reader can verify a signature from these alone,
        without fetching a certificate chain and parsing it.
      type: object
      properties:
        'n':
          type: string
          description: The RSA modulus, base64url-encoded, as RFC 7518 defines it.
          examples:
            - 0vx7agoebGcQ...
        e:
          type: string
          description: The RSA public exponent, base64url-encoded. Almost always AQAB.
          examples:
            - AQAB
        crv:
          type: string
          description: The elliptic curve this key is on, by its registered name.
          examples:
            - P-256
        x:
          type: string
          description: The x coordinate of the EC public key point, base64url-encoded.
          examples:
            - f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
        'y':
          type: string
          description: The y coordinate of the EC public key point, base64url-encoded.
          examples:
            - x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
      additionalProperties: false
    RelatedOrganization:
      title: RelatedOrganization
      description: >-
        A relationship between two organizations — a subsidiary of a group, an agent acting for a principal, a
        distributor for a manufacturer — with the kind of link it is and the dates it runs between. Two organizations
        related in more than one way have one of these per kind.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key of the link itself, distinct from either organization it joins.
          examples:
            - c92e6a37-4b18-4d05-9f73-2a6d8c0e5b41
        fromOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization the link is stated from — the subsidiary, the agent, the operator. Carried in the path
            rather than the body.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        toOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization the link is stated to — the parent, the principal, the operator. Carried in the body rather
            than the path.
          examples:
            - id: 1a7d3e90-b2c4-4f16-8a55-9c0e2d4f6b81
              organizationName: Example Bank plc
        relationshipType:
          type: string
          description: >-
            What kind of relationship this is. The value must be one `RelatedOrganizationConfig.relationshipTypes`
            names, and that entry is what says whether the link reads the same in both directions or has an inverse.
          examples:
            - SubsidiaryOf
        effectiveFromDate:
          type: string
          format: date
          description: The date the relationship takes effect, supplied by whoever states it. Not the date the record was created.
          examples:
            - '2026-03-01'
        effectiveToDate:
          type: string
          format: date
          description: The date the relationship ends, supplied by whoever states it. Omitted while the link is open-ended.
          examples:
            - '2028-02-29'
        deactivationReason:
          type: string
          description: >-
            Why the relationship ended. Required when `status` is `Ended` and absent otherwise, and must be one of the
            reasons `RelatedOrganizationConfig.deactivationReasons` lists. Supplied when calling
            `endRelatedOrganization`, and on no other request.
          examples:
            - Divested
        status:
          type: string
          enum:
            - Active
            - Ended
          description: Whether the relationship is in force. `Active` is; `Ended` is not, and is final.
          examples:
            - Active
        effectiveStatus:
          $ref: '#/components/schemas/EffectiveStatus'
          description: >-
            Whether this `RelatedOrganization` is actually in service. `status` is what an operator asked for; this is
            what the ecosystem gets, once the condition of `fromOrganization` and `toOrganization` is taken into
            account. Maintained by the platform; not accepted in any request body.
