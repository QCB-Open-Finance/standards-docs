        others are left out of the list rather than refused, so a page may be shorter than its limit, and `meta` counts
        what the caller can see, not what exists.

        - The access token MUST carry `view:resources:all` or `view:resources:own`. Either admits the call. Which
        records it then reaches is the access rule below, not this one. Otherwise `403`.


        Every operation is also subject to the **common rules** — client certificate, access token, scope, caller
        status, schema validation, visibility. They are set out once under **Common rules** in this API's description,
        and are not repeated on each operation.
      tags:
