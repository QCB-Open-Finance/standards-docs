servers:
  - url: https://directory.example.org
    description: >-
      Placeholder. This document specifies an API rather than describing a deployment of one — the host is whichever
      organisation operates this API for a given ecosystem, and there is no single correct value.
security: []
tags:
  - name: parties
    description: >-
      The organizations and people the Trust Framework holds a record of: the identifiers by which each is legally
      known, how to reach them, which people are assigned to act for which organization and in what capacity, and the
      customer-facing brands an organization trades under.
  - name: access-control
    description: >-
      Login accounts for the Trust Framework's own web UI and API, and the access level each account holds within each
      organization it acts for. Distinct from the ecosystem roles a participant holds, which are conferred by
      entitlements.
  - name: licensing
    description: >-
      The ecosystem roles a participant can hold, the licenses, certifications and authorizations that confer them, and
      the accrediting authorities entitled to issue those.
  - name: resources
    description: >-
      The infrastructure a participant operates and the applications it registers: authorization servers and API
      endpoints with the addresses they publish, the compliance certifications recorded against them, and the signed
      software statements issued for client applications.
  - name: pki
    description: >-
      Key stores, the individual keys inside them, and the X.509 certificates issued against them — everything a
      participant publishes so that a counterparty can verify what it signs and trust what it presents at the TLS
      handshake.
  - name: configuration
    description: >-
      The ecosystem's own settings: what may be recorded on each kind of record, which values each configurable list may
      take, and what a participant must hold in order to register one. One set of these is in force at a time, and every
      record here names the version it belongs to.
  - name: configuration-versions
    description: >-
      Versions of the ecosystem's configuration, and the history of which one was live when. Exactly one version is
      active; changing the rules means building a new version and activating it, and an earlier version can be activated
      again to roll back.
components:
  schemas:
    AddressType:
      title: AddressType
      description: >-
        What kind of address this is, aligned with ISO 20022 `AddressType2Code` — `Residential` (HOME), `Business`
        (BIZZ), `Registered` and `Correspondence` (both ADDR in ISO, split here because a register of parties
        distinguishes them), `POBox` (PBOX), `DeliveryTo` (DLVY) and `MailTo` (MLTO).
      type: string
      enum:
        - Residential
        - Business
        - Registered
        - Correspondence
        - POBox
        - DeliveryTo
        - MailTo
    Channel:
      title: Channel
      description: >-
        How a write reached the Trust Framework.<br/>- `api` — a machine caller, authenticated by client
        credentials.<br/>- `ui` — a person at a screen, authenticated through the authorization code flow.<br/>-
        `system` — the platform itself, with no caller at all: a time-based transition, or a cascade from an operation
        on another record. This is the value that tells a record which expired apart from one somebody revoked by
        hand.<br/>- `dataload` — a bulk import performed by whoever operates this API, typically to seed an ecosystem or
        to migrate one in. A record written this way was never the outcome of a request, so nothing about it should be
        read as somebody having acted at that moment.
      type: string
      enum:
        - api
        - ui
        - system
        - dataload
    TrustFrameworkScope:
      title: TrustFrameworkScope
      description: >-
        What a caller may do in the Trust Framework itself, as it appears in the access token issued by this API's own
        OIDC provider. Structured as `<verb>:<resource>[:<qualifier>]` — `view:configurations`,
        `view:organizations:own`, `action:configurations:activate` — so a scope can be read at a glance and matched by
        prefix. `own` and `all` appear only where the resource has an owner; where nothing owns it there is nothing for
        `own` to contrast with, so the verb and the resource are the whole scope. Holding the scope is what permits the
        operation, so an authorisation decision is a check on the token rather than a lookup. Not to be confused with an
        EcosystemScope, which is what a participant's application requests of other participants.
      type: string
      enum:
        - create:assignment-config
        - create:assignments:all
        - create:assignments:own
