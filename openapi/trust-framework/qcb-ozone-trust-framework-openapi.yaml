    RelatedOrganizationNew:
      title: RelatedOrganizationNew
      description: >-
        The fields a caller supplies when creating a `RelatedOrganization`.<br/><br/>A relationship between two
        organizations — a subsidiary of a group, an agent acting for a principal, a distributor for a manufacturer —
        with the kind of link it is and the dates it runs between. Two organizations related in more than one way have
        one of these per kind.
      type: object
      properties:
        toOrganization:
          type: string
          format: uuid
          description: >-
            The organization the link is stated to — the parent, the principal, the operator. Carried in the body rather
            than the path.
          examples:
            - 1a7d3e90-b2c4-4f16-8a55-9c0e2d4f6b81
        relationshipType:
          type: string
          description: >-
            What kind of relationship this is. The value must be one `RelatedOrganizationConfig.relationshipTypes`
            names, and that entry is what says whether the link reads the same in both directions or has an inverse.
          examples:
            - SubsidiaryOf
        effectiveFromDate:
          type: string
          format: date
          description: The date the relationship takes effect, supplied by whoever states it. Not the date the record was created.
          examples:
            - '2026-03-01'
        effectiveToDate:
          type: string
          format: date
          description: The date the relationship ends, supplied by whoever states it. Omitted while the link is open-ended.
          examples:
            - '2028-02-29'
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Ecosystem-specific attributes of the link. What may appear here is fixed by
            `RelatedOrganizationConfig.supplementaryInformationSchema`.
      required:
        - toOrganization
        - relationshipType
        - effectiveFromDate
      additionalProperties: false
    RelatedOrganizationPatch:
      title: RelatedOrganizationPatch
      description: >-
        The fields a caller may change on a `RelatedOrganization`.<br/><br/>A relationship between two organizations — a
        subsidiary of a group, an agent acting for a principal, a distributor for a manufacturer — with the kind of link
        it is and the dates it runs between. Two organizations related in more than one way have one of these per kind.
      type: object
      properties:
        effectiveFromDate:
          type: string
          format: date
          description: The date the relationship takes effect, supplied by whoever states it. Not the date the record was created.
          examples:
            - '2026-03-01'
        effectiveToDate:
          type: string
          format: date
          description: The date the relationship ends, supplied by whoever states it. Omitted while the link is open-ended.
          examples:
            - '2028-02-29'
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Ecosystem-specific attributes of the link. What may appear here is fixed by
            `RelatedOrganizationConfig.supplementaryInformationSchema`.
      minProperties: 1
      additionalProperties: false
    RelatedOrganizationConfigNew:
      title: RelatedOrganizationConfigNew
      description: >-
        The fields a caller supplies when creating a `RelatedOrganizationConfig`.<br/><br/>The ecosystem's settings for
        links between organizations — which kinds of relationship may be recorded, how each reads from either end, and
        the reasons a link may end. One record per configuration version.
      type: object
      properties:
        configuration:
          type: string
          format: uuid
          description: >-
            The configuration version this record belongs to. Every configuration record in one version references it,
            and exactly one version is active at a time.
          examples:
            - 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
        relationshipTypes:
          type: array
          items:
            $ref: '#/components/schemas/RelatedOrganizationType'
          minItems: 1
          description: >-
            The kinds of relationship that may be recorded between two organizations.
            `RelatedOrganization.relationshipType` must name one of these.
        deactivationReasons:
          type: array
          items:
            type: string
          minItems: 1
          description: The reasons a link may end. `RelatedOrganization.deactivationReason` must be one of these.
          examples:
            - - Divested
              - AgreementTerminated
              - Rebranded
              - Superseded
        supplementaryInformationSchema:
          type: object
          additionalProperties: true
          description: The JSON Schema that `RelatedOrganization.supplementaryInformation` is validated against.
      required:
        - configuration
        - relationshipTypes
        - deactivationReasons
      additionalProperties: false
    ResourceNew:
      title: ResourceNew
      description: >-
        The fields a caller supplies when creating a `Resource`.<br/><br/>One piece of infrastructure an organization
        operates and publishes to the ecosystem — an authorization server, an API resource, a gateway. What kind it is,
        and what it must carry, are set by the resource type it is registered under.
      type: object
      properties:
        resourceConfig:
          type: string
          format: uuid
          description: The registered resource type this resource is an instance of, and whose rules governed its registration.
          examples:
            - 0b6e4c19-8d37-4f52-a9c1-5e2b7a0d3f68
        resourceType:
          type: string
          description: >-
            What kind of infrastructure this is — an authorization server, an API resource, a gateway. A string rather
            than a fixed list: the set of kinds is whichever `ResourceConfig.resourceType` values this ecosystem has
            registered.
          examples:
            - AuthorizationServer
        keyStore:
          type: string
          format: uuid
          description: >-
            The resource's own key store. Required for resource types whose `ResourceConfig.hasJwks` is true, and absent
            otherwise.
          examples:
            - 5f9c3a72-1e48-4b06-8d95-2c7e0b4a6f31
        reliesOnEcosystemRole:
          type: string
          format: uuid
          description: >-
            The ecosystem role the operator must hold for this registration to stand. Recorded at creation, so a later
            change to the resource type does not alter what this resource was permitted under. Losing the role suspends
            the resource.
          examples:
            - 2f7b9c14-8a03-4e56-b7d1-4c9e0a2f6b85
        jurisdictionScope:
          $ref: '#/components/schemas/JurisdictionScope'
          description: >-
            Whether this resource serves everywhere, or only within the jurisdictions listed below. A resource may only
            claim a jurisdiction its operator is entitled in: every claim has to be backed by an active entitlement
            conferring the role this registration relies on.
          examples:
            - Limited
        jurisdictions:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            The jurisdictions this resource serves. Required when `jurisdictionScope` is `Limited` and absent when it is
            `Global`. Each value must be one `JurisdictionConfig.jurisdictions` lists, and each must be covered by an
            active entitlement the operator holds. Losing that cover suspends the resource.
          examples:
            - - GB
        name:
          type: string
          description: The resource as the operator names it, shown wherever participants are listed.
          examples:
            - Example Bank Production AS
        uris:
          type: array
          items:
            $ref: '#/components/schemas/ResourceUri'
          minItems: 1
          description: >-
            Where the resource is reachable, one entry per kind of URI it publishes — an issuer, a discovery document, a
            token endpoint, a JWKS.
        brands:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: >-
            The brands this resource is presented under. Every brand named must be one its `owner` operates and must be
            `Active`. Whether this record may name no brand, exactly one, or several is fixed by the
            `BrandConfig.brandAssociations` entry for `Resource` — `0..0` there means this field is absent.
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Technical and operational attributes specific to the ecosystem. What may appear here is fixed by
            `ResourceConfig.supplementaryInformationSchema`.
      required:
        - resourceConfig
        - resourceType
        - jurisdictionScope
        - name
        - uris
      additionalProperties: false
    ResourcePatch:
      title: ResourcePatch
      description: >-
        The fields a caller may change on a `Resource`.<br/><br/>One piece of infrastructure an organization operates
        and publishes to the ecosystem — an authorization server, an API resource, a gateway. What kind it is, and what
        it must carry, are set by the resource type it is registered under.<br/><br/>**`jurisdictions`, `uris`, `brands`
        are lists and they are replaced in full.** Sending one of them sets the field to exactly the members in your
        request; members the record holds and your request omits are removed.
      type: object
      properties:
        keyStore:
          type: string
          format: uuid
          description: >-
            The resource's own key store. Required for resource types whose `ResourceConfig.hasJwks` is true, and absent
            otherwise.
          examples:
            - 5f9c3a72-1e48-4b06-8d95-2c7e0b4a6f31
        jurisdictionScope:
          $ref: '#/components/schemas/JurisdictionScope'
          description: >-
