        requires, and `reliesOnEcosystemRole` MUST be set to it. (when the governing config names a required role)
        Otherwise `403`.

        - The caller MUST have write access to the record. With `edit:software-statements:all` that is every
        `SoftwareStatement`. With `edit:software-statements:own` it is the caller's own records only. The application's
        `organization` is the principal. Otherwise `403`.

        - The access token MUST carry `edit:software-statements:all` or `edit:software-statements:own`. Either admits
        the call. Which records it then reaches is the access rule below, not this one. Otherwise `403`.

        - Every value in `brands` MUST resolve to an existing `Brand`. Otherwise `422`.

        - Every `Brand` named MUST have an `organization` equal to the associating record's organization, per the table
        above. A record may wear only its own operator's brands. Otherwise `422`.

        - Every `Brand` named MUST have `status` `Active`. A `Draft` brand has not entered service, a `Suspended` one
        has been taken out of use, and a `Deactivated` one has gone for good. Otherwise `409`.

        - The number of values MUST satisfy the cardinality for this kind on the active `BrandConfig`, per the table
