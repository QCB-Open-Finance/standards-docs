    BrandAssociableType:
      title: BrandAssociableType
      description: >-
        The kinds of record that may be associated with a brand — a piece of infrastructure, a registered application,
        or a key store.
      type: string
      enum:
        - Resource
        - SoftwareStatement
        - Jwks
    BrandAssociationCardinality:
      title: BrandAssociationCardinality
      description: >-
        How many brands a record of a given kind may name, written as a cardinality: `0..0` not at all, `0..1` at most
        one, `1..1` exactly one, `0..M` any number including none, `1..M` at least one.
      type: string
      enum:
        - 0..0
        - 0..1
        - 1..1
        - 0..M
        - 1..M
    EffectiveStatus:
      title: EffectiveStatus
      description: >-
        Whether a record is actually in service. `status` is what an operator asked for; this is what the ecosystem
        gets, once the condition of the record's owning organization is taken into account. A record an operator left
        `Active` is `NotInService` while its organization is deactivated, and returns to `Active` of its own accord when
        the organization does.
      type: string
      enum:
        - Active
        - NotInService
    EntitlementType:
      title: EntitlementType
      description: >-
        The kinds of entitlement an entitlement can be: a license, a certification, an authorization, or the delegation
        of an authority's power to issue.
      type: string
      enum:
        - License
        - Certification
        - Authorization
        - Delegated
    JurisdictionScope:
      title: JurisdictionScope
      description: >-
        Whether something reaches everywhere or only within named jurisdictions. `Global` has no territorial limit;
        `Limited` confines it to an accompanying list of jurisdictions.
      type: string
      enum:
        - Global
        - Limited
    JwkKeyType:
      title: JwkKeyType
      description: >-
        What a key is used for in the ecosystem's protocols — signing, encryption, transport, or a purpose the ecosystem
        defines for itself.
      type: string
      enum:
        - Signing
        - Encryption
        - Transport
        - Custom
    JwksUrlPurpose:
      title: JwksUrlPurpose
      description: What a JWKS publishing URL serves — the live key set, the revoked key set, or an X.509 chain for one key.
      type: string
      enum:
        - Jwks
        - RevokedJwks
        - X5u
    KeyMaterialRequirement:
      title: KeyMaterialRequirement
      description: Whether a piece of key material must be present, may be present, or is not accepted at all.
      type: string
      enum:
        - Mandatory
        - Optional
        - Unsupported
    NotInServiceReason:
      title: NotInServiceReason
      description: >-
        Why a record is not in service. Each value names something true of the record's owner, not of the record itself
        — a record with its own `status` of `Inactive` is simply inactive and needs no reason here.
      type: string
      enum:
        - OrganizationDeactivated
        - OrganizationSuspended
        - PersonDeactivated
        - PersonSuspended
        - FromOrganizationDeactivated
        - FromOrganizationSuspended
        - ToOrganizationDeactivated
        - ToOrganizationSuspended
        - IssuingAuthorityNotInService
        - ResourceDeactivated
        - ResourceSuspended
        - KeyStoreNotInService
    Address:
      title: Address
      description: >-
        A postal address, in structured fields, in free-form lines, or both. Every field is optional: which of them are
        mandatory is a matter for each ecosystem.
      type: object
      properties:
        addressType:
          $ref: '#/components/schemas/AddressType'
          description: What kind of address this is, from the ISO 20022-aligned set.
          examples:
            - Registered
        department:
          type: string
          description: Department within the organization, where the address needs one.
          examples:
            - Compliance
        subDepartment:
          type: string
          description: Sub-department, where the department alone is not enough.
          examples:
            - Financial Crime
        street:
          type: string
          description: Street name, without the building number.
          examples:
            - Threadneedle Street
        building:
          type: string
          description: Building name or number on that street.
          examples:
            - '42'
        postCode:
          type: string
          description: Postal or ZIP code, unvalidated by the Trust Framework.
          examples:
            - EC2R 8AH
        town:
          type: string
          description: Town or city of the address.
          examples:
            - London
        countrySubDivision:
          type: string
          description: County, state or province, where the country uses one.
          examples:
            - Greater London
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: ^[A-Z]{2}$
          examples:
            - GB
        addressLine:
          type: array
          items:
            type: string
          description: >-
            The address as free-form lines, for addresses the structured fields above cannot express. Either form may be
            used; ecosystems differ on which they mandate.
      additionalProperties: false
    Assignment:
      title: Assignment
      description: >-
        The assignment of a person to an organization in one designation — an officer, an authorized representative, a
        technical contact — with the dates it runs between. A person holding two designations at one organization has
        two assignments.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key of the assignment link itself, distinct from either end it joins.
          examples:
            - b81c4f26-9d70-4a35-8e12-3f5a7c0b6d94
        organization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The assigning organization. Set from the path when the record is created, never sent in the body, and fixed
            for the life of the record.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        person:
          $ref: '#/components/schemas/PersonRef'
          description: The person being assigned. Carried in the body rather than the path.
          examples:
            - id: 5d9e7f31-2a4b-4c68-b0f7-8e1c6a3d9b52
              displayName: Alex Whittaker
        designation:
          type: string
          description: >-
            What the person is assigned as — an officer, an authorized representative, a technical contact. One
            designation per assignment, and the value must be one `AssignmentConfig.designations` lists.
          examples:
            - Officer
        profile:
          $ref: '#/components/schemas/ProfileRef'
          description: >-
            The assignee's access level in the Trust Framework. It must resolve to a subset of the roles the assigning
            organization's own profile resolves to: a person cannot hold more Trust Framework power than the
            organization they act for.
          examples:
            - id: 6b91d4c0-3e57-42a8-9f16-8d0a2c7e5b39
              profileName: EcosystemParticipant
        deactivationReason:
          type: string
          description: >-
            Why the assignment ended. Required when `status` is `Ended` and absent otherwise, and must be one of the
            reasons `AssignmentConfig.deactivationReasons` lists. Supplied when calling `endAssignment`, and on no other
            request.
        status:
          type: string
          enum:
            - Draft
            - Active
            - Ended
          description: >-
            Whether the assignment is in force. `Draft` has been recorded but confers nothing yet; `Active` is in force;
            `Ended` is not, and is final.
          examples:
            - Active
        effectiveStatus:
          $ref: '#/components/schemas/EffectiveStatus'
          description: >-
            Whether this `Assignment` is actually in service. `status` is what an operator asked for; this is what the
            ecosystem gets, once the condition of the owning `Organization` and the `Person` assigned is taken into
            account. Maintained by the platform; not accepted in any request body.
          examples:
            - Active
        notInServiceReasons:
          type: array
          items:
            type: string
            enum:
              - OrganizationDeactivated
              - OrganizationSuspended
              - PersonDeactivated
              - PersonSuspended
          description: >-
            Why this `Assignment` is not in service, where the cause is the owning `Organization` and the `Person`
            assigned rather than this record's own `status`. Present, and non-empty, exactly while `effectiveStatus` is
            `NotInService`; absent while the record is in service. The two are one value in two shapes and never
            disagree, and an empty array is not a state either of them has. Maintained by the platform; not accepted in
            any request body.
        createdByOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organisation the record is attributed to. Always present, by one of three routes, which
            `createdByChannel` tells apart:<br/>- `api` or `ui` — resolved from the access token. Both the
            client-credentials and the authorization-code grant identify an organisation.<br/>- `system` — there was no
            caller, so it is inherited from the record whose change caused this one. A cascade is attributed to whoever
            set off the cascade.<br/>- `dataload` — the organisation operating this API, which ran the load.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        createdByUser:
          $ref: '#/components/schemas/UserRef'
          description: >-
            The user account that created the record. Present only where a person was at the other end of the request —
            that is, where `createdByChannel` is `ui`. Absent for `api`, which authenticates an organisation and no
            person, and absent for `system` and `dataload`, which have no caller at all. Its absence is information
            rather than a gap.
          examples:
            - id: e04a2b78-6c1d-4f93-a5e8-7b2f9d0c3a61
              fullName: Amara Okafor
        createdByChannel:
          $ref: '#/components/schemas/Channel'
          description: >-
            How the record was created. Read from the access token, never from the request body: `ui` where the token
            carries the `trust-framework-ui` scope, `api` otherwise. Send this field and it is ignored. `system` and
            `dataload` both cover records written with no caller — a time-based transition or a cascade for the first, a
            bulk import for the second — so both take their organisation from elsewhere, as the creating-organisation
            field beside this one describes, and neither ever carries a user.
          examples:
            - api
        createdAt:
          type: string
          format: date-time
          description: >-
            When the Trust Framework created this record. System-owned — set by the platform at write time and never
            supplied by a caller.
          examples:
            - '2026-03-14T09:12:44+00:00'
        lastUpdatedAt:
          type: string
          format: date-time
          description: >-
            When the Trust Framework last changed this record. System-owned — equal to `createdAt` until something
            changes it, and never supplied by a caller.
          examples:
            - '2026-08-02T16:41:07+00:00'
        lastUpdatedByOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organisation the last change is attributed to, by the same three routes as the creating organisation and
            told apart the same way by `lastUpdatedByChannel`. Equal to the creating organisation until something
            changes the record.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        lastUpdatedByUser:
          $ref: '#/components/schemas/UserRef'
          description: >-
            The user account that last changed the record. Present only where `lastUpdatedByChannel` is `ui`; absent for
            a machine caller, for a change the platform made itself, and for a bulk load.
          examples:
            - id: e04a2b78-6c1d-4f93-a5e8-7b2f9d0c3a61
              fullName: Amara Okafor
        lastUpdatedByChannel:
          $ref: '#/components/schemas/Channel'
          description: >-
            How the record was last changed. Read from the access token the same way as `createdByChannel` — `ui` where
            it carries `trust-framework-ui`, `api` otherwise — and never from the request body. `system` is the value
            for a time-based transition or a cascade, which is how an expiry is told apart from someone revoking by
            hand, and `dataload` for a change made by a bulk import rather than by a request.
          examples:
            - api
      required:
        - id
        - organization
        - person
        - designation
        - profile
        - status
        - effectiveStatus
        - createdByOrganization
        - createdByChannel
        - createdAt
        - lastUpdatedAt
        - lastUpdatedByOrganization
        - lastUpdatedByChannel
      additionalProperties: false
