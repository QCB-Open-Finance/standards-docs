    EntitlementConfig:
      title: EntitlementConfig
      description: >-
        One kind of entitlement the ecosystem recognizes — what it is called, which authority issues it, and which
        ecosystem roles it confers. Every entitlement is issued against one of these.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key. One config record per license or certification type.
          examples:
            - d13f7a58-6b04-4c92-8e71-3a9c5f2e0b46
        configuration:
          $ref: '#/components/schemas/ConfigurationRef'
          description: >-
            The configuration version this record belongs to. Every configuration record in one version references it,
            and exactly one version is active at a time.
          examples:
            - id: 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
              version: '2026.09'
        entitlementTypeName:
          type: string
          description: The type as the issuing regime names it.
          examples:
            - AIS
        entitlementType:
          $ref: '#/components/schemas/EntitlementType'
          description: >-
            Which kind of grant this type produces. Copied onto every `Entitlement` issued against this config, so a
            grant says what it is without resolving back here.
          examples:
            - License
        delegatedTo:
          $ref: '#/components/schemas/EcosystemRoleRef'
          description: >-
            The ecosystem role a caller must hold to issue an entitlement of this type **on the authority's behalf**.
            Absent where only the authority itself may issue. The delegation is itself an entitlement, of
            `entitlementType` `Delegated`, conferring the role named here.
          examples:
            - id: 8d5f3a92-7c16-4e40-b283-1f9a6c0e5d78
              roleName: PISP
        issuingAuthority:
          type: string
          format: uuid
          description: >-
            The authority on whose behalf entitlements of this type are issued. Copied onto every entitlement issued
            against this config.
          examples:
            - 6e1d8b45-3f92-4a07-bc58-9d0f2a6e4b13
        effectiveEcosystemRoles:
          type: array
          items:
            $ref: '#/components/schemas/EcosystemRoleRef'
          minItems: 1
          description: >-
            The ecosystem roles an entitlement of this type confers. Not a default that issuance may override — it is
            what the grant gives, and it is copied onto every entitlement issued against this config.
        effectiveProfiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileRef'
          minItems: 1
          description: >-
            The Trust Framework access levels an entitlement of this type confers on the organization holding it. A
            `TrustFrameworkClient` may name any of these and none that is not here, so this is what decides how much of
            the Trust Framework API a participant can reach by virtue of what it is licensed to do.
        supplementaryInformationSchema:
          type: object
          additionalProperties: true
          description: The JSON Schema that `Entitlement.supplementaryInformation` is validated against.
        createdByOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organisation the record is attributed to. Always present, by one of three routes, which
            `createdByChannel` tells apart:<br/>- `api` or `ui` — resolved from the access token. Both the
            client-credentials and the authorization-code grant identify an organisation.<br/>- `system` — there was no
            caller, so it is inherited from the record whose change caused this one. A cascade is attributed to whoever
            set off the cascade.<br/>- `dataload` — the organisation operating this API, which ran the load.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        createdByUser:
          $ref: '#/components/schemas/UserRef'
          description: >-
            The user account that created the record. Present only where a person was at the other end of the request —
            that is, where `createdByChannel` is `ui`. Absent for `api`, which authenticates an organisation and no
            person, and absent for `system` and `dataload`, which have no caller at all. Its absence is information
            rather than a gap.
          examples:
            - id: e04a2b78-6c1d-4f93-a5e8-7b2f9d0c3a61
              fullName: Amara Okafor
        createdByChannel:
          $ref: '#/components/schemas/Channel'
          description: >-
            How the record was created. Read from the access token, never from the request body: `ui` where the token
            carries the `trust-framework-ui` scope, `api` otherwise. Send this field and it is ignored. `system` and
            `dataload` both cover records written with no caller — a time-based transition or a cascade for the first, a
            bulk import for the second — so both take their organisation from elsewhere, as the creating-organisation
            field beside this one describes, and neither ever carries a user.
          examples:
            - api
        createdAt:
          type: string
          format: date-time
          description: >-
            When the Trust Framework created this record. System-owned — set by the platform at write time and never
            supplied by a caller.
          examples:
            - '2026-03-14T09:12:44+00:00'
        lastUpdatedAt:
          type: string
          format: date-time
          description: >-
            When the Trust Framework last changed this record. System-owned — equal to `createdAt` until something
            changes it, and never supplied by a caller.
          examples:
            - '2026-08-02T16:41:07+00:00'
        lastUpdatedByOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organisation the last change is attributed to, by the same three routes as the creating organisation and
            told apart the same way by `lastUpdatedByChannel`. Equal to the creating organisation until something
            changes the record.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        lastUpdatedByUser:
          $ref: '#/components/schemas/UserRef'
          description: >-
            The user account that last changed the record. Present only where `lastUpdatedByChannel` is `ui`; absent for
            a machine caller, for a change the platform made itself, and for a bulk load.
          examples:
            - id: e04a2b78-6c1d-4f93-a5e8-7b2f9d0c3a61
              fullName: Amara Okafor
        lastUpdatedByChannel:
          $ref: '#/components/schemas/Channel'
          description: >-
            How the record was last changed. Read from the access token the same way as `createdByChannel` — `ui` where
            it carries `trust-framework-ui`, `api` otherwise — and never from the request body. `system` is the value
            for a time-based transition or a cascade, which is how an expiry is told apart from someone revoking by
            hand, and `dataload` for a change made by a bulk import rather than by a request.
          examples:
            - api
      required:
        - id
        - configuration
        - entitlementTypeName
        - entitlementType
        - issuingAuthority
        - effectiveEcosystemRoles
        - effectiveProfiles
        - createdByOrganization
        - createdByChannel
        - createdAt
        - lastUpdatedAt
        - lastUpdatedByOrganization
        - lastUpdatedByChannel
      additionalProperties: false
