        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listResources
      summary: List Resource records
      description: >-
        Read a page of `Resource` records. Scoped to the `orgId` in the path. Pass `updatedSince` to receive only what
