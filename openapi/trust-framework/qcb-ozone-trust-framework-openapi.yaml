info:
  title: Ozone Trust Framework — API
  x-sf-docs-util-menu-item-name: Trust Framework API
  summary: >-
    The registry of who participates in an open-finance ecosystem, what they are licensed to do, and the keys and
    certificates by which they prove it.
  version: v1.0.0
  description: >-
    The Ozone Trust Framework is the registry an open-finance ecosystem keeps of its own participants: the organizations
    taking part, the licenses and certifications they hold, the infrastructure and applications they operate, and the
    keys and certificates by which they prove who they are.<br/><br/>This specification describes the API that reads and
    maintains that registry. You will use it to register an organization and the people who act for it, record the
    entitlements it has been granted, publish the resources and software statements it operates, and manage the key
    stores behind them.<br/><br/>The sections below introduce the concepts the API is built from, and then the rules
    that apply to every call. Each resource and operation is documented in full further down.<br/><br/>Every response is
    wrapped as `{data, meta}` and every request body as `{data}`. `meta` is reserved for pagination and is empty for
    now. Any call may fail, and a failure carries an `ErrorBody` saying what went wrong.


    ## Concepts


    This section describes the over-arching concepts in the Ozone Trust Framework.


    Each concept is introduced here in one place. The packages, schemas and operations that realise it are described in
    detail later in this document.


    ### Organization


    An organization is a legal entity that participates in the ecosystem — a bank, a financial institution, a
    third-party provider, a regulator, a certificate authority. It is the thing the trust framework ultimately holds
    records about: nearly everything else here is owned by one, issued to one, or operated by one. An organization is
    identified by the identifiers a legal authority issued it, and it is sponsored into the ecosystem by another
    organization, with the root naming itself.


    Related: **Person**, **Brand**, **RelatedOrganization**, **Entitlement**


    ### Person


    A natural person the trust framework holds a record of — an officer, an authorized representative, a technical
    contact. A person exists independently of any organization and the same person may act for several. The trust
    framework's interest in a person is as somebody who acts for a participant, never as a customer of one.


    Related: **Organization**, **Assignment**, **Trust Framework Scopes**


    ### Assignment


    *A person acting for an organization in one named capacity.*


    The assignment of a person to an organization in one named capacity — an officer, an authorized representative, a
    technical contact. A person holding two capacities at one organization has two assignments, each ending separately,
    because a register of officers has to be able to end one without ending the other.


    Related: **Organization**, **Person**


    ### Brand


    *A customer-facing identity of an organization.*


    A customer-facing identity an organization trades under — the name and logo a consumer recognizes and chooses
    between. One organization may operate several, and infrastructure, applications and key stores may each be presented
    under one or more of its brands. Whether a brand may be associated with each of those, and how many, is configured
    by the ecosystem.


    Related: **Organization**, **Resource**, **SoftwareStatement**, **Key Store**


    ### RelatedOrganization


    *A relationship between two organizations.*


    A relationship between two organizations — a subsidiary of a group, an agent acting for a principal, a distributor
    for a manufacturer — with the kind of link it is and the dates it runs between. Two organizations related in more
    than one way have multiple links.


    Related: **Organization**, **Brand**


    ### Entitlement


    *A license or permission for an organization to carry out actions in the ecosystem.*


    A license, certification or authorization an organization holds, as granted by an accrediting authority. The
    entitlement confers the ecosystem roles the organization may act under. An organization may hold several
    entitlements, from several authorities.


    Related: **Organization**, **Authority**, **Jurisdiction**, **Resource**, **SoftwareStatement**


    ### Authority


    *An organization's capability to accredit others.*


    A body that may accredit participants — a regulator, a scheme operator, a certification body. An authority is not a
    separate kind of organization: it is a capability an organization holds, so an organization either is an accrediting
    authority or is not. An authority has an outer territorial bound, and every entitlement it issues is valid somewhere
    within it. What an authority may accredit is not listed on the authority itself: it is whatever the ecosystem's
    entitlement types name it as the issuer of.


    Related: **Organization**, **Entitlement**, **Jurisdiction**


    ### Jurisdiction


    *The territory a licence, an entitlement or a resource applies within.*


    The trust framework can keep note of the jurisdictions within which its entitlements can be applied. An organization
    may declare the jurisdictions within which its resources and software statements operate.


    Related: **Entitlement**, **Resource**


    ### Resource


    *Infrastructure operated by an organization that forms part of the ecosystem.*


    A piece of infrastructure an organization operates and publishes to the ecosystem — an authorization server, an API
    resource, a gateway. What kind it is, and what it must carry, are set by the resource type it is registered under.
    An organization operates a resource under an entitlement — for example, a bank entitled to run an authorization
    server in an ecosystem because it is licensed as a bank. A resource may be certified by a certification authority —
    for example, an authorization server holding a FAPI 2.0 certification. Resources may also declare the key stores
    that publish their public keys.


    Related: **Organization**, **Entitlement**, **Jurisdiction**, **Brand**, **Software Statement Attestation**, **Key
    Store**


    ### SoftwareStatement


    *A client application an organization has registered with the ecosystem.*


    A client application an organization has registered. It records the application's OAuth client identity and the
    ecosystem roles it activates — which may be a subset of the roles its organization holds, since an application need
    not use all of them. Like resources, software statements may also be certified, and may also be associated with key
    stores.


    Related: **Organization**, **Entitlement**, **Brand**, **Software Statement Attestation**


    ### Key Store


    *The public keys an organization publishes so others can verify what it signs.*


    A key store is a means for an organization to group and publish public keys that can be used to encrypt, or to
    verify signatures, for one or more of its resources or software statements.


    Related: **Organization**, **Resource**, **SoftwareStatement**, **Brand**


    ### Software Statement Attestation


    A software statement is used to generate Software Statement Assertions — a document signed by the trust framework
    that establishes and verifies the presence of a software statement at a given point in time.


    Related: **Resource**, **SoftwareStatement**, **Organization**


    ### Configuration


    *The settings an ecosystem chooses for itself, versioned as one set.*


    Everything an ecosystem sets for itself — which identifier types are recognized, what each kind of record may carry,
    which roles exist, what is permitted of keys. It is versioned as a set rather than per record: a version is built up
    while the current one stays live, then goes live in one step, and an earlier version can be made live again. Exactly
    one version is in force at a time, and every write is evaluated wholly against the version that was in force when it
    started.


    Related: **Jurisdiction**, **Brand**, **Trust Framework Scopes**


    ### Trust Framework Scopes


    The OAuth 2.0 scopes used to authorize users to make the API calls documented in this specification. The scopes are
    assigned to organizations, and through an assignment are made available to the users assigned to that organization.
    There is a deliberate separation between trust framework scopes, which say what a participant may do in the trust
    framework, and ecosystem roles, which say what a participant may do in the ecosystem.


    Related: **Organization**, **Person**, **Configuration**


    ### Trust Framework Client


    An OIDC client an organization registers so that it, or the people acting for it, can call the Trust Framework API.
    An organization may hold several: a machine integration and a staff-facing application need different key material,
    different grant types and different access levels, and one credential cannot be all of those at once. A client holds
    a set of access levels, which may be any the organization's entitlements confer on it and no more. Withdraw the
    entitlement behind one of them and the client stops working, without anyone editing it and without its operator's
    own intent being overwritten.


    Related: **Organization**, **Entitlement**, **Trust Framework Scopes**, **Key Store**


    ### Resource Status


    *Whether a record is actually in service, as opposed to what its operator asked for.*


    Whether a record is actually in service, which is not always the same as what its operator asked for. Each record
    carries a status its operator sets, and a separate effective status the trust framework works out. A resource left
    active by its operator stops being in service while the organization that owns it is deactivated, and returns to
    service when that organization does — without anyone having to set it again. This is why a record can appear active
    and still be refused: the status is the intent, and the effective status is what the ecosystem gets.


    Related: **Organization**, **Resource**, **SoftwareStatement**, **Entitlement**


    ## Common rules


    ### Before any operation runs


    - Call over mutual TLS with a client certificate the trust framework trusts and has not revoked. An expired or
    revoked certificate is refused before anything else is looked at. → `401` · `INVALID_CLIENT_CERTIFICATE`

    - Send an access token that is still valid and carries a scope the operation accepts. Each operation lists the
    scopes it will take; one of them is enough. Every operation here accepts both a client-credentials token and an
    authorization-code token — what differs is not which calls you can make but which records you can reach. → `401` ·
    `INVALID_ACCESS_TOKEN` / `403` · `INSUFFICIENT_SCOPE`

    - Your token must resolve to a participant that is in service. A client-credentials token must resolve to an
    organization whose effective status is `Active`; an authorization-code token must additionally resolve to a user
    whose effective status is `Active`. Note this is the **effective** status — an organization left `Active` by its own
    operator is still refused while something upstream holds it out of service. → `401` · `CALLER_NOT_ACTIVE`

    - What you may do is computed from your record, not from what you ask for. As an organization, it is the scopes of
    your profile. As a person, it is everything your roles add up to: hold two roles and you hold both their scopes,
    with no need to choose between them when you sign in. Ask for a scope you have not been granted and the token simply
    comes back without it, so check the token's `scope` claim rather than assuming you got what you requested. → `403` ·
    `OPERATION_NOT_PERMITTED`

    - Send a request that validates against the schema. The whole body is validated before anything is rejected, so the
    response lists every schema violation it found rather than only the first — one round trip tells you everything that
    is wrong with the request. → `400` · `INVALID_REQUEST`

    - A request that is well formed but cannot be carried out is refused separately from one that is malformed, so you
    can tell the two apart: `400` means the shape is wrong, `422` means the shape is right and the request is
    impossible. → `422` · `UNPROCESSABLE_REQUEST`

    - A `404` means either that there is no such record **or** that it exists and you cannot see it. The API does not
    distinguish the two, deliberately — so do not read a `404` as proof that something does not exist. → `404` ·
    `NOT_FOUND`

    - You can only move a record to a state its lifecycle allows from where it is now. Each resource documents its own
    states and the moves between them. → `409` · `INVALID_STATE_TRANSITION`

    - Some operations apply only while a record is in a particular state — deleting one, for instance, is usually
    possible only before it has been used. Refused with `409` · `INVALID_RESOURCE_STATE`, which tells you the record is
    in the wrong state, as opposed to `INVALID_STATE_TRANSITION`, which tells you the move you asked for does not exist.
    → `409` · `INVALID_RESOURCE_STATE`

    - When a person signs in, the token identifies them: `sub` is their user id — the same id the Trust Framework's own
    `/users` records use, so you can look the account up directly — and `given_name` and `family_name` are their first
    and last name as the Trust Framework holds them. A service account carries `sub` and no name claims; their absence
    tells you no person is behind the call. → `401` · `INVALID_ACCESS_TOKEN`

    - `:own` means "belongs to you". As an organization, that is your own records. As a person, it is the records of
    every organization you hold a role in — if you act for two, a `:own` scope reaches both, and you do not pick one
    when you sign in. → `403` · `OPERATION_NOT_PERMITTED`

    - A refused request changes nothing. If a call fails its checks, no record is written, no notification is sent, and
    you can retry once you have fixed the cause.


    ### What a refusal returns


    - Something named in the path is not there, or is not yours to see — `404` · `NOT_FOUND`

    - Something your request points at does not exist — `422` · `REFERENCE_NOT_FOUND` — the response names the offending
    field

    - Something your request points at exists but is not in a state that allows this — `409` ·
    `REFERENCE_IN_INVALID_STATE` — the response names the record and its state

    - You asked to move the record to a state its lifecycle does not reach from where it is — `409` ·
    `INVALID_STATE_TRANSITION`

    - Another record already holds a value that must be unique — `409` · `ALREADY_EXISTS` — the response names the key,
    with the scope that key actually has, not the field list

    - You are not entitled to do this, or it conflicts with the ecosystem's configuration — `403` where the caller lacks
    standing; `422` where the request is inconsistent with configuration · `NOT_ENTITLED` / `CONFIGURATION_VIOLATION`

    - The record is in a state this operation does not apply to — as distinct from gate 12, where a transition you asked
    for is not defined — `409` · `INVALID_RESOURCE_STATE` — the response names the record and its state


    ### On every operation


    - Every response body is `{ data, meta }`. `data` carries the record or records; `meta` is reserved for pagination.

    - Send `x-fapi-interaction-id` and it comes back unchanged. The same value is the correlation id on everything the
    request produces, so quote it when reporting a problem.

    - A write either happens completely or not at all. There is no partial result to clean up after a failure.

    - You never set the channel. The platform reads it from your token: requests made through the Trust Framework user
    interface are recorded as `ui`, and every other request you make is recorded as `api`. Send the field and it is
    ignored, not rejected.

    - You never set `createdByOrganization`, `createdByUser`, `createdByChannel` or `createdAt`. The platform records
    who you are from your token, and when it wrote the record from its own clock. Send any of them and they are ignored,
    not rejected.

    - A change made by a signed-in person records which account made it — through the user interface or straight against
    the API, it makes no difference. A change made by an organization's own client records no user at all, and the field
    is simply not there; its absence is how you tell a person's change from a machine's. Do not read the channel for
    this: `api` with a user is a person driving the API directly, which is a normal thing to see.

    - A new record's `lastUpdated…` fields are copies of its `created…` fields. They start to differ the first time
    something changes it.

    - Any change updates the `lastUpdated…` fields, including a lifecycle action that sends no body. The `created…`
    fields never change again.

    - Both are UTC instants set by the platform, not by you, and `lastUpdatedAt` is never before `createdAt`.

    - Reading a record does not change it.

    - A list you send on a `PATCH` replaces the whole list — it is not merged into the one already there. Send two legal
    identifiers to a record holding three and it holds two: the one you left out is gone. So to add or remove a single
    member, read the record, change the list you were given, and send all of it back. Leave the field out entirely and
    the stored list is untouched, which is how you change something else without touching a list at all.

    - Rename an organization and every record that refers to it shows the new name the next time you read it. You do not
    have to re-save those records, and you will not find one still showing the old name: the name in a reference is read
    from the organization, not copied onto the record that points at it.


    ### Service characteristics


    - Collections are paged. The default page is 25 records and the largest you may ask for is 100; asking for more
    returns `400` · `PAGE_SIZE_EXCEEDED`.


    ### What a consumer must do


    - Page through a collection by following `meta.next` rather than building the links yourself. Note that a paged read
    is **not** a point-in-time snapshot: the underlying set can change while you traverse it, so a record may be missed
    or seen twice. If you need a consistent view, re-read rather than assume.

    - An absent upper bound means the window is open, not that it has closed. An `Entitlement` with no `expiryDate`, or
    an `Assignment` with no `effectiveToDate`, is still live — do not treat the missing value as an expiry.
