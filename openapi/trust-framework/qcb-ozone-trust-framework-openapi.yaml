        - `keyStore` MUST resolve to an existing `Jwks`. (when `keyStore` present) Otherwise `422`.

        - `brands` MUST resolve to an existing `Brand`. (when `brands` present) Otherwise `422`.

        - The `supplementaryInformation` the `SoftwareStatement` will hold MUST validate against
        `SoftwareStatementConfig.supplementaryInformationSchema`. That schema is the ecosystem's and may require
        members, so the check does not depend on the request carrying the field — omitting it fails wherever a member is
        required. Otherwise `422`.

