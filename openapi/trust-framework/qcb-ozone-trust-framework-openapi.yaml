paths:
  /organizations:
    post:
      operationId: createOrganization
      summary: Create a Organization
      description: >-
        Create an `Organization`. The created record is returned, and its address in the `Location` header.


        **Rules**


        *Before it runs*

        - Each `legalIdentifiers[].issuingOrganization` MUST resolve to an existing `Organization`. (when
        `legalIdentifiers` present) Otherwise `422`.

        - `sponsoredBy` MUST resolve to an existing `Organization`. Otherwise `422`.

        - No other `Organization` may already hold the same (`organizationName`). Otherwise `409`.

        - No other `Organization` may already hold the same (`legalIdentifier`, `country`, `type`). Otherwise `409`.

        - The `supplementaryInformation` the `Organization` will hold MUST validate against `the governing config`. That
        schema is the ecosystem's and may require members, so the check does not depend on the request carrying the
        field — omitting it fails wherever a member is required. Otherwise `422`.

        - The access token MUST carry `create:organizations:all` or `create:organizations:own`. Either admits the call.
        Which records it then reaches is the access rule below, not this one. Otherwise `403`.

        - The `Organization` the caller is creating MUST be its own. With `create:organizations:all` it may be created
