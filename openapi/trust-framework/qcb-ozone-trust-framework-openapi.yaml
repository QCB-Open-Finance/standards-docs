          type: string
          enum:
            - Draft
            - Active
            - Suspended
            - Deactivated
          description: >-
            Whether the person is an active participant. `Draft` is being onboarded and is not yet one; `Active` is;
            `Suspended` has been stopped and can be reactivated; `Deactivated` has left the ecosystem and does not come
            back. Once active, a person is suspended or deactivated rather than deleted, because assignments that
            referenced them remain part of the record.
