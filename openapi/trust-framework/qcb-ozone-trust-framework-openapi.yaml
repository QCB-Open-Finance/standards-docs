    UserNew:
      title: UserNew
      description: >-
        The fields a caller supplies when creating a `User`.<br/><br/>A login account for the Trust Framework's web UI
        and API. It belongs to a person where one is known, and to nobody where it is a service account acting for an
        organization.
      type: object
      properties:
        person:
          type: string
          format: uuid
          description: >-
            The person this account belongs to, where one is known. Absent for a service account, which is why the
            account can exist without it.
          examples:
            - 5d9e7f31-2a4b-4c68-b0f7-8e1c6a3d9b52
        fullName:
          type: string
          description: Display name for the account, shown wherever the account appears or is credited with a change.
          examples:
            - Amara Okafor
        emailAddress:
          type: string
          description: Address the account signs in with and receives notifications at.
          examples:
            - amara.okafor@example-bank.co.uk
        authChannel:
          type: string
          description: How the account authenticates, as configured for the deployment.
          examples:
            - SSO – Redirect
      required:
        - fullName
        - emailAddress
        - authChannel
      additionalProperties: false
