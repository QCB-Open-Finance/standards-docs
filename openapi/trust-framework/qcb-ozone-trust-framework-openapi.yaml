        configuration:
          $ref: '#/components/schemas/ConfigurationRef'
          description: >-
            The configuration version this record belongs to. Every configuration record in one version references it,
            and exactly one version is active at a time.
          examples:
            - id: 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
              version: '2026.09'
        resourceType:
          type: string
          description: >-
            The kind of infrastructure this config governs, and the value `Resource.resourceType` carries. A string
            rather than a fixed list: the set of config records is the set of kinds this ecosystem recognizes.
          examples:
            - AuthorizationServer
        requiredEcosystemRole:
          $ref: '#/components/schemas/EcosystemRoleRef'
          description: >-
            The ecosystem role an organization must hold to register a resource of this type. Absent where the ecosystem
            places no market restriction on operating one. Losing the role suspends every resource that relied on it.
