        supplied `kid`, and `expiresAt` set to the certificate's `notAfter`. One upload, one key, one certificate.

        - `Certificate.kid` MUST be set to that key's `kid`, which is the only link between the two records.

        - `certificateAuthority` MUST be set to the organization whose `CaConfiguration` matched in `PRE.16`.


