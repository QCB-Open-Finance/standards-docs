    patch:
      operationId: updateSoftwareStatement
      summary: Update one SoftwareStatement
      description: >-
        Update one `SoftwareStatement`, identified by `softwareStatementId` in the path. Only the fields you supply are
        changed; everything you leave out keeps the value it has. **`jurisdictions`, `redirectUris`, `activeRoles`,
        `brands` are lists and they are replaced in full, not merged.** Send any of them and the field becomes exactly
        the members in your request — a member the record holds and your request leaves out is removed. To add or remove
        one member, read the record first and send the whole list back. `softwareStatementConfig`,
        `reliesOnEcosystemRole`, `clientId` are fixed when the record is created and cannot be changed, so they are not
        accepted here.


        **Rules**


        *Before it runs*

        - `{orgId}` MUST resolve to an `Organization` the caller has read access to. Read access means
