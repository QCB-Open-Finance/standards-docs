            The brands this key store is presented under. Every brand named must be one the key store's owning
            organization operates, and must be `Active`. Whether this record may name no brand, exactly one, or several
            is fixed by the `BrandConfig.brandAssociations` entry for `Jwks` — `0..0` there means this field is absent.
        effectiveStatus:
          $ref: '#/components/schemas/EffectiveStatus'
          description: >-
