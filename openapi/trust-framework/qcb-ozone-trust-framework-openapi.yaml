    Contact:
      title: Contact
      description: >-
        One way of reaching a party — what the contact point is for, and the email, phone, mobile and postal addresses
        behind it.
      type: object
      properties:
        contactType:
          type: string
          description: >-
            What this contact point is for — a registered office, a technical contact, a complaints address. Must be one
            of the types `ContactConfig.contactTypes` lists.
          examples:
            - TechnicalContact
        email:
          type: string
          description: Email address for this contact point.
          examples:
            - compliance@example-bank.co.uk
        phone:
          type: string
          description: Landline number for this contact point, in the ecosystem's agreed format.
          examples:
            - +44 20 7946 0000
        mobile:
          type: string
          description: Mobile number for this contact point, in the ecosystem's agreed format.
          examples:
            - +44 7700 900000
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          description: Postal addresses for this contact point.
      required:
        - contactType
      additionalProperties: false
    ContactConfig:
      title: ContactConfig
      description: What kinds of contact point a party may record, and which of those kinds are mandatory.
      type: object
      properties:
        contactTypes:
          type: array
          items:
            type: string
          minItems: 1
          description: The kinds of contact point that may be recorded. `Contact.contactType` must be one of these.
          examples:
            - - RegisteredOffice
              - TechnicalContact
              - Complaints
        primaryRequiredTypes:
          type: array
          items:
            type: string
          description: >-
            The contact types for which a party must record at least one. Absent where the ecosystem requires none. A
            subset of `contactTypes`.
          examples:
            - - TechnicalContact
      required:
        - contactTypes
      additionalProperties: false
    EcosystemRole:
      title: EcosystemRole
      description: >-
        A ecosystem classification an organization holds — AISP, PISP, ASPSP. Holding one is what lets an organization
        and its applications act in that capacity. Roles are conferred by entitlements, never assigned directly.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key. Stable even when `roleName` changes, which is why every reference uses it.
          examples:
            - 2f7b9c14-8a03-4e56-b7d1-4c9e0a2f6b85
        roleName:
          type: string
          description: >-
            The role as the ecosystem names it — a regulatory classification like `PISP` or `ASPSP`, or an
            access-control name like `Admin`.
          examples:
            - PISP
        description:
          type: string
          description: What holding this role permits, in the ecosystem's own words.
          examples:
            - Payment Initiation Service Provider, as defined by the scheme rulebook.
        ecosystemScopes:
          type: array
          items:
            type: string
          description: >-
            The OAuth scopes an application activating this role may request **of other participants** — not of the
            Trust Framework. Plain strings, because the market standard owns this vocabulary and the Trust Framework
            only records it. Empty for a classification that confers no API surface of its own.
