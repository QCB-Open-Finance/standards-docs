            `Authority` rather than this record's own `status`. Present, and non-empty, exactly while `effectiveStatus`
            is `NotInService`; absent while the record is in service. The two are one value in two shapes and never
            disagree, and an empty array is not a state either of them has. Maintained by the platform; not accepted in
            any request body.
