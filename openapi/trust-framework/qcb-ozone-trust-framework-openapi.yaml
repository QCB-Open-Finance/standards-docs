    RelatedOrganizationType:
      title: RelatedOrganizationType
      description: One kind of relationship two organizations may be in — its name, and how the same link reads from the other end.
      type: object
      properties:
        name:
          type: string
          description: >-
            The relationship as the ecosystem names it, read from the subject end — `SubsidiaryOf`, `AgentOf`,
            `DistributorFor`. This is the value `RelatedOrganization.relationshipType` carries. Both ends are
            organizations, so a relationship to anything else is not a link type.
          examples:
            - SubsidiaryOf
        symmetric:
          type: boolean
          description: >-
            Whether the relationship reads the same in both directions. `true` means one record says it for both
            organizations and the reverse must not also be recorded; `false` means the link has a direction and an
            inverse name below.
          examples:
            - false
        inverseName:
          type: string
          description: >-
            How the link reads from the other end — `ParentOf` against `SubsidiaryOf`. Required when `symmetric` is
            `false` and absent when it is `true`.
          examples:
            - ParentOf
        description:
          type: string
          description: What this kind of relationship means in this ecosystem, in the operator's own words.
          examples:
            - The subject is a wholly or majority owned subsidiary of the object.
      required:
        - name
        - symmetric
      additionalProperties: false
    Resource:
      title: Resource
      description: >-
        One piece of infrastructure an organization operates and publishes to the ecosystem — an authorization server,
        an API resource, a gateway. What kind it is, and what it must carry, are set by the resource type it is
        registered under.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key of the infrastructure record, stable across deprecation.
          examples:
            - 3e7a1d86-5c04-4b93-8f26-1a9d0c5e7b34
        owner:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization that operates this resource. Set from the path when the record is created, never sent in
            the body, and fixed for the life of the record.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        resourceConfig:
          type: string
          format: uuid
          description: The registered resource type this resource is an instance of, and whose rules governed its registration.
          examples:
            - 0b6e4c19-8d37-4f52-a9c1-5e2b7a0d3f68
        resourceType:
          type: string
          description: >-
            What kind of infrastructure this is — an authorization server, an API resource, a gateway. A string rather
            than a fixed list: the set of kinds is whichever `ResourceConfig.resourceType` values this ecosystem has
            registered.
          examples:
            - AuthorizationServer
        keyStore:
          $ref: '#/components/schemas/JwksRef'
          description: >-
            The resource's own key store. Required for resource types whose `ResourceConfig.hasJwks` is true, and absent
            otherwise.
          examples:
            - id: 5f9c3a72-1e48-4b06-8d95-2c7e0b4a6f31
              discoveryUri: https://directory.example.org/jwks/8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
        reliesOnEcosystemRole:
          $ref: '#/components/schemas/EcosystemRoleRef'
          description: >-
            The ecosystem role the operator must hold for this registration to stand. Recorded at creation, so a later
            change to the resource type does not alter what this resource was permitted under. Losing the role suspends
            the resource.
          examples:
            - id: 2f7b9c14-8a03-4e56-b7d1-4c9e0a2f6b85
              roleName: PISP
        jurisdictionScope:
          $ref: '#/components/schemas/JurisdictionScope'
          description: >-
            Whether this resource serves everywhere, or only within the jurisdictions listed below. A resource may only
            claim a jurisdiction its operator is entitled in: every claim has to be backed by an active entitlement
            conferring the role this registration relies on.
          examples:
            - Limited
        jurisdictions:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            The jurisdictions this resource serves. Required when `jurisdictionScope` is `Limited` and absent when it is
            `Global`. Each value must be one `JurisdictionConfig.jurisdictions` lists, and each must be covered by an
            active entitlement the operator holds. Losing that cover suspends the resource.
          examples:
            - - GB
        name:
          type: string
          description: The resource as the operator names it, shown wherever participants are listed.
          examples:
            - Example Bank Production AS
        uris:
          type: array
          items:
            $ref: '#/components/schemas/ResourceUri'
          minItems: 1
          description: >-
            Where the resource is reachable, one entry per kind of URI it publishes — an issuer, a discovery document, a
            token endpoint, a JWKS.
        brands:
          type: array
          items:
            $ref: '#/components/schemas/BrandRef'
          minItems: 1
          description: >-
            The brands this resource is presented under. Every brand named must be one its `owner` operates and must be
            `Active`. Whether this record may name no brand, exactly one, or several is fixed by the
            `BrandConfig.brandAssociations` entry for `Resource` — `0..0` there means this field is absent.
        status:
          type: string
          enum:
            - Draft
            - Inactive
            - Active
            - Suspended
            - Deprecated
          description: >-
            The resource's operational state. `Draft` is registered but has never been in service — the only state it
            can be deleted from; `Active` is in service; `Inactive` was in service and the operator withdrew it;
            `Suspended` is the ecosystem withdrawing permission; `Deprecated` is final. A suspended resource returns to
            `Inactive`, never straight to `Active`.
