        jurisdictions:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            The jurisdictions this resource serves. Required when `jurisdictionScope` is `Limited` and absent when it is
            `Global`. Each value must be one `JurisdictionConfig.jurisdictions` lists, and each must be covered by an
            active entitlement the operator holds. Losing that cover suspends the resource.<br/><br/>This is a list, and
            sending it **replaces the whole list**. The members you send become the entire value of the field: anything
            the record holds and your request omits is removed, not kept. To add or remove one member, read the record,
            change the list you were given, and send all of it back.
          examples:
            - - GB
        name:
          type: string
          description: The resource as the operator names it, shown wherever participants are listed.
          examples:
            - Example Bank Production AS
        uris:
          type: array
          items:
            $ref: '#/components/schemas/ResourceUri'
          minItems: 1
          description: >-
            Where the resource is reachable, one entry per kind of URI it publishes — an issuer, a discovery document, a
            token endpoint, a JWKS.<br/><br/>This is a list, and sending it **replaces the whole list**. The members you
            send become the entire value of the field: anything the record holds and your request omits is removed, not
            kept. To add or remove one member, read the record, change the list you were given, and send all of it back.
        brands:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: >-
            The brands this resource is presented under. Every brand named must be one its `owner` operates and must be
            `Active`. Whether this record may name no brand, exactly one, or several is fixed by the
            `BrandConfig.brandAssociations` entry for `Resource` — `0..0` there means this field is
            absent.<br/><br/>This is a list, and sending it **replaces the whole list**. The members you send become the
            entire value of the field: anything the record holds and your request omits is removed, not kept. To add or
            remove one member, read the record, change the list you were given, and send all of it back.
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Technical and operational attributes specific to the ecosystem. What may appear here is fixed by
            `ResourceConfig.supplementaryInformationSchema`.
      minProperties: 1
      additionalProperties: false
    ResourceCertificationNew:
      title: ResourceCertificationNew
      description: >-
        The fields a caller supplies when creating a `ResourceCertification`.<br/><br/>A compliance certification
        recorded against one resource — the standard it was certified against, the body that certified it, and the dates
        it runs between.
      type: object
      properties:
        resourceCertificationConfig:
          type: string
          format: uuid
          description: >-
            The kind of certification this is. The standard's name and the rules for recording it come from here, and
            the values copied onto this record at issuance do not change when it does.
          examples:
            - 2c8e5f41-7b30-4d96-a1e7-5f0b3c9d6a28
        certificationTypeName:
          type: string
          description: The standard certified against, as the certifying body names it.
          examples:
            - FAPI 2.0 Advanced
        certifiedBy:
          type: string
          format: uuid
          description: >-
            The body that performed the certification — the OpenID Foundation, a conformance laboratory. Not necessarily
            the organization that recorded it here, which is `createdByOrganization`, and the two differ whenever a
            certification awarded elsewhere is entered into the Trust Framework.
          examples:
            - 1a7d3e90-b2c4-4f16-8a55-9c0e2d4f6b81
        certificationUri:
          type: string
          format: uri
          description: >-
            Where the certification can be looked up at the certifying body — an entry in a public conformance register.
            Absent where the body publishes none. This is what makes a recorded certification checkable by a relying
            party rather than merely asserted.
          examples:
            - https://openid.net/certification/#FAPI2_OPs
        certificationReference:
          type: string
          description: >-
            The certifying body's own reference for this certification. Supplied by whoever records it; the Trust
            Framework neither generates nor validates it.
          examples:
            - OIDF-FAPI2-2026-0417
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Attributes specific to this kind of certification — profile, test suite version, deployment scope. What may
            appear here is fixed by `ResourceCertificationConfig.supplementaryInformationSchema`.
        issueDate:
          type: string
          format: date
          description: >-
            The date the certifying body granted the certification. Supplied at registration, not stamped by the Trust
            Framework.
          examples:
            - '2026-05-06'
        expiryDate:
          type: string
          format: date
          description: >-
            The date the certification lapses, as the certifying body set it. Absent means there is no fixed renewal
            cycle.
          examples:
            - '2027-05-05'
      required:
        - resourceCertificationConfig
        - certificationTypeName
        - certifiedBy
        - issueDate
      additionalProperties: false
    ResourceCertificationPatch:
      title: ResourceCertificationPatch
      description: >-
        The fields a caller may change on a `ResourceCertification`.<br/><br/>A compliance certification recorded
        against one resource — the standard it was certified against, the body that certified it, and the dates it runs
        between.
      type: object
      properties:
        certificationUri:
          type: string
          format: uri
          description: >-
            Where the certification can be looked up at the certifying body — an entry in a public conformance register.
            Absent where the body publishes none. This is what makes a recorded certification checkable by a relying
            party rather than merely asserted.
          examples:
            - https://openid.net/certification/#FAPI2_OPs
        certificationReference:
          type: string
          description: >-
            The certifying body's own reference for this certification. Supplied by whoever records it; the Trust
            Framework neither generates nor validates it.
          examples:
            - OIDF-FAPI2-2026-0417
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Attributes specific to this kind of certification — profile, test suite version, deployment scope. What may
            appear here is fixed by `ResourceCertificationConfig.supplementaryInformationSchema`.
        expiryDate:
          type: string
          format: date
          description: >-
            The date the certification lapses, as the certifying body set it. Absent means there is no fixed renewal
            cycle.
          examples:
            - '2027-05-05'
      minProperties: 1
      additionalProperties: false
    ResourceCertificationConfigNew:
      title: ResourceCertificationConfigNew
      description: >-
        The fields a caller supplies when creating a `ResourceCertificationConfig`.<br/><br/>One kind of compliance
        certification the ecosystem recognizes — the standard's name, which resource types it may be recorded against,
        and who may record one.
      type: object
      properties:
        configuration:
          type: string
          format: uuid
          description: >-
            The configuration version this record belongs to. Every configuration record in one version references it,
            and exactly one version is active at a time.
          examples:
            - 5a8f2c71-3e64-4b09-9d17-8c0e4a2f6b53
        certificationTypeName:
          type: string
          description: >-
            The standard as the certifying body names it. Copied onto every `ResourceCertification` recorded against
            this config, so a record says what it is without resolving back here.
          examples:
            - FAPI 2.0 Advanced
        applicableResourceTypes:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
