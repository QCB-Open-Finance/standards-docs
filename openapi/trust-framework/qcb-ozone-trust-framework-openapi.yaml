    ResourceUri:
      title: ResourceUri
      description: >-
        One address at which a resource is reachable, and what kind of address it is — an issuer, a discovery document,
        a token endpoint, a JWKS.
      type: object
      properties:
        uriType:
          type: string
          description: >-
            What this URI is for — an issuer, a discovery document, a token endpoint, a JWKS. Where
            `ResourceConfig.permittedUriTypes` is set for the resource's type, the value must be one it lists.
          examples:
            - discovery
        uri:
          type: string
          format: uri
          description: The address itself. Supplied by the operator; the Trust Framework does not resolve it.
          examples:
            - https://as.example-bank.co.uk/.well-known/openid-configuration
      required:
        - uriType
        - uri
      additionalProperties: false
    SoftwareStatement:
      title: SoftwareStatement
      description: >-
        One client application registered by an organization. It is what a software statement assertion is issued from,
        and what the ecosystem roles an application activates are recorded against.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key, and the `software_id` claim in every SSA issued from this record.
          examples:
            - 4a9d2f68-5c31-4e07-b8a2-1f6c0e3d9b54
        organization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization the application belongs to. Set from the path when the record is created, never sent in the
            body, and fixed for the life of the record.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        softwareStatementConfig:
          type: string
          format: uuid
          description: >-
            The registration rules this application was registered under, and whose schema fixes what
            `supplementaryInformation` may contain.
          examples:
            - 1c5e8a34-7d20-4b96-8f43-9a0c6e2b5d78
        reliesOnEcosystemRole:
          $ref: '#/components/schemas/EcosystemRoleRef'
          description: >-
            The ecosystem role the organization must hold for this registration to stand. Recorded at creation, so a
            later configuration change does not alter what the registration was permitted under. Losing the role
            suspends it.
          examples:
            - id: 2f7b9c14-8a03-4e56-b7d1-4c9e0a2f6b85
              roleName: PISP
        jurisdictionScope:
          $ref: '#/components/schemas/JurisdictionScope'
          description: >-
            Whether this application may be used everywhere, or only within the jurisdictions listed below. An
            application may only claim a jurisdiction its organization is entitled in: every claim has to be backed by
            an active entitlement conferring the ecosystem role this registration relies on.
          examples:
            - Limited
        jurisdictions:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            The jurisdictions this application may be used in. Required when `jurisdictionScope` is `Limited` and absent
            when it is `Global`. Each value must be one `JurisdictionConfig.jurisdictions` lists, and each must be
            covered by an active entitlement the organization holds. Losing that cover suspends the registration.
          examples:
            - - GB
        name:
          type: string
          description: The application as its operator names it, shown to users at consent time.
          examples:
            - Example Budgeting App
        clientId:
          type: string
          description: >-
            The OAuth `client_id` the application authenticates with. Assigned at Dynamic Client Registration, so the
            Trust Framework records rather than mints it.
          examples:
            - b7f3c9a1e64d284f
        redirectUris:
          type: array
          items:
            type: string
            format: uri
          minItems: 1
          description: The application's registered OAuth redirect URIs, asserted in every SSA.
          examples:
            - - https://app.example.com/callback
        activeRoles:
          type: array
          items:
            $ref: '#/components/schemas/EcosystemRoleRef'
          minItems: 1
          description: >-
            The ecosystem roles this application activates. A subset of the roles its organization holds — an
            application need not activate all of them.
        keyStore:
          $ref: '#/components/schemas/JwksRef'
          description: A key store dedicated to this application. Absent where the application uses its organization's store.
          examples:
            - id: 5f9c3a72-1e48-4b06-8d95-2c7e0b4a6f31
              discoveryUri: https://directory.example.org/jwks/8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
        brands:
          type: array
          items:
            $ref: '#/components/schemas/BrandRef'
          minItems: 1
          description: >-
            The brands this application is presented under. Every brand named must be one its `organization` operates
            and must be `Active`. Whether this record may name no brand, exactly one, or several is fixed by the
            `BrandConfig.brandAssociations` entry for `SoftwareStatement` — `0..0` there means this field is absent.
        status:
          type: string
          enum:
            - Draft
            - Active
            - Inactive
            - Suspended
            - Revoked
          description: >-
            The registration's state. `Draft` is registered but has never been in service — the only state it can be
            deleted from; `Active` is in service; `Inactive` is the operator withdrawing its own application;
            `Suspended` is the ecosystem withdrawing permission; `Revoked` is final. A suspended registration returns to
            `Inactive`, never straight to `Active`.
          examples:
            - Active
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Ecosystem-specific attributes of the application. What may appear here is fixed by
            `SoftwareStatementConfig.supplementaryInformationSchema`.
        effectiveStatus:
          $ref: '#/components/schemas/EffectiveStatus'
          description: >-
            Whether this `SoftwareStatement` is actually in service. `status` is what an operator asked for; this is
            what the ecosystem gets, once the condition of the owning `Organization` is taken into account. Maintained
            by the platform; not accepted in any request body.
          examples:
            - Active
        notInServiceReasons:
          type: array
          items:
            type: string
            enum:
              - OrganizationDeactivated
              - OrganizationSuspended
          description: >-
            Why this `SoftwareStatement` is not in service, where the cause is the owning `Organization` rather than
            this record's own `status`. Present, and non-empty, exactly while `effectiveStatus` is `NotInService`;
            absent while the record is in service. The two are one value in two shapes and never disagree, and an empty
            array is not a state either of them has. Maintained by the platform; not accepted in any request body.
