    TrustFrameworkClientNew:
      title: TrustFrameworkClientNew
      description: >-
        The fields a caller supplies when creating a `TrustFrameworkClient`.<br/><br/>An OIDC client registered so that
        an organization can call the Trust Framework API. It is created deliberately, by a caller, and an organization
        may hold several — a machine integration and a staff-facing application have different key material, different
        grant types and different access levels, and one client cannot be all of those at once. What the client may do
        is the union of the `Profile`s named here, which may be no more than its organization is entitled to.
      type: object
      properties:
        clientName:
          type: string
          description: >-
            How this client is known to its operator. Shown wherever the client is listed, and registered with the OIDC
            provider as the client's name.
          minLength: 2
          examples:
            - Example Bank onboarding integration
        profiles:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: >-
            The access levels this client holds. The scopes it is registered with are the union of the Trust Framework
            scopes these profiles confer. Every one must be a profile the organization is itself entitled to, so a
            client can be given less than its organization holds and never more.
          examples:
            - - 6b91d4c0-3e57-42a8-9f16-8d0a2c7e5b39
        grantTypes:
          type: array
          items:
            type: string
            enum:
              - authorization_code
              - client_credentials
          minItems: 1
          description: >-
            How this client obtains a token. `client_credentials` where the caller is the organization itself;
            `authorization_code` where it is a person acting for it. A client may hold both, and which one a given call
            used is what decides whether the write records a user.
          examples:
            - - client_credentials
        tokenEndpointAuthMethod:
          type: string
          enum:
            - private_key_jwt
            - tls_client_auth
          description: >-
            How this client authenticates to the token endpoint. `private_key_jwt` signs an assertion with a key from
            the client's key store; `tls_client_auth` presents the mutual TLS certificate the connection was established
            with. One or the other, never both.
          examples:
            - private_key_jwt
        keyStore:
          type: string
          format: uuid
          description: >-
            The key store holding the public keys this client signs with. Required where `tokenEndpointAuthMethod` is
            `private_key_jwt`, and absent otherwise — a `tls_client_auth` client authenticates with its certificate and
            has nothing to publish.
          examples:
            - 5f9c3a72-1e48-4b06-8d95-2c7e0b4a6f31
        redirectUris:
          type: array
          items:
            type: string
            format: uri
          description: >-
            Where the authorization server may return a person after they sign in. Required where `grantTypes` includes
            `authorization_code`, and absent otherwise — a client-credentials client has no user to return.
          examples:
            - - https://admin.example-bank.co.uk/oauth2/callback
      required:
        - clientName
        - profiles
        - grantTypes
        - tokenEndpointAuthMethod
      additionalProperties: false
