    SoftwareStatementNew:
      title: SoftwareStatementNew
      description: >-
        The fields a caller supplies when creating a `SoftwareStatement`.<br/><br/>One client application registered by
        an organization. It is what a software statement assertion is issued from, and what the ecosystem roles an
        application activates are recorded against.
      type: object
      properties:
        softwareStatementConfig:
          type: string
          format: uuid
          description: >-
            The registration rules this application was registered under, and whose schema fixes what
            `supplementaryInformation` may contain.
          examples:
            - 1c5e8a34-7d20-4b96-8f43-9a0c6e2b5d78
        reliesOnEcosystemRole:
          type: string
          format: uuid
          description: >-
            The ecosystem role the organization must hold for this registration to stand. Recorded at creation, so a
            later configuration change does not alter what the registration was permitted under. Losing the role
            suspends it.
          examples:
            - 2f7b9c14-8a03-4e56-b7d1-4c9e0a2f6b85
        jurisdictionScope:
          $ref: '#/components/schemas/JurisdictionScope'
          description: >-
            Whether this application may be used everywhere, or only within the jurisdictions listed below. An
            application may only claim a jurisdiction its organization is entitled in: every claim has to be backed by
            an active entitlement conferring the ecosystem role this registration relies on.
          examples:
            - Limited
        jurisdictions:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            The jurisdictions this application may be used in. Required when `jurisdictionScope` is `Limited` and absent
            when it is `Global`. Each value must be one `JurisdictionConfig.jurisdictions` lists, and each must be
            covered by an active entitlement the organization holds. Losing that cover suspends the registration.
          examples:
            - - GB
        name:
          type: string
          description: The application as its operator names it, shown to users at consent time.
          examples:
            - Example Budgeting App
        clientId:
          type: string
