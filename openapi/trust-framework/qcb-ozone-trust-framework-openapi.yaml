    Entitlement:
      title: Entitlement
      description: >-
        A license, certification or authorization an organization holds, as granted by an accrediting authority. Holding
        one is what confers the ecosystem roles the organization may act under.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key of this entitlement, stable across suspension and reinstatement.
          examples:
            - f60b2c74-9e51-4a38-b1d6-7c4f0a8e3b29
        entitlementConfig:
          $ref: '#/components/schemas/EntitlementConfigRef'
          description: The type this entitlement is an instance of, and whose issuer rules govern it.
          examples:
            - id: d13f7a58-6b04-4c92-8e71-3a9c5f2e0b46
              entitlementTypeName: AIS
        entitlementType:
          $ref: '#/components/schemas/EntitlementType'
          description: >-
            Which kind of entitlement this is — a license, a certification, an authorization, or a delegation of an
            authority's power to issue. Recorded on the entitlement itself, so it still says what it was if the
            entitlement type is changed later.
          examples:
            - License
        entitlementName:
          type: string
          description: The entitlement as named on the paperwork, which may differ from the type name.
          examples:
            - Data Provider License (Retail Banking)
        entitlementNumber:
          type: string
          description: >-
            The issuing regime's own reference for the entitlement. Supplied by the participant; the Trust Framework
            neither generates nor validates it.
          examples:
            - FCA-DP-2026-004417
        issuingAuthority:
          type: string
          format: uuid
          description: >-
            The authority that issued the entitlement. What the entitlement confers is fixed by the entitlement type it
            was issued against, not chosen at issuance.
          examples:
            - 6e1d8b45-3f92-4a07-bc58-9d0f2a6e4b13
        organization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization the entitlement is made to. Set from the path when the record is created, never sent in the
            body, and fixed for the life of the record.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        effectiveEcosystemRoles:
          type: array
          items:
            $ref: '#/components/schemas/EcosystemRoleRef'
          minItems: 1
          description: >-
            The ecosystem roles this entitlement confers. Recorded on the entitlement itself, so it still says what it
            conferred after the entitlement type changes. An organization's roles are the union of these across its
            active entitlements — there is no separate assignment record.
        effectiveProfiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileRef'
          minItems: 1
          description: >-
            The Trust Framework access levels this entitlement confers. A `TrustFrameworkClient` belonging to this
            organization may name any profile the union of its in-service entitlements confers, and none that none of
            them confers. Recorded on the entitlement itself, so it still says what it conferred after the entitlement
            type changes.
        jurisdictionScope:
          $ref: '#/components/schemas/JurisdictionScope'
          description: >-
            Whether this entitlement is good anywhere, or only within the jurisdictions listed below. It cannot reach
            further than the issuing authority's own remit: an authority limited to named jurisdictions cannot make a
            global entitlement.
          examples:
            - Limited
        jurisdictions:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            The jurisdictions this entitlement is good in. Required when `jurisdictionScope` is `Limited` and absent
            when it is `Global`, and every value must be one the issuing authority is itself permitted to accredit
            within. Recorded on the entitlement, so it still says where it reached after the authority's own remit
            changes.
          examples:
            - - GB
        issueDate:
          type: string
          format: date
          description: >-
            The date the issuing authority granted the entitlement, as stated on the paperwork. Supplied by the
            participant or the authority; not stamped by the Trust Framework.
          examples:
            - '2026-04-01'
        expiryDate:
          type: string
          format: date
          description: The date the entitlement lapses, as the issuing authority set it. Absent means it runs until it is revoked.
          examples:
            - '2029-03-31'
        revocationDate:
          type: string
          format: date
          description: >-
            The date the entitlement was revoked, supplied at revocation as the revoking authority states it. Present
            when `status` is `Revoked` and absent otherwise. It can be earlier than the date the record itself changed.
            Supplied when calling `revokeEntitlement`, and on no other request.
          examples:
            - '2027-06-30'
        status:
          type: string
          enum:
            - Active
            - Suspended
            - Revoked
            - Expired
          description: >-
            Where the entitlement stands. `Active` is in force; `Suspended` is temporarily withdrawn and can be
            reinstated; `Revoked` was withdrawn by the authority; `Expired` passed its expiry date. The last two are
            final.
          examples:
            - Active
        supplementaryInformation:
          type: object
          additionalProperties: true
          description: >-
            Ecosystem-specific attributes of the entitlement, such as geographic scope or product limitations. What may
            appear here is fixed by `EntitlementConfig.supplementaryInformationSchema`.
        effectiveStatus:
          $ref: '#/components/schemas/EffectiveStatus'
          description: >-
            Whether this `Entitlement` is actually in service. `status` is what an operator asked for; this is what the
            ecosystem gets, once the condition of the owning `Organization` and the issuing `Authority` is taken into
            account. Maintained by the platform; not accepted in any request body.
          examples:
            - Active
        notInServiceReasons:
          type: array
          items:
            type: string
            enum:
              - IssuingAuthorityNotInService
              - OrganizationDeactivated
