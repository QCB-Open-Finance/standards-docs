    Ssa:
      title: Ssa
      description: >-
        One issuance of a signed software statement assertion — the JWS a participant presents to register dynamically
        with another participant. Each issuance is a new record, and the token itself is never amended.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key of this issuance. A reissue is a new record with a new id.
          examples:
            - e28b4d70-1a56-4c93-8f2e-7b0d5a9c3e61
        softwareStatement:
          $ref: '#/components/schemas/SoftwareStatementRef'
          description: >-
            The application this assertion was issued from. Set from the path when the record is created, never sent in
            the body, and fixed for the life of the record.
          examples:
            - id: 4a9d2f68-5c31-4e07-b8a2-1f6c0e3d9b54
              name: Example Budgeting App
        issuedAt:
          type: string
          format: date-time
          description: >-
            When the Trust Framework signed the assertion. System-owned, and the `iat` claim in the token. Set by
            `createSsa`; not accepted in any request body.
          examples:
            - '2026-06-04T11:20:15+00:00'
        expiresAt:
          type: string
          format: date-time
          description: >-
            When the assertion stops being accepted. Computed by the Trust Framework at issuance, and the `exp` claim in
            the token. Set by `createSsa`; not accepted in any request body.
          examples:
            - '2026-06-04T12:20:15+00:00'
        signedBy:
          $ref: '#/components/schemas/JwkRef'
          description: >-
            The Trust Framework's own signing key that produced the JWS, by its `kid`. Set by `createSsa`; not accepted
            in any request body.
          examples:
            - kid: kid-directory-signing-2026-02
        jwt:
          type: string
          description: >-
            The signed assertion itself, as a compact-serialisation JWS. Immutable once issued — a reissue is a new
            record, never an amendment. Set by `createSsa`; not accepted in any request body.
          examples:
            - >-
              eyJhbGciOiJQUzI1NiIsImtpZCI6ImtpZC1kaXJlY3Rvcnktc2lnbmluZy0yMDI2LTAyIn0.eyJpc3MiOiJodHRwczovL2RpcmVjdG9yeS5leGFtcGxlLm9yZyIsInNvZnR3YXJlX2lkIjoiNGE5ZDJmNjgifQ.SIGNATURE
        createdByOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organisation the record is attributed to. Always present, by one of three routes, which
            `createdByChannel` tells apart:<br/>- `api` or `ui` — resolved from the access token. Both the
            client-credentials and the authorization-code grant identify an organisation.<br/>- `system` — there was no
            caller, so it is inherited from the record whose change caused this one. A cascade is attributed to whoever
            set off the cascade.<br/>- `dataload` — the organisation operating this API, which ran the load.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        createdByUser:
          $ref: '#/components/schemas/UserRef'
          description: >-
            The user account that created the record. Present only where a person was at the other end of the request —
            that is, where `createdByChannel` is `ui`. Absent for `api`, which authenticates an organisation and no
            person, and absent for `system` and `dataload`, which have no caller at all. Its absence is information
            rather than a gap.
          examples:
            - id: e04a2b78-6c1d-4f93-a5e8-7b2f9d0c3a61
              fullName: Amara Okafor
        createdByChannel:
          $ref: '#/components/schemas/Channel'
          description: >-
            How the record was created. Read from the access token, never from the request body: `ui` where the token
            carries the `trust-framework-ui` scope, `api` otherwise. Send this field and it is ignored. `system` and
            `dataload` both cover records written with no caller — a time-based transition or a cascade for the first, a
            bulk import for the second — so both take their organisation from elsewhere, as the creating-organisation
            field beside this one describes, and neither ever carries a user.
          examples:
            - api
      required:
        - id
        - softwareStatement
        - issuedAt
        - expiresAt
        - signedBy
        - jwt
        - createdByOrganization
        - createdByChannel
      additionalProperties: false
    SsaClaimMapping:
      title: SsaClaimMapping
      description: 'One claim in an issued SSA: the name it appears under, and the Trust Framework value that fills it.'
      type: object
      properties:
        claimName:
          type: string
          description: The name this claim appears under in the issued SSA JWT.
          examples:
            - org_jwks_uri
        source:
          type: string
          enum:
            - OrganizationId
            - OrganizationName
            - OrganizationStatus
            - OrganizationJwksUri
            - SoftwareStatementId
            - SoftwareStatementName
            - SoftwareStatementClientId
            - SoftwareStatementRedirectUris
            - EcosystemRoles
          description: The Trust Framework value that fills this claim.
          examples:
            - OrganizationJwksUri
      required:
        - claimName
        - source
      additionalProperties: false
    TrustFrameworkClient:
      title: TrustFrameworkClient
      description: >-
        An OIDC client registered so that an organization can call the Trust Framework API. It is created deliberately,
        by a caller, and an organization may hold several — a machine integration and a staff-facing application have
        different key material, different grant types and different access levels, and one client cannot be all of those
        at once. What the client may do is the union of the `Profile`s named here, which may be no more than its
        organization is entitled to.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Primary key, assigned by the Trust Framework when the client is created.
          examples:
            - c2f7a914-6b38-4e52-9a07-3d81e5c0b4f6
        organization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organization this client acts for. Fixed at creation: a client is an authentication identity, and moving
            one between organizations would silently re-point every call it has ever made.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        clientName:
          type: string
          description: >-
            How this client is known to its operator. Shown wherever the client is listed, and registered with the OIDC
            provider as the client's name.
          minLength: 2
          examples:
            - Example Bank onboarding integration
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileRef'
          minItems: 1
          description: >-
            The access levels this client holds. The scopes it is registered with are the union of the Trust Framework
            scopes these profiles confer. Every one must be a profile the organization is itself entitled to, so a
            client can be given less than its organization holds and never more.
          examples:
            - - id: 6b91d4c0-3e57-42a8-9f16-8d0a2c7e5b39
                profileName: EcosystemParticipant
        grantTypes:
          type: array
          items:
            type: string
            enum:
              - authorization_code
              - client_credentials
          minItems: 1
          description: >-
            How this client obtains a token. `client_credentials` where the caller is the organization itself;
            `authorization_code` where it is a person acting for it. A client may hold both, and which one a given call
            used is what decides whether the write records a user.
          examples:
            - - client_credentials
        tokenEndpointAuthMethod:
          type: string
          enum:
            - private_key_jwt
            - tls_client_auth
          description: >-
            How this client authenticates to the token endpoint. `private_key_jwt` signs an assertion with a key from
            the client's key store; `tls_client_auth` presents the mutual TLS certificate the connection was established
            with. One or the other, never both.
          examples:
            - private_key_jwt
        keyStore:
          $ref: '#/components/schemas/JwksRef'
          description: >-
            The key store holding the public keys this client signs with. Required where `tokenEndpointAuthMethod` is
            `private_key_jwt`, and absent otherwise — a `tls_client_auth` client authenticates with its certificate and
            has nothing to publish.
          examples:
            - id: 5f9c3a72-1e48-4b06-8d95-2c7e0b4a6f31
              discoveryUri: https://directory.example.org/jwks/8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
        redirectUris:
          type: array
          items:
            type: string
            format: uri
          description: >-
            Where the authorization server may return a person after they sign in. Required where `grantTypes` includes
            `authorization_code`, and absent otherwise — a client-credentials client has no user to return.
          examples:
            - - https://admin.example-bank.co.uk/oauth2/callback
        clientId:
          type: string
          description: >-
            The `client_id` the OIDC provider assigned this client. Recorded here once registration has happened, and
            absent on a `Draft` client that has not been registered yet. You never supply it. Maintained by the
            platform; not accepted in any request body.
          examples:
            - tf-9a41c7e2b0d84f16
        status:
          type: string
          enum:
            - Draft
            - Active
            - Suspended
            - Withdrawn
          description: >-
            What the operator asked for. `Draft` is described but not registered; `Active` is registered and usable;
            `Suspended` is registered and disabled, reversibly; `Withdrawn` is gone for good and cannot be brought back.
          examples:
            - Active
        effectiveStatus:
          $ref: '#/components/schemas/EffectiveStatus'
          description: >-
            Whether this client is actually usable. `status` is what an operator asked for; this is what the ecosystem
            gets, once the condition of the owning organization and of the entitlements behind its profiles are taken
            into account. Maintained by the platform; not accepted in any request body.
          examples:
            - Active
        notInServiceReasons:
          type: array
          items:
            type: string
            enum:
              - OrganizationDeactivated
              - OrganizationSuspended
              - ProfileNotEntitled
          description: >-
            Why this client is not usable, where the cause is something other than its own `status`. Present, and
            non-empty, exactly while `effectiveStatus` is `NotInService`; absent while the record is in service. The two
            are one value in two shapes and never disagree, and an empty array is not a state either of them has.
            Maintained by the platform; not accepted in any request body.
        createdByOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organisation the record is attributed to. Always present, by one of three routes, which
            `createdByChannel` tells apart:<br/>- `api` or `ui` — resolved from the access token. Both the
            client-credentials and the authorization-code grant identify an organisation.<br/>- `system` — there was no
            caller, so it is inherited from the record whose change caused this one. A cascade is attributed to whoever
            set off the cascade.<br/>- `dataload` — the organisation operating this API, which ran the load.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        createdByUser:
          $ref: '#/components/schemas/UserRef'
          description: >-
            The user account that created the record. Present only where a person was at the other end of the request —
            that is, where `createdByChannel` is `ui`. Absent for `api`, which authenticates an organisation and no
            person, and absent for `system` and `dataload`, which have no caller at all. Its absence is information
            rather than a gap.
          examples:
            - id: e04a2b78-6c1d-4f93-a5e8-7b2f9d0c3a61
              fullName: Amara Okafor
        createdByChannel:
          $ref: '#/components/schemas/Channel'
          description: >-
            How the record was created. Read from the access token, never from the request body: `ui` where the token
            carries the `trust-framework-ui` scope, `api` otherwise. Send this field and it is ignored. `system` and
            `dataload` both cover records written with no caller — a time-based transition or a cascade for the first, a
            bulk import for the second — so both take their organisation from elsewhere, as the creating-organisation
            field beside this one describes, and neither ever carries a user.
          examples:
            - api
        createdAt:
          type: string
          format: date-time
          description: >-
            When the Trust Framework created this record. System-owned — set by the platform at write time and never
            supplied by a caller.
          examples:
            - '2026-03-14T09:12:44+00:00'
        lastUpdatedAt:
          type: string
          format: date-time
          description: >-
            When the Trust Framework last changed this record. System-owned — equal to `createdAt` until something
            changes it, and never supplied by a caller.
          examples:
            - '2026-08-02T16:41:07+00:00'
        lastUpdatedByOrganization:
          $ref: '#/components/schemas/OrganizationRef'
          description: >-
            The organisation the last change is attributed to, by the same three routes as the creating organisation and
            told apart the same way by `lastUpdatedByChannel`. Equal to the creating organisation until something
            changes the record.
          examples:
            - id: 8f2b1c40-5a3e-4c71-9d88-1e6f0a4b7c23
              organizationName: Example Bank plc
        lastUpdatedByUser:
          $ref: '#/components/schemas/UserRef'
          description: >-
            The user account that last changed the record. Present only where `lastUpdatedByChannel` is `ui`; absent for
            a machine caller, for a change the platform made itself, and for a bulk load.
          examples:
            - id: e04a2b78-6c1d-4f93-a5e8-7b2f9d0c3a61
              fullName: Amara Okafor
        lastUpdatedByChannel:
          $ref: '#/components/schemas/Channel'
          description: >-
            How the record was last changed. Read from the access token the same way as `createdByChannel` — `ui` where
            it carries `trust-framework-ui`, `api` otherwise — and never from the request body. `system` is the value
            for a time-based transition or a cascade, which is how an expiry is told apart from someone revoking by
            hand, and `dataload` for a change made by a bulk import rather than by a request.
          examples:
            - api
      required:
        - id
        - organization
        - clientName
        - profiles
        - grantTypes
        - tokenEndpointAuthMethod
        - status
        - effectiveStatus
        - createdByOrganization
        - createdByChannel
        - createdAt
        - lastUpdatedAt
        - lastUpdatedByOrganization
        - lastUpdatedByChannel
      additionalProperties: false
