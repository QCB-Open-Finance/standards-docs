    UserRoleNew:
      title: UserRoleNew
      description: >-
        The fields a caller supplies when creating a `UserRole`.<br/><br/>The entitlement of a Trust Framework access
        level to one account, within one organization. An account acting for several organizations holds one of these
        per organization, each with its own access level.
      type: object
      properties:
        user:
          type: string
          format: uuid
          description: >-
            The account the access level is granted to. Set from the path when the record is created, never sent in the
            body, and fixed for the life of the record.
          examples:
