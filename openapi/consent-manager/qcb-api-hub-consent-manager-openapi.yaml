openapi: 3.1.0
servers:
  - url: https://{hostName}
    description: The address of the API Hub Authorization Server
    variables:
      hostName:
        description: The hostname at which the API Hub Authorization Server is hosted
        default: example.com
info:
  title: API Hub - Consent Manager
  x-sf-docs-util-menu-item-name: Consent Manager API
  description: >
    This document provides an API description in [OpenAPI](https://spec.openapis.org/oas/v3.1.0.html) for the Consent 
    Manager API.

    These APIs are implemented by the API Hub and should be called by the Licensed Financial Institution (LFI) to find, 
    modify and delete consents.

    ## Versioning

    The `version` property implements the following pattern
    `{standards-major}.{standards-minor}.{ozone-connect-version}`, where:

    * `standards-major` is the major version of the latest QCB standard that the API description implements.

    * `standards-minor` is the minor version of the latest QCB standard that the API description implements.

    * `ozone-connect-version` is the version of the Ozone Connect API description.

    So, for example, `v1.0.0` indicates the first version of the Ozone Connect API description that implements the QCB
    standard version 1.0.

    ## Changelog

    The following sections describe high-level changes to this API description.

    ### v1.0.0

    * Added initial version of API description
  version: v1.0.0
tags:
  - name: Consents
    description: Operations that support creating, retrieving, updating and auditing consents
  - name: Consent Groups
    description: Operations that support retrieving the consents within a consent group
  - name: Consents By PSU
    description: Operations that support retrieving the consents associated with a PSU
  - name: Consents By Account
    description: Operations that support retrieving the consents associated with an account
  - name: Payments
    description: Operations that support retrieving and updating the payment log for a consent
  - name: Actions
    description: Operations that support revoking a consent, or the consents within a consent group
  - name: Health Check
    description: Operations that support checking the health of the API Hub
security:
  - OzoneConnectMutualTls: []
  - OzoneConnectMutualTls: []
    OzoneConnectJwtAuth: []
paths:
  /consents:
    post:
      tags:
        - Consents
      summary: Create a Consent
      description: |
        Used by Ozone to create a new consent using a Heimdall interaction.
      operationId: addConsent
      requestBody:
        description: >
          Creates a new consent in the Consent Manager.

          The API is used by Ozone for creating consents when requested by a TPPs. Use by LFIs is **not** supported 
          under the QCB Open Finance Framework.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentManager.AuthorizationDetails1Properties'
      responses:
        '201':
          description: |
            Indicates the successful creation of a consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.CreateConsentResponse1Properties'
        '400':
          description: |
            Indicates a failure to create the consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.Error400Response1Properties'
    get:
      tags:
        - Consents
      summary: Retrieve Consents
      description: >
        Retrieves an array of consents that meets the search criteria.


        If no consents could be found, then an empty array is returned.


        This API may be used by an LFI to get a "stream" of consents that have been created or updated since a given
        timestamp.
      operationId: getAllConsents
      parameters:
        - name: updatedAt
          in: query
          schema:
            type: number
          required: false
          description: |
            Select only consents updated after the specified time
        - $ref: '#/components/parameters/consentType'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: |
            Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.ReadConsentsResponse1Properties'
        '400':
          description: Indicates a failure to retrieve the consents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.Error400Response1Properties'
  /consents/{consentId}:
    get:
      tags:
        - Consents
      summary: Retrieve a given Consent
      description: Retrieve a Consent by Consent identifier
      operationId: getConsentsByConsentId
      parameters:
        - $ref: '#/components/parameters/consentId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ConsentManager.ConsentRecord1Properties'
                  meta:
                    $ref: '#/components/schemas/ConsentManager.Meta1Properties'
        '400':
          description: |
            Indicates a failure to retrieve the consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.Error400Response1Properties'
    patch:
      tags:
        - Consents
      summary: Update a Consent
      description: |
        This operation allows an LFI modify fields within a consent's `consentBody`.

        Typically, this API would be called after the PSU has authorised a consent. This would allow the financial 
        institution to "patch in" the `psuIdentifier` and `accountIds` associated with the consent.

        This is also called as authentication progresses for a multi-auth consent.
      operationId: patchConsent
      parameters:
        - $ref: '#/components/parameters/consentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentManager.UpdateConsent1Properties'
      responses:
        '204':
          description: |
            Indicates a successful operation.
            The response does not have a body.
        '400':
          description: |
            Indicates a failure to patch the consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.Error400Response1Properties'
  /consents/{consentId}/audit:
    get:
      tags:
        - Consents
      summary: Retrieve Audit Log for a given Consent
      description: >-
        Retrieves an audit of a consent by Consent identifier. The audit log is a low-level record of all changes
        applied to a Consent throughout its life-cycle
      operationId: getAuditConsentsByConsentId
      parameters:
        - $ref: '#/components/parameters/consentId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - providerId
                        - operation
                        - timestamp
                        - fkMongoId
                        - fkId
                        - id
                        - ozoneInteractionId
                      properties:
                        providerId:
                          type: string
                          description: |
                            The provider id of the LFI that made the change
                        operation:
                          type: string
                          description: |
                            Like "create" or "patch"
                        timestamp:
                          type: integer
                        fkMongoId:
                          type: string
                          description: |
                            A unique identifier for the audit log in mongodb
                        fkId:
                          type: string
                          description: |
                            The Consent identifier of the audited Consent.
                        id:
                          type: string
                          description: |
                            A unique identifier for the audit log
                        ozoneInteractionId:
                          type: string
                          description: >
                            The ozone interaction id assigned to the interaction that caused this changed. Useful for
                            looking up the api-log.


                            Note - this is not the "heimdall Interaction Id" - this is an identifier for the API log
                        callerDetails:
                          type: object
                          description: |
                            The details of the API caller that made the change
                          properties:
                            callerOrgId:
                              type: string
                            callerClientId:
                              type: string
                            callerSoftwareStatementId:
                              type: string
                        patchFilter:
                          type: string
                          description: |
                            Low-level operation description of the selector for the patch
                        patch:
                          type: string
                          description: |
                            Low-level operation description of the patch that was applied at the storage level
                  meta:
                    $ref: '#/components/schemas/ConsentManager.Meta1Properties'
        '400':
          description: |
            Indicates a failure to retrieve the consent's audit trail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.Error400Response1Properties'
  /consent-groups/{consentGroupId}/consents:
    get:
      tags:
        - Consent Groups
      summary: Retrieve a Consent Group
      description: |
        Retrieves an array of consents that are within a consent group.

        If no consents could be found, then an empty array is returned.

        For QCB, a consent group identifier is the `BaseConsentId`.
      operationId: getConsentsInConsentGroup
      parameters:
        - name: consentGroupId
          in: path
          schema:
            type: string
          required: true
          description: |
            Select consents within the consentGroupId
        - $ref: '#/components/parameters/consentType'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: |
            Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.ReadConsentsResponse1Properties'
        '400':
          description: Indicates a failure to retrieve the consents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.Error400Response1Properties'
  /psu/{userId}/consents:
    get:
      tags:
        - Consents By PSU
      summary: Retrieve Consents for a given User
      description: |
        Retrieves an array of consents associated with the PSU.

        If no consents could be found associated with the PSU, then an empty array is returned.

        The userId path parameter is matched with the `psuIdentifiers.userId` field in the consent.
      operationId: getConsents
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/consentType'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: |
            Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.ReadConsentsResponse1Properties'
        '400':
          description: Indicates a failure to retrieve the consents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.Error400Response1Properties'
  /accounts/{accountId}/consents:
    get:
      tags:
        - Consents By Account
      summary: Retrieve Consents for a given Account
      description: |
        Retrieve consents of a account by its id
      operationId: getAccountIdConsents
      parameters:
        - name: accountId
          in: path
          schema:
            type: string
          required: true
          description: Identifier for the account
        - $ref: '#/components/parameters/consentType'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.ReadConsentsResponse1Properties'
        '400':
          description: |
            Indicates a failure to create the consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.Error400Response1Properties'
  /consent-groups/{consentGroupId}/consents/action/revoke:
    post:
      tags:
        - Actions
      summary: Revoke Consents for a given Consent Group
      description: |
        Revokes consents that are within a consent group.
      operationId: revokeConsentsInConsentGroup
      parameters:
        - name: consentGroupId
          in: path
          schema:
            type: string
          required: true
          description: |
            Select consents within the consentGroupId
      requestBody:
        description: >
          An end-point for revoking a consent within a consent group.


          This is similar in behaviour to the consent revocation endpoint, but operates on a consent group id parameter
          instead
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentManager.UpdateRevokedConsent1Properties'
      responses:
        '204':
          description: |
            Indicates a successful operation.
            The response does not have a body.
        '400':
          description: Indicates a failure to revoke the consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.Error400Response1Properties'
  /consents/{consentId}/action/revoke:
    post:
      tags:
        - Actions
      summary: Revoke a given Consent
      description: >-
        Revokes a consent by Consent identifier along with any associated access and refresh tokens.

        This API is used by ozone internally to revoke consents.

        The API should be used by an LFI to revoke consents (rather than simply patching the consent) to also revoke the
        tokens associated with the consent
      operationId: revokeConsentsByConsentId
      parameters:
        - $ref: '#/components/parameters/consentId'
      requestBody:
        description: |
          An end-point for revoking a consent.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentManager.UpdateRevokedConsent1Properties'
      responses:
        '204':
          description: |
            Indicates a successful operation.
            The response does not have a body.
        '400':
          description: |
            Indicates a failure to revoke the consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.Error400Response1Properties'
  /payment-log:
    get:
      tags:
        - Payments
      summary: Retrieve payment log for a given Consent
      operationId: getAuditConsentsByConsentIdw
      description: Retrieve all payments using the `consentId` value. Returns all payments associated with the consent.
      parameters:
        - name: consentId
          in: query
          schema:
            type: string
          required: true
          description: Identifier for the consent
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - consentId
                        - paymentType
                        - paymentId
                        - idempotencyKey
                        - paymentResponse
                        - tpp
                        - accountId
                        - psuIdentifiers
                        - interactionId
                        - authorizationCode
                        - requestBody
                        - requestHeaders
                      properties:
                        consentId:
                          type: string
                          description: |
                            The Consent identifier, generated by the TPP.
                        paymentType:
                          type: string
                          description: |
                            The underlying payment type

                            For example,

                              - qcb-single-instant-payment
                              - qcb-variable-on-demand-payment
                        paymentId:
                          type: string
                        idempotencyKey:
                          type: string
                        paymentResponse:
                          type: object
                          description: |
                            The payment response as received from the LFI as a result of a `make-payment` call
                          properties:
                            id:
                              type: string
                              description: |
                                A unique id for the payment in uuid-v4 format.
                            status:
                              type: string
                              description: |
                                The current status of the payment
                              enum:
                                - Pending
                                - AcceptedSettlementCompleted
                                - AcceptedCreditSettlementCompleted
                                - AcceptedWithoutPosting
                                - Rejected
                            creationDateTime:
                              type: string
                              format: date-time
                              description: |
                                An ISO date-time representing when the consent was created
                            statusUpdateDateTime:
                              type: string
                              format: date-time
                              description: |
                                An ISO date-time representing when the consent status was last updated
                            rejectReasonCode:
                              $ref: '#/components/schemas/ConsentManager.RejectReasonCode1Properties'
                        signedResponse:
                          type: string
                        tpp:
                          $ref: '#/components/schemas/ConsentManager.Tpp1Properties'
                        accountId:
                          description: The account identifier
                          type: string
                        psuIdentifiers:
                          $ref: '#/components/schemas/ConsentManager.PsuIdentifiers1Properties'
                        interactionId:
                          $ref: '#/components/schemas/ConsentManager.ApiLogInteractionId1Properties'
                        authorizationCode:
                          type: object
                          properties:
                            paymentId:
                              type: string
                            accessTokenHash:
                              type: string
                            currentDateTime:
                              type: string
                              format: date-time
                        requestBody:
                          $ref: '#/components/schemas/CreatePaymentInitiation1Request'
                        signedRequestBody:
                          type: string
                        requestHeaders:
                          type: object
                          description: |
                            The entire set of Http request headers that was received by Ozone from the TPP
                  meta:
                    $ref: '#/components/schemas/ConsentManager.Meta1Properties'
        '400':
          description: |
            Indicates a failure to retrieve the payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.Error400Response1Properties'
  /payment-log/{id}:
    patch:
      tags:
        - Payments
      summary: Update a given payment log entry
      description: |
        This operation allows an  modify fields within a payment's `paymentResponse`.
        This is used by the LFIs to update the status of a payment
      operationId: patchPaymentLog
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentManager.UpdatePaymentLog1Properties'
      responses:
        '204':
          description: |
            Indicates a successful operation.
            The response does not have a body.
        '400':
          description: The request patch operation failed due to an error at the Consent Manager API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.Error400Response1Properties'
  /hello-mtls:
    get:
      operationId: helloMtls
      tags:
        - Health Check
      summary: Check connectivity to Consent Manager
      description: >-
        This health check is used to check that the end-to-end network connectivity is working as expected including
        mutual tls. This health check endpoint assists in debugging mutual tls client issues. The health check returns
        information about the client certificate and the issuer of the client certificate that the server received.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentManager.HealthCheckCertResponse1Properties'
components:
  schemas:
    ConsentManager.StandardError1Codes:
      description: Standardized error codes used across open finance components
      type: string
      enum:
        - AccessToken.InvalidScope
        - Body.InvalidFormat
        - Consent.AccountTemporarilyBlocked
        - Consent.BusinessRuleViolation
        - Consent.FailsControlParameters
        - Consent.Invalid
        - Consent.InvalidUserIdentifier
        - Consent.PermanentAccountAccessFailure
        - Consent.TransientAccountAccessFailure
        - Event.UnexpectedEvent
        - JWE.DecryptionError
        - JWE.InvalidHeader
        - JWS.InvalidClaim
        - JWS.InvalidHeader
        - JWS.InvalidSignature
        - JWS.Malformed
        - Resource.InvalidFormat
    ConsentManager.StandardErrorCodePattern1Type:
      description: >-
        Namespaced error codes, indicating the source of the error code prior to the period, and the error code itself
        after the period e.g. `FAWRAN.AM04` indicates insufficient funds.
      type: string
      pattern: ^[A-Za-z]+\.[A-Za-z0-9]+$
    ConsentManager.ErrorReasonCode1Types:
      description: >-
        Error code identifying the problem that occurred. This may either be one of the prescribed error code(s), a code
        that observes the namespaced pattern, or a custom error codes specific to the API Hub.
      anyOf:
        - $ref: '#/components/schemas/ConsentManager.StandardError1Codes'
        - $ref: '#/components/schemas/ConsentManager.StandardErrorCodePattern1Type'
        - type: string
    ConsentManager.Error400Response1Properties:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          $ref: '#/components/schemas/ConsentManager.ErrorReasonCode1Types'
        errorMessage:
          type: string
          description: Message describing what problem has occurred
    ConsentManager.Meta1Properties:
      type: object
    ConsentManager.ApiLogInteractionId1Properties:
      type: object
      properties:
        ozoneInteractionId:
          type: string
        clientInteractionId:
          type: string
      required:
        - ozoneInteractionId
    ConsentManager.Tpp1Properties:
      description: >-
        The TPP record as held by Ozone. If Ozone TPP Connect has been integrated into a directory, the
        `directoryRecord` provides the TPP's directory record as held by Ozone in base 64 encoded format.
      type: object
      required:
        - clientId
        - orgId
        - softwareStatementId
        - tppId
        - tppName
        - decodedSsa
      properties:
        clientId:
          description: The client identifier for the TPP as issued by the Trust Framework
          type: string
          pattern: ^.*[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        tppId:
          description: The identifier used by the API Hub to uniquely identify the TPP
          type: string
        tppName:
          description: The TPP name recorded in the Trust Framework
          type: string
        softwareStatementId:
          description: The software statement identifier for the Client.
          type: string
        directoryRecord:
          type: string
          description: >-
            The latest copy of the TPP directory record retrieved from the QCB Trust Framework directory, encoded as a
            Base64 string.
          format: base64
        ssa:
          description: >-
            The encoded Software Statement Assertion. This property is not used for QCB and is therefore marked as
            deprecated.
          type: string
          deprecated: true
        decodedSsa:
          $ref: '#/components/schemas/ConsentManager.SoftwareStatement1Properties'
        orgId:
          description: The organization identifier for the TPP
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    ConsentManager.SoftwareStatement1Properties:
      description: |
        The decoded software statement retrieved from the Trust Framework that provides the properties of the Client.

        Please note:

        - The JSON payload will contain other properties in addition to those listed here. The properties listed here 
          are considered most relevant for activities such as TPP logo retrieval and JWS verification.
        - The content reflects elements of discovery metadata, which in generally defined as a file rather than an API. 
          Providing constraints such as `minLength` and `maxLength` is impractical in this context.

        The full software statement record is also available in the Trust Framework.
      type: object
      properties:
        redirect_uris:
          description: The redirect URIs registered by the TPP at the Trust Framework
          type: array
          items:
            type: string
        client_name:
          description: Name of the Client to be presented to the End-User.
          type: string
        client_uri:
          description: URL of the home page of the Client.
          type: string
        logo_uri:
          description: URL of the Client logo.
          type: string
        jwks_uri:
          description: URL of the Client JSON Web Key Set (JWKS) at the Trust Framework.
          type: string
        client_id:
          description: Unique Client Identifier.
          type: string
        roles:
          description: The roles under which the organization is registered at the Trust Framework.
          type: array
          items:
            type: string
        sector_identifier_uri:
          description: >-
            URL using the https scheme to be used in calculating Pseudonymous Identifiers by the OP. Allows redirect URI
            values to be grouped, easing registration management.
          type: string
        application_type:
          description: Client application type.
          type: string
        organisation_id:
          description: Organization identifier for organization that owns the Client.
          type: string
    ConsentManager.PsuIdentifiers1Properties:
      type: object
      description: |
        The PSU that is associated with this consent.

        The `PSUIdentifiers` object may have arbitrary custom fields that an LFI may use to identify 
        the PSU. All `PSUIdentifiers` must, however have a mandatory `userId` field that provides a unique user id for
        the PSU.

        The consent is initially created without a PSU identified.

        The value must be specified once the consent is authorised.
      properties:
        userId:
          type: string
      required:
        - userId
    ConsentManager.Consent1Properties:
      type: object
      properties:
        id:
          type: string
          description: |
            The Consent identifier, in uuid-v4 format.
        parId:
          type: string
          description: |
            A unique identifier for the PAR request that created this consent.
            The value matches the value of the request_uri returned by the post call to the PAR endpoint.
        rarType:
          type: string
          pattern: >-
            ^urn:openfinanceqatar:(?:bank-data-sharing:account-information|bank-service-initiation:payment-initiation):v[0-9]+\.[0-9]+$
          description: |
            The authorization detail type of the RAR request that resulted in this consent.
            This value matches the Type of the authorization_details element of the RAR request.
            Its value will be one of the authorization_details_types_supported on the well-known endpoint.
        standardVersion:
          type: string
          description: >
            The standardVersion field specifies the standardized version of an API set. An API set refers to a group of
            APIs designed to deliver a specific functionality (e.g., accounts, payments). Example values: 'v1.0' or
            'v2.1'.
        consentGroupId:
          type: string
          description: |
            A unique identifier for the consent group in uuid-v4 format.
            The consent group id is used to group together consents that are related to each other.
        requestUrl:
          type: string
          format: uri
          description: |
            The request url of Http request that was received by Ozone from the TPP
        consentType:
          type: string
          description: >
            The type of the consent that is being created.


            Each LFI's instance may support a different set of consent types

            The Consent Manager supports the creation of consents of different consent types depending on the standards
            supported.


            - qcb-account-access-consents

            - qcb-service-initiation-consents
        status:
          $ref: '#/components/schemas/Consent.ConsentStatus1Codes'
        request:
          $ref: '#/components/schemas/ConsentManager.AuthorizationDetails1Properties'
        requestHeaders:
          type: object
          description: |
            The entire set of Http request headers that was received by Ozone from the TPP
        consentBody:
          $ref: '#/components/schemas/ConsentManager.ConsentBody1Properties'
        interactionId:
          type: string
          description: The Heimdall `interactionId` that this consent is associated with.
        tpp:
          $ref: '#/components/schemas/ConsentManager.Tpp1Properties'
        ozoneSupplementaryInformation:
          type: object
        updatedAt:
          description: When the consent was last updated, as an epoch-based date/time
          type: number
      required:
        - id
        - consentType
        - consentBody
        - request
        - requestHeaders
        - tpp
    ConsentManager.ConsentBody1Properties:
      type: object
      description: |
        An object representing the current state of the consent.
        This includes the entire request, augmented by additional computed properties
        (e.g. ids, charges etc)
      oneOf:
        - $ref: '#/components/schemas/ConsentManager.BankDataSharingConsentBody1Properties'
        - $ref: '#/components/schemas/ConsentManager.BankServiceInitiationConsentBody1Properties'
    ConsentManager.BankDataSharingConsentBody1Properties:
      type: object
      title: Bank Data Sharing Consent Body
      required:
        - Data
      properties:
        Data:
          $ref: '#/components/schemas/AccountInformation.ReadConsent1Properties'
        Subscription:
          allOf:
            - $ref: '#/components/schemas/Events.Subscription1Properties'
          description: Subscription to Event Notifications, to be sent to the TPP Webhook registered at the API Hub.
      description: The current state of a Bank Data Sharing Consent.
    ConsentManager.BankServiceInitiationConsentBody1Properties:
      type: object
      title: Bank Service Initiation Consent Body
      required:
        - Data
      properties:
        Data:
          $ref: '#/components/schemas/PaymentInitiation.ReadPaymentInitiationConsent1Properties'
        Subscription:
          allOf:
            - $ref: '#/components/schemas/Events.Subscription1Properties'
          description: Subscription to Event Notifications, to be sent to the TPP Webhook registered at the API Hub.
        Meta:
          allOf:
            - $ref: '#/components/schemas/Consent.ConsentMeta1Properties'
          description: Metadata recorded against the Consent by the LFI, which currently carries multi-authorization  progress.
      description: The current state of a Bank Service Initiation Consent.
    ConsentManager.MutableConsentRecord1Properties:
      type: object
      properties:
        psuIdentifiers:
          $ref: '#/components/schemas/ConsentManager.PsuIdentifiers1Properties'
        accountIds:
          $ref: '#/components/schemas/ConsentManager.AccountIdentifiers'
        supplementaryInformation:
          $ref: '#/components/schemas/ConsentManager.SupplementaryInformation'
        paymentContext:
          type: object
        ConnectToken:
          type: string
          description: >-
            A bearer token that will be sent as the `Authorization` header for calls to Ozone Connect made under this
            consent.
        consentUsage:
          $ref: '#/components/schemas/ConsentManager.UpdateConsentUsage1Properties'
    ConsentManager.UpdateConsent1Properties:
      description: >-
        Update one-or-more properties of a given Consent based on the `consentId` value. Use the correct properties for
        the type of consent i.e. Bank Data Sharing or Bank Service Initiation.


        The interaction update, which carries only `interactionId`, is used by the API Hub alone.
      anyOf:
        - $ref: '#/components/schemas/ConsentManager.UpdateBankDataSharingConsent1Properties'
        - $ref: '#/components/schemas/ConsentManager.UpdateBankServiceInitiationConsent1Properties'
        - $ref: '#/components/schemas/ConsentManager.UpdateConsentInteraction1Properties'
    ConsentManager.UpdateConsentInteraction1Properties:
      title: Consent Interaction Update
      description: >-
        Updates the consent with the interaction. This payload is only used by the API Hub, to update the consent with
        the interaction during resolution of the properties of the `authorization_details` payload. It is not used by
        LFIs.
      type: object
      required:
        - interactionId
      properties:
        interactionId:
          type: string
          description: The Heimdall `interactionId` that this consent is associated with.
      additionalProperties: false
    ConsentManager.AccountIdentifiers:
      description: >-
        An array of Account Identifier values associated with the Consent, which must be populated once consent has been
        authorised.

        For Bank Service Initiation, the array must always have one element, which is the debtor account from which the
        payment will be made

        For Bank Data Sharing requests, the array may contain multiple values, representing each of the payment accounts
        for which an data will be provide.
      type: array
      minItems: 1
      items:
        type: string
    ConsentManager.AuthorizationChannel:
      description: LFI channel on which the User authorized the Consent.
      type: string
      enum:
        - App
        - Web
    ConsentManager.SupplementaryInformation:
      description: Contains additional information at the discretion of the LFI.
      type: object
    ConsentManager.UpdateBankDataSharingConsent1Properties:
      title: Bank Data Sharing Consent Update
      description: Properties that can be patched for a Bank Data Sharing Consent.
      type: object
      required:
        - authorizationChannel
      properties:
        psuIdentifiers:
          $ref: '#/components/schemas/ConsentManager.PsuIdentifiers1Properties'
        accountIds:
          $ref: '#/components/schemas/ConsentManager.AccountIdentifiers'
        supplementaryInformation:
          $ref: '#/components/schemas/ConsentManager.SupplementaryInformation'
        consentBody.Data.Status:
          $ref: '#/components/schemas/Consent.ConsentStatus1Codes'
        consentBody.Data.RevokedBy:
          $ref: '#/components/schemas/Consent.ConsentRevokedBy1Codes'
        authorizationChannel:
          $ref: '#/components/schemas/ConsentManager.AuthorizationChannel'
        consentUsage:
          $ref: '#/components/schemas/ConsentManager.UpdateConsentUsage1Properties'
      additionalProperties: false
    ConsentManager.UpdateBankServiceInitiationConsent1Properties:
      title: Bank Service Initiation Consent Update
      description: Properties that can be patched for a Bank Service Initiation Consent.
      type: object
      required:
        - authorizationChannel
      properties:
        psuIdentifiers:
          $ref: '#/components/schemas/ConsentManager.PsuIdentifiers1Properties'
        accountIds:
          allOf:
            - $ref: '#/components/schemas/ConsentManager.AccountIdentifiers'
            - type: array
              maxItems: 1
              items:
                type: string
        supplementaryInformation:
          $ref: '#/components/schemas/ConsentManager.SupplementaryInformation'
        consentBody.Data.Status:
          $ref: '#/components/schemas/Consent.ConsentStatus1Codes'
        consentBody.Data.ExchangeRate:
          $ref: '#/components/schemas/CurrencyExchange.ConsentCurrencyExchangeRateInformation1Properties'
        consentBody.Data.Charges:
          type: array
          items:
            $ref: '#/components/schemas/Charges.Charge1Properties'
          minItems: 1
        consentBody.Data.RevokedBy:
          $ref: '#/components/schemas/Consent.ConsentRevokedBy1Codes'
        consentBody.Meta.MultipleAuthorizers:
          $ref: '#/components/schemas/ConsentManager.UpdateMultiAuthorization1Properties'
        authorizationChannel:
          $ref: '#/components/schemas/ConsentManager.AuthorizationChannel'
        ConnectToken:
          type: string
          description: >-
            A bearer token that will be sent as the `Authorization` header for Bank Service Initiation  operations
            invoked at Ozone Connect. The API Hub for a given LFI must be configured for sending this token.
        consentUsage:
          $ref: '#/components/schemas/ConsentManager.UpdateConsentUsage1Properties'
      additionalProperties: false
    ConsentManager.RejectReasonCode1Properties:
      description: >
        A list of reject reason codes provided by the LFI.

        Where this list is patched repeatedly the LFI **MUST** append to the existing list **BEFORE** calling the patch
        operation, to ensure all values are maintained, unless the reject reason was patched in error and the existing
        value is being replaced.
      type: array
      minItems: 1
      items:
        description: >-
          The reason for rejection of a given payment request as detected by the LFI. The `Code` and `Message`
          properties are transposed EXACTLY in event notifications sent to the TPP, so the `Message` value MUST be
          sanitized accordingly.
        type: object
        required:
          - code
          - message
        properties:
          code:
            $ref: '#/components/schemas/PaymentInitiation.RejectReasonCode1Type'
          message:
            $ref: '#/components/schemas/PaymentInitiation.RejectReasonMessage1Type'
    ConsentManager.UpdatePaymentLog1Properties:
      type: object
      description: |
        Describes the fields to be patched and their corresponding values.
      required:
        - paymentResponse.status
      properties:
        paymentResponse.status:
          $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationStatus1Codes'
        paymentResponse.paymentTransactionId:
          $ref: '#/components/schemas/PaymentInitiation.PaymentTransactionId1Type'
        paymentResponse.rejectReasonCode:
          $ref: '#/components/schemas/ConsentManager.RejectReasonCode1Properties'
    ConsentManager.ConsentRecord1Properties:
      description: >

        A consent in its current state.


        If the consent has been authorised, then it can be expected that the LFI would have patched in `accountIds` and
        `psuIdentifier` fields.


        Additionally, the LFI may also patch in an arbitrary set of fields along with consent in the
        `supplementaryInformation` field.
      allOf:
        - $ref: '#/components/schemas/ConsentManager.Consent1Properties'
        - $ref: '#/components/schemas/ConsentManager.MutableConsentRecord1Properties'
        - type: object
          properties:
            authorizationChannel:
              type: string
              enum:
                - App
                - Web
    ConsentManager.ReadConsentsResponse1Properties:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConsentManager.ConsentRecord1Properties'
        meta:
          $ref: '#/components/schemas/ConsentManager.PaginationMetadata'
    ConsentManager.CreateConsentResponse1Properties:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ConsentManager.Consent1Properties'
        meta:
          $ref: '#/components/schemas/ConsentManager.Meta1Properties'
    ConsentManager.UpdateRevokedConsent1Properties:
      type: object
      required:
        - revokedBy
      properties:
        revokedBy:
          $ref: '#/components/schemas/Consent.ConsentRevokedBy1Codes'
        revokedByPsu:
          type: object
          properties:
            userId:
              type: string
    ConsentManager.AuthorizationDetails1Properties:
      description: |
        The request body for creating a new consent.

        The body consists of the RAR request that is sent by the TPP to the authorization server.
      oneOf:
        - $ref: '#/components/schemas/ConsentManager.BankDataSharingAuthorizationDetails1Properties'
        - $ref: '#/components/schemas/ConsentManager.BankServiceInitiationAuthorizationDetails1Properties'
    ConsentManager.BankDataSharingAuthorizationDetails1Properties:
      type: object
      required:
        - type
        - consent
      properties:
        type:
          description: The Rich Authorization Request (RAR) type
          type: string
          pattern: ^urn:openfinanceqatar:bank-data-sharing:account-information:v[0-9]+\.[0-9]+$
          example: urn:openfinanceqatar:bank-data-sharing:account-information:v1.0
        consent:
          $ref: '#/components/schemas/AccountInformation.CreateAccountInformationConsent1Properties'
        subscription:
          allOf:
            - $ref: '#/components/schemas/Events.Subscription1Properties'
          description: Subscription to Event Notifications, to be sent to the TPP Webhook registered at the API Hub.
      description: Properties for creating a Consent object for sharing account information with a TPP.
    ConsentManager.BankServiceInitiationAuthorizationDetails1Properties:
      type: object
      required:
        - type
        - consent
      properties:
        type:
          description: The Rich Authorization Request (RAR) type
          type: string
          pattern: ^urn:openfinanceqatar:bank-service-initiation:payment-initiation:v[0-9]+\.[0-9]+$
          example: urn:openfinanceqatar:bank-service-initiation:payment-initiation:v1.0
        consent:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.CreatePaymentInitiationConsent1Properties'
          description: Properties of the consent agreed by the User with the TPP.
        subscription:
          allOf:
            - $ref: '#/components/schemas/Events.Subscription1Properties'
          description: Subscription to Event Notifications, to be sent to the TPP Webhook registered at the API Hub.
      description: A Rich Authorization Request object for a Payment Initiation Consent.
    ConsentManager.HealthCheckCertResponse1Properties:
      type: object
      properties:
        connectionEstablished:
          type: boolean
        mtlsStatus:
          type: string
          enum:
            - established
            - not-established
        hostName:
          type: string
        clientCertificate:
          type: object
          properties:
            subject:
              type: string
            issuer:
              type: string
          required:
            - subject
            - issuer
      required:
        - connectionEstablished
        - mtlsStatus
        - hostName
        - clientCertificate
    ConsentManager.UpdateConsentUsage1Properties:
      type: object
      description: |
        Contains information about the last time the consent was used.
      properties:
        lastDataShared:
          type: string
          format: date-time
          description: >
            The last time the data was shared with the TPP. This is updated by the CM when the data is shared with the
            TPP.
        lastServiceInitiationAttempt:
          type: string
          format: date-time
          description: |
            The last time the payment was initiated by TPP. This is updated by the CM when payment is initiated by TPP.
    ConsentManager.PaginationMetadata:
      description: Pagination metadata that describes the response
      type: object
      required:
        - totalPages
        - totalRecords
      properties:
        pageNumber:
          description: The current page number
          type: integer
          minimum: 1
        pageSize:
          description: Number of records in the current page
          type: integer
          minimum: 1
        totalPages:
          description: Total number of pages available for response
          type: integer
          minimum: 0
        totalRecords:
          description: Total number of records across all pages
          type: integer
          minimum: 0
    AccountInformation.AccountSubType1Codes:
      type: string
      enum:
        - CreditCard
        - CurrencyAccount
        - CurrentAccount
        - Loan
        - Mortgage
        - Savings
        - Wallet
      description: |-
        Specifies the sub type of account (product family group).

        Supported values: CreditCard, CurrencyAccount, CurrentAccount, Loan, Mortgage, Savings, Wallet.
    AccountInformation.AccountType1Codes:
      type: string
      enum:
        - Retail
        - SME
        - Corporate
      description: Specifies the type of account (Retail, SME or Corporate).
    AccountInformation.ConsentPermission1Codes:
      type: string
      enum:
        - ReadAccountsBasic
        - ReadAccountsDetail
        - ReadBalances
        - ReadTransactionsBasic
        - ReadTransactionsDetail
      description: The permission codes available to the TPP for Bank Data Sharing and agreed with the User.
    AccountInformation.CreateAccountInformationConsent1Properties:
      type: object
      required:
        - ConsentId
        - Permissions
        - ExpirationDateTime
      properties:
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        BaseConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        Permissions:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.ConsentPermission1Codes'
          minItems: 1
        ExpirationDateTime:
          $ref: '#/components/schemas/Consent.ConsentExpirationDateTime1Type'
        FromDate:
          $ref: '#/components/schemas/AccountInformation.FromDate1Type'
        ToDate:
          $ref: '#/components/schemas/AccountInformation.ToDate1Type'
        AccountType:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.AccountType1Codes'
          minItems: 1
        AccountSubType:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.AccountSubType1Codes'
          minItems: 1
        OnBehalfOf:
          $ref: '#/components/schemas/Consent.TppActingOnBehalfOf1Types'
    AccountInformation.FromDate1Type:
      type: string
      format: date
      description: >-
        Specified start date for the transaction or statement query period.


        If this is not populated, the start date will be open ended, and data will be returned from the earliest
        available transaction or statement.


        All dates in the JSON payloads are represented in RFC 3339 date format.  For example: 2025-01-01
    AccountInformation.ToDate1Type:
      type: string
      format: date
      description: >-
        Specified end date for the transaction or statement query period.


        If this is not populated, the end date will be open ended, and data will be returned to the latest available
        transaction or the last statement generated.


        All dates in the JSON payloads are represented in RFC 3339 date format.  For example: 2025-12-31
    Address.Address1Types:
      type: object
      oneOf:
        - $ref: '#/components/schemas/Address.QatarAddress1Properties'
        - $ref: '#/components/schemas/Address.InternationalQualifiedAddress1Properties'
        - $ref: '#/components/schemas/Address.InternationalUnqualifiedAddress1Properties'
      discriminator:
        propertyName: AddressFormatType
        mapping:
          Qatar: '#/components/schemas/Address.QatarAddress1Properties'
          InternationalQualifiedAddress: '#/components/schemas/Address.InternationalQualifiedAddress1Properties'
          InternationalUnqualifiedAddress: '#/components/schemas/Address.InternationalUnqualifiedAddress1Properties'
      description: >-
        An address related to a given person or organization, based on ISO 20022.


        Qatar address structures are mapped as follows:


        * Zone: `CountrySubDivision`.


        * Street: `StreetName`.


        * Building Number: `BuildingNumber`.


        Other properties are retained in this object to support non-Qatar addresses.


        Implementers can choose, where appropriate, to provide `AddressLine` and `Country` where disambiguation of
        address properties is impossible.
    Address.AddressLine1Type:
      type: string
      minLength: 1
      maxLength: 70
      description: A freeform address entry that is not specified using specific address properties.
    Address.AddressType1Codes:
      type: string
      enum:
        - Billing
        - Business
        - Correspondence
        - DeliveryTo
        - MailTo
        - POBox
        - Postal
        - Permanent
        - Residential
        - Statement
        - Other
      description: Qualifies the type of address.
    Address.InternationalQualifiedAddress1Properties:
      type: object
      required:
        - AddressFormatType
        - AddressType
        - StreetName
        - Country
      properties:
        AddressFormatType:
          type: string
          enum:
            - InternationalQualifiedAddress
          description: Address format, defaults to `InternationalQualifiedAddress`
        AddressType:
          $ref: '#/components/schemas/Address.AddressType1Codes'
        BuildingNumber:
          type: string
          minLength: 1
          maxLength: 16
          description: Identifies the position of a given building on a street.
        BuildingName:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of the house or building.
        Floor:
          type: string
          minLength: 1
          maxLength: 70
          description: Floor or storey within a building.
        StreetName:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of a street or thoroughfare.
        DistrictName:
          type: string
          minLength: 1
          maxLength: 140
          description: Identifies a subdivision within a country sub-division.
        PostBox:
          type: string
          minLength: 1
          maxLength: 16
          description: Numbered box ina post office assigned to a given Party where post is kept until collected.
        PostCode:
          type: string
          minLength: 1
          maxLength: 16
          description: Identifier that qualifies a postal address to assist with the sorting and delivery of mail.
        TownName:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of a built-up area.
        CountrySubDivision:
          type: string
          minLength: 1
          maxLength: 35
          description: Country sub-division based on standards for stated country.
        Country:
          type: string
          pattern: ^[A-Z]{2}$
          description: Country code that conforms to ISO 3166-1 alpha-2 values.
      description: International address in the qualified address format, implemented using separate address properties.
    Address.InternationalUnqualifiedAddress1Properties:
      type: object
      required:
        - AddressFormatType
        - AddressType
        - Country
      properties:
        AddressFormatType:
          type: string
          enum:
            - InternationalUnqualifiedAddress
          description: Address format, defaults to `InternationalUnqualifiedAddress`
        AddressType:
          $ref: '#/components/schemas/Address.AddressType1Codes'
        AddressLine:
          type: array
          items:
            $ref: '#/components/schemas/Address.AddressLine1Type'
          minItems: 1
          maxItems: 7
          description: One-or-more address lines provided using freeform text.
        Country:
          type: string
          pattern: ^[A-Z]{2}$
          description: Country code that conforms to ISO 3166-1 alpha-2 values.
      description: International address in the unqualified address format, implemented using `AddressLine` and `Country`.
    Address.QatarAddress1Properties:
      type: object
      required:
        - AddressFormatType
        - AddressType
        - BuildingNumber
        - StreetName
        - CountrySubDivision
        - Country
      properties:
        AddressFormatType:
          type: string
          enum:
            - Qatar
          description: Address format, defaults to `Qatar`
        AddressType:
          $ref: '#/components/schemas/Address.AddressType1Codes'
        BuildingNumber:
          type: string
          minLength: 1
          maxLength: 16
          description: Identifies the position of a given building on a street.
        StreetName:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of a street or thoroughfare.
        CountrySubDivision:
          type: string
          pattern: ^Zone [0-9]{1,2}$
          description: Country sub-division, provided as as a Zone for Qatar addresses.
        Country:
          type: string
          pattern: ^[A-Z]{2}$
          description: Country code that conforms to ISO 3166-1 alpha-2 values.
      description: Address in the Qatar address format.
    Charges.ChargeBearerType1Codes:
      type: string
      enum:
        - BorneByCreditor
        - BorneByDebtor
        - Shared
      description: Bearer of the charges associated with a given payment or transaction.
    Consent.ConsentExpirationDateTime1Type:
      type: string
      pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
      format: date-time
      description: >-
        Date and time at which the consent will expire, as agreed at Consent Setup between the User and the TPP.


        Date and time is represented in RFC 3339 date-time format, qualified as Arabia Standard Time, with seconds being
        the maximum supported precision.
    Consent.ConsentId1Type:
      type: string
      minLength: 1
      maxLength: 128
      format: uuid
      description: >-
        Unique identification assigned by the TPP to identify the Consent.
          
        Indicates either a unique Consent or is used to identify a series of Consents linked by the TPP to indicate
        continuity of service across two-or-more Consent durations.


        Where used to indicate a series of Consents the value is described as the "Base Consent ID" (`baseConsentId`).
    Consent.IdentifiedTppActingOnBehalfOf1Properties:
      type: object
      required:
        - LegalName
        - IdentifierType
        - Identifier
      properties:
        TradingName:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            Trading Name of the organization, as understood by the User agreeing the Consent. Omitted where the Trading
            Name and Legal Name are the same.
        LegalName:
          type: string
          minLength: 1
          maxLength: 50
          description: Legal Name, as registered with the local agency who licenses or regulates the activity of the organization.
        IdentifierType:
          type: string
          enum:
            - CommercialRegistrationCertificate
            - Other
          description: >-
            Qualifier for the organization identifier. Permissible values:


            * CommercialRegistrationCertificate: Issued by Ministry of Commerce and Industry, with the value being the
            Certificate number.


            * Other: Alternative identifier, as allowed under open finance regulations.
        Identifier:
          type: string
          minLength: 1
          maxLength: 50
          description: Value of the identifier, qualified by `IdentifierType`.
      description: >-
        Provides details of the organization a TPP is acting on behalf of in providing open finance services, identified
        by name and by a qualified identifier.


        `IdentifierType` and `Identifier` are paired: an identifier is always accompanied by the scheme that qualifies
        it.
    Consent.TppActingOnBehalfOf1Types:
      oneOf:
        - $ref: '#/components/schemas/Consent.IdentifiedTppActingOnBehalfOf1Properties'
        - $ref: '#/components/schemas/Consent.UnidentifiedTppActingOnBehalfOf1Properties'
      description: >-
        Provides details of the organization a TPP is acting on behalf of in providing open finance services.


        Used in Consent to provide information on organizations that are not licensed directly to provide open finance
        services.


        Omitted where the TPP is not representing another organization in providing open finance services and agreeing
        Consent with the User.
    Consent.UnidentifiedTppActingOnBehalfOf1Properties:
      type: object
      required:
        - LegalName
      properties:
        TradingName:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            Trading Name of the organization, as understood by the User agreeing the Consent. Omitted where the Trading
            Name and Legal Name are the same.
        LegalName:
          type: string
          minLength: 1
          maxLength: 50
          description: Legal Name, as registered with the local agency who licenses or regulates the activity of the organization.
      description: >-
        Provides details of the organization a TPP is acting on behalf of in providing open finance services, identified
        by name only.


        Used where no qualified identifier is held for the organization.
    CurrencyExchange.ContractIdentification1Type:
      type: string
      minLength: 1
      maxLength: 256
      description: >-
        Unique and unambiguous reference to the foreign exchange contract agreed between the initiating party/Creditor
        and the Debtor Agent.
    CurrencyExchange.CurrencyExchangeRateInformation1Properties:
      type: object
      required:
        - UnitCurrency
        - RateType
      properties:
        UnitCurrency:
          type: string
          pattern: ^[A-Z]{3,3}$
          description: >-
            Currency in which the rate of exchange is expressed in a currency exchange. Often referred to as the "sell"
            side in a currency conversion.


            In the example 1GBP = xxxCUR, the unit currency is GBP.
        RateType:
          $ref: '#/components/schemas/CurrencyExchange.RateType1Codes'
        ContractIdentification:
          $ref: '#/components/schemas/CurrencyExchange.ContractIdentification1Type'
        ExchangeRate:
          type: number
          description: |-
            The factor used for conversion of an amount from one currency to another.

            Reflects the price at which one currency was bought with another currency.
      description: |-
        Provides details on the currency exchange rate and contract requested for a payment.

        `ExchangeRate` is omitted where the rate is not known at the point the request is made, and is
        resolved by the LFI.
    CurrencyExchange.InstructionPriority1Codes:
      type: string
      enum:
        - Normal
        - Urgent
      description: >-
        Indicator of the urgency or order of importance that the instructing party would like the instructed party to
        apply to the processing of the instruction.


        Payment Initiation Request may not require this code where it is not supported or the payment can proceed
        without specific prioritization.
    CurrencyExchange.RateType1Codes:
      type: string
      enum:
        - Actual
        - Agreed
        - Indicative
      description: Specifies the type used to complete the currency exchange.
    CurrencyExchange.RequestedCurrencyExchange1Properties:
      type: object
      required:
        - CurrencyOfTransfer
      properties:
        InstructionPriority:
          $ref: '#/components/schemas/CurrencyExchange.InstructionPriority1Codes'
        ExtendedPurpose:
          type: string
          minLength: 1
          maxLength: 140
          description: Specifies the purpose of an international payment, using freeform text.
        ChargeBearer:
          $ref: '#/components/schemas/Charges.ChargeBearerType1Codes'
        CurrencyOfTransfer:
          type: string
          pattern: ^[A-Z]{3,3}$
          description: >-
            Specifies the currency of the to be transferred amount, which is different from the currency of the Debtor
            Account.


            Often referred to as the "buy" side in a currency conversion.
        DestinationCountryCode:
          type: string
          pattern: '[A-Z]{2,2}'
          description: >-
            Country in which Credit Account is domiciled. Code to identify a country, a dependency, or another area of
            particular geopolitical interest, on the basis of country names obtained from the United Nations (ISO 3166,
            Alpha-2 code).


            Provides visibility to the LFI of the destination country for payment routing and risk screening purposes.
        ExchangeRateInformation:
          allOf:
            - $ref: '#/components/schemas/CurrencyExchange.CurrencyExchangeRateInformation1Properties'
          description: >-
            Details of the request currency exchange.


            Omitted where the TPP has no visibility of available rates at Consent Setup, with resolution of the
            requested currency exchange details happening at the LFI.
      description: >-
        The details of the non-local currency or currency exchange request that has been agreed between the User and the
        TPP.


        The requested Charge Bearer and Exchange Rate Information included in this object may be superseded by updated
        information supplied by the LFI, which will be recorded on the Consent record at Consent Manager.
    Events.Subscription1Properties:
      type: object
      required:
        - Webhook
      properties:
        Webhook:
          type: object
          properties:
            Url:
              type: string
              pattern: https:\/\/.+
              description: |-
                The TPP Webhook URL being registered with the LFI.

                The URL **MUST** use HTTPS.
            IsActive:
              type: boolean
              description: >-
                The TPP specifying whether the API Hub should emit Events, where `isActive` is `true` (Events are sent)
                or `false` (Events are not sent).
          required:
            - Url
            - IsActive
          description: Properties of the TPP Webhook and the state of the subscription.
      description: >-
        Properties of the a Event Notification Subscription created by the TPP for a given Consent.


        Additional guidance on supported Events is provided separately in the Developer Portal, and in the Webhook
        Template API description.
    Identity.BusinessIdentity1Properties:
      type: object
      required:
        - SchemeName
        - Identification
      properties:
        SchemeName:
          type: string
          enum:
            - CommercialRegistrationNumber
          description: |-
            The scheme name that specifies the identification type value.

            `CommercialRegistrationNumber` is the only supported value for businesses.
        Identification:
          type: string
          minLength: 1
          maxLength: 12
          description: Identification value, qualified by `schemeName`
        ExpiryDate:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]
          format: date
          description: |-
            Date on which the identification expires.

            Omitted if not held.
        Name:
          type: object
          properties:
            en:
              type: string
              minLength: 1
              maxLength: 70
              description: Name provided in English language.
            ar:
              type: string
              minLength: 1
              maxLength: 70
              description: Name provided in Arabic
          description: Name of the organization. Omitted if not held.
    Identity.Identity1Properties:
      type: object
      required:
        - SchemeName
        - Identification
      properties:
        SchemeName:
          $ref: '#/components/schemas/Identity.NationalIdentifier1Codes'
        Identification:
          type: string
          minLength: 1
          maxLength: 12
          description: Identification value, qualified by `schemeName`
        Name:
          type: object
          properties:
            en:
              type: string
              minLength: 1
              maxLength: 70
              description: Name provided in English language.
            ar:
              type: string
              minLength: 1
              maxLength: 70
              description: Name provided in Arabic
          description: Name of the person or organization. Omitted if not held.
    Identity.NationalIdentifier1Codes:
      type: string
      enum:
        - QID
        - CommercialRegistrationNumber
      description: |-
        Identifier type, based on following values:

        * QID: A Qatar ID, issued to individuals.

        * CommercialRegistrationNumber: Commercial Registration Certificate, issued to organizations.
    PaymentInitiation.AccountName1Properties:
      type: object
      properties:
        en:
          type: string
          minLength: 1
          maxLength: 70
          description: English language value of the account name.
        ar:
          type: string
          minLength: 1
          maxLength: 70
          description: Arabic language value of the account name.
      description: Name of the account holder on the account as recorded by the FI.
    PaymentInitiation.AccountType1Codes:
      type: string
      enum:
        - CurrentAccount
        - Savings
        - CreditCard
        - Mortgage
        - Finance
      description: The type of account held by the Creditor.
    PaymentInitiation.AddressMatchLevel1Codes:
      type: string
      enum:
        - FullMatch
        - PartialMatch
        - NoMatch
        - NotApplicable
      description: The level to which the delivery address matches the billing address.
    PaymentInitiation.AuthenticationChannel1Codes:
      type: string
      enum:
        - App
        - Web
      description: Indicates whether the User authenticated at the TPP using a mobile app or website.
    PaymentInitiation.AuthenticationFlow1Codes:
      type: string
      enum:
        - MFA
        - Other
      description: The authentication flow used by the User when authenticated at the TPP.
    PaymentInitiation.AuthenticationValue1Type:
      type: string
      minLength: 1
      maxLength: 256
      description: Value of authentication code.
    PaymentInitiation.BicFi1Type:
      type: string
      pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
      description: A BIC as defined by ISO 9302.
    PaymentInitiation.BindingStatus1Codes:
      type: string
      enum:
        - Active
        - Expired
        - Revoked
        - Suspended
      description: The status of the binding between the device and the session established by the TPP with the User.
    PaymentInitiation.BiometricType1Codes:
      type: string
      enum:
        - Fingerprint
        - FacialRecognition
        - Iris
        - VoicePrint
        - Other
      description: The type of biometric supported by the User's device.
    PaymentInitiation.ChallengeOutcome1Codes:
      type: string
      enum:
        - Pass
        - Fail
        - NotPerformed
      description: The outcome of the authentication challenge performed by the User at the TPP.
    PaymentInitiation.Channel1Codes:
      type: string
      enum:
        - Web
        - Mobile
      description: Where the payment has been initiated from.
    PaymentInitiation.ChannelType1Codes:
      type: string
      enum:
        - ECommerce
        - InStore
        - InApp
        - Telephone
        - Mail
        - RecurringPayment
        - Other
      description: The channel through which the transaction is being conducted.
    PaymentInitiation.ConnectionType1Codes:
      type: string
      enum:
        - WiFi
        - Cellular
        - Other
      description: The type of network connection used by the User's device.
    PaymentInitiation.CreatePaymentInitiationConsent1Properties:
      type: object
      required:
        - PersonalIdentifiableInformation
        - ControlParameters
        - ConsentId
        - ExpirationDateTime
        - PaymentPurposeCode
      properties:
        PersonalIdentifiableInformation:
          oneOf:
            - $ref: '#/components/schemas/PaymentInitiation.DomesticPaymentPersonalIdentifiableInformation1Properties'
            - $ref: '#/components/schemas/PaymentInitiation.JWEPaymentPII1Type'
          description: >-
            Personal Identifiable Information (PII), represented in both encoded and decoded form using a `oneOf`.


            Implementers **MUST** adhere to the `DomesticPaymentPersonalIdentifiableInformation1Properties` Schema
            Object when creating the object to be signed and encrypted through a JWS and JWE.


            Debtor and Creditor information **MUST** be set according to the rules for the payment type being
            instructed.


            A `DebtorAccount` **_may_** be provided if known to the TPP and agreed in the initial Consent setup at the
            TPP.


            The encrypted form of the object is provided by the `JWEPaymentPII1Type` Schema Object, which **MUST** be
            used when invoking the PAR operation.
        ControlParameters:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationControlParameters1Properties'
          description: Control Parameters set the overall rules for the Payment Schedule.
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        BaseConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        IsSingleAuthorization:
          type: boolean
          description: >-
            TPP is request authorization by a single User, with no multi-authorization requirement.


            Used to indicate the requirement time-bound authorization of the payment, in order to release goods or
            services in a timely fashion.


            Can be ignored by LFIs where the access control model for the account requires multiple authorizations of
            the


            Set to `false` where immediate authorization is not required.
        AuthorizationExpirationDateTime:
          type: string
          format: date-time
        ExpirationDateTime:
          $ref: '#/components/schemas/Consent.ConsentExpirationDateTime1Type'
        Permissions:
          type: array
          items:
            $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationAccountInformationPermission1Codes'
          minItems: 2
          uniqueItems: true
          description: >-
            Specifies the permitted Bank Data Sharing permissions, which is the data clusters being consented by the
            User, and requested for authorization with the LFI.


            Allows TPPs to check the User balance at the payment account.


            TPPs **MUST** select `ReadAccountsBasic` and `ReadBalances` to implement a balance check before making
            payment.
        CurrencyRequest:
          $ref: '#/components/schemas/CurrencyExchange.RequestedCurrencyExchange1Properties'
        DebtorReference:
          $ref: '#/components/schemas/PaymentInitiation.DebtorReference1Type'
        CreditorReference:
          $ref: '#/components/schemas/PaymentInitiation.CreditorReference1Type'
        PaymentPurposeCode:
          allOf:
            - $ref: '#/components/schemas/PaymentPurposeCode1Type'
      description: Properties of the consent agreed by the User with the TPP for a Payment Initiation Consent.
    PaymentInitiation.Creditor1Properties:
      type: object
      properties:
        Name:
          type: string
          minLength: 1
          maxLength: 140
          description: Creditor name.
        PostalAddress:
          allOf:
            - $ref: '#/components/schemas/Address.Address1Types'
          description: Creditor postal address.
      description: Party to which an amount of money is due.
    PaymentInitiation.CreditorAccountType1Codes:
      type: string
      enum:
        - Individual
        - Merchant
        - Business
        - Charity
        - GovernmentBody
        - Other
      description: |-
        The Creditor (Payee) Type, based on an allowed list.

        This value is populated by TPPs to inform the User of the type of Creditor being authorized

        Used to provide information to the User during the Consent journey.
    PaymentInitiation.CreditorAgent1Properties:
      type: object
      required:
        - SchemeName
        - Identification
      properties:
        SchemeName:
          type: string
          enum:
            - BICFI
            - Other
          description: |-
            The name of the scheme that qualifies the `identification` value for the Agent.

            The following values are supported:

            * `BICFI`: A Business Identification Code, as defined under ISO9362.

            * `Other`: An alternative identifier, as prescribed under local market regulations.
        Identification:
          anyOf:
            - $ref: '#/components/schemas/PaymentInitiation.BicFi1Type'
            - $ref: '#/components/schemas/PaymentInitiation.OtherFiIdentification1Type'
          description: Identification for the financial institution who is the Agent, qualified by `SchemeName`.
        Name:
          type: string
          minLength: 1
          maxLength: 140
          description: Creditor Agent name.
        PostalAddress:
          allOf:
            - $ref: '#/components/schemas/Address.Address1Types'
          description: Creditor Agent postal address.
      description: >-
        Properties of the Creditor Agent, which provides information on the Financial Institution that holds the
        Creditor Account.
    PaymentInitiation.CreditorIndicators1Properties:
      type: object
      properties:
        AccountType:
          $ref: '#/components/schemas/PaymentInitiation.AccountType1Codes'
        IsCreditorPrePopulated:
          type: boolean
          description: Creditor details are provided by the TPP and the User has not entered them at Consent Setup.
        TradingName:
          $ref: '#/components/schemas/PaymentInitiation.TradingName1Properties'
        IsVerifiedByTPP:
          type: boolean
          description: The TPP has onboarded the Creditor and verified their identity.
        AdditionalAccountHolderIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/Identity.Identity1Properties'
        MerchantDetails:
          type: object
          properties:
            MerchantIdentification:
              $ref: '#/components/schemas/Identity.BusinessIdentity1Properties'
            MerchantSICCode:
              type: string
              minLength: 3
              maxLength: 4
            MerchantCategoryCode:
              type: string
              minLength: 3
              maxLength: 4
          required:
            - MerchantIdentification
          description: >-
            Details of the Merchant involved in the transaction.


            Merchant details are specified only for those merchant categories that are generally expected to originate
            retail financial transactions.
        SupplementaryData:
          type: object
          description: Additional information that cannot be captured in the structured fields and/or any other specific block
      description: Creditor Indicators
    PaymentInitiation.CreditorReference1Type:
      type: string
      minLength: 1
      maxLength: 35
      pattern: ^[A-Za-z0-9 \/?:().,'+-]+$
      description: >-
        Creditor Reference that provides information to the Creditor on the source of the payment.


        If included in the Consent displayed during Consent Authorization and recorded with payment on the Creditor
        account ledger of transactions by the LFI, where supported by the LFI.


        If included in the Payment Initiation operation included in the request payload.


        If included in Account Information, provides a record of the Creditor Reference recorded with the transaction.
    PaymentInitiation.DebtorAccount1Properties:
      type: object
      required:
        - SchemeName
        - Identification
      properties:
        SchemeName:
          type: string
          enum:
            - IBAN
          description: Scheme name for the Debtor Account. The Debtor Account must be an IBAN.
        Identification:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.QcbIban1Type'
          description: The Identification of the Debtor Account.
        Name:
          type: object
          properties:
            en:
              type: string
              minLength: 1
              maxLength: 70
            ar:
              type: string
              minLength: 1
              maxLength: 70
          minProperties: 1
          description: The Debtor Account, which can be provided in both English and Arabic. Omitted if not held by the TPP.
      description: >-
        Details of the Debtor Account when provided at the TPP. Omitted if not available at the TPP or the User chooses
        to select the Debtor Account at the LFI.
    PaymentInitiation.DebtorIndicators1Properties:
      type: object
      properties:
        Authentication:
          type: object
          properties:
            AuthenticationChannel:
              $ref: '#/components/schemas/PaymentInitiation.AuthenticationChannel1Codes'
            PossessionFactor:
              type: object
              properties:
                IsUsed:
                  type: boolean
                Type:
                  $ref: '#/components/schemas/PaymentInitiation.PossessionFactorType1Codes'
            KnowledgeFactor:
              type: object
              properties:
                IsUsed:
                  type: boolean
                Type:
                  $ref: '#/components/schemas/PaymentInitiation.KnowledgeFactorType1Codes'
            InherenceFactor:
              type: object
              properties:
                IsUsed:
                  type: boolean
                Type:
                  $ref: '#/components/schemas/PaymentInitiation.InherenceFactorType1Codes'
            ChallengeOutcome:
              $ref: '#/components/schemas/PaymentInitiation.ChallengeOutcome1Codes'
            AuthenticationFlow:
              $ref: '#/components/schemas/PaymentInitiation.AuthenticationFlow1Codes'
            AuthenticationValue:
              $ref: '#/components/schemas/PaymentInitiation.AuthenticationValue1Type'
            ChallengeDateTime:
              type: string
              format: date-time
          description: The authentication method used by the User to access their account with the TPP.
        UserName:
          type: object
          properties:
            en:
              type: string
              minLength: 1
              maxLength: 70
              description: Name provided in English language.
            ar:
              type: string
              minLength: 1
              maxLength: 70
              description: Name provided in Arabic
          description: The Name of the User initiating the Payment
        GeoLocation:
          type: object
          properties:
            Latitude:
              $ref: '#/components/schemas/Values.Latitude1Type'
            Longitude:
              $ref: '#/components/schemas/Values.Longitude1Type'
          required:
            - Latitude
            - Longitude
          description: GPS to identify and track the whereabouts of the connected electronic device.
        DeviceInformation:
          type: object
          properties:
            DeviceId:
              $ref: '#/components/schemas/PaymentInitiation.DeviceId1Type'
            AlternativeDeviceId:
              $ref: '#/components/schemas/PaymentInitiation.DeviceId1Type'
            DeviceOperatingSystem:
              $ref: '#/components/schemas/PaymentInitiation.DeviceOperatingSystem1Type'
            DeviceOperatingSystemVersion:
              $ref: '#/components/schemas/PaymentInitiation.DeviceOperatingSystemVersion1Type'
            DeviceBindingId:
              $ref: '#/components/schemas/PaymentInitiation.DeviceBindingId1Type'
            LastBindingDateTime:
              type: string
              format: date-time
            BindingDuration:
              type: string
              format: duration
            BindingStatus:
              $ref: '#/components/schemas/PaymentInitiation.BindingStatus1Codes'
            DeviceType:
              $ref: '#/components/schemas/PaymentInitiation.DeviceType1Codes'
            DeviceManufacturer:
              type: object
              properties:
                Model:
                  type: string
                  minLength: 1
                  maxLength: 50
                Manufacturer:
                  type: string
                  minLength: 1
                  maxLength: 50
              description: Device manufacturer information.
            DeviceLanguage:
              $ref: '#/components/schemas/PaymentInitiation.DeviceLanguage1Type'
            DeviceLocalDateTime:
              type: string
              format: date-time
              description: Date and time as set on the device.
            ConnectionType:
              $ref: '#/components/schemas/PaymentInitiation.ConnectionType1Codes'
            ScreenInformation:
              type: object
              properties:
                PixelDensity:
                  type: integer
                  format: int64
                Orientation:
                  $ref: '#/components/schemas/PaymentInitiation.Orientation1Codes'
              description: Device screen information
            BatteryStatus:
              type: object
              properties:
                Level:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 100
                IsCharging:
                  type: boolean
              description: Device battery information.
            TouchSupport:
              type: object
              properties:
                Supported:
                  type: boolean
                MaxTouchPoints:
                  type: integer
                  minimum: 0
              description: Device touch support information.
            MotionSensors:
              type: object
              properties:
                Status:
                  $ref: '#/components/schemas/PaymentInitiation.MotionSensorStatus1Codes'
                Accelerometer:
                  type: boolean
                Gyroscope:
                  type: boolean
              description: Device motion sensor information.
            DeviceEnvironmentContext:
              type: array
              items:
                $ref: '#/components/schemas/PaymentInitiation.DeviceEnvironmentContext1Codes'
              minItems: 1
              description: Device environment context information.
          description: Detailed device information
        BiometricCapabilities:
          type: object
          properties:
            SupportsBiometric:
              type: boolean
            BiometricTypes:
              type: array
              items:
                $ref: '#/components/schemas/PaymentInitiation.BiometricType1Codes'
          description: Device biometric capabilities
        AppInformation:
          type: object
          properties:
            AppVersion:
              type: string
              minLength: 1
              maxLength: 50
              description: TPP app version number or label.
            PackageName:
              type: string
              minLength: 1
              maxLength: 256
              description: TPP app package name.
            BuildNumber:
              type: string
              minLength: 1
              maxLength: 50
              description: TPP app build number.
          minProperties: 1
          description: Mobile application specific information
        BrowserInformation:
          type: object
          properties:
            UserAgent:
              type: string
              minLength: 1
              maxLength: 1024
              description: User agent information.
            IsCookiesEnabled:
              type: boolean
              description: Whether cookies are enabled indicator.
            AvailableFonts:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 140
                description: Font family name.
              minItems: 1
            Plugins:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 140
                description: Plug-in name.
              minItems: 1
            PixelRatio:
              type: integer
              format: int64
              description: Browser pixel ratio.
          minProperties: 1
          description: Browser-specific information
        UserBehavior:
          type: object
          properties:
            ScrollBehavior:
              type: object
              properties:
                Direction:
                  $ref: '#/components/schemas/PaymentInitiation.Direction1Codes'
                Speed:
                  type: integer
                  format: int64
                Frequency:
                  type: integer
                  format: int64
          description: User behavior indicators
        AccountRiskIndicators:
          type: object
          properties:
            UserOnboardingDateTime:
              type: string
              format: date-time
              description: Date and time at which the User was onboarded with the TPP.
            LastAccountChangeDate:
              type: string
              format: date
              description: Date at which the User last changed their account settings at the TPP.
            LastPasswordChangeDate:
              type: string
              format: date
              description: Date at which the User last changed their password at the TPP.
            SuspiciousActivity:
              $ref: '#/components/schemas/PaymentInitiation.SuspiciousActivity1Codes'
            TransactionHistory:
              type: object
              properties:
                LastDay:
                  type: integer
                  minimum: 0
                LastYear:
                  type: integer
                  minimum: 0
              description: Summary of User transaction history at the TPP.
          description: Risk indicators related to the account
        SupplementaryData:
          type: object
          description: >-
            Additional information that cannot be captured in the structured fields and/or any other specific block.
            This may include information that is not available in the structured fields, such as a user's behavioural
            data like their typing speed and typing patterns.
      description: Indicators associated with the User (Debtor) that agreed the Consent with the TPP.
    PaymentInitiation.DebtorReference1Type:
      type: string
      minLength: 1
      maxLength: 35
      pattern: ^[A-Za-z0-9 \/?:().,'+-]+$
      description: >-
        Debtor Reference that provides information to the User on the source of the payment.


        If included in the Consent displayed during Consent Authorization and recorded with payment on the account
        ledger of transactions by the LFI.


        If included in the Payment Initiation operation included in the request payload or returned by the financial
        institution for information for the User.
    PaymentInitiation.DeliveryTimeframe1Codes:
      type: string
      enum:
        - ElectronicDelivery
        - SameDayShipping
        - OvernightShipping
        - MoreThan1DayShipping
      description: The delivery timeframe for the merchandise as provided by the merchant.
    PaymentInitiation.DeviceBindingId1Type:
      type: string
      minLength: 1
      maxLength: 8192
      description: Device binding identifier that binds a device to the session established by the TPP with the User.
    PaymentInitiation.DeviceEnvironmentContext1Codes:
      type: string
      enum:
        - VPNDetected
        - EmulatorDetected
      description: Contextual indicators detected in the environment of the User's device.
    PaymentInitiation.DeviceId1Type:
      type: string
      minLength: 1
      maxLength: 255
      description: Device identifier (primary or alternative) as elicited by the TPP from the appropriate device interface.
    PaymentInitiation.DeviceLanguage1Type:
      type: string
      minLength: 1
      maxLength: 35
      description: Device language setting.
    PaymentInitiation.DeviceOperatingSystem1Type:
      type: string
      minLength: 1
      maxLength: 70
      description: Device operating system as elicited by the TPP from the appropriate device interface.
    PaymentInitiation.DeviceOperatingSystemVersion1Type:
      type: string
      minLength: 1
      maxLength: 70
      description: Device operating system version as elicited by the TPP from the appropriate device interface.
    PaymentInitiation.DeviceType1Codes:
      type: string
      enum:
        - Mobile
        - Desktop
        - Tablet
        - Wearable
        - Other
      description: The type of device used by the User to access their account with the TPP.
    PaymentInitiation.Direction1Codes:
      type: string
      enum:
        - Up
        - Down
        - Both
      description: The direction of the User's scroll behaviour.
    PaymentInitiation.DomesticCreditor1Properties:
      type: object
      required:
        - CreditorAccount
      properties:
        CreditorAgent:
          $ref: '#/components/schemas/PaymentInitiation.CreditorAgent1Properties'
        Creditor:
          $ref: '#/components/schemas/PaymentInitiation.Creditor1Properties'
        CreditorAccount:
          $ref: '#/components/schemas/PaymentInitiation.DomesticCreditorAccount1Properties'
      description: Identification elements for a Creditor for a domestic payment instruction.
    PaymentInitiation.DomesticCreditorAccount1Properties:
      type: object
      required:
        - SchemeName
        - Identification
        - Name
      properties:
        Type:
          $ref: '#/components/schemas/PaymentInitiation.CreditorAccountType1Codes'
        SchemeName:
          type: string
          enum:
            - IBAN
          description: Domestic payment scheme, restricted to `IBAN`.
        Identification:
          $ref: '#/components/schemas/PaymentInitiation.QcbIban1Type'
        Name:
          $ref: '#/components/schemas/PaymentInitiation.AccountName1Properties'
        TradingName:
          $ref: '#/components/schemas/PaymentInitiation.TradingName1Properties'
      description: Unambiguous identification of the account of the Creditor to which a payment will be made.
    PaymentInitiation.DomesticPaymentPersonalIdentifiableInformation1Properties:
      type: object
      required:
        - Initiation
        - Risk
      properties:
        Initiation:
          type: object
          properties:
            DebtorAccount:
              $ref: '#/components/schemas/PaymentInitiation.DebtorAccount1Properties'
            Creditor:
              type: array
              items:
                $ref: '#/components/schemas/PaymentInitiation.DomesticCreditor1Properties'
              minItems: 1
              maxItems: 10
              description: List of Creditors for a domestic payment consent.
          required:
            - Creditor
          description: The Initiation data is sent by the TPP to the LFI. This data is immutable and cannot be changed.
        Risk:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.Risk1Properties'
          description: |-
            Risk data provides the context of the Consent Setup at the TPP.

            Guidance on the required data for given payment types is provided separately.
      description: >-
        Personal Identifiable Information (PII) for a Domestic Payment.


        Between one and ten Creditors are supported, to allow fixed and variable payments to multiple Creditors under a
        single Consent.
      title: Domestic Payment PII Schema Object
    PaymentInitiation.InherenceFactorType1Codes:
      type: string
      enum:
        - Biometric
        - Fingerprint
        - FaceRecognition
        - IrisSca
        - VoiceRecognition
        - FIDOBiometric
        - DeviceBiometrics
        - Other
    PaymentInitiation.JWEPaymentPII1Type:
      type: string
      minLength: 1
      maxLength: 131072
      description: >-
        A JSON Web Encryption (JWE) object, which encapsulates a JWS.


        The value is a Compact Serialization of a JWE, which encapsulates encrypted content using JSON data structures.


        Decrypted payload content **MUST** be parsed using the Scheme Objects defined by the
        `personalIdentifiableInformation` property for the given payment type.
      title: Encrypted PII Object
    PaymentInitiation.KnowledgeFactorType1Codes:
      type: string
      enum:
        - PIN
        - Password
        - SecurityQuestion
        - SMSOTP
        - EmailOTP
        - OTPPush
        - Other
    PaymentInitiation.LongLivedPaymentConsent1Properties:
      type: object
      required:
        - PeriodicSchedule
      properties:
        MaximumCumulativeValueOfPayments:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.PeriodTypeMaximumCumulativeValueOfPayments1Properties'
          description: >-
            The maximum cumulative value of all successful payment rails executions under the Consent.


            Each successful payment rails execution amount (related to the Consent) is added to the total cumulative
            value of the Consent, which cannot exceed the maximum value agreed with the User at the point of consent.
        MaximumCumulativeNumberOfPayments:
          type: integer
          description: >-
            The maximum cumulative number of all successful payment rails executions under the Consent.


            Each successful payment rails execution (related to the Consent) is added to the total cumulative number of
            payments for the Consent, which cannot exceed the maximum value agreed with the User at the point of
            consent.
        PeriodicSchedule:
          $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationPeriodicSchedule1Types'
      description: A Consent definition for defining Multi Payments.
    PaymentInitiation.MaximumIndividualAmount1Properties:
      type: object
      required:
        - Amount
        - Currency
      properties:
        Amount:
          $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
        Currency:
          $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
      description: This is the Maximum amount a variable payment can take per period.
    PaymentInitiation.MotionSensorStatus1Codes:
      type: string
      enum:
        - InMotion
        - Stationary
      description: Indicates whether the User's device is in motion or stationary.
    PaymentInitiation.MultiPaymentConsentSchedule1Properties:
      type: object
      required:
        - MultiPayment
      properties:
        MultiPayment:
          $ref: '#/components/schemas/PaymentInitiation.LongLivedPaymentConsent1Properties'
      description: A Consent Schedule for a Multi-Payment, initiated under a payment schedule agreed between the User and the TPP.
    PaymentInitiation.Orientation1Codes:
      type: string
      enum:
        - Portrait
        - Landscape
      description: The screen orientation of the User's device.
    PaymentInitiation.OtherFiIdentification1Type:
      type: string
      minLength: 1
      maxLength: 35
      description: Alternative FI identification, where BICFI is not supplied or supported.
    PaymentInitiation.PaymentInitiationAccountInformationPermission1Codes:
      type: string
      enum:
        - ReadAccountsBasic
        - ReadAccountsDetail
        - ReadBalances
        - ReadRefundAccount
    PaymentInitiation.PaymentInitiationConsentSchedule1Types:
      oneOf:
        - $ref: '#/components/schemas/PaymentInitiation.SinglePaymentConsentSchedule1Properties'
        - $ref: '#/components/schemas/PaymentInitiation.MultiPaymentConsentSchedule1Properties'
      description: |-
        The Consent Schedule agreed between the User and the TPP.

        Exactly one payment type **MUST** be provided.
    PaymentInitiation.PaymentInitiationControlParameters1Properties:
      type: object
      required:
        - ConsentSchedule
      properties:
        ConsentSchedule:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationConsentSchedule1Types'
          description: |-
            The various payment types that can be initiated. Exactly one payment type **MUST** be provided:

            * A Single Payment, initiated immediately after the User authorizes the Consent at the LFI.

            * A Multi-Payment, initiated under a payment schedule agreed between the User and the TPP.
      description: Control Parameters set the overall rules for the Payment Schedule.
    PaymentInitiation.PaymentInitiationPeriodicSchedule1Types:
      type: object
      oneOf:
        - $ref: '#/components/schemas/PaymentInitiation.VariableOnDemand1Properties'
      discriminator:
        propertyName: Type
        mapping:
          VariableOnDemand: '#/components/schemas/PaymentInitiation.VariableOnDemand1Properties'
      description: The definition for a payment schedule, discriminated by the `Type` property.
    PaymentInitiation.PeriodStartDate1Type:
      type: string
      format: date
      description: Specifies the start date of when a payment schedule begins.
    PaymentInitiation.PeriodType1Codes:
      type: string
      enum:
        - Day
        - Week
        - Month
        - Year
      description: >-
        |Period Type|Description|

        |-----------|-----------|

        |Day|A continuous period of time, consisting of 24 consecutive hours, starting from midnight (00:00:00) and
        finishing at 23:59:59 of the same day. |

        |Week|A continuous period of time, consisting of seven consecutive days, starting from midnight (00:00:00) and
        finishing at 23:59:59 of the 7th day. |

        |Month|A continuous period of time starting from midnight (00:00:00) of the first day of a month and finishing
        at 23:59:59 of the last day of that month.|

        |Year|A continuous period of time, consisting of 12 months.|
    PaymentInitiation.PeriodTypeMaximumCumulativeValueOfPayments1Properties:
      type: object
      required:
        - Amount
        - Currency
      properties:
        Amount:
          $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
        Currency:
          $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
      description: The maximum cumulative payment value of all payment initiations per Period Type.
    PaymentInitiation.PossessionFactorType1Codes:
      type: string
      enum:
        - FIDO2SecurityKey
        - Passkey
        - OTPDevice
        - OTPApp
        - SMSOTP
        - EmailOTP
        - PushNotification
        - WebauthnToken
        - SecureEnclaveKey
        - HardwareOTPKey
        - TrustedDevice
        - Other
      description: Possession factor used by the User when authenticated at the TPP.
    PaymentInitiation.PreOrderPurchaseIndicator1Codes:
      type: string
      enum:
        - MerchandiseAvailable
        - FutureAvailability
      description: Indicates whether the merchandise is currently available or is a pre-order for future availability.
    PaymentInitiation.QcbIban1Type:
      type: string
      pattern: ^QA[0-9]{2}[A-Z]{4}[0-9]{21}$
      description: >-
        A domestic IBAN, as [defined](https://www.qcb.gov.qa/Documents/BankInstructions/EN/13-193.pdf) by Qatar Central
        Bank.
    PaymentInitiation.RecipientType1Codes:
      type: string
      enum:
        - Individual
        - Corporate
      description: Indicates whether the recipient of the delivery is an individual or a corporate entity.
    PaymentInitiation.ReorderItemsIndicator1Codes:
      type: string
      enum:
        - FirstTimeOrder
        - Reorder
      description: Indicates whether the transaction is a first-time order or a reorder of items.
    PaymentInitiation.Risk1Properties:
      type: object
      properties:
        DebtorIndicators:
          $ref: '#/components/schemas/PaymentInitiation.DebtorIndicators1Properties'
        DestinationDeliveryAddress:
          type: object
          properties:
            RecipientType:
              $ref: '#/components/schemas/PaymentInitiation.RecipientType1Codes'
            RecipientName:
              type: object
              properties:
                en:
                  type: string
                  minLength: 1
                  maxLength: 70
                  description: Name provided in English language.
                ar:
                  type: string
                  minLength: 1
                  maxLength: 70
                  description: Name provided in Arabic
            NationalAddress:
              type: array
              items:
                $ref: '#/components/schemas/Address.QatarAddress1Properties'
              minItems: 1
              description: One-or-more addresses the goods or services are to be delivered to.
          description: Destination Delivery Address
        TransactionIndicators:
          $ref: '#/components/schemas/PaymentInitiation.TransactionIndicators1Properties'
        CreditorIndicators:
          $ref: '#/components/schemas/PaymentInitiation.CreditorIndicators1Properties'
      description: >-
        Risk information is sent by the TPP to the LFI and is used to specify additional details for payment risk and
        fraud scoring.
    PaymentInitiation.SingleInstantPayment1Properties:
      type: object
      required:
        - Type
        - Amount
      properties:
        Type:
          type: string
          enum:
            - SingleInstantPayment
          description: The Payment Type.
        Amount:
          type: object
          required:
            - Amount
            - Currency
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: An Amount qualified by an active Currency, using amount and currency as prescribed by ISO 4217.
      description: >-
        A single immediate payment consent that **MUST** be used for a single payment, which will be initiated
        immediately after User authorization at the LFI.
    PaymentInitiation.SinglePaymentConsentSchedule1Properties:
      type: object
      required:
        - SinglePayment
      properties:
        SinglePayment:
          $ref: '#/components/schemas/PaymentInitiation.SingleInstantPayment1Properties'
      description: A Consent Schedule for a Single Payment, initiated immediately after the User authorizes the Consent at the LFI.
    PaymentInitiation.SubChannelType1Codes:
      type: string
      enum:
        - WebBrowser
        - MobileApp
        - SmartTV
        - WearableDevice
        - POSTerminal
        - ATM
        - KioskTerminal
        - Other
      description: More specific classification of the transaction channel.
    PaymentInitiation.SuspiciousActivity1Codes:
      type: string
      enum:
        - NoSuspiciousActivity
        - SuspiciousActivityDetected
      description: Indicates whether suspicious activity has been detected on the account.
    PaymentInitiation.TradingName1Properties:
      type: object
      properties:
        en:
          type: string
          minLength: 1
          maxLength: 70
          description: English language value of the trading name.
        ar:
          type: string
          minLength: 1
          maxLength: 70
          description: Arabic language value of the trading name.
      description: |-
        The trading name (if applicable) for the Creditor, as defined by local organization registration requirements.

        Omitted if not account name and trading name match.
    PaymentInitiation.TransactionIndicators1Properties:
      type: object
      properties:
        IsCustomerPresent:
          type: boolean
          description: This field differentiates between automatic and manual payment initiation.
        IsContractPresent:
          type: boolean
          description: Indicates if the Creditor has a contractual relationship with the TPP.
        Channel:
          $ref: '#/components/schemas/PaymentInitiation.Channel1Codes'
        ChannelType:
          $ref: '#/components/schemas/PaymentInitiation.ChannelType1Codes'
        SubChannelType:
          $ref: '#/components/schemas/PaymentInitiation.SubChannelType1Codes'
        PaymentProcess:
          type: object
          properties:
            TotalDuration:
              type: integer
              minimum: 0
            CurrentSessionAttempts:
              type: integer
              minimum: 1
            CurrentSessionFailedAttempts:
              type: integer
              minimum: 0
            Last24HourAttempts:
              type: integer
              minimum: 0
            Last24HourFailedAttempts:
              type: integer
              minimum: 0
          description: Metrics related to the payment process duration and attempts
        MerchantRisk:
          type: object
          properties:
            DeliveryTimeframe:
              $ref: '#/components/schemas/PaymentInitiation.DeliveryTimeframe1Codes'
            ReorderItemsIndicator:
              $ref: '#/components/schemas/PaymentInitiation.ReorderItemsIndicator1Codes'
            PreOrderPurchaseIndicator:
              $ref: '#/components/schemas/PaymentInitiation.PreOrderPurchaseIndicator1Codes'
            IsGiftCardPurchase:
              type: boolean
            IsDeliveryAddressMatchesBilling:
              type: boolean
            AddressMatchLevel:
              $ref: '#/components/schemas/PaymentInitiation.AddressMatchLevel1Codes'
          description: Risk indicator details provided by the merchant
        SupplementaryData:
          type: object
          description: Additional information that cannot be captured in the structured fields and/or any other specific block
      description: Transaction Indicators
    PaymentInitiation.VariableOnDemand1Properties:
      type: object
      required:
        - Type
        - PeriodType
        - PeriodStartDate
        - Controls
      properties:
        Type:
          type: string
          enum:
            - VariableOnDemand
          description: The Periodic Schedule Type.
        PeriodType:
          $ref: '#/components/schemas/PaymentInitiation.PeriodType1Codes'
        PeriodStartDate:
          $ref: '#/components/schemas/PaymentInitiation.PeriodStartDate1Type'
        Controls:
          type: object
          properties:
            MaximumIndividualAmount:
              $ref: '#/components/schemas/PaymentInitiation.MaximumIndividualAmount1Properties'
            MaximumCumulativeValueOfPaymentsPerPeriod:
              $ref: '#/components/schemas/PaymentInitiation.PeriodTypeMaximumCumulativeValueOfPayments1Properties'
            MaximumCumulativeNumberOfPaymentsPerPeriod:
              type: integer
          minProperties: 1
          description: Controls that apply to the payment schedule.
      description: >-
        Payment Controls that apply to all payment instructions in a given period under this payment consent.


        The payments for this consent may be executed on any date, as long as they are within the Controls for a
        PeriodType.
    PaymentPurposeCode1Type:
      type: string
      minLength: 1
      maxLength: 4
      description: >-
        A category code that relates to the type of services or goods that corresponds to the underlying purpose of the
        payment.


        The code must conform to the published code list provided by QCB.
    Values.ActiveOrHistoricAmount1Type:
      type: string
      pattern: ^\d{1,13}$|^\d{1,13}\.\d{1,5}$
      description: >-
        A number of monetary units specified in an active currency where the unit of currency is explicit and compliant
        with ISO 4217.
      example: '100.00'
    Values.ActiveOrHistoricCurrencyCode1Type:
      type: string
      pattern: ^[A-Z]{3,3}$
      description: |-
        A 3 character alphabetic code allocated to a currency under an international currency identification scheme.

        Values **MUST** be in accordance with ISO 4217 'Codes for the representation of currencies and funds'.
    Values.Latitude1Type:
      type: string
      minLength: 1
      maxLength: 20
      description: Latitude value.
    Values.Longitude1Type:
      type: string
      minLength: 1
      maxLength: 20
      description: Longitude value.
    PaymentInitiation.DomesticPaymentInitiationPersonalIdentifiableInformation1Properties:
      type: object
      required:
        - Initiation
        - Risk
      properties:
        Initiation:
          $ref: '#/components/schemas/PaymentInitiation.DomesticCreditor1Properties'
        Risk:
          $ref: '#/components/schemas/PaymentInitiation.Risk1Properties'
      description: >-
        Domestic Payment Personal Identifiable Information (PII) Schema Object.


        This Schema Object is provided for guidance only, and **must be implemented as a JWE when a Payment Initiation
        Request is sent**.
    Consent.ConsentStatus1Codes:
      type: string
      enum:
        - AwaitingAuthorization
        - Authorized
        - Rejected
        - Revoked
        - Expired
        - Consumed
        - Suspended
      description: |-
        Specifies the status of a Consent as recorded at Consent Manager.
         
        | Consent Status           | State Type | Description                                                       |
        |--------------------------|------------|-------------------------------------------------------------------|
        | `AwaitingAuthorization`  | Pending    | The Consent is awaiting authorization by the User.                |
        | `Authorized`             | In Use     | The Consent has been successfully authorized.                     |
        | `Rejected`               | Terminal   | The unauthorized Consent has been rejected at the LFI.            |
        | `Revoked`                | Terminal   | The Consent has been revoked at the TPP or LFI.                   |
        | `Expired`                | Terminal   | The Consent has expired.                                          |
        | `Consumed`               | Terminal   | The consented action(s) have been completed successfully.         |
        | `Suspended`              | In Use     | The Consent has been suspended.                                   |
    Consent.ConsentRevokedBy1Codes:
      type: string
      enum:
        - LFI
        - TPP
        - LFI.InitiatedByUser
        - TPP.InitiatedByUser
      description: |-
        Indicates who the Consent was revoked by.

        | Identifier            | Description                              |
        |-----------------------|------------------------------------------|
        | `LFI`                 | Revoked by LFI without User interaction. |
        | `TPP`                 | Revoked by TPP without User interaction. |
        | `LFI.InitiatedByUser` | Initiated by the User at the LFI.        |
        | `TPP.InitiatedByUser` | Initiated by the User the TPP.           |
    ConsentManager.TotalRequiredAuthorizers1Properties:
      type: object
      properties:
        TotalRequired:
          type: integer
          description: The total number of Authorizers required to process the request, as provided by the LFI.
    ConsentManager.Authorization1Properties:
      type: object
      properties:
        AuthorizerId:
          type: string
          minLength: 1
          maxLength: 128
          description: Authorizer identifier, as assigned by the LFI.
        AuthorizerType:
          type: string
          minLength: 1
          maxLength: 50
          description: The Type of Authorizer. For example, Financial, Management, etc.
        AuthorizationDate:
          type: string
          pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
          format: date-time
          description: The date and time when the Authorization occurred.
        AuthorizationStatus:
          type: string
          enum:
            - Pending
            - Approved
            - Rejected
          description: Status that reflects the authorizers decision in granted Consent.
    ConsentManager.ReadMultiAuthorization1Properties:
      allOf:
        - $ref: '#/components/schemas/ConsentManager.TotalRequiredAuthorizers1Properties'
        - type: object
          required:
            - TotalRequired
        - type: object
          required:
            - Authorizations
          properties:
            Authorizations:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/ConsentManager.Authorization1Properties'
                  - type: object
                    required:
                      - AuthorizerId
                      - AuthorizationDate
                      - AuthorizationStatus
              minItems: 1
          description: Metadata that describes the multi-authorization characteristics of the Consent, as prescribed by the LFI.
    ConsentManager.UpdateMultiAuthorization1Properties:
      allOf:
        - $ref: '#/components/schemas/ConsentManager.TotalRequiredAuthorizers1Properties'
        - type: object
          properties:
            Authorizations:
              type: array
              items:
                $ref: '#/components/schemas/ConsentManager.Authorization1Properties'
              minItems: 1
          description: Metadata that describes the multi-authorization characteristics of the Consent, as prescribed by the LFI.
    Charges.Charge1Properties:
      type: object
      required:
        - ChargeBearer
        - Type
        - Amount
      properties:
        ChargeBearer:
          $ref: '#/components/schemas/Charges.ChargeBearerType1Codes'
        Type:
          $ref: '#/components/schemas/Charges.PaymentChargeType1Codes'
        Amount:
          type: object
          required:
            - Amount
            - Currency
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: An Amount qualified by an active Currency, using amount and currency as prescribed by ISO 4217.
      description: Charges related to a given payment or transaction.
    Charges.PaymentChargeType1Codes:
      type: string
      enum:
        - VAT
        - Fees
      description: Charge type codes, indicating what the charge relates to.
    CurrencyExchange.ConsentCurrencyExchangeRateInformation1Properties:
      type: object
      required:
        - UnitCurrency
        - RateType
      properties:
        UnitCurrency:
          type: string
          pattern: ^[A-Z]{3,3}$
          description: >-
            Currency in which the rate of exchange is expressed in a currency exchange. Often referred to as the "sell"
            side in a currency conversion.


            In the example 1GBP = xxxCUR, the unit currency is GBP.
        RateType:
          $ref: '#/components/schemas/CurrencyExchange.RateType1Codes'
        ContractIdentification:
          $ref: '#/components/schemas/CurrencyExchange.ContractIdentification1Type'
        ExchangeRate:
          type: number
          description: |-
            The factor used for conversion of an amount from one currency to another.

            Reflects the price at which one currency was bought with another currency.
        ExpirationDateTime:
          type: string
          format: date-time
          description: |-
            Specified date and time the exchange rate agreement will expire.

            All dates in the JSON payloads are represented in ISO 8601 date-time format.

            All date-time fields in responses must include the timezone, for example: 2023-04-05T10:43:07+00:00
      description: |-
        Details of the currency exchange recorded against a Consent.

        `ExchangeRate` is optional, as the rate may not have been established at the point the Consent is
        read — unlike a payment, which reports the rate that was applied.
    PaymentInitiation.RejectReasonCode1Type:
      type: string
      minLength: 1
      maxLength: 35
      pattern: ^(FAWRAN|QATCH|.+)\.[A-Za-z0-9]+$
      description: >-
        A reject reason code describes why a given Payment Initiation Request has been rejected.


        The first part of the code qualifies the payment system processing the Request, and reflects either domestic
        payment

        schemes or other payment rails out of scope of Open Finance standards.


        The second part is a code prescribed by the payment system for the error condition.
    PaymentInitiation.RejectReasonMessage1Type:
      type: string
      minLength: 1
      maxLength: 500
      description: A message describing the reason why a given Payment Initiation Request was rejected.
    PaymentInitiation.PaymentInitiationStatus1Codes:
      type: string
      enum:
        - Pending
        - AcceptedSettlementCompleted
        - AcceptedCreditSettlementCompleted
        - AcceptedWithoutPosting
        - Rejected
      description: >
        Describes the status of the Payment Initiation Request.


        | Code |
        Description                                                                                                                                                                    
        |

        | --------------------------------- |
        --------------------------------------------------------------------------------------------------------------------------------------------------
        |

        | Pending                           | Payment initiation or individual transaction included in the payment
        initiation is pending.<br>Further checks and status update will be performed. |

        | Rejected                          | The payment initiation has been
        rejected.                                                                                                         
        |

        | AcceptedSettlementCompleted       | Settlement of the Debtor account has been
        completed.                                                                                               |

        | AcceptedCreditSettlementCompleted | When the Creditor account has been credited with the funds of the payment
        initiated via the TPP.                                                   |

        | AcceptedWithoutPosting            | When the Recipient Bank has accepted the payment but has not applied the
        credit to the Creditor account yet.                                       |
    PaymentInitiation.PaymentTransactionId1Type:
      type: string
      minLength: 1
      maxLength: 140
      description: >-
        An identifier for a given Payment Initiation Request generated by the Debtor financial institution or payment
        system acting on their behalf to identify the transaction.


        An example of this value is the `EndToEndIdentification` value, which is commonly implemented in ISO 20022-based
        payment systems.


        This value is optional as it may not be available when the Payment Initiation Request resource is initially
        created, due to the asynchronous nature of payment systems.
    AccountInformation.ReadConsent1Properties:
      type: object
      required:
        - ConsentId
        - Permissions
        - ExpirationDateTime
        - Status
      properties:
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        BaseConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        Permissions:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.ConsentPermission1Codes'
          minItems: 1
        ExpirationDateTime:
          $ref: '#/components/schemas/Consent.ConsentExpirationDateTime1Type'
        FromDate:
          $ref: '#/components/schemas/AccountInformation.FromDate1Type'
        ToDate:
          $ref: '#/components/schemas/AccountInformation.ToDate1Type'
        AccountType:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.AccountType1Codes'
          minItems: 1
        AccountSubType:
          type: array
          items:
            $ref: '#/components/schemas/AccountInformation.AccountSubType1Codes'
          minItems: 1
        OnBehalfOf:
          $ref: '#/components/schemas/Consent.TppActingOnBehalfOf1Types'
        CreationDateTime:
          $ref: '#/components/schemas/Consent.ConsentCreationDateTime1Type'
        Status:
          $ref: '#/components/schemas/Consent.ConsentStatus1Codes'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/Consent.ConsentStatusUpdateDateTime1Type'
        RevokedBy:
          allOf:
            - $ref: '#/components/schemas/Consent.ConsentRevokedBy1Codes'
          description: |-
            Indicates who the Consent was revoked by.

            Omitted where the Consent has not been revoked.
    Consent.ConsentStatusUpdateDateTime1Type:
      type: string
      pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
      format: date-time
      description: >-
        Consent status update data and time, as recorded by Consent Manager.


        Date and time is represented in RFC 3339 date-time format, qualified as Arabia Standard Time, with seconds being
        the maximum supported precision.
    Consent.ConsentCreationDateTime1Type:
      type: string
      pattern: ^[0-9]{4}-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\+03:00$
      format: date-time
      description: >-
        Consent creation date and time, as recorded by Consent Manager.


        Date and time is represented in RFC 3339 date-time format, qualified as Arabia Standard Time, with seconds being
        the maximum supported precision.
    PaymentInitiation.ReadPaymentInitiationConsent1Properties:
      type: object
      required:
        - ControlParameters
        - ConsentId
        - ExpirationDateTime
        - PaymentPurposeCode
        - Status
      properties:
        ControlParameters:
          allOf:
            - $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationControlParameters1Properties'
          description: Control Parameters set the overall rules for the Payment Schedule.
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        BaseConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        IsSingleAuthorization:
          type: boolean
          description: >-
            TPP is request authorization by a single User, with no multi-authorization requirement.


            Used to indicate the requirement time-bound authorization of the payment, in order to release goods or
            services in a timely fashion.


            Can be ignored by LFIs where the access control model for the account requires multiple authorizations of
            the


            Set to `false` where immediate authorization is not required.
        AuthorizationExpirationDateTime:
          type: string
          format: date-time
        ExpirationDateTime:
          $ref: '#/components/schemas/Consent.ConsentExpirationDateTime1Type'
        Permissions:
          type: array
          items:
            $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationAccountInformationPermission1Codes'
          minItems: 2
          uniqueItems: true
          description: >-
            Specifies the permitted Bank Data Sharing permissions, which is the data clusters being consented by the
            User, and requested for authorization with the LFI.


            Allows TPPs to check the User balance at the payment account.


            TPPs **MUST** select `ReadAccountsBasic` and `ReadBalances` to implement a balance check before making
            payment.
        CurrencyRequest:
          $ref: '#/components/schemas/CurrencyExchange.RequestedCurrencyExchange1Properties'
        DebtorReference:
          $ref: '#/components/schemas/PaymentInitiation.DebtorReference1Type'
        CreditorReference:
          $ref: '#/components/schemas/PaymentInitiation.CreditorReference1Type'
        PaymentPurposeCode:
          allOf:
            - $ref: '#/components/schemas/PaymentPurposeCode1Type'
        CreationDateTime:
          $ref: '#/components/schemas/Consent.ConsentCreationDateTime1Type'
        Status:
          $ref: '#/components/schemas/Consent.ConsentStatus1Codes'
        StatusUpdateDateTime:
          $ref: '#/components/schemas/Consent.ConsentStatusUpdateDateTime1Type'
        RevokedBy:
          allOf:
            - $ref: '#/components/schemas/Consent.ConsentRevokedBy1Codes'
          description: |-
            Indicates who the Consent was revoked by.

            Omitted where the Consent has not been revoked.
        Charges:
          type: array
          items:
            $ref: '#/components/schemas/Charges.Charge1Properties'
          minItems: 1
          description: |-
            Charges applied to a given payment initiation instruction, as stated by the LFI.

            Omitted if no charges apply to the payment.
        ExchangeRate:
          $ref: '#/components/schemas/CurrencyExchange.ConsentCurrencyExchangeRateInformation1Properties'
        PaymentConsumption:
          $ref: '#/components/schemas/PaymentInitiation.PaymentConsumption1Properties'
        Meta:
          allOf:
            - $ref: '#/components/schemas/Consent.ConsentMeta1Properties'
          description: >-
            Metadata recorded against the Consent by the LFI, which currently carries multi-authorization progress.


            Response-only: it reports state established after Consent Authorization, so it is **not** submitted in the
            Pushed Authorization Request.


            Omitted where the LFI does not require multiple authorizers for the Consent.
      description: Properties of the Consent agreed by the User with the TPP for Payment Initiation.
    Consent.ConsentMeta1Properties:
      type: object
      properties:
        MultipleAuthorizers:
          allOf:
            - $ref: '#/components/schemas/ConsentManager.ReadMultiAuthorization1Properties'
          description: Information on multi-authorization
      description: Metadata associated with a Consent Resource.
    PaymentInitiation.PaymentConsumption1Properties:
      type: object
      required:
        - CumulativeNumberOfPayments
        - CumulativeValueOfPayments
      properties:
        CumulativeNumberOfPayments:
          type: integer
          description: |-
            The cumulative number of payment instructions initiated under the consent schedule.

            Excludes instructions in a Rejected state.
        CumulativeValueOfPayments:
          type: object
          required:
            - Amount
            - Currency
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: >-
            The cumulative value of payment instructions initiated under the consent schedule, excluding instructions in
            a Rejected state.


            A number of monetary units specified in an active currency where the unit of currency is explicit and
            compliant with ISO 4217.
        CumulativeNumberOfPaymentsInCurrentPeriod:
          type: integer
          description: |-
            The cumulative number of payment instructions in the current period initiated under the consent schedule.

            Excludes instructions in a Rejected state.
        CumulativeValueOfPaymentsInCurrentPeriod:
          type: object
          required:
            - Amount
            - Currency
          properties:
            Amount:
              $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
            Currency:
              $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
          description: >-
            The cumulative value of payment instructions in the current period initiated under the consent schedule.


            Excludes instructions in a Rejected state.


            A number of monetary units specified in an active currency where the unit of currency is explicit and
            compliant with ISO 4217.
    CreatePaymentInitiation1Request:
      type: object
      required:
        - Data
      properties:
        Data:
          $ref: '#/components/schemas/PaymentInitiation.PaymentInitiationRequest1Properties'
      description: Payment Initiation Request Data.
    PaymentInitiation.PaymentInitiationRequest1Properties:
      type: object
      required:
        - ConsentId
        - Instruction
        - PersonalIdentifiableInformation
        - PaymentPurposeCode
        - CreditorReference
      properties:
        ConsentId:
          $ref: '#/components/schemas/Consent.ConsentId1Type'
        Instruction:
          type: object
          properties:
            Amount:
              type: object
              required:
                - Amount
                - Currency
              properties:
                Amount:
                  $ref: '#/components/schemas/Values.ActiveOrHistoricAmount1Type'
                Currency:
                  $ref: '#/components/schemas/Values.ActiveOrHistoricCurrencyCode1Type'
              description: The payment initiation currency and amount.
          required:
            - Amount
          description: |-
            The currency and amount instructed by the TPP based on the payment authorized by the User. 

            Used to instruct the movement of funds from the Debtor to the Creditor.
        PersonalIdentifiableInformation:
          oneOf:
            - $ref: >-
                #/components/schemas/PaymentInitiation.DomesticPaymentInitiationPersonalIdentifiableInformation1Properties
            - type: string
              minLength: 1
              maxLength: 131072
          description: >-
            Personal Identifiable Information for the Payment Request.


            This information **MUST** be sent as a JWE when submitting the Request.


            The Schema Objects are provided for guidance only, to ensure the JSON Web Token (JWT) payload is created
            correctly.
        PaymentPurposeCode:
          $ref: '#/components/schemas/PaymentPurposeCode1Type'
        DebtorReference:
          $ref: '#/components/schemas/PaymentInitiation.DebtorReference1Type'
        CreditorReference:
          $ref: '#/components/schemas/PaymentInitiation.CreditorReference1Type'
        CurrencyRequest:
          allOf:
            - $ref: '#/components/schemas/CurrencyExchange.RequestedCurrencyExchange1Properties'
          description: Currency exchange requested for an International Payment. Omitted for a Domestic Payment.
      description: |-
        Payment Initiation Request for a Domestic or International Payment.

        A single request object is used for both payment types. The payment type is
        evident from the Personal Identifiable Information supplied, and `CurrencyRequest` is provided only
        for an International Payment.
  parameters:
    consentId:
      name: consentId
      in: path
      schema:
        type: string
      required: true
      description: |
        The Consent identifier.
    id:
      name: id
      in: path
      schema:
        type: string
      required: true
      description: |
        Identifies the payment by an id
    userId:
      name: userId
      in: path
      schema:
        type: string
      required: true
      description: |
        Identifies the PSU associated with a consent.

        This should match up with the `psuIdentifier.userId` field.
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
      required: false
      description: |
        The page number to retrieve in a paginated response
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
      required: false
      description: |
        The maximum rows to retrieve in a given page. Defaults to 25 if not specified.
    consentType:
      name: consentType
      in: query
      schema:
        type: string
      description: Consents of particular accountId
      required: false
    status:
      name: status
      in: query
      schema:
        type: string
      description: Status of the consent
      required: false
  securitySchemes:
    OzoneConnectMutualTls:
      description: >-
        Communications between the API Hub and the LFI Ozone Connect implementation are secured using mutual TLS (mTLS),
        where the Client authenticates by presenting an X.509 certificate during the TLS handshake.
      type: mutualTLS
    OzoneConnectJwtAuth:
      description: >
        Communications between the API Hub and the LFI Ozone Connect implementation are secured using the "JWT Auth"
        mechanism, where the Client presents a signed JSON Web Token as a credential.


        The Server MUST verify the signature in order to authenticate the Client.


        Please note that the value of the `scheme` parameter is not a registered HTTP Authentication Scheme, to indicate
        it is specific to Ozone Connect. Please refer to API Hub documentation for further details.
      type: http
      scheme: Ozone-Connect-JWT-Auth
